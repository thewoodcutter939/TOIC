name: Bourse — cours et alertes

on:
  schedule:
    # Toutes les 30 minutes, du lundi au vendredi, de 8 h à 22 h (heure de Paris en hiver)
    - cron: "7,37 7-20 * * 1-5"
    # Après la clôture de Wall Street
    - cron: "20 21 * * 1-5"
    # Une fois par jour le week-end (cryptomonnaies)
    - cron: "0 12 * * 0,6"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [bourse/watchlist.json]

permissions:
  contents: write

concurrency:
  group: bourse
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cours, signaux et notifications
        run: node bourse/scripts/update.js
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          APP_URL: ${{ vars.APP_URL }}
      - name: Enregistrer les données
        run: |
          git config user.name "bourse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bourse/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "bourse : cours du $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
