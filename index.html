</b>.","tr":"L'atelier est gratuit."},{"q":"Mr. Hughes has been ___ the company since 2012.","o":["with","for","by","on"],"e":"<b>Be with a company</b> = travailler pour une entreprise.","tr":"M. Hughes travaille dans l'entreprise depuis 2012."},{"q":"The parcel was left ___ the front door.","o":["at","in","into","through"],"e":"Point précis → <b>at</b>.","tr":"Le colis a été déposé à la porte d'entrée."}]},{"id":"conj","group":"grammar","title":"Conjonctions & connecteurs","part":"Part 5","start":101,"rule":"Opposition : <b>although / even though</b> + proposition · <b>despite / in spite of</b> + nom · <b>however</b> entre deux phrases. Conséquence : <b>therefore, consequently, as a result</b>. Paires : <b>either…or · neither…nor · both…and · not only…but also</b>. <b>Unless</b> = à moins que.","qs":[{"q":"___ the weather was bad, the outdoor event was a success.","o":["Although","Despite","However","Because"],"e":"Idée d'<b>opposition</b> suivie d'une <b>proposition</b> (the weather was bad) → <b>Although</b>. « Despite » exige un nom : despite the bad weather.","tr":"Bien que le temps ait été mauvais, l'événement en plein air a été un succès."},{"q":"Sales increased this quarter; ___, profits fell slightly.","o":["however","therefore","moreover","otherwise"],"e":"Les deux idées s'<b>opposent</b> (ventes ↑, bénéfices ↓) → <b>however</b>.","tr":"Les ventes ont augmenté ce trimestre ; cependant, les bénéfices ont légèrement baissé."},{"q":"You can pay ___ by credit card or by bank transfer.","o":["either","both","neither","whether"],"e":"Paire corrélative <b>either … or</b> (soit… soit). « Both » va avec « and », « neither » avec « nor ».","tr":"Vous pouvez payer soit par carte bancaire, soit par virement."},{"q":"The package will not be delivered ___ someone signs for it.","o":["unless","if","because","so"],"e":"<b>Unless</b> = à moins que / sauf si. Avec « if », la phrase dirait l'inverse du sens logique.","tr":"Le colis ne sera pas livré à moins que quelqu'un ne signe."},{"q":"The new model is not only lighter ___ cheaper than the previous one.","o":["but also","and","or","as well"],"e":"<b>Not only … but also</b> est une structure figée : dès que vous voyez « not only », cherchez « but also ».","tr":"Le nouveau modèle est non seulement plus léger mais aussi moins cher que le précédent."},{"q":"Please read the manual carefully ___ you install the device.","o":["before","during","prior","until"],"e":"Il faut une <b>conjonction</b> suivie d'une proposition → <b>before</b>. « Prior » exige « to » (prior to installing).","tr":"Veuillez lire attentivement le manuel avant d'installer l'appareil."},{"q":"The flight was delayed; ___, we missed our connection.","o":["consequently","nevertheless","instead","meanwhile"],"e":"Le second fait est la <b>conséquence</b> du premier → <b>consequently</b>.","tr":"Le vol a été retardé ; par conséquent, nous avons raté notre correspondance."},{"q":"The report was late ___ the data arrived only yesterday.","o":["because","although","so","unless"],"e":"La seconde proposition explique la <b>cause</b> du retard → <b>because</b>.","tr":"Le rapport était en retard car les données ne sont arrivées qu'hier."},{"q":"Please sign the contract ___ return it by Friday.","o":["and","but","or","so"],"e":"Deux actions qui s'<b>ajoutent</b> → <b>and</b>.","tr":"Veuillez signer le contrat et le renvoyer avant vendredi."},{"q":"The product is popular; ___, its price is quite high.","o":["however","therefore","thus","consequently"],"e":"Opposition entre populaire et cher → <b>however</b>.","tr":"Le produit est populaire ; son prix est pourtant assez élevé."},{"q":"___ Mr. Vega was ill, he attended the board meeting.","o":["Even though","Because","Despite","Unless"],"e":"Opposition + <b>proposition</b> → <b>Even though</b>. « Despite » exige un nom.","tr":"Bien qu'il soit malade, M. Vega a assisté au conseil."},{"q":"We will start the meeting ___ everyone has arrived.","o":["once","unless","although","despite"],"e":"<b>Once</b> = dès que / une fois que.","tr":"Nous commencerons la réunion une fois que tout le monde sera arrivé."},{"q":"The seminar was useful; ___, it was too long.","o":["nevertheless","therefore","accordingly","similarly"],"e":"Opposition (utile ↔ trop long) → <b>nevertheless</b> (néanmoins).","tr":"Le séminaire était utile ; il était néanmoins trop long."},{"q":"Neither the manager ___ his assistant was available.","o":["nor","or","and","but"],"e":"Paire <b>neither … nor</b>.","tr":"Ni le responsable ni son assistant n'étaient disponibles."},{"q":"Both the design ___ the price of the new model were well received.","o":["and","or","nor","but"],"e":"Paire <b>both … and</b>.","tr":"Le design comme le prix du nouveau modèle ont été bien accueillis."},{"q":"___ you have any questions, please do not hesitate to contact us.","o":["If","Unless","Although","Whereas"],"e":"Condition → <b>If</b>.","tr":"Si vous avez des questions, n'hésitez pas à nous contacter."},{"q":"The company hired more staff ___ it could meet growing demand.","o":["so that","even though","unless","whereas"],"e":"But + proposition avec « could » → <b>so that</b> (afin que).","tr":"L'entreprise a embauché pour pouvoir répondre à la demande croissante."},{"q":"Ms. Hart will lead the project ___ Mr. Lin is on leave.","o":["while","during","despite","unless"],"e":"<b>While</b> + proposition = pendant que. « During » exige un nom.","tr":"Mme Hart dirigera le projet pendant que M. Lin est en congé."},{"q":"___ the budget cuts, the project was completed on time.","o":["In spite of","Although","Even if","Because"],"e":"Opposition + <b>nom</b> (the budget cuts) → <b>In spite of</b>.","tr":"Malgré les coupes budgétaires, le projet a été terminé à temps."},{"q":"The new printer is fast; ___, it uses less ink.","o":["in addition","however","otherwise","instead"],"e":"Deux avantages qui s'<b>ajoutent</b> → <b>in addition</b>.","tr":"La nouvelle imprimante est rapide ; en outre, elle consomme moins d'encre."},{"q":"Customers can return items within 30 days ___ they keep the receipt.","o":["as long as","even though","so that","whereas"],"e":"Condition → <b>as long as</b> (à condition que).","tr":"Les clients peuvent retourner les articles sous 30 jours à condition de garder le ticket."},{"q":"The machine stopped working, ___ production was delayed.","o":["so","but","or","yet"],"e":"Conséquence → <b>so</b>.","tr":"La machine est tombée en panne, donc la production a pris du retard."},{"q":"We chose this supplier ___ its prices are the lowest.","o":["because","despite","although","however"],"e":"Cause + proposition → <b>because</b>.","tr":"Nous avons choisi ce fournisseur car ses prix sont les plus bas."},{"q":"I will call you ___ I get to the airport.","o":["when","unless","although","despite"],"e":"Moment futur → <b>when</b> + présent.","tr":"Je t'appellerai quand j'arriverai à l'aéroport."},{"q":"The event was a success, ___ the small number of participants.","o":["despite","although","because","even"],"e":"Opposition + <b>nom</b> → <b>despite</b>.","tr":"L'événement a été un succès malgré le petit nombre de participants."},{"q":"Please arrive early; ___, you may not find a seat.","o":["otherwise","therefore","moreover","however"],"e":"<b>Otherwise</b> = sinon (conséquence si la consigne n'est pas suivie).","tr":"Arrivez tôt ; sinon, vous risquez de ne pas trouver de place."},{"q":"The new employee is not only talented ___ very hardworking.","o":["but also","and also","as well as","or"],"e":"Structure figée <b>not only … but also</b>.","tr":"La nouvelle recrue est non seulement talentueuse mais aussi très travailleuse."},{"q":"___ sales were strong, the company reported a loss.","o":["Although","Because","Since","Due to"],"e":"Opposition (ventes fortes ↔ perte) + proposition → <b>Although</b>.","tr":"Bien que les ventes aient été bonnes, l'entreprise a annoncé une perte."},{"q":"We will not sign the agreement ___ the terms are revised.","o":["unless","if","because","so"],"e":"<b>Unless</b> = à moins que.","tr":"Nous ne signerons pas l'accord à moins que les conditions ne soient révisées."},{"q":"The report must be approved ___ it is published.","o":["before","during","prior","by"],"e":"Conjonction de temps + proposition → <b>before</b>. « Prior » exige « to ».","tr":"Le rapport doit être approuvé avant d'être publié."},{"q":"Whether you travel by train ___ by plane, the trip takes about three hours.","o":["or","and","nor","but"],"e":"Paire <b>whether … or</b>.","tr":"Que vous voyagiez en train ou en avion, le trajet dure environ trois heures."},{"q":"The hotel was expensive; ___, the service was excellent.","o":["on the other hand","as a result","for example","therefore"],"e":"Contraste entre inconvénient et avantage → <b>on the other hand</b>.","tr":"L'hôtel était cher ; en revanche, le service était excellent."},{"q":"___ the project is complete, the team will take a short break.","o":["Once","Unless","Although","Despite"],"e":"<b>Once</b> = une fois que.","tr":"Une fois le projet terminé, l'équipe prendra une courte pause."},{"q":"The meeting was canceled ___ the director was sick.","o":["because","because of","despite","although"],"e":"Cause + <b>proposition</b> (the director was sick) → <b>because</b>.","tr":"La réunion a été annulée parce que le directeur était malade."},{"q":"The company has offices in Paris, London, ___ Madrid.","o":["and","or","but","so"],"e":"Énumération → <b>and</b> avant le dernier élément.","tr":"L'entreprise a des bureaux à Paris, Londres et Madrid."},{"q":"Mr. Park speaks English fluently, ___ he has never lived abroad.","o":["even though","because","so","unless"],"e":"Fait surprenant → opposition → <b>even though</b>.","tr":"M. Park parle couramment anglais, bien qu'il n'ait jamais vécu à l'étranger."},{"q":"The files are confidential; ___, they must not be shared.","o":["therefore","however","nevertheless","instead"],"e":"Conséquence logique → <b>therefore</b>.","tr":"Les fichiers sont confidentiels ; ils ne doivent donc pas être partagés."},{"q":"___ receiving your payment, we will send you a confirmation.","o":["Upon","Unless","Although","Whereas"],"e":"<b>Upon + V-ing</b> = dès (la réception).","tr":"Dès réception de votre paiement, nous vous enverrons une confirmation."},{"q":"The first option is cheaper, ___ the second one is faster.","o":["whereas","because","unless","so that"],"e":"Comparaison de deux éléments opposés → <b>whereas</b> (tandis que).","tr":"La première option est moins chère, tandis que la seconde est plus rapide."},{"q":"You may attend the conference in person ___ watch it online.","o":["or","nor","but","so"],"e":"Alternative → <b>or</b>.","tr":"Vous pouvez assister à la conférence sur place ou la suivre en ligne."},{"q":"Ms. Grey was promoted ___ she had worked for the company for only two years.","o":["although","because","unless","so"],"e":"« only two years » = fait inattendu → opposition → <b>although</b>.","tr":"Mme Grey a été promue alors qu'elle ne travaillait dans l'entreprise que depuis deux ans."},{"q":"The training was postponed ___ the trainer's flight was delayed.","o":["since","despite","unless","although"],"e":"<b>Since</b> peut signifier « puisque / car » (cause).","tr":"La formation a été reportée car le vol du formateur a été retardé."},{"q":"Our team worked overtime ___ meet the deadline.","o":["in order to","so that","because","despite"],"e":"But + <b>base verbale</b> (meet) → <b>in order to</b>. « So that » exige un sujet.","tr":"Notre équipe a fait des heures supplémentaires afin de respecter l'échéance."},{"q":"The project will fail ___ we receive additional funding.","o":["unless","if","when","as soon as"],"e":"Échec sauf si financement → <b>unless</b>.","tr":"Le projet échouera à moins que nous ne recevions des fonds supplémentaires."},{"q":"The company is expanding rapidly. ___, it plans to open ten new stores.","o":["For instance","However","Nevertheless","Otherwise"],"e":"La seconde phrase <b>illustre</b> la première → <b>For instance</b>.","tr":"L'entreprise se développe rapidement. Par exemple, elle prévoit d'ouvrir dix magasins."},{"q":"___ the train was delayed, we arrived on time.","o":["Even though","Because","Since","Unless"],"e":"Opposition (retard ↔ à l'heure) → <b>Even though</b>.","tr":"Même si le train avait du retard, nous sommes arrivés à l'heure."},{"q":"The equipment is old; ___, it still works well.","o":["nonetheless","consequently","therefore","thus"],"e":"Opposition (vieux ↔ fonctionne bien) → <b>nonetheless</b>.","tr":"L'équipement est ancien ; il fonctionne néanmoins toujours bien."},{"q":"___ you finish the survey, please return it to the front desk.","o":["After","Unless","Although","Whereas"],"e":"Succession temporelle → <b>After</b>.","tr":"Après avoir rempli le questionnaire, rapportez-le à l'accueil."},{"q":"The store will remain open ___ the renovation is taking place.","o":["while","during","despite","unless"],"e":"<b>While</b> + proposition (the renovation is taking place).","tr":"Le magasin restera ouvert pendant les travaux."},{"q":"Payment can be made ___ in cash or by check.","o":["either","both","neither","whether"],"e":"Paire <b>either … or</b>.","tr":"Le paiement peut se faire soit en espèces, soit par chèque."},{"q":"The candidate had neither experience ___ the required qualifications.","o":["nor","or","and","but"],"e":"Paire <b>neither … nor</b>.","tr":"Le candidat n'avait ni expérience ni les diplômes requis."},{"q":"The price is reasonable ___ the high quality of the product.","o":["given","although","because","unless"],"e":"<b>Given</b> + nom = compte tenu de. « Because » exigerait « because of ».","tr":"Le prix est raisonnable compte tenu de la grande qualité du produit."},{"q":"The company moved its headquarters; ___, many employees had to relocate.","o":["as a result","in contrast","instead","nevertheless"],"e":"Conséquence → <b>as a result</b>.","tr":"L'entreprise a déménagé son siège ; en conséquence, beaucoup d'employés ont dû déménager."},{"q":"We will proceed with the plan ___ the board approves it.","o":["provided that","even though","so that","whereas"],"e":"Condition → <b>provided that</b> (à condition que).","tr":"Nous poursuivrons le projet à condition que le conseil l'approuve."},{"q":"Ms. Liu checked the figures twice ___ there would be no errors.","o":["so that","because","although","unless"],"e":"But (« would ») → <b>so that</b>.","tr":"Mme Liu a vérifié les chiffres deux fois pour qu'il n'y ait pas d'erreur."},{"q":"___ his busy schedule, Mr. Rossi agreed to give a speech.","o":["Despite","Although","Because","Unless"],"e":"Opposition + <b>nom</b> (his busy schedule) → <b>Despite</b>.","tr":"Malgré son emploi du temps chargé, M. Rossi a accepté de faire un discours."},{"q":"The new system is easy to use. ___, it saves a lot of time.","o":["Furthermore","However","Instead","Otherwise"],"e":"Ajout d'un second avantage → <b>Furthermore</b>.","tr":"Le nouveau système est simple. De plus, il fait gagner beaucoup de temps."},{"q":"The tickets sold out quickly ___ the concert was announced only last week.","o":["even though","because","so","unless"],"e":"Fait surprenant (annoncé récemment mais vite complet) → <b>even though</b>.","tr":"Les billets se sont vendus rapidement alors que le concert n'a été annoncé que la semaine dernière."},{"q":"Please turn off your computer ___ you leave the office.","o":["before","during","until","since"],"e":"Ordre des actions → <b>before</b>.","tr":"Éteignez votre ordinateur avant de quitter le bureau."},{"q":"The package will arrive on Monday ___ Tuesday, depending on the weather.","o":["or","nor","but","so"],"e":"Alternative → <b>or</b>.","tr":"Le colis arrivera lundi ou mardi, selon la météo."},{"q":"___ it was raining, the event was held outdoors.","o":["Although","Because","Despite","Unless"],"e":"Opposition + proposition → <b>Although</b>.","tr":"Bien qu'il pleuve, l'événement s'est tenu en extérieur."},{"q":"We will cancel the trip ___ the weather improves.","o":["unless","if","because","since"],"e":"Annulation <b>sauf si</b> le temps s'améliore → unless.","tr":"Nous annulerons le voyage à moins que le temps ne s'améliore."},{"q":"The store was crowded ___ it was the first day of the sale.","o":["because","although","unless","despite"],"e":"Cause + proposition → <b>because</b>.","tr":"Le magasin était bondé parce que c'était le premier jour des soldes."},{"q":"Please call me ___ you arrive at the hotel.","o":["when","unless","although","whereas"],"e":"Moment → <b>when</b>.","tr":"Appelez-moi quand vous arriverez à l'hôtel."},{"q":"The project was delayed; ___, it was completed within budget.","o":["however","therefore","thus","because"],"e":"Opposition entre deux phrases → <b>however</b>.","tr":"Le projet a pris du retard ; il a cependant respecté le budget."},{"q":"You can reach us ___ by phone or by e-mail.","o":["either","both","neither","whether"],"e":"Paire <b>either … or</b>.","tr":"Vous pouvez nous joindre soit par téléphone, soit par e-mail."},{"q":"Neither the printer ___ the scanner is working.","o":["nor","or","and","but"],"e":"Paire <b>neither … nor</b>.","tr":"Ni l'imprimante ni le scanner ne fonctionnent."},{"q":"The seminar was informative ___ enjoyable.","o":["and","but","or","nor"],"e":"Deux qualités qui s'<b>ajoutent</b> → and.","tr":"Le séminaire était instructif et agréable."},{"q":"___ the heavy traffic, we arrived on time.","o":["Despite","Although","Even though","Because"],"e":"Opposition + nom → <b>Despite</b>.","tr":"Malgré la circulation dense, nous sommes arrivés à l'heure."},{"q":"The manager left early ___ he had a doctor's appointment.","o":["because","although","unless","so"],"e":"Cause → <b>because</b>.","tr":"Le responsable est parti tôt car il avait rendez-vous chez le médecin."},{"q":"The price is high; ___, the product sells well.","o":["nevertheless","therefore","consequently","as a result"],"e":"Opposition → <b>nevertheless</b>.","tr":"Le prix est élevé ; le produit se vend néanmoins bien."},{"q":"We need to hurry, ___ we will miss the train.","o":["or","and","but","so"],"e":"<b>Or</b> = sinon (menace/conséquence).","tr":"Il faut se dépêcher, sinon nous allons rater le train."},{"q":"The hotel was full, ___ we stayed at another one.","o":["so","but","or","because"],"e":"Conséquence → <b>so</b>.","tr":"L'hôtel était complet, alors nous avons dormi ailleurs."},{"q":"___ you need assistance, please ask a staff member.","o":["If","Unless","Although","Whereas"],"e":"Condition → <b>If</b>.","tr":"Si vous avez besoin d'aide, adressez-vous à un membre du personnel."},{"q":"The report is not only accurate ___ well written.","o":["but also","and also","as well","or"],"e":"<b>Not only … but also</b>.","tr":"Le rapport est non seulement exact mais aussi bien rédigé."},{"q":"Ms. Chen will join us ___ she finishes her call.","o":["after","during","despite","unless"],"e":"Succession temporelle + proposition → <b>after</b>.","tr":"Mme Chen nous rejoindra après son appel."},{"q":"The company cut costs ___ it could stay competitive.","o":["so that","even though","unless","whereas"],"e":"But + could → <b>so that</b>.","tr":"L'entreprise a réduit ses coûts pour rester compétitive."},{"q":"___ Mr. Obi is on vacation, Ms. Lee will handle his clients.","o":["While","During","Despite","Unless"],"e":"<b>While</b> + proposition = pendant que.","tr":"Pendant les vacances de M. Obi, Mme Lee s'occupera de ses clients."},{"q":"The event was a success ___ the bad weather.","o":["in spite of","although","because","even though"],"e":"Opposition + nom → <b>in spite of</b>.","tr":"L'événement a été un succès malgré le mauvais temps."},{"q":"The train was late; ___, we missed the first session.","o":["as a result","however","instead","nevertheless"],"e":"Conséquence → <b>as a result</b>.","tr":"Le train était en retard ; nous avons donc manqué la première session."},{"q":"I'll wait here ___ you come back.","o":["until","by","during","despite"],"e":"<b>Until</b> + proposition = jusqu'à ce que.","tr":"J'attendrai ici jusqu'à ton retour."},{"q":"The new phone is lighter ___ cheaper than the old one.","o":["and","but","or","nor"],"e":"Deux avantages → <b>and</b>.","tr":"Le nouveau téléphone est plus léger et moins cher que l'ancien."},{"q":"Both Mr. Tan ___ Ms. Silva attended the conference.","o":["and","or","nor","but"],"e":"Paire <b>both … and</b>.","tr":"M. Tan et Mme Silva ont tous deux assisté à la conférence."},{"q":"We can meet on Monday ___ Tuesday, whichever you prefer.","o":["or","and","nor","but"],"e":"Alternative → <b>or</b>.","tr":"Nous pouvons nous voir lundi ou mardi, comme vous préférez."},{"q":"The company expanded quickly; ___, it faced some difficulties.","o":["however","therefore","for example","similarly"],"e":"Opposition → <b>however</b>.","tr":"L'entreprise s'est développée rapidement ; elle a toutefois rencontré des difficultés."},{"q":"___ the software is installed, you can start using it.","o":["Once","Unless","Although","Despite"],"e":"<b>Once</b> = une fois que.","tr":"Une fois le logiciel installé, vous pouvez l'utiliser."},{"q":"The team didn't finish on time ___ they worked overtime.","o":["even though","because","so","unless"],"e":"Fait inattendu → <b>even though</b>.","tr":"L'équipe n'a pas fini à temps alors qu'elle a fait des heures supplémentaires."},{"q":"The museum is closed today ___ it is a public holiday.","o":["since","although","unless","despite"],"e":"<b>Since</b> = puisque (cause).","tr":"Le musée est fermé aujourd'hui puisque c'est un jour férié."},{"q":"Please read the contract carefully ___ signing it.","o":["before","until","unless","despite"],"e":"<b>Before</b> + V-ing = avant de.","tr":"Lisez attentivement le contrat avant de le signer."},{"q":"You can use the gym ___ you are a member.","o":["as long as","even though","so that","whereas"],"e":"Condition → <b>as long as</b>.","tr":"Vous pouvez utiliser la salle tant que vous êtes membre."},{"q":"The product was expensive, too short.","o":["but","and","or","so"],"e":"Contraste → <b>but</b>.","tr":"Le séminaire était intéressant mais trop court."},{"q":"The shipment arrived early; ___, we started production ahead of schedule.","o":["as a result","however","nevertheless","instead"],"e":"Conséquence → <b>as a result</b>.","tr":"La livraison est arrivée en avance ; nous avons donc commencé la production plus tôt."},{"q":"I'll lend you my car ___ you drive carefully.","o":["as long as","even though","so that","whereas"],"e":"Condition → <b>as long as</b>.","tr":"Je te prête ma voiture à condition que tu conduises prudemment."},{"q":"The meeting ended early ___ the director had another appointment.","o":["because","although","unless","despite"],"e":"Cause → <b>because</b>.","tr":"La réunion s'est terminée tôt car le directeur avait un autre rendez-vous."},{"q":"___ the factory is old, it is very efficient.","o":["Although","Because","Since","Unless"],"e":"Opposition → <b>Although</b>.","tr":"Bien que l'usine soit ancienne, elle est très efficace."},{"q":"We should leave now ___ we want to avoid traffic.","o":["if","unless","although","whereas"],"e":"Condition → <b>if</b>.","tr":"Nous devrions partir maintenant si nous voulons éviter les embouteillages."},{"q":"Ms. Liu can speak three languages, ___ Chinese and Arabic.","o":["including","include","included","includes"],"e":"<b>Including</b> = dont, y compris.","tr":"Mme Liu parle trois langues, dont le chinois et l'arabe."},{"q":"The weather was good, ___ the picnic was a success.","o":["so","but","or","yet"],"e":"Conséquence → <b>so</b>.","tr":"Il faisait beau, le pique-nique a donc été un succès."},{"q":"The CEO will visit the factory ___ she is in Mexico.","o":["while","during","despite","unless"],"e":"<b>While</b> + proposition.","tr":"La PDG visitera l'usine pendant son séjour au Mexique."},{"q":"___ receiving the complaint, the manager called the customer.","o":["After","Although","Unless","Whereas"],"e":"<b>After</b> + V-ing.","tr":"Après avoir reçu la plainte, le responsable a appelé le client."},{"q":"Neither the manual ___ the website explains the problem.","o":["nor","or","and","but"],"e":"<b>Neither … nor</b>.","tr":"Ni le manuel ni le site n'expliquent le problème."},{"q":"The product is both reliable ___ affordable.","o":["and","or","nor","but"],"e":"<b>Both … and</b>.","tr":"Le produit est à la fois fiable et abordable."},{"q":"Sales increased; ___, we hired more staff.","o":["therefore","however","nevertheless","otherwise"],"e":"Conséquence → <b>therefore</b>.","tr":"Les ventes ont augmenté ; nous avons donc embauché."},{"q":"The company will survive ___ it adapts to change.","o":["only if","even though","so that","whereas"],"e":"Condition nécessaire → <b>only if</b>.","tr":"L'entreprise ne survivra que si elle s'adapte au changement."},{"q":"The building is old ___ well maintained.","o":["but","so","or","because"],"e":"Contraste → <b>but</b>.","tr":"Le bâtiment est ancien mais bien entretenu."},{"q":"___ it rains, the ceremony will take place indoors.","o":["If","Unless","Although","Despite"],"e":"Condition → <b>If</b>.","tr":"S'il pleut, la cérémonie aura lieu à l'intérieur."},{"q":"The team celebrated ___ the project was finished.","o":["when","unless","although","despite"],"e":"Moment → <b>when</b>.","tr":"L'équipe a fait la fête quand le projet a été terminé."},{"q":"Please check your e-mail regularly ___ you don't miss an update.","o":["so that","in case","unless","because"],"e":"But → <b>so that</b>.","tr":"Consultez régulièrement vos e-mails pour ne manquer aucune mise à jour."},{"q":"He was tired, ___ he kept working.","o":["yet","so","or","because"],"e":"<b>Yet</b> = pourtant.","tr":"Il était fatigué, et pourtant il a continué à travailler."},{"q":"The applicant was rejected ___ he lacked experience.","o":["because","although","unless","despite"],"e":"Cause → <b>because</b>.","tr":"Le candidat a été refusé car il manquait d'expérience."},{"q":"The report must be clear ___ concise.","o":["and","nor","or","but"],"e":"Deux exigences → <b>and</b>.","tr":"Le rapport doit être clair et concis."},{"q":"The store offers free delivery ___ the order is over $100.","o":["if","unless","although","whereas"],"e":"Condition → <b>if</b>.","tr":"Le magasin livre gratuitement si la commande dépasse 100 $."}]},{"id":"pron","group":"grammar","title":"Pronoms","part":"Part 5","start":101,"rule":"Sujet <b>I, he, they</b> · complément <b>me, him, them</b> · adjectif possessif (+ nom) <b>my, his, their, its</b> · pronom possessif (seul) <b>mine, his, theirs</b> · réfléchi <b>myself, themselves</b> (le sujet agit sur lui-même ou « lui-même, en personne »). <b>its</b> = possessif, <b>it's</b> = it is.","qs":[{"q":"Mr. Brown asked his assistant to send the files to ___.","o":["him","he","his","himself"],"e":"Après une préposition (to), on met un <b>pronom complément</b> : him. « Himself » renverrait à l'assistant, pas à M. Brown.","tr":"M. Brown a demandé à son assistant de lui envoyer les fichiers."},{"q":"The employees completed the survey ___.","o":["themselves","they","them","their"],"e":"En fin de phrase, le <b>réfléchi</b> insiste : « eux-mêmes, sans aide ».","tr":"Les employés ont rempli le questionnaire eux-mêmes."},{"q":"Ms. Kim and I will present ___ findings at the meeting.","o":["our","ours","us","ourselves"],"e":"Devant un <b>nom</b> (findings) → <b>adjectif possessif</b> : our.","tr":"Mme Kim et moi présenterons nos conclusions lors de la réunion."},{"q":"This office is larger than ___.","o":["ours","our","us","we"],"e":"Rien ne suit le blanc → <b>pronom possessif</b> (ours = our office).","tr":"Ce bureau est plus grand que le nôtre."},{"q":"Anyone who wants to attend the workshop should register ___ name online.","o":["their","theirs","them","they're"],"e":"Devant un nom → <b>adjectif possessif</b>. Après « anyone », l'anglais utilise <b>their</b> (singular they).","tr":"Toute personne souhaitant participer à l'atelier doit inscrire son nom en ligne."},{"q":"The company updated ___ website to make it easier to use.","o":["its","it's","it","itself"],"e":"Possessif devant un nom → <b>its</b> (sans apostrophe). <b>It's</b> = it is.","tr":"L'entreprise a mis à jour son site pour le rendre plus simple d'utilisation."},{"q":"Please give the documents to Ms. Lee and ___.","o":["me","I","my","mine"],"e":"Après la préposition <b>to</b> → <b>pronom complément</b> (me), même dans « X and me ».","tr":"Veuillez remettre les documents à Mme Lee et à moi."},{"q":"The decision is ___ to make, not mine.","o":["yours","your","you","yourself"],"e":"Aucun nom après le blanc → <b>pronom possessif</b> (yours), en parallèle avec « mine ».","tr":"C'est à vous de prendre la décision, pas à moi."},{"q":"Ms. Yu prefers to handle difficult clients by ___.","o":["herself","her","hers","she"],"e":"<b>By + réfléchi</b> = seul(e), sans aide.","tr":"Mme Yu préfère gérer seule les clients difficiles."},{"q":"The company and ___ competitors attended the trade fair.","o":["its","it's","it","itself"],"e":"Devant un nom (competitors) → adjectif possessif <b>its</b> (the company).","tr":"L'entreprise et ses concurrents ont participé au salon."},{"q":"Mr. Evans forgot ___ badge at home.","o":["his","him","he","himself"],"e":"Devant le nom <b>badge</b> → adjectif possessif <b>his</b>.","tr":"M. Evans a oublié son badge chez lui."},{"q":"The managers held the meeting ___ because the assistant was absent.","o":["themselves","them","their","theirs"],"e":"<b>Réfléchi d'insistance</b> = eux-mêmes.","tr":"Les responsables ont animé la réunion eux-mêmes car l'assistant était absent."},{"q":"Is this umbrella ___ or Mr. Kato's?","o":["yours","your","you","yourself"],"e":"Pas de nom après → <b>pronom possessif</b>, parallèle à « Mr. Kato's ».","tr":"Ce parapluie est-il à vous ou à M. Kato ?"},{"q":"The clients said ___ were satisfied with the service.","o":["they","them","their","themselves"],"e":"Sujet du verbe <b>were</b> → <b>pronom sujet</b>.","tr":"Les clients ont dit qu'ils étaient satisfaits du service."},{"q":"We should ask ___ supervisor before changing the schedule.","o":["our","us","ours","ourselves"],"e":"Devant un nom → adjectif possessif <b>our</b>.","tr":"Nous devrions demander à notre supérieur avant de changer le planning."},{"q":"Ms. Obi and ___ will attend the meeting.","o":["I","me","my","mine"],"e":"Sujet (avec Ms. Obi) du verbe <b>will attend</b> → <b>I</b>.","tr":"Mme Obi et moi assisterons à la réunion."},{"q":"The new manager asked ___ to call her by her first name.","o":["us","we","our","ours"],"e":"Complément du verbe <b>asked</b> → <b>us</b>.","tr":"La nouvelle responsable nous a demandé de l'appeler par son prénom."},{"q":"The laptop on the desk is ___.","o":["mine","my","me","myself"],"e":"Fin de phrase, pas de nom → <b>pronom possessif</b>.","tr":"L'ordinateur sur le bureau est à moi."},{"q":"___ of the applicants has a degree in engineering.","o":["Each","Every","All","Both"],"e":"<b>Each of</b> + verbe au singulier (has). « Every » ne s'emploie pas avec « of ».","tr":"Chacun des candidats a un diplôme d'ingénieur."},{"q":"The team members congratulated one ___ on the successful launch.","o":["another","other","others","the other"],"e":"Expression réciproque <b>one another</b> = les uns les autres.","tr":"Les membres de l'équipe se sont félicités mutuellement pour le lancement réussi."},{"q":"Some employees prefer working from home, while ___ prefer the office.","o":["others","other","another","the other"],"e":"<b>Some … others</b> : pronom pluriel (d'autres), sans nom derrière.","tr":"Certains employés préfèrent le télétravail, d'autres le bureau."},{"q":"___ called while you were out, but they didn't leave a message.","o":["Someone","Anyone","No one","Anything"],"e":"Phrase affirmative, une personne → <b>Someone</b>.","tr":"Quelqu'un a appelé pendant votre absence, sans laisser de message."},{"q":"There is ___ in the meeting room right now; you can use it.","o":["nobody","anybody","somebody","everybody"],"e":"La salle est libre → <b>nobody</b>. « Anybody » ne s'emploie pas ainsi à l'affirmatif.","tr":"Il n'y a personne dans la salle de réunion ; vous pouvez l'utiliser."},{"q":"Ms. Ruiz wrote the entire report by ___.","o":["herself","her","hers","she"],"e":"<b>By herself</b> = toute seule.","tr":"Mme Ruiz a rédigé tout le rapport seule."},{"q":"The director thanked ___ for their hard work.","o":["everyone","anyone","no one","each other"],"e":"Phrase affirmative, tout le monde → <b>everyone</b>.","tr":"Le directeur a remercié tout le monde pour son travail."},{"q":"Our products are cheaper than ___.","o":["theirs","their","them","they"],"e":"Comparaison avec <b>leurs produits</b> → pronom possessif <b>theirs</b>.","tr":"Nos produits sont moins chers que les leurs."},{"q":"The company allows ___ employees to work remotely twice a week.","o":["its","it's","it","itself"],"e":"Devant un nom → <b>its</b> (pas d'apostrophe).","tr":"L'entreprise autorise ses salariés à télétravailler deux fois par semaine."},{"q":"Let ___ know if you need any assistance.","o":["me","I","my","mine"],"e":"<b>Let + complément</b> → me.","tr":"Faites-moi savoir si vous avez besoin d'aide."},{"q":"The customers were asked to help ___ to free coffee.","o":["themselves","them","their","theirs"],"e":"<b>Help oneself to</b> = se servir.","tr":"On a invité les clients à se servir un café gratuit."},{"q":"Neither of the proposals ___ acceptable.","o":["was","were","are","have been"],"e":"En anglais soutenu (TOEIC), <b>neither of</b> + verbe au <b>singulier</b>.","tr":"Aucune des deux propositions n'était acceptable."},{"q":"Ms. Hill will present the plan ___ at tomorrow's meeting.","o":["herself","her","hers","she"],"e":"<b>Réfléchi d'insistance</b> après le complément : elle-même.","tr":"Mme Hill présentera elle-même le projet à la réunion de demain."},{"q":"The new interns have not received ___ ID cards yet.","o":["their","there","they're","them"],"e":"Devant un nom → possessif <b>their</b>. There = là ; they're = they are.","tr":"Les nouveaux stagiaires n'ont pas encore reçu leurs badges."},{"q":"The firm's success is due to ___ skilled workforce.","o":["its","it's","it","itself"],"e":"Devant un groupe nominal → <b>its</b>.","tr":"Le succès du cabinet est dû à sa main-d'œuvre qualifiée."},{"q":"The tickets for ___ and your colleagues are at the front desk.","o":["you","your","yours","yourself"],"e":"Après <b>for</b> → pronom complément <b>you</b>.","tr":"Les billets pour vous et vos collègues sont à l'accueil."},{"q":"The two companies agreed to share resources with each ___.","o":["other","another","others","one"],"e":"Réciproque <b>each other</b>.","tr":"Les deux entreprises ont accepté de partager leurs ressources."},{"q":"Everyone in the department ___ the new policy.","o":["supports","support","supporting","have supported"],"e":"<b>Everyone</b> est singulier → supports.","tr":"Tout le service soutient la nouvelle politique."},{"q":"The supplier sent us a sample, but ___ was damaged.","o":["it","its","it's","itself"],"e":"Sujet de <b>was</b> reprenant « a sample » → <b>it</b>.","tr":"Le fournisseur nous a envoyé un échantillon, mais il était abîmé."},{"q":"I asked Mr. Ward for his opinion, and ___ agreed with the plan.","o":["he","him","his","himself"],"e":"Sujet de <b>agreed</b> → <b>he</b>.","tr":"J'ai demandé son avis à M. Ward, et il a approuvé le projet."},{"q":"These documents are ___; please don't take them.","o":["ours","our","us","ourselves"],"e":"Pas de nom après → <b>ours</b>.","tr":"Ces documents sont à nous ; ne les prenez pas."},{"q":"Ms. Tran asked ___ assistant to book a flight.","o":["her","hers","she","herself"],"e":"Devant un nom → possessif <b>her</b>.","tr":"Mme Tran a demandé à son assistant de réserver un vol."},{"q":"The CEO ___ will attend the opening ceremony.","o":["himself","him","his","he"],"e":"Réfléchi d'insistance après le sujet : le PDG <b>lui-même</b>.","tr":"Le PDG en personne assistera à la cérémonie d'ouverture."},{"q":"Many of ___ were surprised by the announcement.","o":["us","we","our","ours"],"e":"Après <b>of</b> → pronom complément <b>us</b>.","tr":"Beaucoup d'entre nous ont été surpris par l'annonce."},{"q":"The engineers checked the machine ___ before signing the report.","o":["themselves","them","their","theirs"],"e":"Insistance : les ingénieurs <b>eux-mêmes</b>.","tr":"Les ingénieurs ont vérifié eux-mêmes la machine avant de signer le rapport."},{"q":"Could ___ of you help me carry these chairs?","o":["one","every","someone","other"],"e":"<b>One of you</b> = l'un d'entre vous. « Every » ne se combine pas avec « of ».","tr":"L'un d'entre vous pourrait-il m'aider à porter ces chaises ?"},{"q":"The hotel has a pool, but ___ is closed for repairs.","o":["it","its","it's","they"],"e":"Sujet singulier reprenant « a pool » → <b>it</b>.","tr":"L'hôtel a une piscine, mais elle est fermée pour travaux."},{"q":"Ms. Bauer and her husband run the store by ___.","o":["themselves","themself","theirselves","them"],"e":"Deux personnes → <b>themselves</b>. « Theirselves » n'existe pas.","tr":"Mme Bauer et son mari tiennent le magasin seuls."},{"q":"This is not my coat; ___ is black.","o":["mine","my","me","myself"],"e":"Pas de nom après → <b>mine</b> (= my coat).","tr":"Ce n'est pas mon manteau ; le mien est noir."},{"q":"The client wants to speak with ___ directly.","o":["you","your","yours","yourself"],"e":"Après <b>with</b> → pronom complément <b>you</b>.","tr":"Le client veut vous parler directement."},{"q":"___ is responsible for locking the door at night?","o":["Who","Whom","Whose","Which"],"e":"Pronom interrogatif <b>sujet</b> désignant une personne → <b>Who</b>.","tr":"Qui est chargé de fermer la porte le soir ?"},{"q":"The report and ___ attachments were sent yesterday.","o":["its","it's","it","itself"],"e":"Les pièces jointes <b>du rapport</b> → <b>its</b>.","tr":"Le rapport et ses pièces jointes ont été envoyés hier."},{"q":"Mr. Nash and I have known ___ for years.","o":["each other","ourselves","us","one other"],"e":"Relation <b>réciproque</b> → <b>each other</b>.","tr":"M. Nash et moi nous connaissons depuis des années."},{"q":"___ who wish to attend the dinner should reply by Friday.","o":["Those","These","Them","They"],"e":"<b>Those who</b> = ceux qui.","tr":"Ceux qui souhaitent assister au dîner doivent répondre avant vendredi."},{"q":"Our competitors lowered ___ prices last month.","o":["their","there","theirs","them"],"e":"Devant un nom → <b>their</b>.","tr":"Nos concurrents ont baissé leurs prix le mois dernier."},{"q":"Ms. Harper gave ___ a detailed tour of the factory.","o":["us","we","our","ours"],"e":"Complément de <b>gave</b> → <b>us</b>.","tr":"Mme Harper nous a fait visiter l'usine en détail."},{"q":"The manager reminded ___ that the deadline was Friday.","o":["everyone","anyone","everything","anything"],"e":"On rappelle quelque chose à des <b>personnes</b>, phrase affirmative → <b>everyone</b>.","tr":"Le responsable a rappelé à tous que l'échéance était vendredi."},{"q":"The printer on the second floor is newer than ___ on the first floor.","o":["the one","it","one's","ones"],"e":"<b>The one</b> remplace un nom singulier déjà cité (the printer).","tr":"L'imprimante du deuxième étage est plus récente que celle du premier."},{"q":"When Ms. Choi arrived, the receptionist greeted ___ warmly.","o":["her","she","hers","herself"],"e":"Complément de <b>greeted</b> → <b>her</b>.","tr":"Quand Mme Choi est arrivée, la réceptionniste l'a accueillie chaleureusement."},{"q":"The sales representatives are proud of ___ results.","o":["their","them","theirs","they"],"e":"Devant un nom → <b>their</b>.","tr":"Les commerciaux sont fiers de leurs résultats."},{"q":"Mr. Lopez did not attend the meeting; ___ assistant went instead.","o":["his","him","he","himself"],"e":"Devant un nom → <b>his</b>.","tr":"M. Lopez n'a pas assisté à la réunion ; son assistant y est allé à sa place."},{"q":"You can reach ___ at extension 204.","o":["me","I","my","mine"],"e":"Complément de <b>reach</b> → <b>me</b>.","tr":"Vous pouvez me joindre au poste 204."},{"q":"Ms. Tan sent ___ the updated schedule.","o":["us","we","our","ours"],"e":"Complément de <b>sent</b> → pronom complément.","tr":"Mme Tan nous a envoyé le planning mis à jour."},{"q":"The customers expressed ___ satisfaction with the service.","o":["their","them","theirs","they"],"e":"Devant un nom → possessif <b>their</b>.","tr":"Les clients ont exprimé leur satisfaction."},{"q":"Mr. Hill repaired the printer ___.","o":["himself","him","his","he"],"e":"Réfléchi d'insistance → lui-même.","tr":"M. Hill a réparé l'imprimante lui-même."},{"q":"Is this your laptop or ___?","o":["mine","my","me","myself"],"e":"Pas de nom après → pronom possessif.","tr":"C'est ton ordinateur ou le mien ?"},{"q":"The company has increased ___ market share.","o":["its","it's","it","itself"],"e":"Devant un nom → <b>its</b>.","tr":"L'entreprise a augmenté sa part de marché."},{"q":"Our manager and ___ discussed the new project.","o":["I","me","my","mine"],"e":"Sujet → <b>I</b>.","tr":"Notre responsable et moi avons parlé du nouveau projet."},{"q":"The documents are for Mr. Wood and ___.","o":["her","she","hers","herself"],"e":"Après <b>for</b> → pronom complément.","tr":"Les documents sont pour M. Wood et elle."},{"q":"We prepared the presentation by ___.","o":["ourselves","us","our","ours"],"e":"<b>By ourselves</b> = seuls.","tr":"Nous avons préparé la présentation seuls."},{"q":"At the start of the meeting, the new staff members introduced ___.","o":["themselves","them","their","theirs"],"e":"Ils se présentent eux-mêmes → réfléchi.","tr":"Au début de la réunion, les nouveaux se sont présentés."},{"q":"Please send the invoice to ___ at the address below.","o":["us","we","our","ours"],"e":"Après <b>to</b> → pronom complément.","tr":"Envoyez-nous la facture à l'adresse ci-dessous."},{"q":"Mr. Soto lost ___ keys at the airport.","o":["his","him","he","himself"],"e":"Devant un nom → <b>his</b>.","tr":"M. Soto a perdu ses clés à l'aéroport."},{"q":"The idea was ___, not the manager's.","o":["hers","her","she","herself"],"e":"Pas de nom après, parallèle à « the manager's » → <b>hers</b>.","tr":"L'idée venait d'elle, pas du responsable."},{"q":"___ of the employees received a bonus.","o":["All","Every","Whole","Much"],"e":"<b>All of the</b> + pluriel.","tr":"Tous les employés ont reçu une prime."},{"q":"The new interns asked ___ many questions.","o":["us","we","our","ours"],"e":"Complément de <b>asked</b> → us.","tr":"Les nouveaux stagiaires nous ont posé beaucoup de questions."},{"q":"Our office is bigger than ___.","o":["theirs","their","them","they"],"e":"= their office → <b>theirs</b>.","tr":"Notre bureau est plus grand que le leur."},{"q":"Everyone must bring ___ ID card.","o":["their","them","they're","theirs"],"e":"Devant un nom, après everyone → <b>their</b>.","tr":"Chacun doit apporter sa carte d'identité."},{"q":"The manager asked ___ to stay late.","o":["me","I","my","mine"],"e":"Complément de <b>asked</b> → me.","tr":"Le responsable m'a demandé de rester tard."},{"q":"The CEO wrote the speech ___.","o":["herself","her","hers","she"],"e":"Réfléchi d'insistance → elle-même.","tr":"La PDG a écrit le discours elle-même."},{"q":"Some of ___ will attend the seminar.","o":["us","we","our","ours"],"e":"Après <b>of</b> → us.","tr":"Certains d'entre nous assisteront au séminaire."},{"q":"The client and ___ lawyer arrived together.","o":["her","hers","she","herself"],"e":"Devant un nom → <b>her</b>.","tr":"La cliente et son avocat sont arrivés ensemble."},{"q":"The company gives ___ employees free lunch.","o":["its","it's","it","itself"],"e":"Devant un nom → <b>its</b>.","tr":"L'entreprise offre le déjeuner à ses employés."},{"q":"___ is the best way to reach the airport?","o":["What","Who","Whom","Whose"],"e":"Interrogatif pour une chose → <b>What</b>.","tr":"Quel est le meilleur moyen d'aller à l'aéroport ?"},{"q":"Mr. Kim, could you help ___ with these boxes?","o":["me","I","my","mine"],"e":"Complément de <b>help</b> → me.","tr":"Monsieur Kim, pourriez-vous m'aider avec ces cartons ?"},{"q":"The shop sells ___ own brand of coffee.","o":["its","it's","it","itself"],"e":"<b>Its own</b> = sa propre.","tr":"La boutique vend sa propre marque de café."},{"q":"Both of ___ are qualified for the job.","o":["them","they","their","theirs"],"e":"Après <b>of</b> → them.","tr":"Tous les deux sont qualifiés pour le poste."},{"q":"The engineers found the solution by ___.","o":["themselves","them","their","theirs"],"e":"<b>By themselves</b> = seuls.","tr":"Les ingénieurs ont trouvé la solution seuls."},{"q":"The report on the desk is ___.","o":["yours","your","you","yourself"],"e":"Pas de nom après → <b>yours</b>.","tr":"Le rapport sur le bureau est le vôtre."},{"q":"Ms. Diaz and ___ husband own a restaurant.","o":["her","hers","she","herself"],"e":"Devant un nom → <b>her</b>.","tr":"Mme Diaz et son mari possèdent un restaurant."},{"q":"The children's section is on the second floor; ___ is very popular.","o":["it","its","it's","itself"],"e":"Sujet reprenant « section » → <b>it</b>.","tr":"L'espace enfants est au deuxième étage ; il est très fréquenté."},{"q":"I'd like to introduce ___ to you.","o":["myself","me","my","mine"],"e":"Sujet = objet → réfléchi.","tr":"J'aimerais me présenter."},{"q":"The company's success is due to ___ hard-working staff.","o":["its","it's","it","itself"],"e":"Devant un nom → <b>its</b>.","tr":"Le succès de l'entreprise est dû à son personnel travailleur."},{"q":"Please let ___ know when you are ready.","o":["us","we","our","ours"],"e":"<b>Let + complément</b>.","tr":"Prévenez-nous quand vous serez prêt."},{"q":"The manager thanked ___ of the volunteers.","o":["each","every","whole","everyone"],"e":"<b>Each of</b> + pluriel. « Every » ne s'emploie pas avec of.","tr":"Le responsable a remercié chacun des bénévoles."},{"q":"Our clients trust ___ completely.","o":["us","we","our","ours"],"e":"Complément de <b>trust</b> → us.","tr":"Nos clients nous font entièrement confiance."},{"q":"The visitors left ___ coats at the reception.","o":["their","there","they're","them"],"e":"Devant un nom → <b>their</b>.","tr":"Les visiteurs ont laissé leurs manteaux à l'accueil."},{"q":"Ms. Ross is a friend of ___.","o":["mine","my","me","I"],"e":"<b>A friend of mine</b>.","tr":"Mme Ross est une de mes amies."},{"q":"The director gave ___ permission to leave early.","o":["us","we","our","ours"],"e":"Complément de <b>gave</b> → us.","tr":"Le directeur nous a autorisés à partir tôt."},{"q":"The tablet comes with ___ own charger.","o":["its","it's","it","itself"],"e":"<b>Its own</b>.","tr":"La tablette est fournie avec son propre chargeur."},{"q":"Each department manages ___ budget.","o":["its","it's","itself","it"],"e":"Devant un nom, reprend department → <b>its</b>.","tr":"Chaque service gère son budget."},{"q":"Who left ___ umbrella in the meeting room?","o":["their","there","they're","them"],"e":"Devant un nom (sujet inconnu) → <b>their</b>.","tr":"Qui a oublié son parapluie dans la salle de réunion ?"},{"q":"The company hired ___ to design the new logo.","o":["someone","anyone","no one","everyone"],"e":"Phrase affirmative, une personne → <b>someone</b>.","tr":"L'entreprise a engagé quelqu'un pour créer le nouveau logo."},{"q":"Did ___ call while I was out?","o":["anyone","no one","anything","everything"],"e":"Question sur une personne → <b>anyone</b>.","tr":"Quelqu'un a-t-il appelé pendant mon absence ?"},{"q":"There isn't ___ in the office today.","o":["anyone","someone","no one","everyone"],"e":"Négation + <b>anyone</b>. « isn't no one » = double négation.","tr":"Il n'y a personne au bureau aujourd'hui."},{"q":"___ in the team agreed with the proposal.","o":["Everyone","Anyone","Whoever","Each other"],"e":"Affirmative, tous → <b>Everyone</b>.","tr":"Toute l'équipe a approuvé la proposition."},{"q":"The two managers respect each ___.","o":["other","another","others","one"],"e":"<b>Each other</b>.","tr":"Les deux responsables se respectent mutuellement."},{"q":"Please help ___ to coffee and snacks.","o":["yourselves","you","your","yours"],"e":"<b>Help yourselves to</b> = servez-vous.","tr":"Servez-vous en café et en en-cas."},{"q":"The phone on the desk is not ___.","o":["mine","my","me","myself"],"e":"Pas de nom après → <b>mine</b>.","tr":"Le téléphone sur le bureau n'est pas à moi."},{"q":"Ms. Klein and ___ will lead the workshop.","o":["he","him","his","himself"],"e":"Sujet → <b>he</b>.","tr":"Mme Klein et lui animeront l'atelier."},{"q":"The laptop and ___ case were stolen.","o":["its","it's","it","itself"],"e":"Devant un nom → <b>its</b>.","tr":"L'ordinateur et sa housse ont été volés."},{"q":"The team members are proud of ___ work.","o":["their","them","theirs","themselves"],"e":"Devant un nom → <b>their</b>.","tr":"Les membres de l'équipe sont fiers de leur travail."},{"q":"Mr. Bell usually drives ___ to work.","o":["himself","him","his","he"],"e":"Il se conduit lui-même → réfléchi.","tr":"M. Bell va généralement au travail en voiture."},{"q":"Tell ___ what you need, and I'll order it.","o":["me","I","my","mine"],"e":"Complément de <b>tell</b> → me.","tr":"Dis-moi ce dont tu as besoin et je le commanderai."},{"q":"The new policy will affect all of ___.","o":["us","we","our","ours"],"e":"Après <b>of</b> → us.","tr":"La nouvelle politique nous concernera tous."},{"q":"The company and ___ partners signed the deal.","o":["its","it's","it","itself"],"e":"Devant un nom → <b>its</b>.","tr":"L'entreprise et ses partenaires ont signé l'accord."},{"q":"The seats in the front row are ___.","o":["ours","our","us","ourselves"],"e":"Pas de nom après → <b>ours</b>.","tr":"Les places du premier rang sont les nôtres."},{"q":"Ms. Park reminded ___ team about the deadline.","o":["her","hers","she","herself"],"e":"Devant un nom → <b>her</b>.","tr":"Mme Park a rappelé l'échéance à son équipe."},{"q":"The printer isn't working. Could you look lly.","o":["itself","it","its","it's"],"e":"La machine s'éteint seule → réfléchi.","tr":"La machine s'éteint automatiquement."},{"q":"Every employee should update ___ contact information.","o":["their","them","theirs","they're"],"e":"Devant un nom → <b>their</b>.","tr":"Chaque employé doit mettre à jour ses coordonnées."},{"q":"The manager invited ___ to the dinner.","o":["everyone","anyone","everything","anything"],"e":"Personnes, phrase affirmative → <b>everyone</b>.","tr":"Le responsable a invité tout le monde au dîner."},{"q":"Mr. Wu and ___ colleagues won the award.","o":["his","him","he","himself"],"e":"Devant un nom → <b>his</b>.","tr":"M. Wu et ses collègues ont remporté le prix."},{"q":"Some of the files are missing, but ___ are safe.","o":["most","much","little","any"],"e":"Pluriel (files) → <b>most</b> (la plupart).","tr":"Certains fichiers manquent, mais la plupart sont intacts."},{"q":"We need someone to help ___ with the move.","o":["us","we","our","ours"],"e":"Complément de <b>help</b> → us.","tr":"Il nous faut quelqu'un pour nous aider à déménager."},{"q":"The client called ___ yesterday to confirm the order.","o":["me","I","my","mine"],"e":"Complément de <b>called</b> → me.","tr":"Le client m'a appelé hier pour confirmer la commande."},{"q":"The team leader asked each member to introduce ___.","o":["himself or herself","him or her","his or her","he or she"],"e":"Chaque membre se présente → réfléchi.","tr":"Le chef d'équipe a demandé à chacun de se présenter."},{"q":"The company changed ___ name last year.","o":["its","it's","it","itself"],"e":"Devant un nom → <b>its</b>.","tr":"L'entreprise a changé de nom l'an dernier."},{"q":"Neither of ___ attended the meeting.","o":["them","they","their","theirs"],"e":"Après <b>of</b> → them.","tr":"Aucun des deux n'a assisté à la réunion."},{"q":"The shareholders will vote at ___ annual meeting.","o":["their","them","theirs","they"],"e":"Devant un nom → <b>their</b>.","tr":"Les actionnaires voteront lors de leur assemblée annuelle."},{"q":"The office belongs to the Smiths; it is ___.","o":["theirs","their","them","they"],"e":"Pas de nom après → <b>theirs</b>.","tr":"Le bureau appartient aux Smith ; c'est le leur."},{"q":"Mr. Chen can't find ___ phone.","o":["his","him","he","himself"],"e":"Devant un nom → <b>his</b>.","tr":"M. Chen ne trouve pas son téléphone."},{"q":"Ms. Hart designed ___ own website.","o":["her","hers","she","herself"],"e":"<b>Her own</b>.","tr":"Mme Hart a conçu son propre site."},{"q":"Thank you for helping ___ with the report.","o":["me","I","my","mine"],"e":"Complément de <b>helping</b> → me.","tr":"Merci de m'avoir aidé pour le rapport."},{"q":"The company offers ___ customers a 10% discount.","o":["its","it's","it","itself"],"e":"Devant un nom → <b>its</b>.","tr":"L'entreprise offre 10 % de remise à ses clients."},{"q":"Please introduce ___ to the other participants.","o":["yourself","you","your","yours"],"e":"Sujet (implicite you) = objet → réfléchi.","tr":"Présentez-vous aux autres participants."},{"q":"The award was given to Ms. Kim and ___.","o":["me","I","my","mine"],"e":"Après <b>to</b> → me.","tr":"Le prix a été remis à Mme Kim et à moi."},{"q":"The sales team exceeded ___ target.","o":["its","it's","it","itself"],"e":"Devant un nom, reprend team → <b>its</b>.","tr":"L'équipe commerciale a dépassé son objectif."},{"q":"The decision is ___ to make, so we will discuss it.","o":["ours","our","us","ourselves"],"e":"Pas de nom après → <b>ours</b>.","tr":"C'est à nous de décider, nous allons donc en discuter."},{"q":"The guests helped ___ to the buffet.","o":["themselves","them","their","theirs"],"e":"<b>Help oneself to</b>.","tr":"Les invités se sont servis au buffet."},{"q":"___ wants to join the trip should sign up by Friday.","o":["Whoever","Whomever","Whose","Which"],"e":"« Quiconque », sujet de wants → <b>Whoever</b>.","tr":"Quiconque veut participer au voyage doit s'inscrire avant vendredi."},{"q":"The software updates ___ every week.","o":["itself","it","its","it's"],"e":"Le logiciel se met à jour → réfléchi.","tr":"Le logiciel se met à jour chaque semaine."},{"q":"My colleague and ___ went to the conference.","o":["I","me","my","mine"],"e":"Sujet → <b>I</b>.","tr":"Mon collègue et moi sommes allés à la conférence."},{"q":"The firm has doubled ___ revenue.","o":["its","it's","it","itself"],"e":"Devant un nom → <b>its</b>.","tr":"Le cabinet a doublé son chiffre d'affaires."},{"q":"The manager lent ___ his car.","o":["me","I","my","mine"],"e":"Complément de <b>lent</b> → me.","tr":"Le responsable m'a prêté sa voiture."},{"q":"Is this bag ___, Ms. Ray?","o":["yours","your","you","yourself"],"e":"Pas de nom après → <b>yours</b>.","tr":"Ce sac est-il à vous, Madame Ray ?"},{"q":"The children were proud of ___ drawings.","o":["their","them","theirs","they"],"e":"Devant un nom → <b>their</b>.","tr":"Les enfants étaient fiers de leurs dessins."},{"q":"___ called while you were in the meeting.","o":["Somebody","Anybody","Anything","Something"],"e":"Personne, phrase affirmative → <b>Somebody</b>.","tr":"Quelqu'un a appelé pendant ta réunion."},{"q":"The team did the work ___, without outside help.","o":["themselves","them","their","theirs"],"e":"Insistance → eux-mêmes.","tr":"L'équipe a fait le travail elle-même, sans aide extérieure."},{"q":"Mr. Park and Ms. Lee congratulated ___ on the success.","o":["each other","one other","another","others"],"e":"Réciproque → <b>each other</b>.","tr":"M. Park et Mme Lee se sont félicités mutuellement du succès."},{"q":"The printer needs a new cartridge; ___ ink is low.","o":["its","it's","it","itself"],"e":"Devant un nom → <b>its</b>.","tr":"L'imprimante a besoin d'une cartouche : son encre est presque vide."},{"q":"Some visitors prefer tea; ___ prefer coffee.","o":["others","other","another","the other"],"e":"Pronom pluriel → <b>others</b>.","tr":"Certains visiteurs préfèrent le thé, d'autres le café."},{"q":"The director called ___ into his office.","o":["me","I","my","mine"],"e":"Complément de <b>called</b> → me.","tr":"Le directeur m'a convoqué dans son bureau."},{"q":"The company rewards ___ top performers.","o":["its","it's","it","itself"],"e":"Devant un nom → <b>its</b>.","tr":"L'entreprise récompense ses meilleurs éléments."},{"q":"The instructions were clear, so we followed ___.","o":["them","they","their","theirs"],"e":"Complément de <b>followed</b> → them.","tr":"Les instructions étaient claires, nous les avons donc suivies."},{"q":"The guide showed ___ around the factory.","o":["us","we","our","ours"],"e":"Complément de <b>showed</b> → us.","tr":"Le guide nous a fait visiter l'usine."},{"q":"The new manager is ___ a former engineer.","o":["herself","her","hers","she"],"e":"Insistance → elle-même.","tr":"La nouvelle responsable est elle-même ancienne ingénieure."},{"q":"The team's success is also ___.","o":["yours","your","you","yourself"],"e":"Pas de nom après → <b>yours</b>.","tr":"La réussite de l'équipe est aussi la vôtre."},{"q":"Mr. Bell asked ___ for advice.","o":["them","they","their","theirs"],"e":"Complément de <b>asked</b> → them.","tr":"M. Bell leur a demandé conseil."},{"q":"Ms. Grant booked the flight ___.","o":["herself","her","hers","she"],"e":"Insistance → elle-même.","tr":"Mme Grant a réservé le vol elle-même."},{"q":"Please make ___ at home.","o":["yourselves","you","your","yours"],"e":"<b>Make yourselves at home</b> = faites comme chez vous.","tr":"Faites comme chez vous."},{"q":"The clients were happy with ___ new offices.","o":["their","them","theirs","they"],"e":"Devant un nom → <b>their</b>.","tr":"Les clients étaient satisfaits de leurs nouveaux bureaux."},{"q":"The CEO told ___ that sales were rising.","o":["us","we","our","ours"],"e":"Complément de <b>told</b> → us.","tr":"Le PDG nous a dit que les ventes augmentaient."},{"q":"___ of the three proposals was chosen.","o":["None","Neither","Nobody","Nothing"],"e":"Trois éléments → <b>None of</b> (neither = deux).","tr":"Aucune des trois propositions n'a été retenue."},{"q":"Mr. Ray's car is older than ___.","o":["hers","her","she","herself"],"e":"= her car → <b>hers</b>.","tr":"La voiture de M. Ray est plus vieille que la sienne."},{"q":"The receptionist asked ___ to wait.","o":["us","we","our","ours"],"e":"Complément de <b>asked</b> → us.","tr":"La réceptionniste nous a demandé de patienter."},{"q":"Each of ___ has a different role.","o":["us","we","our","ours"],"e":"Après <b>of</b> → us.","tr":"Chacun de nous a un rôle différent."},{"q":"The machine stopped by ___.","o":["itself","it","its","it's"],"e":"<b>By itself</b> = toute seule.","tr":"La machine s'est arrêtée toute seule."},{"q":"Mr. Kent has his own office, but Ms. Lee shares ___.","o":["hers","her","she","herself"],"e":"= her office → <b>hers</b>.","tr":"M. Kent a son propre bureau, mais Mme Lee partage le sien."},{"q":"Thank ___ for your patience.","o":["you","your","yours","yourself"],"e":"Complément de <b>thank</b> → you.","tr":"Merci de votre patience."}]},{"id":"passive","group":"grammar","title":"Voix passive & participes","part":"Part 5","start":101,"rule":"Passif = <b>be + participe passé</b>. Si le sujet <b>subit</b> l'action (results, documents), pensez passif. Participe passé en adjectif = sens passif (<b>products made in…</b>) ; en -ing = sens actif (<b>a confusing change</b>).","qs":[{"q":"The results of the survey ___ next week.","o":["will be announced","will announce","announced","are announcing"],"e":"Les résultats ne s'annoncent pas eux-mêmes : ils <b>sont annoncés</b> → passif futur <b>will be + participe</b>.","tr":"Les résultats de l'enquête seront annoncés la semaine prochaine."},{"q":"The documents ___ by the legal team before they were sent.","o":["were reviewed","reviewed","have reviewed","reviewing"],"e":"<b>by the legal team</b> = agent du passif. Contexte passé → <b>were reviewed</b>.","tr":"Les documents ont été vérifiés par l'équipe juridique avant d'être envoyés."},{"q":"Products ___ in this factory are exported to over 20 countries.","o":["made","make","making","makes"],"e":"Participe passé à sens passif : les produits <b>(qui sont) fabriqués</b> dans cette usine. Le verbe principal est « are exported ».","tr":"Les produits fabriqués dans cette usine sont exportés dans plus de 20 pays."},{"q":"Employees ___ in the training program should contact HR.","o":["interested","interest","interesting","interests"],"e":"<b>Interested in</b> = intéressé par (ce que ressent la personne). « Interesting » = qui est intéressant.","tr":"Les employés intéressés par le programme de formation doivent contacter les RH."},{"q":"The ___ sales figures were lower than expected.","o":["reported","report","reporting","reports"],"e":"Les chiffres <b>ont été communiqués</b> (sens passif) → participe passé adjectif <b>reported</b>.","tr":"Les chiffres de ventes communiqués étaient inférieurs aux prévisions."},{"q":"The new policy was a ___ change for many employees.","o":["confusing","confuse","confused","confusion"],"e":"Le changement <b>provoque</b> la confusion → adjectif en <b>-ing</b>. Les employés, eux, sont « confused ».","tr":"La nouvelle politique a été un changement déroutant pour de nombreux employés."},{"q":"The new bridge ___ next year.","o":["will be completed","will complete","completed","is completing"],"e":"Le pont <b>est achevé</b> (il subit) + futur → <b>will be completed</b>.","tr":"Le nouveau pont sera achevé l'année prochaine."},{"q":"All orders ___ within 24 hours.","o":["are processed","process","processing","are processing"],"e":"Les commandes <b>sont traitées</b> → passif présent.","tr":"Toutes les commandes sont traitées sous 24 heures."},{"q":"The meeting room ___ right now, so please wait.","o":["is being cleaned","is cleaning","cleans","has cleaned"],"e":"Action en cours subie → <b>is being + participe</b>.","tr":"La salle de réunion est en train d'être nettoyée, veuillez patienter."},{"q":"The winners ___ at the ceremony last night.","o":["were announced","announced","are announcing","have announced"],"e":"Les gagnants <b>ont été annoncés</b> + last night → passif prétérit.","tr":"Les lauréats ont été annoncés lors de la cérémonie hier soir."},{"q":"This building ___ in 1920.","o":["was built","built","has built","is building"],"e":"Un bâtiment <b>est construit</b> + date passée → <b>was built</b>.","tr":"Ce bâtiment a été construit en 1920."},{"q":"The package ___ to the wrong address.","o":["was sent","sent","has sent","sending"],"e":"Le colis <b>a été envoyé</b> → passif. « Sent » seul ferait du colis l'expéditeur.","tr":"Le colis a été envoyé à la mauvaise adresse."},{"q":"Employees ___ to wear safety helmets in the factory.","o":["are required","require","requiring","have required"],"e":"<b>Be required to</b> = être tenu de.","tr":"Les employés doivent porter un casque dans l'usine."},{"q":"The ___ items will be delivered on Friday.","o":["ordered","ordering","to order","orders"],"e":"Les articles <b>commandés</b> → participe passé adjectif (sens passif).","tr":"Les articles commandés seront livrés vendredi."},{"q":"The report ___ by the manager before it is sent to the client.","o":["must be approved","must approve","approved","approving"],"e":"<b>by the manager</b> → passif ; après un modal : <b>must be + participe</b>.","tr":"Le rapport doit être validé par le responsable avant d'être envoyé au client."},{"q":"The documents ___ in the cabinet for five years.","o":["have been kept","have kept","keep","are keeping"],"e":"Les documents <b>sont conservés</b> + for five years → passif present perfect.","tr":"Les documents sont conservés dans l'armoire depuis cinq ans."},{"q":"The conference ___ by more than 2,000 people.","o":["was attended","attended","attending","has attended"],"e":"Agent introduit par <b>by</b> → passif.","tr":"La conférence a réuni plus de 2 000 personnes."},{"q":"The ___ results surprised everyone.","o":["unexpected","unexpectedly","unexpecting","expect"],"e":"Devant un nom → adjectif ; des résultats <b>inattendus</b> (sens passif) → -ed.","tr":"Les résultats inattendus ont surpris tout le monde."},{"q":"Mr. Ross was ___ by the quality of the presentation.","o":["impressed","impressive","impressing","impression"],"e":"Ce que <b>ressent</b> la personne → <b>-ed</b>.","tr":"M. Ross a été impressionné par la qualité de la présentation."},{"q":"The new marketing strategy is very ___.","o":["exciting","excited","excite","excitedly"],"e":"La stratégie <b>suscite</b> l'enthousiasme → <b>-ing</b>.","tr":"La nouvelle stratégie marketing est très enthousiasmante."},{"q":"A new manager ___ for the Tokyo branch.","o":["has been appointed","has appointed","appointing","appoints"],"e":"Le responsable <b>a été nommé</b> (il subit) → passif present perfect.","tr":"Un nouveau directeur a été nommé pour l'agence de Tokyo."},{"q":"The shipment ___ yet.","o":["hasn't been delivered","hasn't delivered","isn't delivering","doesn't deliver"],"e":"<b>Yet</b> → present perfect ; la livraison est subie → passif.","tr":"La commande n'a pas encore été livrée."},{"q":"Participants ___ to arrive 15 minutes early.","o":["are asked","ask","asking","have asked"],"e":"Les participants <b>sont priés</b> de → passif.","tr":"Les participants sont priés d'arriver 15 minutes en avance."},{"q":"The contract ___ by both parties last week.","o":["was signed","signed","has signed","is signing"],"e":"<b>by both parties</b> + last week → passif prétérit.","tr":"Le contrat a été signé par les deux parties la semaine dernière."},{"q":"The e-mail ___ yesterday contained an error.","o":["sent","sending","was sent","sends"],"e":"Le verbe principal est <b>contained</b> ; « sent yesterday » est une relative réduite (= which was sent).","tr":"L'e-mail envoyé hier contenait une erreur."},{"q":"Anyone ___ in joining the team should apply online.","o":["interested","interesting","interest","interests"],"e":"<b>Interested in</b> = intéressé par (relative réduite).","tr":"Toute personne intéressée par l'équipe doit postuler en ligne."},{"q":"The new software ___ by all departments since March.","o":["has been used","has used","is using","uses"],"e":"<b>Since March</b> + logiciel utilisé → passif present perfect.","tr":"Le nouveau logiciel est utilisé par tous les services depuis mars."},{"q":"Customers ___ about the change in opening hours.","o":["will be informed","will inform","informing","have informed"],"e":"Les clients <b>seront informés</b> → passif futur.","tr":"Les clients seront informés du changement d'horaires."},{"q":"The workers were ___ with the new schedule.","o":["satisfied","satisfying","satisfy","satisfaction"],"e":"Sentiment des personnes → <b>-ed</b> ; <b>satisfied with</b>.","tr":"Les ouvriers étaient satisfaits du nouveau planning."},{"q":"The factory ___ when the fire broke out.","o":["was being inspected","was inspecting","inspected","inspects"],"e":"Action en cours dans le passé, subie par l'usine → <b>was being + participe</b>.","tr":"L'usine était en cours d'inspection quand l'incendie s'est déclaré."},{"q":"The results of the study were ___.","o":["disappointing","disappointed","disappoint","disappointment"],"e":"Les résultats <b>provoquent</b> la déception → <b>-ing</b>.","tr":"Les résultats de l'étude étaient décevants."},{"q":"The machine ___ every six months.","o":["is serviced","services","servicing","is servicing"],"e":"La machine <b>est entretenue</b> → passif présent (habitude).","tr":"La machine est révisée tous les six mois."},{"q":"Rooms can ___ online or by phone.","o":["be booked","book","booked","booking"],"e":"Après un modal, passif → <b>be + participe</b>.","tr":"Les chambres peuvent être réservées en ligne ou par téléphone."},{"q":"The goods ___ before the store opened.","o":["had been unloaded","had unloaded","unloaded","unloading"],"e":"Antériorité (before … opened) + marchandises déchargées → <b>passif past perfect</b>.","tr":"Les marchandises avaient été déchargées avant l'ouverture du magasin."},{"q":"The ___ candidate will start work next month.","o":["chosen","choosing","choose","chooses"],"e":"Le candidat <b>choisi</b> → participe passé adjectif.","tr":"Le candidat retenu commencera le mois prochain."},{"q":"The price ___ in the brochure is incorrect.","o":["listed","listing","lists","is listed"],"e":"Verbe principal = <b>is</b> ; « listed in the brochure » = relative réduite passive.","tr":"Le prix indiqué dans la brochure est erroné."},{"q":"The project ___ due to a lack of funding.","o":["was abandoned","abandoned","abandoning","has abandoned"],"e":"Le projet <b>a été abandonné</b> → passif.","tr":"Le projet a été abandonné faute de financement."},{"q":"The visitors ___ around the facility by the plant manager.","o":["were shown","showed","were showing","have shown"],"e":"<b>by the plant manager</b> → passif : on a fait visiter aux visiteurs.","tr":"Le directeur d'usine a fait visiter le site aux visiteurs."},{"q":"The ___ news spread quickly through the office.","o":["surprising","surprised","surprises","surprisingly"],"e":"La nouvelle <b>surprend</b> → <b>-ing</b>.","tr":"La nouvelle surprenante s'est vite répandue dans le bureau."},{"q":"Your application ___ carefully.","o":["will be reviewed","will review","reviewing","has reviewed"],"e":"Votre candidature <b>sera examinée</b> → passif futur.","tr":"Votre candidature sera examinée avec attention."},{"q":"The instructions ___ in the user manual.","o":["are explained","explain","explaining","are explaining"],"e":"Les instructions <b>sont expliquées</b> → passif.","tr":"Les instructions sont expliquées dans le manuel d'utilisation."},{"q":"Ms. Kent felt ___ after the long flight.","o":["exhausted","exhausting","exhaust","exhaustively"],"e":"Ce que <b>ressent</b> la personne → <b>-ed</b>.","tr":"Mme Kent était épuisée après le long vol."},{"q":"The event ___ because of the storm.","o":["has been canceled","has canceled","is canceling","cancels"],"e":"L'événement <b>a été annulé</b> → passif present perfect.","tr":"L'événement a été annulé à cause de la tempête."},{"q":"Tickets ___ at the entrance.","o":["will be checked","will check","checking","checked"],"e":"Les billets <b>seront contrôlés</b> → passif futur.","tr":"Les billets seront contrôlés à l'entrée."},{"q":"The company ___ by a larger competitor in 2021.","o":["was acquired","acquired","has acquired","acquires"],"e":"<b>by a larger competitor</b> + 2021 → passif prétérit.","tr":"L'entreprise a été rachetée par un concurrent plus important en 2021."},{"q":"Products ___ after the deadline will not be accepted.","o":["returned","returning","return","are returned"],"e":"Verbe principal = <b>will not be accepted</b> ; « returned after… » = relative réduite passive.","tr":"Les produits retournés après la date limite ne seront pas acceptés."},{"q":"The plans for the new office are still ___ discussed.","o":["being","been","be","to"],"e":"Passif en cours → <b>are being discussed</b>.","tr":"Les plans du nouveau bureau sont toujours en discussion."},{"q":"Lunch ___ in the cafeteria at noon.","o":["will be served","will serve","serving","serves"],"e":"Le déjeuner <b>sera servi</b> → passif.","tr":"Le déjeuner sera servi à la cafétéria à midi."},{"q":"The ___ employees received a certificate.","o":["trained","training","train","trains"],"e":"Les employés <b>formés</b> → participe passé adjectif.","tr":"Les employés formés ont reçu un certificat."},{"q":"The speech was so ___ that many people fell asleep.","o":["boring","bored","bore","boredom"],"e":"Le discours <b>provoque</b> l'ennui → <b>-ing</b>.","tr":"Le discours était si ennuyeux que beaucoup se sont endormis."},{"q":"The office supplies ___ by the end of the week.","o":["should be ordered","should order","ordering","ordered"],"e":"Les fournitures <b>doivent être commandées</b> → modal + passif.","tr":"Les fournitures de bureau doivent être commandées d'ici la fin de la semaine."},{"q":"The broken window ___ yet.","o":["hasn't been repaired","hasn't repaired","doesn't repair","isn't repairing"],"e":"<b>Yet</b> + fenêtre réparée → passif present perfect.","tr":"La fenêtre cassée n'a pas encore été réparée."},{"q":"Mr. Webb ___ as the best employee of the year.","o":["was named","named","naming","has named"],"e":"M. Webb <b>a été désigné</b> → passif.","tr":"M. Webb a été élu employé de l'année."},{"q":"The survey results ___ next Monday.","o":["will be published","will publish","publishing","published"],"e":"Les résultats <b>seront publiés</b> → passif futur.","tr":"Les résultats de l'enquête seront publiés lundi prochain."},{"q":"The new model has a ___ design.","o":["simplified","simplifying","simplify","simplifies"],"e":"Un design <b>simplifié</b> → participe passé adjectif.","tr":"Le nouveau modèle a un design simplifié."},{"q":"The tourists were ___ by the view from the tower.","o":["amazed","amazing","amaze","amazement"],"e":"Sentiment des touristes → <b>-ed</b>.","tr":"Les touristes ont été émerveillés par la vue depuis la tour."},{"q":"The problem ___ by the technician this morning.","o":["was fixed","fixed","has fixed","is fixing"],"e":"<b>by the technician</b> + this morning → passif prétérit.","tr":"Le problème a été réglé par le technicien ce matin."},{"q":"All luggage must ___ at the counter.","o":["be checked","check","checked","checking"],"e":"Après <b>must</b>, passif → <b>be checked</b>.","tr":"Tous les bagages doivent être enregistrés au comptoir."},{"q":"Only ___ personnel may enter this area.","o":["authorized","authorizing","authorize","authorization"],"e":"Le personnel <b>autorisé</b> → participe passé adjectif.","tr":"Seul le personnel autorisé peut entrer dans cette zone."},{"q":"The new factory ___ by the mayor next Tuesday.","o":["will be opened","will open","opened","opening"],"e":"<b>by the mayor</b> + next Tuesday → passif futur.","tr":"La nouvelle usine sera inaugurée par le maire mardi prochain."},{"q":"The new branch ___ by the mayor next month.","o":["will be inaugurated","will inaugurate","inaugurated","inaugurating"],"e":"<b>by the mayor</b> + futur → passif futur.","tr":"La nouvelle agence sera inaugurée par le maire le mois prochain."},{"q":"All employees ___ to attend the safety training.","o":["are expected","expect","expecting","have expected"],"e":"<b>Be expected to</b> = être censé.","tr":"Tous les employés sont censés suivre la formation sécurité."},{"q":"The documents ___ to the client yesterday.","o":["were sent","sent","have sent","are sending"],"e":"Les documents <b>ont été envoyés</b> → passif prétérit.","tr":"Les documents ont été envoyés au client hier."},{"q":"The report ___ by the finance team at the moment.","o":["is being prepared","is preparing","prepares","has prepared"],"e":"Action en cours subie → <b>is being + participe</b>.","tr":"Le rapport est en cours de préparation par l'équipe financière."},{"q":"English ___ in many countries.","o":["is spoken","speaks","is speaking","spoke"],"e":"Une langue <b>est parlée</b> → passif.","tr":"L'anglais est parlé dans de nombreux pays."},{"q":"The meeting room ___ for the afternoon.","o":["has been reserved","has reserved","reserves","is reserving"],"e":"La salle <b>a été réservée</b> → passif.","tr":"La salle de réunion a été réservée pour l'après-midi."},{"q":"The museum ___ in 1850.","o":["was founded","founded","has founded","is founding"],"e":"Fondé en 1850 → passif prétérit.","tr":"Le musée a été fondé en 1850."},{"q":"Your order ___ within three days.","o":["will be delivered","will deliver","delivered","is delivering"],"e":"La commande <b>sera livrée</b> → passif futur.","tr":"Votre commande sera livrée sous trois jours."},{"q":"The staff were ___ by the CEO's announcement.","o":["surprised","surprising","surprise","surprises"],"e":"Ce que <b>ressentent</b> les personnes → -ed.","tr":"Le personnel a été surpris par l'annonce du PDG."},{"q":"It was an ___ day for the whole team.","o":["exhausting","exhausted","exhaust","exhaustion"],"e":"La journée <b>épuise</b> → -ing.","tr":"Ce fut une journée épuisante pour toute l'équipe."},{"q":"The contract must ___ by Friday.","o":["be signed","sign","signed","signing"],"e":"Après <b>must</b>, passif → be + participe.","tr":"Le contrat doit être signé d'ici vendredi."},{"q":"The new product ___ at the trade fair last week.","o":["was introduced","introduced","has introduced","introduces"],"e":"Le produit <b>a été présenté</b> → passif prétérit.","tr":"Le nouveau produit a été présenté au salon la semaine dernière."},{"q":"Several employees ___ for their hard work.","o":["have been recognized","have recognized","recognize","recognizing"],"e":"Les employés <b>ont été récompensés</b> → passif.","tr":"Plusieurs employés ont été récompensés pour leur travail."},{"q":"The ___ goods will be shipped tomorrow.","o":["packaged","packaging","package","packages"],"e":"Marchandises <b>emballées</b> → participe passé adjectif.","tr":"Les marchandises emballées seront expédiées demain."},{"q":"The flight ___ due to fog.","o":["was delayed","delayed","has delayed","is delaying"],"e":"Le vol <b>a été retardé</b> → passif.","tr":"Le vol a été retardé à cause du brouillard."},{"q":"The building ___ at the moment.","o":["is being renovated","is renovating","renovates","has renovated"],"e":"En cours + subi → is being + participe.","tr":"Le bâtiment est en cours de rénovation."},{"q":"Photographs ___ in the museum.","o":["are not allowed","do not allow","are not allowing","have not allowed"],"e":"Les photos <b>ne sont pas autorisées</b> → passif.","tr":"Les photos sont interdites dans le musée."},{"q":"The survey ___ by over 1,000 customers.","o":["was completed","completed","has completed","is completing"],"e":"<b>by … customers</b> → passif.","tr":"L'enquête a été remplie par plus de 1 000 clients."},{"q":"The news was ___ for investors.","o":["worrying","worried","worry","worries"],"e":"La nouvelle <b>inquiète</b> → -ing.","tr":"La nouvelle était inquiétante pour les investisseurs."},{"q":"Mr. Hall was ___ to hear about the promotion.","o":["thrilled","thrilling","thrill","thrills"],"e":"Sentiment de la personne → -ed.","tr":"M. Hall était ravi d'apprendre sa promotion."},{"q":"The goods ___ in the warehouse until Monday.","o":["will be stored","will store","stored","are storing"],"e":"Les marchandises <b>seront stockées</b> → passif futur.","tr":"Les marchandises seront stockées à l'entrepôt jusqu'à lundi."},{"q":"The machine ___ by a technician every month.","o":["is checked","checks","is checking","has checked"],"e":"<b>by a technician</b> + habitude → passif présent.","tr":"La machine est vérifiée chaque mois par un technicien."},{"q":"The meeting ___ until next week.","o":["has been postponed","has postponed","postpones","is postponing"],"e":"La réunion <b>a été reportée</b> → passif.","tr":"La réunion a été reportée à la semaine prochaine."},{"q":"The bridge ___ when the storm hit.","o":["was being built","was building","built","has built"],"e":"Action en cours au passé, subie → was being + participe.","tr":"Le pont était en construction quand la tempête a frappé."},{"q":"The ___ report must be submitted by Friday.","o":["completed","completing","completes","completely"],"e":"Rapport <b>terminé</b> → participe passé adjectif.","tr":"Le rapport finalisé doit être remis d'ici vendredi."},{"q":"All applications ___ carefully.","o":["are reviewed","review","reviewing","have reviewed"],"e":"Les candidatures <b>sont examinées</b> → passif.","tr":"Toutes les candidatures sont examinées avec soin."},{"q":"The keys ___ at the front desk.","o":["can be collected","can collect","collected","collecting"],"e":"Modal + passif → can be + participe.","tr":"Les clés peuvent être récupérées à l'accueil."},{"q":"The name of the winner ___ tomorrow.","o":["will be revealed","will reveal","revealed","revealing"],"e":"Le nom <b>sera dévoilé</b> → passif futur.","tr":"Le nom du gagnant sera dévoilé demain."},{"q":"Customers were ___ with the new design.","o":["pleased","pleasing","please","pleasure"],"e":"Sentiment → -ed (pleased with)."
