e financier examine les chiffres mensuels."},{"q":"We need to reduce our ___ on imports.","o":["dependence","dependents","dependable","depending"],"e":"<b>Dependence on</b> = dépendance à.","tr":"Nous devons réduire notre dépendance aux importations."},{"q":"The client has ___ the invoice.","o":["paid","payed","pays","paying"],"e":"Participe passé de pay → <b>paid</b> (« payed » n'existe pas dans ce sens).","tr":"Le client a réglé la facture."},{"q":"The company offers ___ payment options.","o":["flexible","flexibly","flexibility","flex"],"e":"Devant un nom → adjectif.","tr":"L'entreprise propose des modes de paiement flexibles."},{"q":"Shareholders will receive their ___ in June.","o":["dividends","divisions","devices","divides"],"e":"<b>Dividends</b>.","tr":"Les actionnaires toucheront leurs dividendes en juin."},{"q":"The company is ___ for tax purposes.","o":["registered","registrar","registry","register"],"e":"<b>Registered</b> = immatriculé.","tr":"L'entreprise est immatriculée à des fins fiscales."},{"q":"The price ___ shipping and handling.","o":["includes","contains","consists","comprises"],"e":"<b>Include</b> = comprendre, inclure.","tr":"Le prix inclut les frais d'envoi."},{"q":"The value of the dollar ___ against the euro yesterday.","o":["fell","felt","fill","fall"],"e":"Prétérit de fall → fell.","tr":"Le dollar a baissé face à l'euro hier."},{"q":"The company needs to ___ more capital.","o":["raise","rise","arise","rouse"],"e":"<b>Raise capital</b> = lever des fonds.","tr":"L'entreprise doit lever davantage de capitaux."},{"q":"Our ___ are expected to double next year.","o":["sales","sails","seals","sells"],"e":"<b>Sales</b> = ventes.","tr":"Nos ventes devraient doubler l'an prochain."},{"q":"The accountant ___ an error in the balance sheet.","o":["spotted","stopped","spoiled","sported"],"e":"<b>Spot an error</b> = repérer une erreur.","tr":"Le comptable a repéré une erreur dans le bilan."},{"q":"The company's budget ___ is very strict.","o":["policy","police","politics","polity"],"e":"<b>Policy</b> = politique (règles internes).","tr":"La politique budgétaire de l'entreprise est très stricte."},{"q":"All payments are ___ through our secure system.","o":["processed","proceeded","professed","progressed"],"e":"<b>Process a payment</b>.","tr":"Tous les paiements sont traités via notre système sécurisé."},{"q":"The company reported a ___ of $500,000.","o":["deficit","defect","deference","defeat"],"e":"<b>Deficit</b> = déficit.","tr":"L'entreprise a annoncé un déficit de 500 000 $."},{"q":"The value of our investments has ___.","o":["increased","increasing","increase","increases"],"e":"<b>Has</b> + participe passé.","tr":"La valeur de nos placements a augmenté."},{"q":"The company's ___ rose by 15% after the merger.","o":["turnover","turnout","turnpike","turntable"],"e":"<b>Turnover</b> = chiffre d'affaires (UK).","tr":"Le chiffre d'affaires a progressé de 15 % après la fusion."},{"q":"The bank will ___ the funds to your account.","o":["transfer","transform","translate","transport"],"e":"<b>Transfer funds</b> = virer des fonds.","tr":"La banque virera les fonds sur votre compte."},{"q":"We must keep ___ costs as low as possible.","o":["operating","operated","operation","operates"],"e":"<b>Operating costs</b> = coûts d'exploitation.","tr":"Nous devons limiter au maximum les coûts d'exploitation."},{"q":"The CFO is responsible for financial ___.","o":["planning","planting","plotting","plating"],"e":"<b>Financial planning</b> = planification financière.","tr":"Le directeur financier est responsable de la planification financière."},{"q":"Our company is ___ profitable.","o":["highly","high","height","higher"],"e":"Adverbe devant l'adjectif.","tr":"Notre entreprise est très rentable."},{"q":"The budget was ___ by the board.","o":["approved","reproved","proved","removed"],"e":"<b>Approve a budget</b>.","tr":"Le budget a été approuvé par le conseil."},{"q":"The company invested in ___ bonds.","o":["government","governing","governed","governor"],"e":"<b>Government bonds</b> = obligations d'État.","tr":"L'entreprise a investi dans des obligations d'État."},{"q":"Customers must pay a ___ to reserve the room.","o":["deposit","depot","deposition","depositor"],"e":"<b>Deposit</b> = acompte.","tr":"Les clients doivent verser un acompte pour réserver la salle."},{"q":"The company's ___ situation is stable.","o":["financial","finance","financially","financier"],"e":"Devant un nom → adjectif.","tr":"La situation financière de l'entreprise est stable."},{"q":"The firm charges a consulting ___ of $200 per hour.","o":["fee","fare","fine","fair"],"e":"<b>Fee</b> = honoraires.","tr":"Le cabinet facture 200 $ de l'heure."},{"q":"The company ___ its losses by selling assets.","o":["covered","coveted","coated","coached"],"e":"<b>Cover losses</b> = couvrir des pertes.","tr":"L'entreprise a couvert ses pertes en vendant des actifs."},{"q":"The investment was a great ___.","o":["success","succession","successor","succeed"],"e":"<b>A great success</b>.","tr":"L'investissement a été un grand succès."},{"q":"We need to ___ the accounts before the audit.","o":["reconcile","reconsider","recognize","reconnect"],"e":"<b>Reconcile accounts</b> = rapprocher les comptes.","tr":"Nous devons faire le rapprochement des comptes avant l'audit."},{"q":"The company's value is ___ at $10 million.","o":["estimated","esteemed","estranged","established"],"e":"<b>Estimated at</b> = estimé à.","tr":"La valeur de l'entreprise est estimée à 10 millions."},{"q":"The ___ of the new equipment was $50,000.","o":["cost","coast","cast","cot"],"e":"<b>Cost</b> = coût.","tr":"Le nouvel équipement a coûté 50 000 $."},{"q":"The company pays ___ every quarter.","o":["taxes","taxis","texts","tasks"],"e":"<b>Pay taxes</b>.","tr":"L'entreprise paie ses impôts chaque trimestre."},{"q":"Our profits were ___ than expected.","o":["lower","lesser","least","low"],"e":"<b>Lower than</b>. « Lesser » ne s'emploie pas avec than.","tr":"Nos bénéfices ont été plus faibles que prévu."},{"q":"The funds were ___ to the wrong account.","o":["transferred","transformed","transcribed","translated"],"e":"<b>Transfer funds</b>.","tr":"Les fonds ont été virés sur le mauvais compte."},{"q":"The company ___ a 10% increase in revenue.","o":["reported","reporter","reporting","reportedly"],"e":"Il manque le verbe → reported.","tr":"L'entreprise a annoncé une hausse de 10 % du chiffre d'affaires."},{"q":"The bank offers loans at low ___ rates.","o":["interest","interesting","interested","interests"],"e":"<b>Interest rates</b>.","tr":"La banque propose des prêts à taux bas."},{"q":"The company's ___ has grown to $50 million.","o":["capital","capitol","capitals","capitalize"],"e":"<b>Capital</b> = capital.","tr":"Le capital de l'entreprise atteint 50 millions."},{"q":"Please ___ the payment before the due date.","o":["make","do","take","give"],"e":"<b>Make a payment</b>.","tr":"Veuillez effectuer le paiement avant l'échéance."},{"q":"The ___ for the project was approved yesterday.","o":["funding","funds","fund's","funded"],"e":"Nom singulier + was → <b>funding</b>.","tr":"Le financement du projet a été approuvé hier."},{"q":"The company expects to ___ even this year.","o":["break","brake","broke","breaking"],"e":"<b>Break even</b> = atteindre l'équilibre.","tr":"L'entreprise compte atteindre l'équilibre cette année."},{"q":"We need a detailed ___ of all expenses.","o":["record","recorder","recordable","recorded"],"e":"<b>A record of</b> = un relevé de.","tr":"Il nous faut un relevé détaillé de toutes les dépenses."},{"q":"Our company has been ___ for ten years.","o":["profitable","profit","profitably","profiteer"],"e":"Après <b>been</b> → adjectif.","tr":"Notre entreprise est rentable depuis dix ans."},{"q":"The client asked for a price ___.","o":["quote","quota","quite","quiet"],"e":"<b>Price quote</b> = devis.","tr":"Le client a demandé un devis."},{"q":"The company must ___ its tax return by April.","o":["file","fill","feel","fail"],"e":"<b>File a tax return</b>.","tr":"L'entreprise doit déposer sa déclaration avant avril."},{"q":"The financial ___ caused many companies to close.","o":["crisis","crisp","critic","criteria"],"e":"<b>Financial crisis</b> (singulier).","tr":"La crise financière a entraîné de nombreuses fermetures."},{"q":"The company's ___ are listed on the Tokyo Stock Exchange.","o":["shares","shores","chairs","shades"],"e":"<b>Shares</b> = actions.","tr":"Les actions de l'entreprise sont cotées à Tokyo."},{"q":"We offer ___ financing for new customers.","o":["interest-free","interest-freely","interesting-free","interested-free"],"e":"<b>Interest-free</b> = sans intérêts.","tr":"Nous proposons un financement sans intérêts aux nouveaux clients."},{"q":"The company's income ___ shows a small profit.","o":["statement","statue","stamen","stature"],"e":"<b>Income statement</b> = compte de résultat.","tr":"Le compte de résultat affiche un léger bénéfice."},{"q":"The CFO ___ that profits would rise.","o":["predicted","pretended","prevented","presented"],"e":"<b>Predict</b> = prévoir.","tr":"Le directeur financier a prévu une hausse des bénéfices."},{"q":"The company is ___ to raise prices.","o":["planning","planting","plating","planking"],"e":"<b>Plan to</b> = prévoir de.","tr":"L'entreprise prévoit d'augmenter ses prix."},{"q":"Our ___ balance is lower than last month.","o":["account","count","amount","mount"],"e":"<b>Account balance</b> = solde du compte.","tr":"Le solde de notre compte est inférieur au mois dernier."},{"q":"The company ___ $2 million in new equipment.","o":["invested","invented","investigated","invited"],"e":"<b>Invest in</b>.","tr":"L'entreprise a investi 2 millions dans du matériel neuf."},{"q":"The shares are worth ___ than last year.","o":["more","much","most","many"],"e":"<b>than</b> → more.","tr":"Les actions valent plus que l'an dernier."},{"q":"The firm offers ___ advice to small businesses.","o":["financial","finance","financially","financier"],"e":"Devant un nom → adjectif.","tr":"Le cabinet conseille les petites entreprises en matière financière."},{"q":"The company's ___ are growing steadily.","o":["revenues","revenges","reviews","reveals"],"e":"<b>Revenues</b> = recettes.","tr":"Les recettes de l'entreprise progressent régulièrement."},{"q":"The price of oil ___ sharply last month.","o":["dropped","dripped","draped","drafted"],"e":"<b>Drop</b> = chuter.","tr":"Le prix du pétrole a chuté le mois dernier."},{"q":"The payment was ___ by the bank.","o":["declined","decline","declining","declines"],"e":"Passif → participe passé (refusé).","tr":"Le paiement a été refusé par la banque."},{"q":"The company ___ a large order from Japan.","o":["received","receipt","receiver","receiving"],"e":"Il manque le verbe → received.","tr":"L'entreprise a reçu une grosse commande du Japon."},{"q":"Our office supply ___ was reduced by 20%.","o":["budget","badge","budge","bucket"],"e":"<b>Budget</b>.","tr":"Notre budget fournitures a été réduit de 20 %."},{"q":"Please keep a copy of the ___ for your records.","o":["receipt","recipe","reception","receiver"],"e":"<b>Receipt</b> = reçu.","tr":"Gardez une copie du reçu pour vos archives."},{"q":"The company is ___ debt-free.","o":["completely","complete","completion","completes"],"e":"Adverbe devant l'adjectif.","tr":"L'entreprise n'a aucune dette."},{"q":"The balance must be ___ in full by December.","o":["paid","payed","pay","paying"],"e":"Passif → <b>paid</b>.","tr":"Le solde doit être intégralement réglé d'ici décembre."},{"q":"The company's ___ has increased thanks to cost cuts.","o":["profitability","profitable","profitably","profiteer"],"e":"Après le possessif → nom.","tr":"La rentabilité de l'entreprise a augmenté grâce aux économies."},{"q":"We need to ___ our spending.","o":["control","controller","controlled","controlling"],"e":"Après <b>need to</b> → verbe.","tr":"Nous devons maîtriser nos dépenses."},{"q":"The company offers a ___ plan for employees.","o":["retirement","retreat","retirement's","retire"],"e":"<b>Retirement plan</b> = plan de retraite.","tr":"L'entreprise propose un plan de retraite à ses salariés."},{"q":"The price includes a ___ fee.","o":["service","servant","serve","served"],"e":"<b>Service fee</b> = frais de service.","tr":"Le prix comprend des frais de service."},{"q":"The company ___ its annual budget in December.","o":["sets","sits","seats","settles"],"e":"<b>Set a budget</b> = fixer un budget.","tr":"L'entreprise fixe son budget annuel en décembre."},{"q":"The economy grew by 2% in the last ___.","o":["quarter","quarterly","quarters","quartered"],"e":"<b>The last quarter</b> = le dernier trimestre.","tr":"L'économie a progressé de 2 % au dernier trimestre."},{"q":"Investors ___ confidence in the company.","o":["lost","loose","losing","loss"],"e":"Prétérit de lose → lost. « Loose » = lâche.","tr":"Les investisseurs ont perdu confiance dans l'entreprise."},{"q":"The company's ___ report will be published next week.","o":["annual","annually","annuity","anniversary"],"e":"Devant un nom → adjectif.","tr":"Le rapport annuel sera publié la semaine prochaine."}]},{"id":"hr","group":"vocab","title":"Ressources humaines","part":"Part 5","start":101,"rule":"<b>hire / recruit</b> embaucher · <b>applicant / candidate</b> · <b>résumé</b> CV (US) · <b>cover letter</b> lettre de motivation · <b>orientation</b> accueil des nouveaux · <b>promote</b> promouvoir · <b>resign</b> démissionner · <b>leave</b> congé · <b>vacancy / opening</b> poste vacant.","qs":[{"q":"The company plans to ___ ten new engineers this year.","o":["hire","rent","lease","retire"],"e":"<b>Hire</b> = embaucher. « Rent / lease » s'emploient pour des biens (louer).","tr":"L'entreprise prévoit d'embaucher dix nouveaux ingénieurs cette année."},{"q":"All new employees must attend an ___ session on their first day.","o":["orientation","retirement","promotion","resignation"],"e":"<b>Orientation session</b> = séance d'accueil/intégration. Notez « an » → mot commençant par une voyelle.","tr":"Tous les nouveaux employés doivent assister à une séance d'intégration le premier jour."},{"q":"After ten years with the firm, Ms. Ortiz was ___ to regional manager.","o":["promoted","hired","applied","resigned"],"e":"<b>Be promoted to</b> = être promu(e) à un poste.","tr":"Après dix ans dans l'entreprise, Mme Ortiz a été promue directrice régionale."},{"q":"Candidates should send a cover letter along with their ___.","o":["résumé","summary","receipt","survey"],"e":"Faux ami : <b>résumé</b> = <b>CV</b> en anglais américain. Un résumé en français se dit « summary ».","tr":"Les candidats doivent envoyer une lettre de motivation avec leur CV."},{"q":"Mr. Park submitted his ___ and will leave the company next month.","o":["resignation","application","appointment","reference"],"e":"Il quitte l'entreprise → <b>resignation</b> (démission). Application = candidature.","tr":"M. Park a remis sa démission et quittera l'entreprise le mois prochain."},{"q":"Employees are entitled to 25 days of paid ___ per year.","o":["leave","left","off","vacancy"],"e":"<b>Paid leave</b> = congés payés. « Vacancy » = poste vacant (ou chambre libre), faux ami.","tr":"Les employés ont droit à 25 jours de congés payés par an."},{"q":"The company is looking to ___ a new sales manager.","o":["recruit","retire","resign","reject"],"e":"<b>Recruit</b> = recruter.","tr":"L'entreprise cherche à recruter un nouveau directeur commercial."},{"q":"Ms. Bell has ___ for the position of marketing director.","o":["applied","appealed","appointed","approved"],"e":"<b>Apply for a position</b> = postuler à un poste.","tr":"Mme Bell a postulé au poste de directrice marketing."},{"q":"All ___ must include a cover letter.","o":["applications","appliances","allocations","allowances"],"e":"<b>Application</b> = candidature. Appliance = appareil électroménager.","tr":"Toutes les candidatures doivent comporter une lettre de motivation."},{"q":"The job ___ was posted on our website last week.","o":["advertisement","advancement","adventure","adversary"],"e":"<b>Job advertisement</b> = offre d'emploi.","tr":"L'offre d'emploi a été publiée sur notre site la semaine dernière."},{"q":"Mr. Cho will be ___ for the interview on Monday.","o":["available","valuable","capable","reliable"],"e":"<b>Available for</b> = disponible pour.","tr":"M. Cho sera disponible lundi pour l'entretien."},{"q":"New employees are on a three-month ___ period.","o":["probation","promotion","provision","production"],"e":"<b>Probation period</b> = période d'essai.","tr":"Les nouveaux employés ont une période d'essai de trois mois."},{"q":"The company offers excellent ___, including health insurance.","o":["benefits","profits","revenues","premiums"],"e":"<b>Benefits</b> = avantages sociaux (mutuelle, etc.).","tr":"L'entreprise offre d'excellents avantages sociaux, dont une mutuelle."},{"q":"Ms. Tanaka will ___ next year after 40 years of service.","o":["retire","recruit","reward","remove"],"e":"Après 40 ans de service → <b>partir à la retraite</b>.","tr":"Mme Tanaka partira à la retraite l'an prochain après 40 ans de carrière."},{"q":"The ___ department is responsible for recruitment.","o":["personnel","personal","persona","personality"],"e":"<b>Personnel</b> = le personnel / les RH. Personal = personnel (privé).","tr":"Le service du personnel est chargé du recrutement."},{"q":"Employees receive an annual performance ___.","o":["review","revue","revival","revision"],"e":"<b>Performance review</b> = entretien annuel d'évaluation.","tr":"Les employés ont un entretien annuel d'évaluation."},{"q":"The company provides ___ for employees who want to learn new skills.","o":["training","trading","tracking","trailing"],"e":"<b>Training</b> = formation.","tr":"L'entreprise propose des formations aux employés qui veulent acquérir de nouvelles compétences."},{"q":"Mr. Diaz was ___ for his outstanding work.","o":["recognized","recovered","recycled","reconsidered"],"e":"<b>Be recognized for</b> = être récompen ":"The ___ of the storage room is limited.","o":["capacity","capability","capital","captivity"],"e":"<b>Capacity</b> = capacité.","tr":"La capacité de la réserve est limitée."}]},{"id":"traps","group":"vocab","title":"Mots piégeux & faux amis","part":"Part 5","start":101,"rule":"<b>affect</b> (verbe) / <b>effect</b> (nom) · <b>raise</b> (lever qqch) / <b>rise</b> (monter tout seul) · <b>lend</b> prêter / <b>borrow</b> emprunter · <b>remind</b> rappeler à qqn / <b>remember</b> se souvenir · <b>attend</b> assister à / <b>assist</b> aider · <b>actually</b> en fait · <b>eventually</b> finalement.","qs":[{"q":"The new regulations will ___ small businesses.","o":["affect","effect","effective","affection"],"e":"Après « will », il faut un <b>verbe</b> : <b>affect</b> (avoir un impact sur). « Effect » est le nom.","tr":"La nouvelle réglementation affectera les petites entreprises."},{"q":"The company plans to ___ prices next year.","o":["raise","rise","arise","rose"],"e":"Il y a un complément (prices) → verbe transitif <b>raise</b>. « Rise » n'a pas de complément (prices rise).","tr":"L'entreprise prévoit d'augmenter ses prix l'an prochain."},{"q":"Could you ___ me your laptop for the presentation?","o":["lend","borrow","rent","owe"],"e":"<b>Lend</b> sb sth = prêter qqch à qqn. <b>Borrow</b> = emprunter (borrow sth from sb).","tr":"Pourrais-tu me prêter ton ordinateur pour la présentation ?"},{"q":"Please ___ me of the meeting time.","o":["remind","remember","recall","memorize"],"e":"<b>Remind sb of sth</b> = rappeler qqch à qqn. « Remember » ne prend pas de personne en complément.","tr":"Rappelez-moi l'heure de la réunion, s'il vous plaît."},{"q":"The price of the service is ___ to change without notice.","o":["subject","object","submit","project"],"e":"Expression <b>subject to change</b> = susceptible d'être modifié.","tr":"Le prix du service est susceptible de changer sans préavis."},{"q":"Ms. Lopez will ___ the conference next week; she has already booked her flight.","o union."},{"q":"Several problems ___ during the installation.","o":["arose","raised","rose","aroused"],"e":"<b>Arise</b> (arose, arisen) = survenir, apparaître.","tr":"Plusieurs problèmes sont survenus pendant l'installation."},{"q":"The new manager will ___ the team.","o":["lead","led","lend","load"],"e":"Après <b>will</b> → base verbale <b>lead</b> (diriger). Led = prétérit.","tr":"Le nouveau responsable dirigera l'équipe."},{"q":"You can buy the book at the ___ across the street.","o":["bookstore","library","librarian","bookcase"],"e":"On <b>achète</b> un livre en <b>librairie</b> = bookstore. Library = bibliothèque (faux ami).","tr":"Vous pouvez acheter le livre à la librairie d'en face."},{"q":"You can borrow books from the city ___.","o":["library","bookstore","librarian","bookshop"],"e":"On <b>emprunte</b> à la bibliothèque = <b>library</b>.","tr":"Vous pouvez emprunter des livres à la bibliothèque municipale."},{"q":"The technician was able to ___ his goal of reducing downtime.","o":["achieve","finish","complete","terminate"],"e":"<b>Achieve a goal</b> = atteindre un objectif (faux ami avec « achever »).","tr":"Le technicien a atteint son objectif de réduction des temps d'arrêt."},{"q":"It would be ___ to book the tickets early.","o":["sensible","sensitive","sensational","sensory"],"e":"<b>Sensible</b> = raisonnable, judicieux (faux ami).","tr":"Il serait judicieux de réserver les billets tôt."},{"q":"This information is highly ___, so do not share it.","o":["sensitive","sensible","sensory","sensual"],"e":"« Sensible / confidentiel » se dit <b>sensitive</b>.","tr":"Ces informations sont très sensibles, ne les partagez pas."},{"q":"The hotel has no ___ rooms tonight.","o":["vacant","vacation","vacancy","vague"],"e":"Devant un nom → adjectif <b>vacant</b> (libre).","tr":"L'hôtel n'a pas de chambre libre ce soir."},{"q":"Ms. Diaz is on ___ in Spain this week.","o":["vacation","vacancy","vacant","vocation"],"e":"<b>On vacation</b> = en vacances. Vacancy = poste/c ry ___.","o":["well","good","goods","best"],"e":"Adverbe → <b>well</b> ; good est un adjectif.","tr":"Mme Kim a très bien fait le travail."},{"q":"The ___ of the project was a great success.","o":["result","resume","summary","resumption"],"e":"<b>Result</b> = résultat.","tr":"Le résultat du projet a été un grand succès."},{"q":"We will ___ the meeting after a short break.","o":["resume","summarize","result","assume"],"e":"Faux ami : <b>resume</b> = reprendre ; « résumer » = summarize.","tr":"Nous reprendrons la réunion après une courte pause."},{"q":"Can you ___ the main points of the report?","o":["summarize","resume","assume","consume"],"e":"« Résumer » = <b>summarize</b>.","tr":"Pouvez-vous résumer les points principaux du rapport ?"},{"q":"I ___ that you have read the instructions.","o":["assume","resume","consume","presume on"],"e":"<b>Assume</b> = supposer.","tr":"Je suppose que vous avez lu les instructions."},{"q":"The new printer ___ a lot of ink.","o":["consumes","assumes","resumes","consummates"],"e":"<b>Consume</b> = consommer.","tr":"La nouvelle imprimante consomme beaucoup d'encre."},{"q":"The plant ___ 500 cars a week.","o":["produces","products","productive","production"],"e":"Verbe → <b>produce</b> ; product = nom.","tr":"L'usine produit 500 voitures par semaine."},{"q":"Our new ___ will be launched in May.","o":["product","produce","producer","productive"],"e":"Nom → <b>product</b>.","tr":"Notre nouveau produit sera lancé en mai."},{"q":"The shop sells fresh ___ from local farms.","o":["produce","product","producer","production"],"e":"<b>Produce</b> (nom) = produits frais (fruits, légumes).","tr":"La boutique vend des produits frais de fermes locales."},{"q":"The meeting ___ at 3 P.M.","o":["ended","achieved","accomplished","succeeded"],"e":"<b>End</b> = se terminer ; achieve ≠ achever.","tr":"La réunion s'est terminée à 15 h."},{"q":"The team ___ its sales goal.","o":["achieved","finished","ended","completed with"],"e":"<b>Achieve a goal</b> = atteindre un objectif.","tr":"L'équipe a atteint son objectif de ventes."},{"q":"___, the factory will close in 2030.","o":["Eventually","Eventual","Eventful","Evening"],"e":"<b>Eventually</b> = à terme, finalement.","tr":"L'usine fermera finalement en 2030."},{"q":"The meeting may ___ be moved to Friday.","o":["possibly","eventually","eventual","possible"],"e":"« Éventuellement » = <b>possibly</b>.","tr":"La réunion sera éventuellement déplacée à vendredi."},{"q":"The company ___ employs 300 people.","o":["currently","actually","actual","current"],"e":"« Actuellement » = <b>currently</b>.","tr":"L'entreprise emploie actuellement 300 personnes."},{"q":"I thought the meeting was today, but ___ it's tomorrow.","o":["actually","currently","actual","current"],"e":"<b>Actually</b> = en fait.","tr":"Je pensais que la réunion était aujourd'hui, mais en fait c'est demain."},{"q":"The ___ price is higher than advertised.","o":["actual","current","actually","currently"],"e":"<b>Actual</b> = réel, effectif (faux ami).","tr":"Le prix réel est plus élevé qu'annoncé."},{"q":"I was ___ to hear that the event was canceled.","o":["disappointed","deceived","delusional","depressed at"],"e":"« Déçu » = <b>disappointed</b> ; deceived = trompé.","tr":"J'ai été déçu d'apprendre l'annulation."},{"q":"The customer was ___ by a fake website.","o":["deceived","disappointed","delighted","defended"],"e":"<b>Deceive</b> = tromper.","tr":"Le client a été trompé par un faux site."},{"q":"The company offers a ___ of services.","o":["range","rank","rang","ranch"],"e":"<b>A range of</b> = une gamme de.","tr":"L'entreprise propose une gamme de services."},{"q":"The new product line will ___ next month.","o":["launch","lunch","launched","launching"],"e":"Après <b>will</b> → launch (lancer) ; lunch = déjeuner.","tr":"La nouvelle gamme sera lancée le mois prochain."},{"q":"Let's have ___ at the café.","o":["lunch","launch","lunge","lounge"],"e":"<b>Lunch</b> = déjeuner.","tr":"Déjeunons au café."},{"q":"The ___ of the building is 50 meters.","o":["height","high","highness","heights'"],"e":"Nom → <b>height</b>.","tr":"Le bâtiment mesure 50 mètres de haut."},{"q":"The ___ traffic made us late.","o":["heavy","heavily","strong","big"],"e":"Collocation : <b>heavy traffic</b>.","tr":"La circulation dense nous a mis en retard."},{"q":"There was a ___ wind this morning.","o":["strong","heavy","big","hard"],"e":"Collocation : <b>strong wind</b>.","tr":"Il y avait un vent fort ce matin."},{"q":"We had a ___ discussion about the budget.","o":["long","length","lengthen","longing"],"e":"Adjectif → <b>long</b>.","tr":"Nous avons eu une longue discussion sur le budget."},{"q":"The seminar was ___ for all employees.","o":["compulsory","complimentary","complementary","comprehensive"],"e":"<b>Compulsory</b> = obligatoire.","tr":"Le séminaire était obligatoire pour tous les employés."},{"q":"The hotel offers ___ coffee in the lobby.","o":["complimentary","compulsory","complementary","complicated"],"e":"<b>Complimentary</b> = offert.","tr":"L'hôtel offre le café dans le hall."},{"q":"The two teams have ___ skills.","o":["complementary","complimentary","compulsory","complacent"],"e":"<b>Complementary</b> = complémentaires.","tr":"Les deux équipes ont des compétences complémentaires."},{"q":"The manager ___ the team to finish early.","o":["allowed","let","made","leaved"],"e":"<b>Allow sb to do</b>. « Let » et « made » ne prennent pas « to ».","tr":"Le responsable a autorisé l'équipe à finir tôt."},{"q":"The manager ___ the team leave early.","o":["let","allowed","permitted","left"],"e":"<b>Let sb do</b> (sans to).","tr":"Le responsable a laissé l'équipe partir tôt."},{"q":"Please ___ the chairs in rows.","o":["arrange","range","arrest","derange"],"e":"<b>Arrange</b> = disposer.","tr":"Disposez les chaises en rangées."},{"q":"The ___ of the new branch is Ms. Silva.","o":["head","chef","chief's","header"],"e":"Faux ami : « chef (responsable) » = <b>head</b> ; chef = cuisinier.","tr":"La responsable de la nouvelle agence est Mme Silva."},{"q":"The restaurant's ___ prepared a special menu.","o":["chef","chief","head's","cheap"],"e":"<b>Chef</b> = chef cuisinier.","tr":"Le chef du restaurant a préparé un menu spécial."},{"q":"The company needs to ___ more engineers.","o":["hire","rent","lease","borrow"],"e":"Personnes → <b>hire</b> ; rent/lease = biens.","tr":"L'entreprise doit embaucher des ingénieurs."},{"q":"We ___ an apartment near the office.","o":["rent","hire","employ","borrow"],"e":"Logement → <b>rent</b>.","tr":"Nous louons un appartement près du bureau."},{"q":"The manager ___ me that the deadline was Friday.","o":["told","said","spoke","talked"],"e":"<b>Tell sb that</b>.","tr":"Le responsable m'a dit que la date limite était vendredi."},{"q":"The manager ___ that the deadline was Friday.","o":["said","told","spoke","talked"],"e":"<b>Say that</b> (sans personne).","tr":"Le responsable a dit que la date limite était vendredi."},{"q":"Please ___ the lights; it's too dark.","o":["turn on","turn off","turn over","turn down"],"e":"Trop sombre → allumer : <b>turn on</b>.","tr":"Allumez la lumière, il fait trop sombre."},{"q":"Could you ___ the music? It's too loud.","o":["turn down","turn up","turn on","turn in"],"e":"Trop fort → baisser : <b>turn down</b>.","tr":"Pourriez-vous baisser la musique ? C'est trop fort."}]},{"id":"colloc","group":"vocab","title":"Collocations & phrasal verbs","part":"Part 5","start":101,"rule":"<b>fill out</b> remplir · <b>call off</b> annuler · <b>put off</b> reporter · <b>look after</b> s'occuper de · <b>come up with</b> trouver (une idée) · <b>make a decision</b> · <b>meet a deadline</b> · <b>carry out</b> réaliser · <b>set up</b> installer/créer.","qs":[{"q":"Please ___ out the form and return it to reception.","o":["fill","full","feel","fall"],"e":"<b>Fill out a form</b> = remplir un formulaire. Attention aux mots qui se ressemblent.","tr":"Veuillez remplir le formulaire et le rapporter à l'accueil."},{"q":"The meeting was ___ off because the director was ill.","o":["called","set","turned","taken"],"e":"<b>Call off</b> = annuler. Set off = partir, turn off = éteindre, take off = décoller.","tr":"La réunion a été annulée car le directeur était malade."},{"q":"We need to ___ a decision before the end of the day.","o":["make","do","get","have"],"e":"Collocation : <b>make a decision</b>. On dit « do » pour les tâches (do the work).","tr":"Nous devons prendre une décision avant la fin de la journée."},{"q":"Could you ___ after the reception desk while I'm at lunch?","o":["look","see","watch","take"],"e":"<b>Look after</b> = s'occuper de, surveiller.","tr":"Pourrais-tu t'occuper de l'accueil pendant ma pause déjeuner ?"},{"q":"The company had to ___ up with a new strategy.","o":["come","go","get","put"],"e":"<b>Come up with</b> = trouver, proposer (une idée). « Put up with » = tolérer.","tr":"L'entreprise a dû élaborer une nouvelle stratégie."},{"q":"Our supplier failed to ___ the deadline.","o":["meet","join","hold","keep"],"e":"Collocation : <b>meet a deadline</b> = respecter une échéance.","tr":"Notre fournisseur n'a pas respecté l'échéance."},{"q":"We need to ___ a meeting with the new client.","o":["set up","set off","set out","set in"],"e":"<b>Set up a meeting</b> = organiser une réunion.","tr":"Nous devons organiser une réunion avec le nouveau client."},{"q":"Please ___ the document before you sign it.","o":["look over","look after","look for","look out"],"e":"<b>Look over</b> = parcourir, relire.","tr":"Veuillez relire le document avant de le signer."},{"q":"Can you ___ the phone number in the directory?","o":["look up","look after","look over","look into"],"e":"<b>Look up</b> = chercher (une information dans une liste).","tr":"Peux-tu chercher le numéro dans l'annuaire ?"},{"q":"The manager promised to ___ the complaint.","o":["look into","look up","look after","look out"],"e":"<b>Look into</b> = examiner, enquêter sur.","tr":"Le responsable a promis d'examiner la réclamation."},{"q":"Please ___ on the line while I transfer your call.","o":["hold","keep","put","take"],"e":"<b>Hold on the line</b> = rester en ligne.","tr":"Veuillez patienter pendant que je transfère votre appel."},{"q":"The company had to ___ 200 workers due to low demand.","o":["lay off","lay out","lay down","lay up"],"e":"<b>Lay off</b> = licencier (pour raisons économiques).","tr":"L'entreprise a dû licencier 200 ouvriers à cause de la faible demande."},{"q":"We ran ___ of paper, so I ordered more.","o":["out","off","over","into"],"e":"<b>Run out of</b> = être à court de.","tr":"Nous n'avions plus de papier, j'en ai donc commandé."},{"q":"The team will ___ a survey to measure customer satisfaction.","o":["conduct","drive","lead","guide"],"e":"<b>Conduct a survey</b> = mener une enquête.","tr":"L'équipe mènera une enquête de satisfaction client."},{"q":"Please ___ attention to the safety instructions.","o":["pay","put","take","make"],"e":"<b>Pay attention to</b> = faire attention à.","tr":"Soyez attentifs aux consignes de sécurité."},{"q":"The CEO will ___ a speech at the opening ceremony.","o":["give","say","tell","speak"],"e":"<b>Give a speech</b> = prononcer un discours.","tr":"Le PDG prononcera un discours lors de la cérémonie d'ouverture."},{"q":"We need to ___ progress on the project.","o":["make","do","take","get"],"e":"<b>Make progress</b> = progresser.","tr":"Nous devons avancer sur le projet."},{"q":"Mr. Ali will ___ care of the arrangements.","o":["take","make","do","have"],"e":"<b>Take care of</b> = s'occuper de.","tr":"M. Ali s'occupera de l'organisation."},{"q":"The company plans to ___ business with Asian partners.","o":["do","make","take","get"],"e":"<b>Do business with</b> = faire des affaires avec.","tr":"L'entreprise prévoit de travailler avec des partenaires asiatiques."},{"q":"Please ___ an appointment with the dentist.","o":["make","do","take","put"],"e":"<b>Make an appointment</b> = prendre rendez-vous.","tr":"Veuillez prendre rendez-vous chez le s <b>do not</b> → base verbale.","tr":"N'hésitez pas à nous contacter."}]},{"id":"p7","group":"reading","title":"Lecture de documents","part":"Part 7","start":147,"ordered":true,"rule":"Lisez <b>d'abord la question</b>, puis cherchez l'information. Les bonnes réponses sont presque toujours des <b>reformulations</b> du texte. Pour « closest in meaning », remplacez le mot dans la phrase et vérifiez le sens.","qs":[{"p":"p7a","q":"What is being advertised?","o":["A shared workspace","A coffee shop","A hotel","A furniture store"],"e":"« Co-working », « flexible desks », « private offices » → un <b>espace de travail partagé</b>. Le café est un simple service inclus (piège).","tr":"Qu'est-ce qui fait l'objet de la publicité ?"},{"p":"p7a","q":"What is included in all memberships?","o":["Access to a rooftop area","Unlimited meeting room use","A private office","Free parking"],"e":"« access to our <b>rooftop terrace</b> » → reformulé en <b>rooftop area</b>. Les salles de réunion ne sont gratuites que 2 h/mois.","tr":"Qu'est-ce qui est inclus dans toutes les formules ?"},{"p":"p7a","q":"How can new customers get a free week?","o":["By registering before a certain date","By booking a meeting room","By bringing a friend","By paying for a year"],"e":"« sign up <b>before September 30</b> » = <b>registering before a certain date</b>. Reformulation typique.","tr":"Comment les nouveaux clients peuvent-ils obtenir une semaine gratuite ?"},{"p":"p7b","q":"Why was the visit changed?","o":["The visitors' travel plans changed.","The factory is closed on Wednesday.","Mr. Haddad is unavailable.","The restaurant is fully booked."],"e":"« as their <b>flight was rescheduled</b> » → leurs <b>plans de voyage</b> ont changé.","tr":"Pourquoi la visite a-t-elle été modifiée ?"},{"p":"p7b","q":"What is Mr. Haddad asked to do today?","o":["Contact a restaurant","Book a flight","Print a catalog","Visit Norvik Industries"],"e":"« please <b>call them today</b> » (Café Lumen) → <b>contacter un restaurant</b>. Le catalogue est déjà imprimé et posé sur son bureau.","tr":"Que doit faire M. Haddad aujourd'hui ?"},{"p":"p7b","q":"What is suggested about Café Lumen?","o":["It requires advance notice for changes.","It is located inside the factory.","It is closed on Thursday.","It was recommended by Mr. Berg."],"e":"« they need at least <b>24 hours' notice</b> » → il faut prévenir <b>à l'avance</b>. Question d'inférence (« suggested »).","tr":"Que peut-on déduire au sujet du Café Lumen ?"},{"p":"p7b","q":"In the e-mail, the word “move” in paragraph 1, line 2, is closest in meaning to","o":["reschedule","carry","relocate","persuade"],"e":"« move the factory tour to Thursday » = changer la <b>date</b> → <b>reschedule</b>. « Relocate » changerait le lieu.","tr":"Le mot « move » est le plus proche de…"},{"p":"p7c","q":"At 9:16 A.M., what does Mr. Reyes mean when he writes, “I'm on it”?","o":["He will take care of the problem.","He is standing on a box.","He is on the truck.","He has already left the warehouse."],"e":"« I'm on it » = <b>je m'en occupe</b>. Il trouve d'ailleurs les cartons à 9 h 20.","tr":"Que veut dire M. Reyes par « I'm on it » ?"},{"p":"p7c","q":"What is suggested about the Harper order?","o":["It must be ready before noon.","It was delivered yesterday.","It was canceled.","It contains only labels."],"e":"« needs to go out today » + « The truck arrives <b>at noon</b> » → la commande doit être prête avant midi.","tr":"Que peut-on déduire de la commande Harper ?"},{"p":"p7d","q":"What kind of business is Brightstar?","o":["A food service company","A consulting firm","A delivery company","A beverage manufacturer"],"e":"« CATERING » + plateaux de sandwichs → <b>traiteur</b>. Dalton Consulting est le client.","tr":"Quel type d'entreprise est Brightstar ?"},{"p":"p7d","q":"Why was Dalton Consulting not charged for delivery?","o":["Its order exceeded a certain amount.","It picked up the food itself.","The event was canceled.","It is a new customer."],"e":"« Deliv n atelier</b>.","tr":"Qui est probablement Mme Laurent ?"},{"p":"p7_10_0","q":"What is the topic of the workshop?","o":["Managing employees who work remotely","Planning international events","Using projectors effectively","Traveling to Lisbon"],"e":"« <b>Leading Remote Teams</b> ».","tr":"Quel est le thème de l'atelier ?"},{"p":"p7_10_0","q":"What is Ms. Laurent asked to do by November 25?","o":["Request additional equipment if needed","Book her hotel room","Send the list of participants","Confirm her flight"],"e":"« If you need any other equipment, please let me know <b>by November 25</b> ».","tr":"Que doit faire Mme Laurent avant le 25 novembre ?"},{"p":"p7_10_0","q":"What will the organizers pay for?","o":["Accommodation","Airfare","Meals","Taxis"],"e":"« We will also cover your <b>hotel costs</b> ».","tr":"Que prendront en charge les organisateurs ?"},{"p":"p7_10_1","q":"Where is Ms. Ruiz?","o":["At a trade show","At the office","At a printing shop","At the airport"],"e":"« at our <b>booth</b> » au salon.","tr":"Où se trouve Mme Ruiz ?"},{"p":"p7_10_1","q":"At 1:13 P.M., what does Ms. Ruiz mean when she writes, “We're down to our last few”?","o":["Almost all the brochures are gone.","Only a few visitors have come.","The team is very tired.","The show is almost over."],"e":"Réponse à « enough brochures? » → il en reste <b>très peu</b>.","tr":"Que veut dire Mme Ruiz ?"},{"p":"p7_10_2","q":"What is included in all room rates?","o":["A morning meal","A guided tour of the city","Airport transportation","Dinner"],"e":"« All rates <b>include breakfast</b> ».","tr":"Qu'est-ce qui est inclus dans tous les tarifs ?"},{"p":"p7_10_2","q":"What is offered for free every morning?","o":["A nature walk","A yoga class","A cooking lesson","A bike rental"],"e":"« Free guided <b>nature walks</b> every morning ».","tr":"Qu'est-ce qui est offert chaque matin ?"},{"p":"p7_10_2","q":"Which room will Mr. Moore most likely book?","o":["The Forest Cabin","The Standard Room","The Family Room","Any available room"],"e":"Croisement : « private outdoor space » = <b>private terrace</b> → Forest Cabin.","tr":"Quelle chambre M. Moore réservera-t-il probablement ?"},{"p":"p7_10_2","q":"How much will Mr. Moore most likely pay?","o":["$320","$288","$180","$160"],"e":"2 nuits × 160 $ = <b>320 $</b> ; pas de remise (moins de trois nuits).","tr":"Combien M. Moore paiera-t-il probablement ?"},{"p":"p7_10_2","q":"Why will Mr. Moore not receive a discount?","o":["His stay is too short.","He booked too late.","He is not a member.","He chose the wrong room."],"e":"La remise exige <b>trois nuits ou plus</b>.","tr":"Pourquoi M. Moore n'aura-t-il pas de remise ?"},{"p":"p7_10_3","q":"What is the memo mainly about?","o":["The temporary closing of a dining area","The opening of a new café","A change in lunch hours","A new ID badge system"],"e":"La <b>cafétéria sera fermée</b> pour travaux.","tr":"De quoi parle principalement le mémo ?"},{"p":"p7_10_3","q":"What will be available in the lobby?","o":["Light meals","A salad bar","A coffee counter","Hot dinners"],"e":"« sandwiches, salads, and drinks » = <b>repas légers</b>.","tr":"Qu'est-ce qui sera disponible dans le hall ?"},{"p":"p7_10_3","q":"How can employees get a discount at Luca's Café?","o":["By presenting their badge","By ordering online","By arriving before noon","By buying a coupon"],"e":"« by <b>showing their ID badge</b> ».","tr":"Comment obtenir une remise chez Luca's Café ?"},{"p":"p7_10_4","q":"What does Jake P. like about the headphones?","o":["Their comfort","Their battery life","Their price","Their color"],"e":"« they are <b>comfortable</b> to wear ».","tr":"Qu'apprécie Jake P. ?"},{"p":"p7_10_4","q":"What problem does Jake P. report?","o":["The battery does not last as long as promised.","The sound is poor.","The headphones broke.","The headphones were delivered late."],"e":"Quatre heures au lieu des <b>20 heures annoncées</b>.","tr":"Quel problème signale-t-il ?"},{"p":"p7_10_4","q":"What did customer service do?","o":["Provided a replacement","Gave a full refund","Repaired the battery","Sent a discount code"],"e":"« offered to <b>replace</b> the headphones » et il a reçu une nouvelle paire.","tr":"Qu'a fait le service client ?"},{"p":"p7_10_5","q":"What is Morning Bean planning to do?","o":["Stop using a type of cup","Open 300 new stores","Raise its prices","Sell reusable bottles"],"e":"« stop using <b>plastic cups</b> ».","tr":"Que prévoit Morning Bean ?"},{"p":"p7_10_5","q":"What will customers who bring their own cups receive?","o":["A price reduction","A free drink","A paper cup","A gift card"],"e":"« a <b>10-cent discount</b> ».","tr":"Que recevront les clients qui apportent leur tasse ?"},{"p":"p7_10_5","q":"In which of the positions marked [1], [2], [3], and [4] does the following sentence best belong? “A recent survey showed that 70% of its customers support the plan.”","o":["[3]","[1]","[2]","[4]"],"e":"Elle justifie « <b>customers will appreciate the effort</b> » → position [3].","tr":"Où placer la phrase sur le sondage ?","fixed":true}]},{"id":"p2","group":"listening","title":"Question-réponse","part":"Part 2","start":7,"listening":true,"rule":"3 réponses, <b>rien n'est écrit</b>. Concentrez-vous sur le <b>premier mot</b> (Where, When, Who…). Méfiez-vous des réponses qui <b>répètent un mot</b> de la question ou qui répondent « Yes/No » à une question en Wh-. Les réponses indirectes (« Let me check ») sont souvent correctes.","qs":[{"q":"Where is the marketing meeting being held?","o":["In conference room B.","At three o'clock.","Yes, it was very productive."],"e":"<b>Where</b> → un <b>lieu</b>. « At three o'clock » répond à When ; « Yes » ne répond jamais à une question en Wh-.","tr":"Où se tient la réunion marketing ?"},{"q":"When will the new printer be delivered?","o":["Sometime next week.","To the second floor.","It prints in color."],"e":"<b>When</b> → un <b>moment</b>. « To the second floor » répondrait à Where.","tr":"Quand la nouvelle imprimante sera-t-elle livrée ?"},{"q":"Who's in charge of the budget report?","o":["Ms. Nakamura is handling it.","About ten pages.","It was charged to my card."],"e":"<b>Who</b> → une <b>personne</b>. « Charged » est un piège sonore (in charge / charged).","tr":"Qui est responsable du rapport budgétaire ?"},{"q":"Why was the flight delayed?","o":["Because of bad weather.","Gate 12.","I'd prefer an aisle seat."],"e":"<b>Why</b> → une <b>cause</b>. Les autres réponses reprennent le thème (avion) sans répondre.","tr":"Pourquoi le vol a-t-il été retardé ?"},{"q":"Would you like me to send you the file?","o":["Yes, that would be helpful.","I filed it yesterday.","He sent a letter."],"e":"<b>Offre</b> (Would you like me to…) → accepter ou refuser. « Filed » et « sent » sont des pièges de répétition.","tr":"Voulez-vous que je vous envoie le fichier ?"},{"q":"Haven't you finished the presentation yet?","o":["I'm working on the last slide.","Yes, he presented it well.","It's a nice present."],"e":"Question négative : la réponse indique où en est la personne. « Presented / present » = pièges sonores, et « he » ne correspond pas à « you ».","tr":"Tu n'as pas encore fini la présentation ?"},{"q":"How long does it take to get to the airport?","o":["About forty minutes by taxi.","It's a long runway.","Terminal 2."],"e":"<b>How long</b> → une <b>durée</b>. « Long » répété dans une autre réponse = piège.","tr":"Combien de temps faut-il pour aller à l'aéroport ?"},{"q":"Should we order lunch or go out?","o":["Let's eat at the café downstairs.","Yes, we should.","In alphabetical order."],"e":"Question à <b>choix</b> (A or B) → on choisit, jamais « Yes/No ». « Order » est répété dans un autre sens.","tr":"On commande le déjeuner ou on sort ?"},{"q":"The client called while you were out.","o":["Did she leave a message?","I'll call a taxi.","Out of stock."],"e":"<b>Affirmation</b> → la réponse naturelle est une réaction ou une question en retour.","tr":"Le client a appelé pendant ton absence."},{"q":"Can you help me move these boxes?","o":["Sure, where do they go?","The movie was great.","Yes, a box of pens."],"e":"<b>Demande d'aide</b> → accepter. « Movie / move » et « box » sont des pièges sonores.","tr":"Tu peux m'aider à déplacer ces cartons ?"},{"q":"Which supplier did you choose?","o":["The one with the lowest price.","Yes, I chose it.","They supply paper."],"e":"<b>Which</b> → identifier un élément ; « the one… » est une réponse typique.","tr":"Quel fournisseur as-tu choisi ?"},{"q":"Isn't the store open on Sundays?","o":["Only in December.","The door is open.","I'll store them."],"e":"Réponse <b>indirecte</b> mais logique (ouvert le dimanche seulement en décembre). « Open » et « store » sont répétés dans un autre sens.","tr":"Le magasin n'est pas ouvert le dimanche ?"},{"q":"What time does the store close tonight?","o":["At nine o'clock.","In the shopping mall.","Yes, it's closed."],"e":"<b>What time</b> → une <b>heure</b>. « Yes » ne répond pas à une question en Wh-.","tr":"À quelle heure le magasin ferme-t-il ce soir ?"},{"q":"Who will be leading the training session?","o":["Someone from the HR department.","It starts at ten.","The train is late."],"e":"<b>Who</b> → une personne. « Train » est un piège sonore (training).","tr":"Qui animera la formation ?"},{"q":"Where can I find the printer paper?","o":["In the supply closet.","Yes, I printed it.","About 500 sheets."],"e":"<b>Where</b> → un lieu.","tr":"Où puis-je trouver du papier pour l'imprimante ?"},{"q":"How was your trip to Singapore?","o":["It went really well, thanks.","By plane.","Next Tuesday."],"e":"<b>How was</b> → demande une <b>appréciation</b>. « By plane » répondrait à « How did you travel ».","tr":"Comment s'est passé ton voyage à Singapour ?"},{"q":"Why don't we take a short break?","o":["That's a good idea.","Because it's broken.","It was very short."],"e":"<b>Why don't we…</b> = <b>suggestion</b>, pas une vraie question sur la cause. « Because » est un piège.","tr":"Et si on faisait une petite pause ?"},{"q":"Have you met the new marketing director?","o":["Not yet, but I will this afternoon.","The meeting was long.","Yes, the market is open."],"e":"Question oui/non : réponse naturelle « Not yet ». Meeting/market = pièges sonores.","tr":"As-tu rencontré la nouvelle directrice marketing ?"},{"q":"Could you send me the sales figures?","o":["I'll e-mail them right away.","The sale ends Friday.","They're very big figures."],"e":"<b>Demande</b> → accepter. « Sale » et « figures » sont répétés dans un autre sens.","tr":"Pourriez-vous m'envoyer les chiffres de ventes ?"},{"q":"When is the report due?","o":["By the end of the week.","It's in my drawer.","Yes, I did."],"e":"<b>When</b> → une échéance.","tr":"Pour quand faut-il rendre le rapport ?"},{"q":"Which room is the interview in?","o":["Room 305, on the third floor.","At two o'clock.","She was interviewed yesterday."],"e":"<b>Which room</b> → identifier la salle.","tr":"Dans quelle salle a lieu l'entretien ?"},{"q":"Would you prefer coffee or tea?","o":["Tea, please.","Yes, I would.","It's in the kitchen."],"e":"Question à <b>choix</b> → on choisit ; jamais « Yes ».","tr":"Vous préférez du café ou du thé ?"},{"q":"You've worked here for a long time, haven't you?","o":["Yes, almost ten years.","It's a long way.","I'll work on it."],"e":"<b>Question tag</b> → confirmation + précision. « Long » et « work » sont des pièges.","tr":"Vous travaillez ici depuis longtemps, n'est-ce pas ?"},{"q":"How many people are coming to the dinner?","o":["About twenty, I think.","At the Italian restaurant.","It was delicious."],"e":"<b>How many</b> → un nombre.","tr":"Combien de personnes viennent au dîner ?"},{"q":"Where did you put the contract?","o":["It's on your desk.","Yes, I signed it.","Last Monday."],"e":"<b>Where</b> → un lieu.","tr":"Où as-tu mis le contrat ?"},{"q":"Why is the office so cold today?","o":["The heating isn't working.","I'll have it today.","Yes, it's closed."],"e":"<b>Why</b> → une cause.","tr":"Pourquoi fait-il si froid au bureau aujourd'hui ?"},{"q":"Can I pay by credit card?","o":["Of course, we accept all cards.","No, it's not paid.","A birthday card."],"e":"Demande de permission → réponse sur l'acceptation. « Card » répété dans un autre sens.","tr":"Puis-je payer par carte ?"},{"q":"Who's responsible for ordering supplies?","o":["Ms. Lopez handles that.","They arrived this morning.","In the storage room."],"e":"<b>Who</b> → une personne.","tr":"Qui s'occupe de commander les fournitures ?"},{"q":"Didn't you receive my e-mail?","o":["No, could you send it again?","Yes, I sent it.","The mail room is downstairs."],"e":"Question négative : répondre sur la <b>réception</b>. « I sent it » ne correspond pas.","tr":"Tu n'as pas reçu mon e-mail ?"},{"q":"How often do you visit the factory?","o":["Once a month.","For two hours.","By car."],"e":"<b>How often</b> → une fréquence.","tr":"À quelle fréquence visitez-vous l'usine ?"},{"q":"Let's discuss the budget after lunch.","o":["Sounds good to me.","I had a sandwich.","It was over budget."],"e":"<b>Suggestion</b> → accepter ou refuser.","tr":"Parlons du budget après le déjeuner."},{"q":"Is the conference room available tomorrow?","o":["Let me check the schedule.","It was a great conference.","Yes, I'm available."],"e":"Réponse <b>indirecte</b> typique (Let me check). « I'm available » parle d'une personne, pas de la salle.","tr":"La salle de conférence est-elle libre demain ?"},{"q":"What did you think of the presentation?","o":["It was very informative.","I think it's at noon.","On the big screen."],"e":"Demande d'<b>opinion</b> → une appréciation.","tr":"Qu'as-tu pensé de la présentation ?"},{"q":"Where's the nearest bank?","o":["There's one on the next corner.","I'll deposit it tomorrow.","It opens at nine."],"e":"<b>Where</b> → un lieu.","tr":"Où est la banque la plus proche ?"},{"q":"Shall I book a taxi for you?","o":["Thanks, that would be great.","The book is on the shelf.","It took an hour."],"e":"<b>Offre</b> (Shall I…) → accepter. « Book » (livre) = piège.","tr":"Voulez-vous que je vous réserve un taxi ?"},{"q":"When does the new manager start?","o":["Next Monday, I believe.","Yes, she is.","In the head office."],"e":"<b>When</b> → un moment.","tr":"Quand le nouveau responsable commence-t-il ?"},{"q":"Why did Mr. Chen leave early?","o":["He had a doctor's appointment.","At four o'clock.","He left the files."],"e":"<b>Why</b> → une raison. « Left » est répété dans un autre sens.","tr":"Pourquoi M. Chen est-il parti tôt ?"},{"q":"Do you know where the keys are?","o":["Check the top drawer.","Yes, I know him.","They're new keys."],"e":"Question indirecte sur un <b>lieu</b> → réponse indiquant où chercher.","tr":"Sais-tu où sont les clés ?"},{"q":"How much does the upgrade cost?","o":["Around two hundred dollars.","It takes two days.","Yes, it's up to date."],"e":"<b>How much</b> → un prix.","tr":"Combien coûte la mise à niveau ?"},{"q":"Should I print the handouts now or later?","o":["Now would be better.","Yes, you should.","Hand them to me."],"e":"Question à <b>choix</b> → on choisit.","tr":"Dois-je imprimer les documents maintenant ou plus tard ?"},{"q":"The printer on the second floor isn't working.","o":["I'll call maintenance.","On the second floor.","Twenty pages, please."],"e":"<b>Affirmation</b> d'un problème → réaction utile.","tr":"L'imprimante du deuxième étage ne fonctionne pas."},{"q":"Would you like to join us for lunch?","o":["I'd love to, thanks.","I joined last year.","We had pasta."],"e":"<b>Invitation</b> → accepter ou décliner.","tr":"Veux-tu te joindre à nous pour le déjeuner ?"},{"q":"Who wrote this proposal?","o":["Our new analyst did.","It was approved.","Yes, I'll write it."],"e":"<b>Who</b> → une personne.","tr":"Qui a rédigé cette proposition ?"},{"q":"Where are we holding the training session?","o":["In the main conference room.","Every Thursday.","The trainer is late."],"e":"<b>Where</b> → un lieu.","tr":"Où organisons-nous la formation ?"},{"q":"Aren't you going to the trade show?","o":["No, I have too much work.","The show was great.","It's a trade secret."],"e":"Question négative → réponse sur la participation + raison.","tr":"Tu ne vas pas au salon professionnel ?"},{"q":"How long have you worked in sales?","o":["For about five years.","It's a long sale.","At the store downtown."],"e":"<b>How long</b> → une durée.","tr":"Depuis combien de temps travaillez-vous dans la vente ?"},{"q":"What's the password for the Wi-Fi?","o":["It's written on the board.","It's very fast.","Yes, it passed."],"e":"Réponse <b>indirecte</b> : indique où trouver l'information.","tr":"Quel est le mot de passe du Wi-Fi ?"},{"q":"Can you help me with this spreadsheet?","o":["Sure, what's the problem?","The sheets are clean.","I spread it out."],"e":"<b>Demande d'aide</b> → accepter. Sheets/spread = pièges sonores.","tr":"Peux-tu m'aider avec ce tableur ?"},{"q":"When will the renovations be finished?","o":["Hopefully by the end of the month.","The office looks new.","The architect."],"e":"<b>When</b> → un moment.","tr":"Quand les travaux seront-ils terminés ?"},{"q":"Why hasn't the shipment arrived yet?","o":["There was a delay at customs.","It's arriving on a ship.","Yes, it has."],"e":"<b>Why</b> → une cause. « Ship » = piège sonore (shipment).","tr":"Pourquoi la livraison n'est-elle pas encore arrivée ?"},{"q":"Did you reserve a table for tonight?","o":["Yes, for seven o'clock.","The table is wooden.","It's a nice reservation."],"e":"Question oui/non → confirmation + détail.","tr":"As-tu réservé une table pour ce soir ?"},{"q":"Which supplier offers the best price?","o":["Brightway, according to the report.","The price is right.","Yes, they supply us."],"e":"<b>Which</b> → identifier un fournisseur.","tr":"Quel fournisseur propose le meilleur prix ?"},{"q":"I can't find my ID badge.","o":["Did you check your car?","It's a nice badge.","I found the ID number."],"e":"<b>Affirmation</b> d'un problème → une suggestion sous forme de question.","tr":"Je ne trouve pas mon badge."},{"q":"Who should I contact about my paycheck?","o":["Try the payroll office.","The check is here.","It was paid in full."],"e":"<b>Who</b> → une personne ou un service.","tr":"Qui dois-je contacter au sujet de ma paie ?"},{"q":"Are you coming to the meeting or staying here?","o":["I'll be there in a minute.","Yes, I am.","It was a long meeting."],"e":"Question à <b>choix</b> → pas de « Yes ».","tr":"Tu viens à la réunion ou tu restes ici ?"},{"q":"How do I get to the airport from here?","o":["Take the express train.","At the gate.","The flight is at six."],"e":"<b>How do I get to</b> → un moyen de transport.","tr":"Comment aller à l'aéroport d'ici ?"},{"q":"Where is the staff party being held this year?","o":["It hasn't been decided yet.","Last December.","Everyone is invited."],"e":"Réponse <b>indirecte</b> : l'information n'est pas encore connue.","tr":"Où a lieu la fête du personnel cette année ?"},{"q":"Why don't you ask Karen for help?","o":["She's on vacation this week.","I'll help you later.","Yes, I asked why."],"e":"Suggestion → réponse expliquant pourquoi ce n'est pas possible.","tr":"Pourquoi ne demandes-tu pas de l'aide à Karen ?"},{"q":"The client wants to reschedule the meeting.","o":["What day works for her?","The schedule is printed.","We met yesterday."],"e":"<b>Affirmation</b> → question de suivi logique.","tr":"Le client veut reporter la réunion."},{"q":"Is this seat taken?","o":["No, please sit down.","I took it yesterday.","It's a comfortable chair."],"e":"Question oui/non → la place est libre. « Took » = piège.","tr":"Cette place est-elle prise ?"},{"q":"When does the next train to Boston leave?","o":["In about fifteen minutes.","From platform three.","Yes, it's a fast train."],"e":"<b>When</b> → un moment.","tr":"Quand part le prochain train pour Boston ?"},{"q":"Where should I put these boxes?","o":["In the storage room, please.","About twenty of them.","They're very heavy."],"e":"<b>Where</b> → un lieu.","tr":"Où dois-je mettre ces cartons ?"},{"q":"Who is giving the presentation this afternoon?","o":["Mr. Patel from marketing.","At two o'clock.","It was very informative."],"e":"<b>Who</b> → une personne.","tr":"Qui fait la présentation cet après-midi ?"},{"q":"Why is the elevator out of order?","o":["It's being repaired.","On the fifth floor.","Take the stairs up."],"e":"<b>Why</b> → une cause.","tr":"Pourquoi l'ascenseur est-il en panne ?"},{"q":"How much does the conference cost?","o":["It's two hundred dollars.","It lasts three days.","Many people attended."],"e":"<b>How much</b> → un prix.","tr":"Combien coûte la conférence ?"},{"q":"Did you finish the sales report?","o":["I'm still working on it.","Yes, the sale was great.","It reports every week."],"e":"Réponse naturelle : pas encore terminé. « Sale » = piège.","tr":"As-tu fini le rapport des ventes ?"},{"q":"Would you like some coffee?","o":["No, thanks, I just had some.","It's a coffee shop.","I like the copy."],"e":"<b>Offre</b> → accepter/refuser.","tr":"Voulez-vous un café ?"},{"q":"Could you close the window, please?","o":["Sure, it's getting cold.","It's close to the office.","The windows are clean."],"e":"Demande → accepter. « Close » (proche) = piège.","tr":"Pourriez-vous fermer la fenêtre ?"},{"q":"Which hotel are you staying at?","o":["The one near the station.","For three nights.","Yes, I'll stay."],"e":"<b>Which</b> → identifier un hôtel.","tr":"Dans quel hôtel logez-vous ?"},{"q":"How long is the flight to Tokyo?","o":["About twelve hours.","It's a long line.","At gate 6."],"e":"<b>How long</b> → une durée.","tr":"Combien de temps dure le vol pour Tokyo ?"},{"q":"What's the best way to get downtown?","o":["Take the subway.","It's a nice town.","The best in the city."],"e":"Moyen de transport → subway.","tr":"Quel est le meilleur moyen d'aller en centre-ville ?"},{"q":"Isn't Ms. Kim coming to the meeting?","o":["She's out of the office today.","Yes, it's a big mee ho</b> → identité.","tr":"Qui est l'homme qui parle au directeur ?"},{"q":"Where can I get a visitor's pass?","o":["At the security desk.","For one day.","I passed the test."],"e":"<b>Where</b> → un lieu. « Passed » = piège.","tr":"Où puis-je obtenir un badge visiteur ?"},{"q":"Why is the meeting room locked?","o":["Someone is using it for an interview.","The lock is new.","At three o'clock."],"e":"<b>Why</b> → une cause.","tr":"Pourquoi la salle de réunion est-elle fermée à clé ?"},{"q":"Didn't you receive the updated schedule?","o":["No, could you forward it to me?","The date is wrong.","The schedule is on time."],"e":"Question négative → non + demande.","tr":"Tu n'as pas reçu le planning mis à jour ?"},{"q":"How many rooms did you reserve?","o":["Three for the whole team.","For two nights.","Yes, I did."],"e":"<b>How many</b> → un nombre.","tr":"Combien de chambres as-tu réservées ?"},{"q":"Can I borrow your stapler?","o":["Sure, here you go.","I bought it yesterday.","It's a red stapler."],"e":"<b>Demande</b> → accepter.","tr":"Je peux t'emprunter ton agrafeuse ?"},{"q":"What's the weather like in Chicago?","o":["It's cold and windy.","I like it very much.","Whether or not you go."],"e":"« What's … like » → description.","tr":"Quel temps fait-il à Chicago ?"},{"q":"When did the new policy take effect?","o":["At the beginning of the month.","It's an effective policy.","They took the train."],"e":"<b>When</b> → un moment passé.","tr":"Quand la nouvelle politique est-elle entrée en vigueur ?"},{"q":"Who should I talk to about my vacation request?","o":["Your department manager.","For two weeks.","It was a nice vacation."],"e":"<b>Who</b> → une personne.","tr":"À qui dois-je parler de ma demande de congé ?"},{"q":"Where's the charger for this laptop?","o":["It should be in the bag.","It's fully charged.","The laptop is new."],"e":"<b>Where</b> → un lieu. « Charged » = piège.","tr":"Où est le chargeur de cet ordinateur ?"},{"q":"Why don't we hire a consultant?","o":["That might be too expensive.","Because he's higher.","The consultant was helpful."],"e":"Suggestion → objection.","tr":"Pourquoi n'embauche-t-on pas un consultant ?"},{"q":"Is the new software easy to use?","o":["Once you get used to it.","It's a soft chair.","It's a used computer."],"e":"Réponse nuancée <b>indirecte</b>.","tr":"Le nouveau logiciel est-il facile à utiliser ?"},{"q":"How did you hear about our company?","o":["A friend recommended you.","Very loudly.","I heard it's big."],"e":"<b>How</b> → un moyen (source).","tr":"Comment avez-vous connu notre entreprise ?"},{"q":"Let's take a break for ten minutes.","o":["Good, I need some coffee.","The break room is small.","It broke yesterday."],"e":"<b>Suggestion</b> → accepter. « Broke » = piège.","tr":"Faisons une pause de dix minutes."},{"q":"Which printer should I use?","o":["The one next to the kitchen works best.","Print it in color.","Yes, you should."],"e":"<b>Which</b> → identifier.","tr":"Quelle imprimante dois-je utiliser ?"},{"q":"When is Ms. Rossi's retirement party?","o":["Next Friday afternoon.","She's retiring after 30 years.","At the restaurant."],"e":"<b>When</b> → une date.","tr":"Quand a lieu le pot de départ de Mme Rossi ?"},{"q":"Who's going to take notes at the meeting?","o":["I can do it.","On the table.","The notes are clear."],"e":"<b>Who</b> → volontaire.","tr":"Qui va prendre des notes à la réunion ?"},{"q":"Where did you park the company car?","o":["In space number 12.","It's a blue car.","The park is nearby."],"e":"<b>Where</b> → un lieu.","tr":"Où as-tu garé la voiture de société ?"},{"q":"Why was the shipment returned?","o":["The address was incorrect.","We return at five.","Please return it."],"e":"<b>Why</b> → une cause.","tr":"Pourquoi la marchandise a-t-elle été renvoyée ?"},{"q":"Are these seats reserved?","o":["Yes, for the speakers.","The service was good.","I'll serve them."],"e":"Question oui/non → oui + précision.","tr":"Ces places sont-elles réservées ?"},{"q":"How much time do we have left?","o":["About fifteen minutes.","It's on my left.","Yes, a lot."],"e":"<b>How much time</b> → une durée. « Left » = piège.","tr":"Combien de temps nous reste-t-il ?"},{"q":"Could you turn up the heat?","o":["Sure, is it too cold in here?","It's a hot day.","Turn left at the corner."],"e":"<b>Demande</b> → accepter + question.","tr":"Pourriez-vous monter le chauffage ?"},{"q":"We should hire more staff for the holidays.","o":["I agree, it gets very busy.","The holidays were fun.","They're higher up."],"e":"<b>Suggestion</b> → accord.","tr":"Nous devrions embaucher pour les fêtes."}]}];

new before this date. [148]\n\nSubscribers who renew by August 15 will receive a 15% discount. You can renew [149] by visiting our website or by calling our customer service line.\n\nThank you for being a [150] reader.\n\nSincerely,\nThe Business Today Team"},"p6k":{"hdr":"From: Olivia Grant\nTo: Project Team\nSubject: Thursday's meeting","text":"Hi everyone,\n\nI'm writing to let you know that Thursday's project meeting has been moved to Friday at 10 A.M. Several team members are [131] a client visit on Thursday and would not be able to attend.\n\nThe meeting will still take place in Conference Room B. [132] Please bring your updated progress reports so that we can review them [133].\n\nIf Friday does not work for you, let me know as soon as [134].\n\nThanks,\nOlivia"},"p6l":{"hdr":"SoftLine Support — Product Update","text":"SoftLine is pleased to announce version 5.0 of its accounting software. The new version includes several features [135] by our customers, such as automatic invoice reminders and improved reporting tools. [136]\n\nCurrent users can upgrade free of charge until December 31. After that date, the upgrade will cost $49. To download the update, simply log in to your account and click “Update.” The installation process takes [137] ten minutes.\n\nAs always, our support team is available 24 hours a day to [138] you."},"p6m":{"hdr":"NOTICE TO ALL TENANTS\nParkview Business Center","text":"Please be informed that the water supply to the building will be shut off on Saturday, October 9, from 8 A.M. to 2 P.M. This is necessary [139] the maintenance team can replace old pipes on the third floor.\n\nDuring this time, restrooms and kitchens will not be [140]. [141] We recommend that tenants who plan to work on Saturday make other arrangements.\n\nManagement apologizes for the inconvenience and thanks you for your [142]."},"p6n":{"hdr":"Lakewood Business Journal","text":"Martin Engineering has received this year's Green Business Award for its efforts to reduce t":"HARBOR CITY — Local bakery Sweet Grain will open its second location on Elm Street next month. Owner Rachel Osei started the business five years ago in a small shop near the train station. — [1] — Since then, the bakery has become known for its whole-grain breads and seasonal pastries. — [2] —\n\n“We've been looking for a larger space for a while,” Ms. Osei said. The new shop will include a seating area for 30 customers and will offer breakfast and lunch menus. — [3] —\n\nTo celebrate the opening on May 5, Sweet Grain will give a free coffee to every customer who makes a purchase. — [4] —"},"p7f":{"hdr":"NOTICE — Westbrook Public Library","text":"Beginning Monday, March 2, the library will extend its opening hours. The new schedule is as follows:\n\nMonday–Thursday: 9 A.M. – 9 P.M.\nFriday: 9 A.M. – 6 P.M.\nSaturday: 10 A.M. – 5 P.M.\nSunday: Closed\n\nIn addition, the second-floor computer lab will be available by reservation only. Reservations can be made at the front desk or online, up to one week in advance. Each session is limited to two hours.\n\nLibrary cards are required to borrow materials. New cards can be issued at the front desk with proof of address."},"p7g":{"hdr":"From: Samuel Ortiz <sortiz@nexatech.com>\nTo: All Sales Staff\nDate: September 8\nSubject: Quarterly sales meeting","text":"Hello team,\n\nOur quarterly sales meeting will be held on Wednesday, September 16, at the Riverside Hotel instead of our office, since our conference room is being renovated. The meeting will start at 9:30 A.M. and end around 3 P.M. Lunch will be provided.\n\nPlease prepare a short summary of your results for the last three months. Each person will have five minutes to present. Also, if you plan to drive, note that parking at the hotel costs $15 per day, but the company will reimburse this expense.\n\nBest,\nSamuel"},"p7h":{"hdr":"Customer review — Lumina Home","text":"★★★★☆  Reviewed by Hannah L. — October 2\n\nI ordered the Arlo desk lamp from Lumina Home for my home office. Delivery was fast — it arrived one day earlier than expected. The lamp is bright and the adjustable arm is very useful.\n\nMy only complaint is that the power cable is rather short, so I had to buy an extension cord. Overall, I would recommend this product."},"p7i":{"hdr":"Document 1 — Advertisement","text":"SUMMIT LANGUAGE SCHOOL — Autumn Courses\n\nBusiness English (Level 2) — Tuesdays & Thursdays, 6–8 P.M. — $320\nSpanish for Beginners — Mondays, 7–9 P.M. — $250\nJapanese Conversation — Saturdays, 10 A.M.–12 P.M. — $280\n\nAll courses run for 10 weeks, starting October 5. Register before September 20 to receive a 10% discount. Companies enrolling three or more employees receive an additional 5% off.\n\n———————————\nDocument 2 — E-mail\nFrom: Grace Liu\nTo: info@summitlanguage.com\nDate: September 14\nSubject: Registration\n\nHello,\n\nI would like to register for one of your courses. I work late on weekdays, so I can only attend classes on weekends. I studied the language for a year at university, so I don't think I need a beginner course. Could you also tell me whether the textbook is included in the price?\n\nThank you,\nGrace Liu"},"p7j":{"hdr":"MEMO\nTo: All employees\nFrom: Karen Blake, Facilities Manager\nDate: January 10\nRe: Recycling program","text":"Starting next week, Norland Industries will introduce a new recycling program. Blue bins for paper and green bins for plastic and cans will be placed in every kitchen area. Please do not put food waste in either bin; it should go in the regular trash.\n\nLast year, we threw away more than four tons of paper. Our goal is to recycle at least 70 percent of this amount in the first year.\n\nA short information session will be held in the cafeteria on January 15 at noon. Attendance is optional, but we encourage everyone to come."},"p7k":{"hdr":"www.metrorail.com/news","text":"Service Update — Blue Line\n\nFrom April 6 to April 19, Blue Line trains will not run between Central Station and Harbor Park due to track repairs. Free shuttle buses will operate between these stations every 10 minutes. Passengers should allow an extra 20 minutes for their journey.\n\nAll other sections of the Blue Line will operate on the normal schedule. For real-time updates, download the MetroRail app."},"p7l":{"hdr":"Online chat discussion","text":"Marcus Bell (2:05 P.M.)\nPriya, the projector in Room 4 isn't turning on. The client presentation starts at 3.\n\nPriya Shah (2:06 P.M.)\nDid you check the power cable?\n\nMarcus Bell (2:08 P.M.)\nYes, it's plugged in.\n\nPriya Shah (2:09 P.M.)\nThen let's not take any chances. Room 6 is free this afternoon, and its projector was just replaced.\n\nMarcus Bell (2:10 P.M.)\nGood idea. Can you let the receptionist know so she sends the clients there?\n\nPriya Shah (2:11 P.M.)\nWill do."},"p7m":{"hdr":"Ferris Architecture\n220 Clark Avenue","text":"Dear Mr. Haddad,\n\nThank you for your interest in the Project Coordinator position at Ferris Architecture. We were impressed by your experience and would like to invite you for an interview on Tuesday, May 9, at 11 A.M. at our office at 220 Clark Avenue.\n\nThe interview will last about one hour and will be conducted by our senior partner, Ms. Elena Voss, and myself. You will also be asked to complete a short written exercise. Please bring a copy of your portfolio.\n\nKindly confirm your attendance by replying to this letter by May 3. If the proposed time is not convenient, we will do our best to find an alternative.\n\nSincerely,\nJames Porter\nHuman Resources Manager"},"p7n":{"hdr":"GREENVILLE BUSINESS FORUM — Program, Friday, June 12","text":"9:00 A.M. — Registration & coffee (Main Lobby)\n9:30 A.M. — Opening remarks: Mayor Linda Cho (Hall A)\n10:00 A.M. — Keynote: “The Future of Small Business” — David Mensah (Hall A)\n11:30 A.M. — Workshops (Rooms 1–3)\n12:30 P.M. — Networking lunch (Garden Terrace)*\n2:00 P.M. — Panel discussion: Financing Your Growth (Hall A)\n\n*In case of rain, lunch will be served in the Main Lobby."},"p7o":{"hdr":"Document 1 — E-mail\nFrom: Nora Feld <nfeld@coastprint.com>\nTo: Victor Allen\nDate: February 2\nSubject: Your brochure order","text":"Dear Mr. Allen,\n\nThank you for your order of 500 color brochures. As requested, they will be printed on glossy paper. The total cost is $425, and the brochures will be ready for pickup on February 9. If you prefer delivery, we can send them to your shop for an additional $20.\n\nPlease review the attached proof carefully and let us know of any changes by February 4. After that date, we will begin printing.\n\nBest regards,\nNora Feld\n\n———————————\nDocument 2 — E-mail\nFrom: Victor Allen\nTo: Nora Feld\nDate: February 3\nSubject: RE: Your brochure order\n\nDear Ms. Feld,\n\nThank you for the proof. It looks great, but the phone number on the back page should be 555-0143, not 555-0134. Also, since I will be traveling that week, please deliver the brochures to my shop.\n\nRegards,\nVictor Allen"},"p7p":{"hdr":"TECH NEWS — Riverdale, August 21","text":"Solaris Mobile, a smartphone maker based in Riverdale, has announced that it will stop producing its low-cost Solaris Lite model at the end of the year. The company said that the model, first released in 2019, no longer sells well because customers now prefer phones with larger screens.\n\nInstead, Solaris will focus on its premium Solaris Pro line, which accounted for 65 percent of the company's revenue last year. A new Pro model is expected to be released in March.\n\nCurrent Solaris Lite owners will continue to receive software updates until 2027, the company confirmed."},"p7q":{"hdr":"CUSTOMER FEEDBACK FORM — Bella Vista Restaurant\nName: Omar Farouk · Date of visit: November 14","text":"Please rate the following (1 = poor, 5 = excellent):\nFood quality: 5\nService: 3\nCleanliness: 5\nValue for money: 4\n\nComments: The pasta was excellent and the dining room was spotless. However, we waited almost 40 minutes for our main course, and our usiasm [135] impressed our hiring team.\n\nYour starting salary will be $48,000 per year, and you will be [136] for our full benefits package after three months. [137]\n\nPlease sign and return the enclosed contract by May 20 to [138] your acceptance. We look forward to welcoming you to the team.\n\nSincerely,\nEmma Clarke, HR Manager"},"p6_27":{"hdr":"Tech Today — Startups","text":"Local software startup CloudNest has raised $12 million from a group of investors. The company plans to use the funds to expand its team and [139] its product into Europe.\n\nFounded just three years ago, CloudNest develops tools that help small businesses [140] their online sales. [141]\n\n“This investment shows that there is strong demand for simple, affordable solutions,” said co-founder Jin Park. The company expects to double the [142] of its staff by the end of next year."},"p6_28":{"hdr":"MEMO\nTo: All employees\nFrom: IT Department\nRe: Password security","text":"To protect company data, all employees must change their passwords every 90 days. Passwords must be at least 12 characters long and [143] both letters and numbers.\n\nPlease do not share your password with anyone, [144] coworkers. [145]\n\nIf you forget your password, you can reset it [146] the self-service portal. For further assistance, contact the IT help desk."},"p6_29":{"hdr":"Bella Cucina Cooking School","text":"Have you always wanted to cook authentic Italian food? Join our six-week evening course, [147] every Tuesday from 7 to 9 P.M.\n\nOur experienced chefs will teach you how to make fresh pasta, sauces, and desserts. [148] All ingredients and equipment are [149].\n\nClasses are limited to 12 students, so early registration is [150] recommended. Sign up before March 1 and receive a 10% discount."},"p6_30":{"hdr":"From: Lisa Grant, Apex Paper Co.\nTo: Valued customers\nSubject: Price update","text":"Dear Customer,\n\nDue to the rising cost of raw materials, we will be [131] our prices by 5% starting August 1. This
