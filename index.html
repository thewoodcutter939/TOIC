","be","been"],"e":"<b>Promise not to</b> + V.","tr":"Il a promis de ne plus être en retard."},{"q":"The manager spent the morning ___ e-mails.","o":["answering","to answer","answer","answered"],"e":"<b>Spend time</b> + V-ing.","tr":"Le responsable a passé la matinée à répondre aux e-mails."},{"q":"She is eager ___ her new job.","o":["to start","starting","start","started"],"e":"<b>Be eager</b> + to V.","tr":"Elle a hâte de commencer son nouveau travail."},{"q":"Instead of ___ by car, take the train.","o":["traveling","travel","to travel","traveled"],"e":"<b>Instead of</b> + V-ing.","tr":"Au lieu de voyager en voiture, prenez le train."},{"q":"The company plans on ___ a new product.","o":["launching","launch","to launch","launched"],"e":"<b>Plan on</b> + V-ing (préposition).","tr":"L'entreprise compte lancer un nouveau produit."},{"q":"It's worth ___ the museum.","o":["visiting","to visit","visit","visited"],"e":"<b>It's worth</b> + V-ing.","tr":"Le musée vaut la visite."},{"q":"Customers are not permitted ___ in this area.","o":["to park","parking","park","parked"],"e":"<b>Be permitted</b> + to V.","tr":"Les clients ne sont pas autorisés à se garer ici."},{"q":"We are proud of ___ this award.","o":["receiving","receive","to receive","received"],"e":"<b>Of</b> + V-ing.","tr":"Nous sommes fiers de recevoir ce prix."},{"q":"The technician attempted ___ the machine.","o":["to repair","repairing","repair","repaired"],"e":"<b>Attempt</b> + to V.","tr":"Le technicien a tenté de réparer la machine."},{"q":"Ms. Kim dislikes ___ in traffic.","o":["waiting","to wait","wait","waited"],"e":"<b>Dislike</b> + V-ing.","tr":"Mme Kim déteste attendre dans les embouteillages."},{"q":"Ms. Ray decided against ___ the offer.","o":["accepting","accept","to accept","accepted"],"e":"<b>Against</b> + V-ing.","tr":"Mme Ray a décidé de ne pas accepter l'offre."},{"q":"The new system makes it easy ___ orders.","o":["to track","tracking","track","tracked"],"e":"<b>make it easy</b> + to V.","tr":"Le nouveau système facilite le suivi des commandes."},{"q":"Mr. Hall is accustomed to ___ early.","o":["waking up","wake up","woke up","be waking up"],"e":"<b>Accustomed to</b> + V-ing.","tr":"M. Hall a l'habitude de se lever tôt."},{"q":"We regret ___ you that the flight is canceled.","o":["to inform","informing","inform","informed"],"e":"<b>Regret to inform</b> = avoir le regret d'annoncer (regret + V-ing = regretter d'avoir fait).","tr":"Nous avons le regret de vous informer que le vol est annulé."},{"q":"The company has stopped ___ paper catalogs.","o":["printing","to print","print","printed"],"e":"<b>Stop</b> + V-ing = cesser de.","tr":"L'entreprise a cessé d'imprimer des catalogues papier."},{"q":"It is necessary ___ the form in English.","o":["to complete","completing","complete","completed"],"e":"<b>It is + adj + to V</b>.","tr":"Il faut remplir le formulaire en anglais."},{"q":"He is in charge of ___ the event.","o":["organizing","organize","to organize","organized"],"e":"<b>Of</b> + V-ing.","tr":"Il est chargé d'organiser l'événement."},{"q":"They hesitated ___ the contract.","o":["to sign","signing","sign","signed"],"e":"<b>Hesitate</b> + to V.","tr":"Ils ont hésité à signer le contrat."},{"q":"The team discussed ___ the deadline.","o":["extending","to extend","extend","extended"],"e":"<b>Discuss</b> + V-ing.","tr":"L'équipe a discuté d'un report de l'échéance."},{"q":"The CEO encouraged employees ___ feedback.","o":["to give","giving","give","given"],"e":"<b>Encourage sb</b> + to V.","tr":"Le PDG a encouragé les employés à donner leur avis."},{"q":"We look forward to ___ with you again.","o":["working","work","worked","be working"],"e":"<b>Look forward to</b> + V-ing.","tr":"Au plaisir de travailler à nouveau avec vous."},{"q":"Ms. Lopez is thinking of ___ her job.","o":["changing","change","to change","changed"],"e":"<b>Of</b> + V-ing.","tr":"Mme Lopez envisage de changer d'emploi."},{"q":"The staff were reminded ___ their passwords.","o":["to change","changing","change","changed"],"e":"<b>Remind sb</b> + to V.","tr":"On a rappelé au personnel de changer ses mots de passe."},{"q":"He enjoys ___ new places.","o":["visiting","to visit","visit","visited"],"e":"<b>Enjoy</b> + V-ing.","tr":"Il aime découvrir de nouveaux endroits."},{"q":"The manager wants us ___ the report today.","o":["to finish","finishing","finish","finished"],"e":"<b>Want sb</b> + to V.","tr":"Le responsable veut que nous terminions le rapport aujourd'hui."},{"q":"The team is busy ___ for the trade fair.","o":["preparing","to prepare","prepare","prepared"],"e":"<b>Be busy</b> + V-ing.","tr":"L'équipe est occupée à préparer le salon."},{"q":"Please refrain from ___ in the lobby.","o":["smoking","smoke","to smoke","smoked"],"e":"<b>Refrain from</b> + V-ing.","tr":"Merci de ne pas fumer dans le hall."},{"q":"The firm is planning ___ its headquarters.","o":["to relocate","relocating","relocate","relocated"],"e":"<b>Plan</b> + to V.","tr":"Le cabinet prévoit de déménager son siège."},{"q":"Mr. Owen quit ___ overtime last year.","o":["working","to work","work","worked"],"e":"<b>Quit</b> + V-ing = arrêter de.","tr":"M. Owen a arrêté les heures supplémentaires l'an dernier."},{"q":"The hotel offers guests the chance ___ the city.","o":["to explore","exploring","explore","explored"],"e":"<b>The chance</b> + to V.","tr":"L'hôtel offre aux clients la possibilité de découvrir la ville."},{"q":"It took two hours ___ the problem.","o":["to solve","solving","solve","solved"],"e":"<b>It took + durée + to V</b>.","tr":"Il a fallu deux heures pour résoudre le problème."},{"q":"Visitors are asked ___ their phones.","o":["to switch off","switching off","switch off","switched off"],"e":"<b>Be asked</b> + to V.","tr":"Les visiteurs sont priés d'éteindre leur téléphone."},{"q":"I'm used to ___ in English.","o":["presenting","present","presented","be presenting"],"e":"<b>Be used to</b> + V-ing.","tr":"J'ai l'habitude de présenter en anglais."},{"q":"The company is known for ___ its staff well.","o":["treating","treat","to treat","treated"],"e":"<b>For</b> + V-ing.","tr":"L'entreprise est connue pour bien traiter son personnel."},{"q":"Mr. Kim forgot ___ his laptop.","o":["to bring","bringing","bring","brought"],"e":"<b>Forget to</b> = oublier de.","tr":"M. Kim a oublié d'apporter son ordinateur."},{"q":"We tend ___ more in December.","o":["to sell","selling","sell","sold"],"e":"<b>Tend</b> + to V.","tr":"Nous vendons généralement plus en décembre."},{"q":"The CEO objected to ___ the budget.","o":["cutting","cut","to cut","cuts"],"e":"<b>Object to</b> + V-ing.","tr":"Le PDG s'est opposé à la réduction du budget."},{"q":"Ms. Tan appears ___ the best candidate.","o":["to be","being","be","been"],"e":"<b>Appear</b> + to V.","tr":"Mme Tan semble être la meilleure candidate."},{"q":"We are excited about ___ in the new office.","o":["working","work","to work","worked"],"e":"<b>About</b> + V-ing.","tr":"Nous sommes ravis de travailler dans le nouveau bureau."},{"q":"The manager urged the team ___ harder.","o":["to work","working","work","worked"],"e":"<b>Urge sb</b> + to V.","tr":"Le responsable a exhorté l'équipe à travailler plus dur."},{"q":"He is not used to ___ so early.","o":["getting up","get up","got up","be getting up"],"e":"<b>Be used to</b> + V-ing.","tr":"Il n'a pas l'habitude de se lever si tôt."},{"q":"The client threatened ___ the contract.","o":["to cancel","canceling","cancel","canceled"],"e":"<b>Threaten</b> + to V.","tr":"Le client a menacé d'annuler le contrat."},{"q":"Would you consider ___ the price?","o":["lowering","to lower","lower","lowered"],"e":"<b>Consider</b> + V-ing.","tr":"Envisageriez-vous de baisser le prix ?"},{"q":"The company is dedicated to ___ the environment.","o":["protecting","protect","protected","be protecting"],"e":"<b>Dedicated to</b> + V-ing.","tr":"L'entreprise s'engage à protéger l'environnement."},{"q":"They risk ___ the client.","o":["losing","to lose","lose","lost"],"e":"<b>Risk</b> + V-ing.","tr":"Ils risquent de perdre le client."},{"q":"I'd like ___ an appointment.","o":["to make","making","make","made"],"e":"<b>Would like</b> + to V.","tr":"J'aimerais prendre rendez-vous."},{"q":"The staff were trained ___ the new machines.","o":["to operate","operating","operate","operated"],"e":"<b>Be trained</b> + to V.","tr":"Le personnel a été formé à utiliser les nouvelles machines."},{"q":"The company delayed ___ the product.","o":["launching","to launch","launch","launched"],"e":"<b>Delay</b> + V-ing.","tr":"L'entreprise a retardé le lancement du produit."},{"q":"We need ___ the figures again.","o":["to check","checking","check","checked"],"e":"<b>Need</b> (sujet actif) + to V.","tr":"Nous devons revérifier les chiffres."},{"q":"The report is worth ___ carefully.","o":["reading","to read","read","reads"],"e":"<b>Be worth</b> + V-ing.","tr":"Le rapport mérite d'être lu attentivement."},{"q":"Mr. Park wishes ___ the manager.","o":["to see","seeing","see","seen"],"e":"<b>Wish</b> + to V.","tr":"M. Park souhaite voir le responsable."},{"q":"The company prevented the workers from ___ injured.","o":["getting","get","to get","got"],"e":"<b>Prevent sb from</b> + V-ing.","tr":"L'entreprise a évité que les ouvriers se blessent."},{"q":"She is proud of ___ the project on time.","o":["finishing","finish","to finish","finished"],"e":"<b>Of</b> + V-ing.","tr":"Elle est fière d'avoir fini le projet à temps."},{"q":"The printer needs ___.","o":["repairing","to repair","repair","repaired"],"e":"<b>Need + V-ing</b> = a besoin d'être (sens passif).","tr":"L'imprimante a besoin d'être réparée."},{"q":"The team plans ___ the results tomorrow.","o":["to present","presenting","present","presented"],"e":"<b>Plan</b> + to V.","tr":"L'équipe prévoit de présenter les résultats demain."},{"q":"Mr. Lee mentioned ___ the client yesterday.","o":["meeting","to meet","meet","met"],"e":"<b>Mention</b> + V-ing.","tr":"M. Lee a dit avoir rencontré le client hier."},{"q":"The company has decided ___ its prices.","o":["not to raise","not raising","to not raising","no raise"],"e":"<b>Decide not to</b> + V.","tr":"L'entreprise a décidé de ne pas augmenter ses prix."},{"q":"It is no use ___ to change his mind.","o":["trying","to try","try","tried"],"e":"<b>It is no use</b> + V-ing.","tr":"Inutile d'essayer de le faire changer d'avis."},{"q":"Staff members are expected ___ on time.","o":["to arrive","arriving","arrive","arrived"],"e":"<b>Be expected</b> + to V.","tr":"Le personnel est censé arriver à l'heure."},{"q":"We are considering ___ our contract with the supplier.","o":["renewing","to renew","renew","renewed"],"e":"<b>Consider</b> + V-ing.","tr":"Nous envisageons de renouveler le contrat avec le fournisseur."},{"q":"The manager asked us not ___ personal calls.","o":["to make","making","make","made"],"e":"<b>Ask sb not to</b> + V.","tr":"Le responsable nous a demandé de ne pas passer d'appels personnels."},{"q":"She is capable of ___ several projects at once.","o":["handling","handle","to handle","handled"],"e":"<b>Of</b> + V-ing.","tr":"Elle sait gérer plusieurs projets à la fois."},{"q":"The company offered ___ the damaged goods.","o":["to replace","replacing","replace","replaced"],"e":"<b>Offer</b> + to V.","tr":"L'entreprise a proposé de remplacer les articles abîmés."},{"q":"The team celebrated ___ the contract.","o":["winning","to win","win","won"],"e":"<b>Celebrate</b> + V-ing.","tr":"L'équipe a fêté l'obtention du contrat."},{"q":"He hopes ___ promoted next year.","o":["to be","being","be","been"],"e":"<b>Hope</b> + to V (ici passif : to be promoted).","tr":"Il espère être promu l'an prochain."},{"q":"The client complained about not ___ a reply.","o":["receiving","receive","to receive","received"],"e":"<b>About</b> + V-ing.","tr":"Le client s'est plaint de ne pas avoir reçu de réponse."},{"q":"Ms. Hall avoided ___ the question.","o":["answering","to answer","answer","answered"],"e":"<b>Avoid</b> + V-ing.","tr":"Mme Hall a évité de répondre à la question."},{"q":"We met in order ___ a solution.","o":["to find","finding","find","found"],"e":"<b>In order to</b> + V.","tr":"Nous nous sommes réunis pour trouver une solution."},{"q":"The company can't risk ___ its reputation.","o":["damaging","to damage","damage","damaged"],"e":"<b>Risk</b> + V-ing.","tr":"L'entreprise ne peut pas risquer d'abîmer sa réputation."},{"q":"Mr. Ali seems ___ tired today.","o":["to be","being","be","been"],"e":"<b>Seem</b> + to V.","tr":"M. Ali a l'air fatigué aujourd'hui."},{"q":"The staff are responsible for ___ the store clean.","o":["keeping","keep","to keep","kept"],"e":"<b>For</b> + V-ing.","tr":"Le personnel est chargé de garder le magasin propre."},{"q":"We decided ___ the event outdoors.","o":["to hold","holding","hold","held"],"e":"<b>Decide</b> + to V.","tr":"Nous avons décidé d'organiser l'événement en plein air."},{"q":"The team has finished ___ the new product.","o":["testing","to test","test","tested"],"e":"<b>Finish</b> + V-ing.","tr":"L'équipe a fini de tester le nouveau produit."},{"q":"Thank you for ___ our survey.","o":["completing","complete","to complete","completed"],"e":"<b>For</b> + V-ing.","tr":"Merci d'avoir répondu à notre enquête."},{"q":"The manager declined ___ on the matter.","o":["to comment","commenting","comment","commented"],"e":"<b>Decline</b> + to V.","tr":"Le responsable s'est refusé à tout commentaire."},{"q":"The company is interested in ___ with us.","o":["partnering","partner","to partner","partnered"],"e":"<b>In</b> + V-ing.","tr":"L'entreprise souhaite s'associer avec nous."},{"q":"The new staff need ___ the safety rules.","o":["to understand","understanding","understand","understood"],"e":"<b>Need</b> + to V.","tr":"Les nouveaux doivent comprendre les règles de sécurité."},{"q":"He suggested ___ the budget.","o":["reviewing","to review","review","reviewed"],"e":"<b>Suggest</b> + V-ing.","tr":"Il a proposé de revoir le budget."},{"q":"It's important ___ customers happy.","o":["to keep","keeping","keep","kept"],"e":"<b>It's + adj + to V</b>.","tr":"Il est important de satisfaire les clients."}]},{"id":"cond","group":"grammar","title":"Conditionnels & subjonctif","part":"Part 5","start":101,"rule":"Type 1 : <b>If + présent, will</b> · Type 2 : <b>If + prétérit, would</b> · Type 3 : <b>If + had + participe, would have + participe</b>. Inversion formelle : <b>Should you need…</b> = If you need… Subjonctif après <b>request / suggest / essential that</b> : base verbale sans -s.","qs":[{"q":"If the shipment ___ late, we will contact you.","o":["is","will be","were","would be"],"e":"Condition réelle + « will » dans la principale → <b>présent</b> après if (jamais will après if).","tr":"Si la livraison est en retard, nous vous contacterons."},{"q":"If I ___ more time, I would take the advanced course.","o":["had","have","will have","would have"],"e":"« would » dans la principale → hypothèse → <b>prétérit</b> après if.","tr":"Si j'avais plus de temps, je suivrais le cours avancé."},{"q":"If the team had prepared better, they ___ the contract.","o":["would have won","will win","would win","had won"],"e":"« had prepared » (passé irréel) → <b>would have + participe</b>.","tr":"Si l'équipe s'était mieux préparée, elle aurait remporté le contrat."},{"q":"___ you need further assistance, please contact our help desk.","o":["Should","Would","Had","Unless"],"e":"<b>Should you need</b> = If you need (inversion formelle très courante dans les e-mails TOEIC).","tr":"Si vous avez besoin d'aide supplémentaire, contactez notre support."},{"q":"The director requested that every employee ___ the new safety rules.","o":["follow","follows","followed","following"],"e":"Après <b>request that</b>, on emploie le <b>subjonctif</b> = base verbale, sans -s même à la 3e personne.","tr":"Le directeur a demandé que chaque employé respecte les nouvelles règles de sécurité."},{"q":"It is essential that the report ___ submitted on time.","o":["be","is","will be","being"],"e":"<b>It is essential that</b> + subjonctif → <b>be</b>.","tr":"Il est essentiel que le rapport soit remis à temps."},{"q":"If you ___ any problems, call the help desk.","o":["have","had","will have","would have"],"e":"Condition réelle + impératif → <b>présent</b> après if.","tr":"Si vous rencontrez un problème, appelez le support."},{"q":"If we had more staff, we ___ faster.","o":["would work","will work","worked","work"],"e":"If + prétérit (type 2) → <b>would</b> + base verbale.","tr":"Si nous avions plus de personnel, nous travaillerions plus vite."},{"q":"If Ms. Grey had known about the meeting, she ___.","o":["would have attended","will attend","would attend","attended"],"e":"If + had + participe (type 3) → <b>would have + participe</b>.","tr":"Si Mme Grey avait su pour la réunion, elle y aurait assisté."},{"q":"Unless the weather ___, the flight will depart on time.","o":["changes","will change","changed","would change"],"e":"Après <b>unless</b> (= if not) → <b>présent</b>.","tr":"À moins que la météo ne change, le vol partira à l'heure."},{"q":"___ I known about the traffic, I would have left earlier.","o":["Had","If","Have","Should"],"e":"Inversion du type 3 : <b>Had I known</b> = If I had known.","tr":"Si j'avais su pour les embouteillages, je serais parti plus tôt."},{"q":"If I ___ you, I would accept the offer.","o":["were","am","will be","had been"],"e":"Conseil : <b>If I were you</b> (were à toutes les personnes).","tr":"À votre place, j'accepterais l'offre."},{"q":"The manager suggested that Mr. Cole ___ the training.","o":["attend","attends","attended","attending"],"e":"<b>Suggest that</b> + subjonctif = base verbale sans -s.","tr":"Le responsable a suggéré que M. Cole suive la formation."},{"q":"If the machine ___ properly, we wouldn't have these delays.","o":["worked","works","will work","has worked"],"e":"« wouldn't » → type 2 → <b>prétérit</b> après if.","tr":"Si la machine fonctionnait correctement, nous n'aurions pas ces retards."},{"q":"We will refund your money if the product ___ damaged.","o":["arrives","will arrive","arrived","would arrive"],"e":"Type 1 : <b>will</b> … if + <b>présent</b>.","tr":"Nous vous rembourserons si le produit arrive endommagé."},{"q":"If you heat water to 100°C, it ___.","o":["boils","would boil","boiled","had boiled"],"e":"Vérité générale (type 0) → <b>présent</b> dans les deux propositions.","tr":"Si on chauffe l'eau à 100 °C, elle bout."},{"q":"If Mr. Ito ___ earlier, he would have caught the train.","o":["had left","left","leaves","would leave"],"e":"« would have caught » → type 3 → <b>had + participe</b>.","tr":"Si M. Ito était parti plus tôt, il aurait eu le train."},{"q":"___ you have any questions, please call me.","o":["Should","Would","Could","Had"],"e":"Inversion formelle : <b>Should you have</b> = If you have.","tr":"Si vous avez des questions, appelez-moi."},{"q":"It is necessary that every visitor ___ in at the front desk.","o":["sign","signs","signed","signing"],"e":"<b>It is necessary that</b> + subjonctif (base verbale).","tr":"Chaque visiteur doit s'enregistrer à l'accueil."},{"q":"If the company ___ its prices, it would lose customers.","o":["raised","raises","will raise","had raise"],"e":"« would » → type 2 → <b>prétérit</b>.","tr":"Si l'entreprise augmentait ses prix, elle perdrait des clients."},{"q":"The client would have signed the contract if we ___ a lower price.","o":["had offered","offered","offer","would offer"],"e":"« would have signed » → <b>had + participe</b>.","tr":"Le client aurait signé si nous avions proposé un prix plus bas."},{"q":"If you ___ the form online, you will receive a confirmation.","o":["complete","completed","would complete","had completed"],"e":"Type 1 → <b>présent</b> après if.","tr":"Si vous remplissez le formulaire en ligne, vous recevrez une confirmation."},{"q":"I wish I ___ more time to finish the report.","o":["had","have","will have","would had"],"e":"<b>I wish</b> + prétérit = regret sur le présent.","tr":"J'aimerais avoir plus de temps pour finir le rapport."},{"q":"If it ___ tomorrow, the outdoor event will be moved inside.","o":["rains","will rain","rained","would rain"],"e":"Type 1 : jamais « will » après if → <b>rains</b>.","tr":"S'il pleut demain, l'événement sera déplacé à l'intérieur."},{"q":"The board insisted that the report ___ revised.","o":["be","is","was","will be"],"e":"<b>Insist that</b> + subjonctif → <b>be</b>.","tr":"Le conseil a exigé que le rapport soit révisé."},{"q":"If Ms. Hart ___ at the office, she would help you.","o":["were","is","will be","has been"],"e":"Type 2 → <b>were</b>.","tr":"Si Mme Hart était au bureau, elle vous aiderait."},{"q":"Provided that the budget ___ approved, work will begin in May.","o":["is","will be","was","would be"],"e":"Après <b>provided that</b> → <b>présent</b> pour le futur.","tr":"À condition que le budget soit approuvé, les travaux commenceront en mai."},{"q":"If we ___ the order yesterday, it would have arrived today.","o":["had placed","placed","place","would place"],"e":"« would have arrived » → <b>had + participe</b>.","tr":"Si nous avions passé commande hier, elle serait arrivée aujourd'hui."},{"q":"In case you ___ lost, call me.","o":["get","will get","got","would get"],"e":"Après <b>in case</b> → <b>présent</b>.","tr":"Au cas où tu te perdrais, appelle-moi."},{"q":"We could finish on time if we ___ more help.","o":["had","have","will have","would have"],"e":"« could » (hypothèse) → <b>prétérit</b> après if.","tr":"Nous pourrions finir à temps si nous avions plus d'aide."},{"q":"If the shipment had arrived on time, we ___ last week's deadline.","o":["would have met","would meet","will meet","met"],"e":"Passé irréel (last week) → <b>would have + participe</b>.","tr":"Si la livraison était arrivée à temps, nous aurions respecté l'échéance de la semaine dernière."},{"q":"What would you do if you ___ the lottery?","o":["won","win","will win","had won"],"e":"« would » → type 2 → <b>prétérit</b>.","tr":"Que ferais-tu si tu gagnais au loto ?"},{"q":"If customers ___ satisfied, they usually come back.","o":["are","were","will be","would be"],"e":"Généralité (usually) → <b>présent</b> (type 0).","tr":"Quand les clients sont satisfaits, ils reviennent généralement."},{"q":"___ the director approve the plan, we will start immediately.","o":["Should","If","Would","Had"],"e":"<b>Should + sujet + base verbale</b> = If the director approves.","tr":"Si le directeur approuve le plan, nous commencerons immédiatement."},{"q":"It is recommended that passengers ___ at the airport two hours early.","o":["arrive","arrives","arrived","arriving"],"e":"<b>It is recommended that</b> + subjonctif.","tr":"Il est recommandé aux passagers d'arriver à l'aéroport deux heures avant."},{"q":"If Mr. Blake ___ the e-mail, he would have replied.","o":["had read","read","reads","would read"],"e":"« would have replied » → <b>had + participe</b>.","tr":"Si M. Blake avait lu l'e-mail, il aurait répondu."},{"q":"If you press this button, the machine ___.","o":["stops","stopped","would stop","had stopped"],"e":"Fonctionnement général (type 0) → <b>présent</b>.","tr":"Si vous appuyez sur ce bouton, la machine s'arrête."},{"q":"We ___ the meeting if the director hadn't been sick.","o":["wouldn't have canceled","won't cancel","didn't cancel","wouldn't cancel"],"e":"« hadn't been » → type 3 → <b>wouldn't have + participe</b>.","tr":"Nous n'aurions pas annulé la réunion si le directeur n'avait pas été malade."},{"q":"If Ms. Novak ___ the job, she will move to Paris.","o":["gets","will get","got","would get"],"e":"Type 1 → <b>présent</b> après if.","tr":"Si Mme Novak obtient le poste, elle s'installera à Paris."},{"q":"Had the team started earlier, they ___ the project on time.","o":["would have finished","will finish","finished","had finished"],"e":"Inversion type 3 (Had the team started) → <b>would have + participe</b>.","tr":"Si l'équipe avait commencé plus tôt, elle aurait fini le projet à temps."},{"q":"Were I in charge, I ___ the process.","o":["would change","will change","changed","change"],"e":"Inversion type 2 (<b>Were I</b> = If I were) → <b>would</b>.","tr":"Si j'étais responsable, je changerais le processus."},{"q":"If the printer ___ out of paper, please refill it.","o":["runs","will run","ran","would run"],"e":"Condition réelle + impératif → <b>présent</b>.","tr":"Si l'imprimante n'a plus de papier, rechargez-la."},{"q":"If you ___ the instructions, you wouldn't have made that mistake.","o":["had followed","followed","follow","would follow"],"e":"« wouldn't have made » → <b>had + participe</b>.","tr":"Si vous aviez suivi les instructions, vous n'auriez pas fait cette erreur."},{"q":"It's essential that all staff ___ the fire drill.","o":["attend","attends","attended","will attend"],"e":"<b>It's essential that</b> + subjonctif.","tr":"Il est essentiel que tout le personnel participe à l'exercice incendie."},{"q":"If I were the manager, I ___ flexible hours.","o":["would introduce","will introduce","introduced","introduce"],"e":"« If I were » → <b>would</b>.","tr":"Si j'étais le responsable, je mettrais en place des horaires flexibles."},{"q":"Customers will receive a discount if they ___ before May 1.","o":["register","will register","registered","would register"],"e":"Type 1 → <b>présent</b>.","tr":"Les clients bénéficieront d'une remise s'ils s'inscrivent avant le 1er mai."},{"q":"If we don't leave now, we ___ the train.","o":["will miss","would miss","missed","miss"],"e":"Type 1 → <b>will</b> dans la principale.","tr":"Si nous ne partons pas maintenant, nous allons rater le train."},{"q":"If the store ___ open on Sundays, it would attract more customers.","o":["were","is","will be","has been"],"e":"« would » → type 2 → <b>were</b>.","tr":"Si le magasin ouvrait le dimanche, il attirerait plus de clients."},{"q":"I would have called you yesterday if I ___ your number.","o":["had had","have","will have","would have"],"e":"« would have called » → <b>had + participe</b> ; le participe de have est had → <b>had had</b>.","tr":"Je t'aurais appelé hier si j'avais eu ton numéro."},{"q":"Even if the price ___, we will still buy the product.","o":["increases","will increase","increased","would increase"],"e":"<b>Even if</b> + présent, principale au futur.","tr":"Même si le prix augmente, nous achèterons quand même le produit."},{"q":"If Ms. Rao ___ more experience, she would get the promotion.","o":["had","has","will have","would have"],"e":"« would get » → <b>prétérit</b>.","tr":"Si Mme Rao avait plus d'expérience, elle obtiendrait la promotion."},{"q":"The director demanded that the problem ___ immediately.","o":["be solved","is solved","was solved","solves"],"e":"<b>Demand that</b> + subjonctif passif → <b>be + participe</b>.","tr":"Le directeur a exigé que le problème soit réglé immédiatement."},{"q":"If you ___ help, just let me know.","o":["need","will need","needed","would need"],"e":"Condition réelle + impératif → <b>présent</b>.","tr":"Si tu as besoin d'aide, dis-le-moi."},{"q":"Our sales would increase if we ___ more in advertising.","o":["invested","invest","will invest","have invested"],"e":"« would increase » → <b>prétérit</b>.","tr":"Nos ventes augmenteraient si nous investissions davantage dans la publicité."},{"q":"If the contract ___ signed last week, the work would have started.","o":["had been","was","has been","were"],"e":"Type 3 au passif → <b>had been + participe</b>.","tr":"Si le contrat avait été signé la semaine dernière, les travaux auraient commencé."},{"q":"As long as you ___ the rules, you can use the gym.","o":["follow","will follow","followed","would follow"],"e":"Après <b>as long as</b> → <b>présent</b>.","tr":"Tant que vous respectez le règlement, vous pouvez utiliser la salle de sport."},{"q":"If the hotel had had a free room, we ___ there last night.","o":["would have stayed","would stay","will stay","stayed"],"e":"Type 3 (last night) → <b>would have + participe</b>.","tr":"Si l'hôtel avait eu une chambre libre, nous y aurions dormi hier soir."},{"q":"___ there be any changes, we will inform you.","o":["Should","Would","Had","Were"],"e":"<b>Should there be</b> = If there are.","tr":"En cas de changement, nous vous en informerons."},{"q":"If I ___ about the problem, I would fix it.","o":["knew","know","will know","would know"],"e":"« would fix » → <b>prétérit</b> ; jamais « would » après if.","tr":"Si j'étais au courant du problème, je le réglerais."},{"q":"It is vital that the machine ___ checked before use.","o":["be","is","was","will be"],"e":"<b>It is vital that</b> + subjonctif → <b>be</b>.","tr":"Il est indispensable que la machine soit vérifiée avant utilisation."},{"q":"If the client ___ the offer, we will start next week.","o":["accepts","will accept","accepted","would accept"],"e":"Type 1 : if + <b>présent</b>, will.","tr":"Si le client accepte l'offre, nous commencerons la semaine prochaine."},{"q":"If we had a bigger budget, we ___ more staff.","o":["would hire","will hire","hired","hire"],"e":"Type 2 : if + prétérit, <b>would</b>.","tr":"Si nous avions un budget plus important, nous embaucherions davantage."},{"q":"If Mr. Lee had checked the report, he ___ the error.","o":["would have found","will find","would find","found"],"e":"Type 3 : had + participe, <b>would have + participe</b>.","tr":"Si M. Lee avait vérifié le rapport, il aurait trouvé l'erreur."},{"q":"If you cool water below 0°C, it ___.","o":["freezes","froze","would freeze","had frozen"],"e":"Vérité générale (type 0) → présent.","tr":"Si on refroidit l'eau sous 0 °C, elle gèle."},{"q":"___ you require further information, please contact us.","o":["Should","Would","Had","Were"],"e":"<b>Should you require</b> = If you require.","tr":"Pour tout renseignement complémentaire, contactez-nous."},{"q":"If I ___ in your position, I would ask for a raise.","o":["were","am","will be","had been"],"e":"Type 2 → <b>were</b>.","tr":"À ta place, je demanderais une augmentation."},{"q":"The manager requested that the report ___ by noon.","o":["be submitted","is submitted","was submitted","submits"],"e":"<b>Request that</b> + subjonctif passif (be + participe).","tr":"Le responsable a demandé que le rapport soit remis avant midi."},{"q":"Unless you ___ now, you will miss the bus.","o":["leave","will leave","left","would leave"],"e":"<b>Unless</b> + présent.","tr":"Si tu ne pars pas maintenant, tu vas rater le bus."},{"q":"If the store ___ open, I would buy it today.","o":["were","is","will be","has been"],"e":"« would » → type 2 → were.","tr":"Si le magasin était ouvert, je l'achèterais aujourd'hui."},{"q":"If she ___ harder, she would have passed the exam.","o":["had studied","studied","studies","would study"],"e":"« would have passed » → had + participe.","tr":"Si elle avait travaillé davantage, elle aurait réussi l'examen."},{"q":"___ I known about the meeting, I would have attended.","o":["Had","If","Have","Should"],"e":"Inversion type 3 : <b>Had I known</b>.","tr":"Si j'avais su pour la réunion, j'y aurais assisté."},{"q":"We ___ the deadline if we work overtime.","o":["will meet","would meet","met","had met"],"e":"Type 1 (if + présent) → will.","tr":"Nous tiendrons l'échéance si nous faisons des heures supplémentaires."},{"q":"If the weather ___ nice tomorrow, we will eat outside.","o":["is","will be","was","were"],"e":"Jamais will après if → <b>is</b>.","tr":"S'il fait beau demain, nous mangerons dehors."},{"q":"If I had more time, I ___ another language.","o":["would learn","will learn","learned","learn"],"e":"Type 2 → would.","tr":"Si j'avais plus de temps, j'apprendrais une autre langue."},{"q":"If the company had invested earlier, it ___ more profit last year.","o":["would have made","will make","would make","made"],"e":"Passé irréel (last year) → would have + participe.","tr":"Si l'entreprise avait investi plus tôt, elle aurait fait plus de bénéfices l'an dernier."},{"q":"I wish I ___ the answer.","o":["knew","know","will know","would know"],"e":"<b>I wish</b> + prétérit (regret présent).","tr":"J'aimerais connaître la réponse."},{"q":"It is important that everyone ___ on time.","o":["arrive","arrives","arrived","arriving"],"e":"<b>It is important that</b> + subjonctif (base verbale).","tr":"Il est important que tout le monde arrive à l'heure."},{"q":"If you press the red button, the alarm ___.","o":["sounds","sounded","would sound","had sounded"],"e":"Fonctionnement général (type 0) → présent.","tr":"Si vous appuyez sur le bouton rouge, l'alarme se déclenche."},{"q":"If they ___ the train, they would have arrived on time.","o":["had caught","caught","catch","would catch"],"e":"Type 3 → had + participe.","tr":"S'ils avaient eu le train, ils seraient arrivés à l'heure."},{"q":"Were the price lower, we ___ more units.","o":["would buy","will buy","bought","buy"],"e":"Inversion type 2 (<b>Were the price</b>) → would.","tr":"Si le prix était plus bas, nous achèterions plus d'unités."},{"q":"Provided that the weather ___ good, the event will go ahead.","o":["is","will be","was","would be"],"e":"<b>Provided that</b> + présent.","tr":"À condition qu'il fasse beau, l'événement aura lieu."},{"q":"If Ms. Kim ___ available, she will lead the meeting.","o":["is","will be","were","would be"],"e":"Type 1 → présent.","tr":"Si Mme Kim est disponible, elle animera la réunion."},{"q":"If we ___ the order earlier, we wouldn't have run out of stock.","o":["had placed","placed","place","would place"],"e":"« wouldn't have run out » → had + participe.","tr":"Si nous avions passé commande plus tôt, nous n'aurions pas été en rupture."},{"q":"We would travel more if flights ___ cheaper.","o":["were","are","will be","had been"],"e":"« would » → were.","tr":"Nous voyagerions plus si les vols étaient moins chers."},{"q":"If the printer ___ again, call the technician.","o":["breaks","will break","broke","would break"],"e":"Condition réelle + impératif → présent.","tr":"Si l'imprimante tombe encore en panne, appelez le technicien."},{"q":"The director insisted that Mr. Park ___ the meeting.","o":["attend","attends","attended","attending"],"e":"<b>Insist that</b> + subjonctif.","tr":"Le directeur a exigé que M. Park assiste à la réunion."},{"q":"Had the team prepared better, the presentation ___ more successful.","o":["would have been","will be","was","had been"],"e":"Inversion type 3 → would have been.","tr":"Si l'équipe s'était mieux préparée, la présentation aurait mieux marché."},{"q":"If I were you, I ___ the contract carefully.","o":["would read","will read","read","had read"],"e":"« If I were you » → would.","tr":"À ta place, je lirais attentivement le contrat."},{"q":"If the package ___ by Friday, please let me know.","o":["doesn't arrive","won't arrive","didn't arrive","wouldn't arrive"],"e":"Condition réelle → présent.","tr":"Si le colis n'arrive pas d'ici vendredi, prévenez-moi."},{"q":"What would happen if the system ___?","o":["failed","fails","will fail","had failed"],"e":"« would » → prétérit.","tr":"Que se passerait-il si le système tombait en panne ?"},{"q":"In case of fire, ___ the building immediately.","o":["leave","leaving","to leave","left"],"e":"Consigne → <b>impératif</b> (base verbale).","tr":"En cas d'incendie, quittez immédiatement le bâtiment."},{"q":"If he ___ more experience, he would get the job.","o":["had","has","will have","would have"],"e":"Type 2 → prétérit.","tr":"S'il avait plus d'expérience, il obtiendrait le poste."},{"q":"The event will be canceled if not enough people ___.","o":["register","will register","registered","would register"],"e":"Type 1 → présent.","tr":"L'événement sera annulé s'il n'y a pas assez d'inscrits."},{"q":"If the meeting had started on time, we ___ earlier.","o":["would have finished","will finish","finished","would finish"],"e":"Type 3 → would have + participe.","tr":"Si la réunion avait commencé à l'heure, nous aurions fini plus tôt."},{"q":"Should the flight be delayed, we ___ you by text.","o":["will notify","notified","had notified","would have notified"],"e":"<b>Should</b> = If (réel) → will.","tr":"Si le vol est retardé, nous vous préviendrons par SMS."},{"q":"If only I ___ more time!","o":["had","have","will have","would have"],"e":"<b>If only</b> + prétérit (regret présent).","tr":"Si seulement j'avais plus de temps !"},{"q":"It is recommended that the machine ___ every month.","o":["be cleaned","is cleaned","was cleaned","cleans"],"e":"Subjonctif passif → be + participe.","tr":"Il est recommandé de nettoyer la machine chaque mois."},{"q":"If the price ___, sales will fall.","o":["increases","will increase","increased","would increase"],"e":"Type 1 → présent.","tr":"Si le prix augmente, les ventes baisseront."},{"q":"If we lived closer, we ___ to work.","o":["would walk","will walk","walked","walk"],"e":"Type 2 → would.","tr":"Si nous habitions plus près, nous irions au travail à pied."},{"q":"If Mr. Hart had not been sick, he ___ the conference.","o":["would have attended","will attend","attended","would attend"],"e":"Type 3 → would have + participe.","tr":"Si M. Hart n'avait pas été malade, il aurait assisté à la conférence."},{"q":"Unless the client ___ by Monday, we will cancel the order.","o":["pays","will pay","paid","would pay"],"e":"<b>Unless</b> + présent.","tr":"Si le client ne paie pas d'ici lundi, nous annulerons la commande."},{"q":"I would call him if I ___ his number.","o":["knew","know","will know","had known"],"e":"« would call » → prétérit.","tr":"Je l'appellerais si je connaissais son numéro."},{"q":"If you ___ any questions, feel free to ask.","o":["have","had","will have","would have"],"e":"Condition réelle + impératif → présent.","tr":"Si vous avez des questions, n'hésitez pas."},{"q":"___ the company offer more money, would you accept the job?","o":["Should","If","Would","Had"],"e":"<b>Should + sujet + base verbale</b> (If offre → offers ; ici base verbale).","tr":"Si l'entreprise proposait plus, accepteriez-vous le poste ?"},{"q":"The CEO asked that all staff ___ the new policy.","o":["follow","follows","followed","following"],"e":"<b>Ask that</b> + subjonctif.","tr":"Le PDG a demandé que tout le personnel respecte la nouvelle politique."},{"q":"If the machine ___ properly, we would not need a new one.","o":["worked","works","will work","has worked"],"e":"« would » → prétérit.","tr":"Si la machine fonctionnait bien, nous n'en aurions pas besoin d'une neuve."},{"q":"We will postpone the trip if it ___.","o":["snows","will snow","snowed","would snow"],"e":"Type 1 → présent.","tr":"Nous reporterons le voyage s'il neige."},{"q":"If I had seen the e-mail, I ___ immediately.","o":["would have replied","will reply","replied","would reply"],"e":"Type 3 → would have + participe.","tr":"Si j'avais vu l'e-mail, j'aurais répondu tout de suite."},{"q":"As long as you ___ the instructions, the machine is safe.","o":["follow","will follow","followed","would follow"],"e":"<b>As long as</b> + présent.","tr":"Tant que vous suivez les instructions, la machine est sans danger."},{"q":"If she ___ the job offer, she will move to London.","o":["accepts","will accept","accepted","would accept"],"e":"Type 1 → présent.","tr":"Si elle accepte l'offre, elle s'installera à Londres."},{"q":"If we had left earlier, we ___ the traffic.","o":["would have avoided","will avoid","avoided","would avoid"],"e":"Type 3.","tr":"Si nous étions partis plus tôt, nous aurions évité les bouchons."},{"q":"If the store ___ more staff, customers wouldn't have to wait.","o":["had","has","will have","would have"],"e":"« wouldn't » → prétérit.","tr":"Si le magasin avait plus de personnel, les clients n'attendraient pas."},{"q":"I wish the meeting ___ shorter.","o":["were","is","will be","would be"],"e":"<b>I wish</b> + were.","tr":"J'aimerais que la réunion soit plus courte."},{"q":"It is essential that the contract ___ before Friday.","o":["be signed","is signed","was signed","signs"],"e":"Subjonctif passif.","tr":"Il est indispensable que le contrat soit signé avant vendredi."},{"q":"If you mix red and blue, you ___ purple.","o":["get","got","would get","had got"],"e":"Vérité générale → présent.","tr":"Si on mélange du rouge et du bleu, on obtient du violet."},{"q":"Were he to resign, the company ___ a new director.","o":["would need","will need","needed","needs"],"e":"<b>Were + sujet + to V</b> = si jamais → would.","tr":"S'il venait à démissionner, l'entreprise aurait besoin d'un nouveau directeur."},{"q":"If you ___ late, the doors will be closed.","o":["arrive","will arrive","arrived","would arrive"],"e":"Type 1 → présent.","tr":"Si vous arrivez en retard, les portes seront fermées."},{"q":"If we hadn't lost the contract, we ___ more staff last year.","o":["would have hired","will hire","hired","would hire"],"e":"Type 3 (last year).","tr":"Si nous n'avions pas perdu le contrat, nous aurions embauché l'an dernier."},{"q":"Suppose you ___ the lottery, what would you do?","o":["won","win","will win","had won"],"e":"<b>Suppose</b> + prétérit (hypothèse) avec would.","tr":"Imagine que tu gagnes au loto : que ferais-tu ?"},{"q":"If the team ___ the target, everyone will get a bonus.","o":["reaches","will reach","reached","would reach"],"e":"Type 1 → présent.","tr":"Si l'équipe atteint l'objectif, tout le monde aura une prime."},{"q":"If the report were ready, I ___ it to you.","o":["would send","will send","sent","send"],"e":"Type 2 → would.","tr":"Si le rapport était prêt, je vous l'enverrais."},{"q":"Had we known about the strike, we ___ a different route.","o":["would have taken","will take","took","had taken"],"e":"Inversion type 3.","tr":"Si nous avions su pour la grève, nous aurions pris un autre itinéraire."},{"q":"Unless it ___ tomorrow, we will play golf.","o":["rains","will rain","rained","would rain"],"e":"<b>Unless</b> + présent.","tr":"Sauf s'il pleut demain, nous jouerons au golf."},{"q":"If Mr. Ito ___ the meeting, he would know the plan.","o":["had attended","attends","will attend","attend"],"e":"Conditionnel mixte : cause passée (had attended) → conséquence présente (would know).","tr":"Si M. Ito avait assisté à la réunion, il connaîtrait le plan."},{"q":"The manager suggested that the staff ___ a break.","o":["take","takes","took","taking"],"e":"<b>Suggest that</b> + subjonctif.","tr":"Le responsable a suggéré que le personnel fasse une pause."},{"q":"If the hotel is full, we ___ somewhere else.","o":["will stay","would stay","stayed","had stayed"],"e":"Type 1 → will.","tr":"Si l'hôtel est complet, nous dormirons ailleurs."},{"q":"If I ___ rich, I would travel the world.","o":["were","am","will be","had been"],"e":"Type 2 → were.","tr":"Si j'étais riche, je ferais le tour du monde."},{"q":"If you ___ the form online, it will be processed faster.","o":["submit","will submit","submitted","would submit"],"e":"Type 1 → présent.","tr":"Si vous envoyez le formulaire en ligne, il sera traité plus vite."},{"q":"If the supplier had delivered on time, we ___ the order.","o":["would have completed","will complete","completed","would complete"],"e":"Type 3.","tr":"Si le fournisseur avait livré à temps, nous aurions terminé la commande."},{"q":"___ you wish to cancel, please call us 24 hours in advance.","o":["Should","Would","Had","Unless"],"e":"<b>Should you wish</b> = If you wish.","tr":"Si vous souhaitez annuler, appelez-nous 24 heures à l'avance."},{"q":"If we don't hurry, we ___ late.","o":["will be","would be","were","are"],"e":"Type 1 → will.","tr":"Si nous ne nous dépêchons pas, nous serons en retard."},{"q":"If the company were smaller, it ___ more flexible.","o":["would be","will be","is","was"],"e":"Type 2 → would.","tr":"Si l'entreprise était plus petite, elle serait plus souple."},{"q":"I would have bought the car if it ___ cheaper.","o":["had been","was","is","would be"],"e":"« would have bought » → had been.","tr":"J'aurais acheté la voiture si elle avait été moins chère."},{"q":"It's time we ___ a decision.","o":["made","make","will make","making"],"e":"<b>It's time + sujet + prétérit</b>.","tr":"Il est temps que nous prenions une décision."},{"q":"If the lights ___ off, the machine stops automatically.","o":["go","went","will go","would go"],"e":"Type 0 → présent.","tr":"Si la lumière s'éteint, la machine s'arrête automatiquement."},{"q":"If Ms. Park ___ us, we would be very happy.","o":["joined","joins","will join","had joined"],"e":"« would be » → prétérit.","tr":"Si Mme Park nous rejoignait, nous serions ravis."},{"q":"The sale will continue until the stock ___ out.","o":["runs","will run","ran","would run"],"e":"<b>Until</b> + présent pour le futur.","tr":"Les soldes continueront jusqu'à épuisement des stocks."},{"q":"If the budget had been approved, the work ___ in May.","o":["would have started","will start","started","would start"],"e":"Type 3.","tr":"Si le budget avait été approuvé, les travaux auraient commencé en mai."},{"q":"We will offer a refund if the product ___ your expectations.","o":["doesn't meet","won't meet","didn't meet","wouldn't meet"],"e":"Type 1 → présent.","tr":"Nous vous rembourserons si le produit ne répond pas à vos attentes."},{"q":"I'd rather you ___ the report tomorrow.","o":["sent","send","will send","sending"],"e":"<b>I'd rather + sujet + prétérit</b>.","tr":"Je préférerais que vous envoyiez le rapport demain."},{"q":"If he were more careful, he ___ fewer mistakes.","o":["would make","will make","made","makes"],"e":"Type 2 → would.","tr":"S'il était plus soigneux, il ferait moins d'erreurs."},{"q":"If the train had been on time, I ___ the meeting.","o":["wouldn't have missed","won't miss","didn't miss","wouldn't miss"],"e":"Type 3.","tr":"Si le train avait été à l'heure, je n'aurais pas raté la réunion."},{"q":"If you ___ lost, ask a staff member for directions.","o":["get","will get","got","would get"],"e":"Condition réelle + impératif → présent.","tr":"Si vous vous perdez, demandez votre chemin à un employé."},{"q":"Even if it ___, the event will take place.","o":["rains","will rain","rained","would rain"],"e":"<b>Even if</b> + présent.","tr":"Même s'il pleut, l'événement aura lieu."},{"q":"If our prices were lower, we ___ more customers.","o":["would attract","will attract","attracted","attract"],"e":"Type 2 → would.","tr":"Si nos prix étaient plus bas, nous attirerions plus de clients."},{"q":"If the manager had approved the plan, we ___ last month.","o":["would have begun","will begin","began","would begin"],"e":"Type 3.","tr":"Si le responsable avait approuvé le plan, nous aurions commencé le mois dernier."},{"q":"It is necessary that he ___ the documents.","o":["sign","signs","signed","signing"],"e":"Subjonctif → base verbale.","tr":"Il faut qu'il signe les documents."},{"q":"If she ___ the bus, she will be late.","o":["misses","will miss","missed","would miss"],"e":"Type 1 → présent.","tr":"Si elle rate le bus, elle sera en retard."},{"q":"If I ___ a car, I would drive to work.","o":["had","have","will have","would have"],"e":"Type 2 → prétérit.","tr":"Si j'avais une voiture, j'irais au travail en voiture."},{"q":"Only if the board approves ___ the project begin.","o":["will","does","would","has"],"e":"<b>Only if</b> en tête → inversion : will the project begin.","tr":"Le projet ne commencera que si le conseil l'approuve."},{"q":"If the customer had complained, we ___ a refund.","o":["would have offered","will offer","offered","would offer"],"e":"Type 3.","tr":"Si le client s'était plaint, nous aurions proposé un remboursement."},{"q":"If ice ___, it turns into water.","o":["melts","melted","will melt","would melt"],"e":"Type 0 → présent.","tr":"Quand la glace fond, elle devient de l'eau."},{"q":"Unless the problem ___ soon, we will lose customers.","o":["is solved","will be solved","was solved","would be solved"],"e":"<b>Unless</b> + présent passif.","tr":"Si le problème n'est pas vite réglé, nous perdrons des clients."},{"q":"If I were the CEO, I ___ salaries.","o":["would raise","will raise","raised","raise"],"e":"Type 2 → would.","tr":"Si j'étais PDG, j'augmenterais les salaires."},{"q":"Had the product been tested, the problem ___.","o":["would have been found","will be found","was found","had been found"],"e":"Inversion type 3 (passif).","tr":"Si le produit avait été testé, le problème aurait été détecté."},{"q":"If we ___ now, we will arrive before noon.","o":["leave","will leave","left","would leave"],"e":"Type 1 → présent.","tr":"Si nous partons maintenant, nous arriverons avant midi."},{"q":"The doctor recommended that Mr. Ali ___ more.","o":["rest","rests","rested","resting"],"e":"<b>Recommend that</b> + subjonctif.","tr":"Le médecin a recommandé à M. Ali de se reposer davantage."},{"q":"If the software were easier to use, more people ___ it.","o":["would buy","will buy","bought","buy"],"e":"Type 2 → would.","tr":"Si le logiciel était plus simple, plus de gens l'achèteraient."},{"q":"If you had asked me, I ___ you.","o":["would have helped","will help","helped","would help"],"e":"Type 3.","tr":"Si tu me l'avais demandé, je t'aurais aidé."},{"q":"If it ___ sunny, we usually eat lunch outside.","o":["is","was","will be","were"],"e":"Habitude (usually) → type 0, présent.","tr":"Quand il fait beau, nous déjeunons généralement dehors."},{"q":"I wish I ___ to the conference last week.","o":["had gone","went","go","would go"],"e":"<b>I wish</b> + past perfect = regret sur le passé.","tr":"J'aurais aimé aller à la conférence la semaine dernière."},{"q":"In the event that the flight ___ canceled, you will receive a refund.","o":["is","will be","was","would be"],"e":"<b>In the event that</b> + présent.","tr":"Si le vol est annulé, vous serez remboursé."},{"q":"If the company ___ its prices, customers will leave.","o":["raises","will raise","raised","would raise"],"e":"Type 1 → présent.","tr":"Si l'entreprise augmente ses prix, les clients partiront."},{"q":"If we had more space, we ___ a bigger office party.","o":["could organize","can organize","organized","organize"],"e":"Type 2 → could (= would be able to).","tr":"Si nous avions plus de place, nous pourrions organiser une plus grande fête."},{"q":"If the goods had arrived yesterday, we ___ them today.","o":["could ship","can ship","shipped","ship"],"e":"Conditionnel mixte : cause passée → conséquence présente (could).","tr":"Si la marchandise était arrivée hier, nous pourrions l'expédier aujourd'hui."},{"q":"Supposing the client ___ no, what will we do?","o":["says","will say","said","would say"],"e":"« what will we do » → hypothèse réelle → présent.","tr":"Et si le client dit non, que ferons-nous ?"},{"q":"If you ___ the manual, you would know how to use it.","o":["had read","reads","will read","reading"],"e":"Conditionnel mixte : had read (passé) → would know (présent).","tr":"Si tu avais lu le manuel, tu saurais t'en servir."},{"q":"The company would have saved money if it ___ the offer.","o":["had accepted","accepted","accepts","would accept"],"e":"Type 3.","tr":"L'entreprise aurait économisé si elle avait accepté l'offre."},{"q":"If Mr. Brown ___ here, please tell him to call me.","o":["is","will be","were","would be"],"e":"Condition réelle + impératif → présent.","tr":"Si M. Brown est là, dites-lui de m'appeler."},{"q":"If we ___ more staff, we could open on Sundays.","o":["had","have","will have","would have"],"e":"« could » → prétérit.","tr":"Si nous avions plus de personnel, nous pourrions ouvrir le dimanche."},{"q":"If I had known you were busy, I ___.","o":["wouldn't have called","won't call","didn't call","wouldn't call"],"e":"Type 3.","tr":"Si j'avais su que tu étais occupé, je n'aurais pas appelé."},{"q":"It is vital that each employee ___ the training.","o":["complete","completes","completed","completing"],"e":"Subjonctif → base verbale.","tr":"Il est indispensable que chaque employé suive la formation."},{"q":"If they ___ the offer, we will look for another partner.","o":["reject","will reject","rejected","would reject"],"e":"Type 1 → présent.","tr":"S'ils refusent l'offre, nous chercherons un autre partenaire."},{"q":"If the weather were better, the event ___ outdoors.","o":["would be held","will be held","was held","is held"],"e":"Type 2 passif → would be + participe.","tr":"S'il faisait meilleur, l'événement aurait lieu dehors."},{"q":"If the delivery ___ late, we would have canceled the order.","o":["had been","was","is","would be"],"e":"Type 3 → had been.","tr":"Si la livraison avait été en retard, nous aurions annulé la commande."},{"q":"If you ___ the heater on, the room warms up quickly.","o":["turn","turned","will turn","would turn"],"e":"Type 0 → présent.","tr":"Si on allume le chauffage, la pièce se réchauffe vite."},{"q":"Should the machine stop, ___ the technician.","o":["call","calling","to call","called"],"e":"Consigne → impératif.","tr":"Si la machine s'arrête, appelez le technicien."},{"q":"If Mr. Kim ___ in charge, things would be different.","o":["were","is","will be","has been"],"e":"Type 2 → were.","tr":"Si M. Kim était responsable, les choses seraient différentes."},{"q":"If the company had hired more staff, it ___ the busy season better.","o":["would have handled","will handle","handled","would handle"],"e":"Type 3.","tr":"Si l'entreprise avait embauché, elle aurait mieux géré la haute saison."},{"q":"Unless you ___ your ticket, you cannot enter.","o":["show","will show","showed","would show"],"e":"<b>Unless</b> + présent.","tr":"Sans présenter votre billet, vous ne pouvez pas entrer."},{"q":"If we ___ the train, we will take a taxi.","o":["miss","will miss","missed","would miss"],"e":"Type 1 → présent.","tr":"Si nous ratons le train, nous prendrons un taxi."},{"q":"If the project were cheaper, the board ___ it.","o":["would approve","will approve","approved","approves"],"e":"Type 2 → would.","tr":"Si le projet était moins cher, le conseil l'approuverait."},{"q":"The board demanded that the CEO ___.","o":["resign","resigns","resigned","resigning"],"e":"<b>Demand that</b> + subjonctif.","tr":"Le conseil a exigé la démission du PDG."},{"q":"If the report ___ earlier, we would have had time to review it.","o":["had been sent","was sent","is sent","would be sent"],"e":"Type 3 passif.","tr":"Si le rapport avait été envoyé plus tôt, nous aurions eu le temps de le relire."},{"q":"If people ___ enough sleep, they feel tired.","o":["don't get","won't get","didn't get","wouldn't get"],"e":"Type 0 → présent.","tr":"Quand on ne dort pas assez, on se sent fatigué."},{"q":"I would accept the job if the salary ___ higher.","o":["were","is","will be","had been"],"e":"Type 2 → were.","tr":"J'accepterais le poste si le salaire était plus élevé."},{"q":"If you ___ early, you will get a good seat.","o":["arrive","will arrive","arrived","would arrive"],"e":"Type 1 → présent.","tr":"Si vous arrivez tôt, vous aurez une bonne place."},{"q":"Had the weather been better, more people ___.","o":["would have come","will come","came","would come"],"e":"Inversion type 3.","tr":"S'il avait fait meilleur, plus de gens seraient venus."},{"q":"If Ms. Lee ___ French, she could work in Paris.","o":["spoke","speaks","will speak","had spoken"],"e":"« could » → prétérit.","tr":"Si Mme Lee parlait français, elle pourrait travailler à Paris."},{"q":"The meeting will start as soon as the director ___.","o":["arrives","will arrive","arrived","would arrive"],"e":"<b>As soon as</b> + présent.","tr":"La réunion commencera dès l'arrivée du directeur."},{"q":"If the order ___ today, it will arrive on Friday.","o":["is placed","will be placed","was placed","would be placed"],"e":"Type 1 passif → présent.","tr":"Si la commande est passée aujourd'hui, elle arrivera vendredi."},{"q":"If we had booked earlier, we ___ a better price.","o":["would have gotten","will get","got","would get"],"e":"Type 3.","tr":"Si nous avions réservé plus tôt, nous aurions eu un meilleur prix."},{"q":"If you ___ this button, the printer turns on.","o":["press","pressed","will press","would press"],"e":"Type 0 → présent.","tr":"Si vous appuyez sur ce bouton, l'imprimante s'allume."},{"q":"I wish our office ___ closer to the station.","o":["were","is","will be","has been"],"e":"<b>I wish</b> + were.","tr":"J'aimerais que notre bureau soit plus près de la gare."},{"q":"If the company ___ a loss again, it will close the branch.","o":["reports","will report","reported","would report"],"e":"Type 1 → présent.","tr":"Si l'entreprise enregistre encore une perte, elle fermera l'agence."},{"q":"If Mr. Ray were here, he ___ what to do.","o":["would know","will know","knew","knows"],"e":"Type 2 → would.","tr":"Si M. Ray était là, il saurait quoi faire."},{"q":"If the manager had been informed, she ___ the problem.","o":["would have solved","will solve","solved","would solve"],"e":"Type 3.","tr":"Si la responsable avait été informée, elle aurait réglé le problème."},{"q":"It's essential that the data ___ regularly.","o":["be backed up","is backed up","was backed up","backs up"],"e":"Subjonctif passif.","tr":"Il est essentiel que les données soient sauvegardées régulièrement."},{"q":"If the rain ___, we will go for a walk.","o":["stops","will stop","stopped","would stop"],"e":"Type 1 → présent.","tr":"Si la pluie s'arrête, nous irons nous promener."},{"q":"If the company had not advertised, sales ___ lower.","o":["would have been","will be","were","had been"],"e":"Type 3.","tr":"Sans publicité, les ventes auraient été plus faibles."}]},{"id":"finance","group":"vocab","title":"Finance & comptabilité","part":"Part 5","start":101,"rule":"<b>revenue</b> chiffre d'affaires · <b>earnings / profits</b> bénéfices · <b>invoice</b> facture · <b>receipt</b> reçu · <b>refund</b> remboursement · <b>budget</b> · <b>loan</b> prêt · <b>expense report</b> note de frais · <b>shareholder</b> actionnaire.","qs":[{"q":"The company's annual ___ exceeded $2 million.","o":["revenue","invoice","receipt","refund"],"e":"<b>Revenue</b> = chiffre d'affaires. Une facture (invoice) ou un reçu ne « dépasse » pas 2 millions annuellement.","tr":"Le chiffre d'affaires annuel de l'entreprise a dépassé 2 millions de dollars."},{"q":"Please attach the ___ to your expense report.","o":["receipts","budgets","shares","loans"],"e":"On joint les <b>receipts</b> (justificatifs, tickets) à une note de frais.","tr":"Veuillez joindre les justificatifs à votre note de frais."},{"q":"The accounting department will ___ the invoices by Friday.","o":["process","proceed","progress","produce"],"e":"<b>Process an invoice</b> = traiter une facture. « Proceed » est intransitif (proceed with).","tr":"Le service comptable traitera les factures d'ici vendredi."},{"q":"Due to rising costs, the project went over ___.","o":["budget","balance","account","fund"],"e":"Expression figée <b>go over budget</b> = dépasser le budget.","tr":"En raison de la hausse des coûts, le projet a dépassé le budget."},{"q":"Investors were pleased with the company's quarterly ___.","o":["earnings","wages","fees","fares"],"e":"<b>Earnings</b> = bénéfices d'une entreprise. Wages = salaires, fees = honoraires, fares = prix d'un billet.","tr":"Les investisseurs étaient satisfaits des bénéfices trimestriels."},{"q":"The bank approved the ___ for the new equipment.","o":["loan","lend","debt","fare"],"e":"<b>Loan</b> (nom) = prêt. « Lend » est un verbe ; une dette (debt) ne s'« approuve » pas.","tr":"La banque a accordé le prêt pour le nouvel équipement."},{"q":"The company reported a net ___ of $5 million this year.","o":["profit","benefit","wage","fare"],"e":"<b>Net profit</b> = bénéfice net. Faux ami : « benefit » = avantage, pas bénéfice comptable.","tr":"L'entreprise a annoncé un bénéfice net de 5 millions de dollars cette année."},{"q":"Please pay the ___ within 30 days of receipt.","o":["invoice","receipt","revenue","refund"],"e":"On <b>paie une facture</b> (invoice). Receipt = reçu, refund = remboursement.","tr":"Veuillez régler la facture sous 30 jours à réception."},{"q":"The customer asked for a full ___ because the product was defective.","o":["refund","reward","budget","profit"],"e":"<b>Full refund</b> = remboursement intégral.","tr":"Le client a demandé un remboursement intégral car le produit était défectueux."},{"q":"Our accountant will prepare the annual financial ___.","o":["statements","receipts","shares","loans"],"e":"<b>Financial statements</b> = états financiers.","tr":"Notre comptable préparera les états financiers annuels."},{"q":"The company's ___ include buildings, equipment and cash.","o":["assets","debts","expenses","liabilities"],"e":"<b>Assets</b> = actifs (ce que possède l'entreprise). Liabilities = passif, dettes.","tr":"Les actifs de l'entreprise comprennent des bâtiments, du matériel et des liquidités."},{"q":"Travel ___ will be reimbursed by the company.","o":["expenses","incomes","earnings","savings"],"e":"On rembourse des <b>frais</b> : travel expenses.","tr":"Les frais de déplacement seront remboursés par l'entreprise."},{"q":"The firm had to borrow money to pay off its ___.","o":["debts","assets","profits","shares"],"e":"<b>Pay off debts</b> = rembourser ses dettes.","tr":"Le cabinet a dû emprunter pour rembourser ses dettes."},{"q":"Shareholders will receive a ___ of $2 per share.","o":["dividend","deposit","discount","deficit"],"e":"Les actionnaires touchent un <b>dividend</b> par action.","tr":"Les actionnaires recevront un dividende de 2 $ par action."},{"q":"The project was completed under ___, saving the company $10,000.","o":["budget","price","fee","charge"],"e":"<b>Under budget</b> = en dessous du budget prévu.","tr":"Le projet a été achevé sous le budget, faisant économiser 10 000 $."},{"q":"Please ___ the check into the company account.","o":["deposit","withdraw","lend","owe"],"e":"<b>Deposit a check into</b> = déposer un chèque sur un compte.","tr":"Veuillez déposer le chèque sur le compte de l'entreprise."},{"q":"The bank charges a small ___ for international transfers.","o":["fee","fare","fine","salary"],"e":"<b>Fee</b> = frais pour un service. Fare = prix d'un billet, fine = amende.","tr":"La banque prélève de légers frais pour les virements internationaux."},{"q":"The company's stock ___ rose sharply after the announcement.","o":["price","cost","charge","fee"],"e":"<b>Stock price</b> = cours de l'action.","tr":"Le cours de l'action a fortement monté après l'annonce."},{"q":"We need to cut ___ to stay profitable.","o":["costs","incomes","revenues","earnings"],"e":"Pour rester rentable, on <b>réduit les coûts</b> (cut costs).","tr":"Nous devons réduire les coûts pour rester rentables."},{"q":"The ___ report shows a 5% increase in revenue.","o":["quarterly","quarters","quarter","quartered"],"e":"<b>Quarterly report</b> = rapport trimestriel (adjectif).","tr":"Le rapport trimestriel montre une hausse de 5 % du chiffre d'affaires."},{"q":"All purchases over $500 must be ___ by a manager.","o":["authorized","awarded","earned","invested"],"e":"<b>Authorize a purchase</b> = autoriser un achat.","tr":"Tout achat de plus de 500 $ doit être autorisé par un responsable."},{"q":"The company went ___ after years of losses.","o":["bankrupt","wealthy","profitable","solvent"],"e":"<b>Go bankrupt</b> = faire faillite.","tr":"L'entreprise a fait faillite après des années de pertes."},{"q":"Our ___ department handles all payments to suppliers.","o":["accounting","marketing","shipping","security"],"e":"Les paiements relèvent de la <b>comptabilité</b>.","tr":"Notre service comptable gère tous les paiements aux fournisseurs."},{"q":"Customers can pay in monthly ___.","o":["installments","shares","receipts","refunds"],"e":"<b>Pay in installments</b> = payer en plusieurs fois.","tr":"Les clients peuvent payer en mensualités."},{"q":"The ___ for the new building is estimated at $3 million.","o":["cost","fare","fee","wage"],"e":"Le <b>coût</b> d'un bâtiment. Fare/fee/wage ne conviennent pas.","tr":"Le coût du nouveau bâtiment est estimé à 3 millions de dollars."},{"q":"Investors are concerned about the company's falling ___.","o":["revenues","expenses","debts","losses"],"e":"Des investisseurs s'inquiètent d'une <b>baisse du chi ttentes."},{"q":"Please ___ the invoice by the end of the month.","o":["settle","solve","resolve","decide"],"e":"<b>Settle an invoice</b> = régler une facture.","tr":"Veuillez régler la facture avant la fin du mois."},{"q":"The bank ___ interest on savings accounts.","o":["pays","spends","costs","lends"],"e":"La banque <b>verse</b> des intérêts : pay interest.","tr":"La banque verse des intérêts sur les comptes d'épargne."},{"q":"Our ___ department prepares the annual budget.","o":["finance","financial","finances","financially"],"e":"<b>Finance department</b> = service financier (nom composé).","tr":"Notre service financier prépare le budget annuel."},{"q":"The customer requested a ___ for the damaged item.","o":["refund","fund","funding","refinance"],"e":"<b>Refund</b> = remboursement.","tr":"Le client a demandé le remboursement de l'article abîmé."},{"q":"The company is facing a cash-flow ___.","o":["problem","profit","benefit","asset"],"e":"<b>Cash-flow problem</b> = problème de trésorerie.","tr":"L'entreprise rencontre un problème de trésorerie."},{"q":"The store accepts payment by credit card or ___.","o":["cash","cache","cast","case"],"e":"<b>Cash</b> = espèces.","tr":"Le magasin accepte la carte ou les espèces."},{"q":"The accountant found a ___ in the figures.","o":["discrepancy","discount","deposit","dividend"],"e":"<b>Discrepancy</b> = écart, incohérence.","tr":"Le comptable a relevé un écart dans les chiffres."},{"q":"The company ___ $1 million from the bank.","o":["borrowed","lent","loaned","owed"],"e":"Emprunter <b>à</b> la banque → <b>borrow from</b>.","tr":"L'entreprise a emprunté un million de dollars à la banque."},{"q":"The bank ___ the company $1 million.","o":["lent","borrowed","owed","earned"],"e":"La banque <b>prête</b> → lend (lent).","tr":"La banque a prêté un million de dollars à l'entreprise."},{"q":"The company ___ its suppliers $50,000.","o":["owes","owns","earns","spends"],"e":"<b>Owe sb money</b> = devoir de l'argent à qqn.","tr":"L'ent à 4 millions."},{"q":"The treasurer keeps track of all ___.","o":["transactions","transitions","translations","transmissions"],"e":"<b>Transactions</b> = opérations financières.","tr":"Le trésorier suit toutes les opérations."},{"q":"We received ___ for the new project from investors.","o":["funding","founding","finding","fending"],"e":"<b>Funding</b> = financement.","tr":"Nous avons reçu un financement d'investisseurs pour le projet."},{"q":"The company ___ its office building for $2 million.","o":["sold","sole","soul","sell"],"e":"Prétérit de sell → sold.","tr":"L'entreprise a vendu son immeuble de bureaux 2 millions."},{"q":"The price of gold has ___ this week.","o":["soared","sored","sorted","soured"],"e":"<b>Soar</b> = s'envoler (prix).","tr":"Le cours de l'or s'est envolé cette semaine."},{"q":"The company pays its employees on a ___ basis.","o":["monthly","month","months","monthlies"],"e":"<b>On a monthly basis</b> = mensuellement.","tr":"L'entreprise paie ses salariés tous les mois."},{"q":"The bank requires ___ for large loans.","o":["collateral","collection","collapse","colleague"],"e":"<b>Collateral</b> = garantie.","tr":"La banque exige une garantie pour les gros prêts."},{"q":"Please make the check ___ to Brightway Inc.","o":["payable","paid","paying","payment"],"e":"<b>Payable to</b> = à l'ordre de.","tr":"Libellez le chèque à l'ordre de Brightway Inc."},{"q":"The company's ___ has improved this year.","o":["cash flow","cash flows","cash-flowing","cashed flow"],"e":"<b>Cash flow</b> (singulier avec has) = trésorerie.","tr":"La trésorerie de l'entreprise s'est améliorée cette année."},{"q":"The finance team is preparing the ___ forecast.","o":["sales","sale","sold","selling"],"e":"<b>Sales forecast</b> = prévisions de ventes.","tr":"L'équipe financière prépare les prévisions de ventes."},{"q":"The merger will ___ both companies.","o":["benefit","beneficial","beneficiary","benefits"],"e":"Après <b>will</b> → verbe.","tr":"La fusion profitera aux deux ent
