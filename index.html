 été envoyée à tous les clients."},{"q":"The contract ___ by the lawyer before it was signed.","o":["had been reviewed","had reviewed","reviews","is reviewing"],"e":"Antériorité + passif → had been + participe.","tr":"Le contrat avait été relu par l'avocat avant d'être signé."},{"q":"The workshop ___ to Thursday by the organizers.","o":["has been moved","has moved","moves","is moving"],"e":"<b>by the organizers</b> → passif.","tr":"L'atelier a été déplacé à jeudi par les organisateurs."},{"q":"The city was ___ by the heavy snow.","o":["paralyzed","paralyzing","paralyze","paralysis"],"e":"Passif → participe passé.","tr":"La ville a été paralysée par la neige."},{"q":"The new policy ___ well by employees.","o":["has been received","has received","receives","is receiving"],"e":"<b>by employees</b> → passif.","tr":"La nouvelle politique a été bien accueillie par les employés."},{"q":"The team was ___ with the award.","o":["honored","honoring","honor","honors"],"e":"<b>Be honored with</b> = recevoir (une distinction).","tr":"L'équipe a reçu cette distinction."},{"q":"The report ___ into Spanish next week.","o":["will be translated","will translate","translated","translating"],"e":"Le rapport <b>sera traduit</b> → passif futur.","tr":"Le rapport sera traduit en espagnol la semaine prochaine."},{"q":"The goods ___ before they are shipped.","o":["are inspected","inspect","are inspecting","inspected"],"e":"Les marchandises <b>sont inspectées</b> → passif présent.","tr":"Les marchandises sont contrôlées avant expédition."},{"q":"The ___ figures show an increase in sales.","o":["published","publishing","publish","publishes"],"e":"Chiffres <b>publiés</b> → participe passé.","tr":"Les chiffres publiés montrent une hausse des ventes."},{"q":"Ms. Rossi ___ employee of the year.","o":["was voted","voted","has voted","votes"],"e":"<b>Be voted</b> + titre = être élu.","tr":"Mme Rossi a été élue employée de l'année."},{"q":"The lecture was ___; I learned a lot.","o":["fascinating","fascinated","fascinate","fascination"],"e":"La conférence <b>passionne</b> → -ing.","tr":"La conférence était passionnante ; j'ai beaucoup appris."},{"q":"The software ___ to fix the security problem.","o":["has been updated","has updated","updates","is updating"],"e":"Le logiciel <b>a été mis à jour</b> → passif.","tr":"Le logiciel a été mis à jour pour corriger la faille."},{"q":"Guests ___ to check out by 11 A.M.","o":["are requested","request","are requesting","requested"],"e":"<b>Be requested to</b> = être prié de.","tr":"Les clients sont priés de libérer la chambre avant 11 h."},{"q":"The new airport ___ in 2028.","o":["will be completed","will complete","completed","completing"],"e":"L'aéroport <b>sera achevé</b> → passif futur.","tr":"Le nouvel aéroport sera achevé en 2028."},{"q":"The printers ___ on every floor.","o":["can be found","can find","found","finding"],"e":"Modal + passif.","tr":"Des imprimantes se trouvent à chaque étage."},{"q":"The candidates ___ by a panel of experts.","o":["were interviewed","interviewed","have interviewed","are interviewing"],"e":"<b>by a panel</b> → passif.","tr":"Les candidats ont été reçus par un jury d'experts."},{"q":"The ___ goods were returned to the supplier.","o":["rejected","rejecting","reject","rejects"],"e":"Marchandises <b>refusées</b> → participe passé.","tr":"Les marchandises refusées ont été renvoyées au fournisseur."},{"q":"The manager was ___ by the team's results.","o":["encouraged","encouraging","encourage","encouragement"],"e":"Sentiment → -ed.","tr":"Le responsable a été encouragé par les résultats de l'équipe."}]},{"id":"compar","group":"grammar","title":"Comparatifs & quantifieurs","part":"Part 5","start":101,"rule":"Adjectif court : <b>-er than / the -est</b> · long : <b>more … than / the most</b>. Égalité : <b>as … as</b>. <b>The more…, the more…</b>. Dénombrable : <b>many, few, a few</b> · indénombrable : <b>much, little, a little</b>. <b>Each / every</b> + verbe au singulier.","qs":[{"q":"This year's revenue is ___ than last year's.","o":["higher","high","highest","more high"],"e":"<b>than</b> → comparatif. « High » est court → <b>higher</b>.","tr":"Le chiffre d'affaires de cette année est plus élevé que celui de l'an dernier."},{"q":"Of all the candidates, Mr. Silva is the ___ qualified.","o":["most","more","much","many"],"e":"« Of all » + <b>the</b> → <b>superlatif</b>. Qualified est long → the most qualified.","tr":"De tous les candidats, M. Silva est le plus qualifié."},{"q":"There isn't ___ information about the merger yet.","o":["much","many","few","a few"],"e":"<b>Information</b> est <b>indénombrable</b> en anglais (jamais de -s) → much.","tr":"Il n'y a pas encore beaucoup d'informations sur la fusion."},{"q":"___ employees attended the seminar, so it was canceled.","o":["Few","Little","A few","Much"],"e":"<b>Few</b> (sans « a ») = trop peu, sens négatif, cohérent avec l'annulation. « Employees » est dénombrable → pas little/much.","tr":"Trop peu d'employés ont assisté au séminaire, il a donc été annulé."},{"q":"Each of the managers ___ a copy of the report.","o":["receives","receive","receiving","have received"],"e":"<b>Each of</b> + pluriel, mais le verbe s'accorde avec <b>each</b> → <b>singulier</b> (receives).","tr":"Chacun des responsables reçoit une copie du rapport."},{"q":"The new printer is twice as fast ___ the old one.","o":["as","than","like","so"],"e":"Structure <b>as … as</b> (twice as fast as = deux fois plus rapide que).","tr":"La nouvelle imprimante est deux fois plus rapide que l'ancienne."},{"q":"The ___ the project starts, the sooner we will finish.","o":["earlier","early","earliest","more early"],"e":"Structure <b>The + comparatif …, the + comparatif …</b> (plus… plus…). Early → earlier.","tr":"Plus le projet commence tôt, plus vite nous finirons."},{"q":"The new office is ___ than the old one.","o":["bigger","big","biggest","more big"],"e":"<b>than</b> → comparatif ; big (court) → bigger (consonne doublée).","tr":"Le nouveau bureau est plus grand que l'ancien."},{"q":"This is the ___ hotel in the city.","o":["most expensive","more expensive","expensivest","expensive most"],"e":"<b>the … in the city</b> → superlatif ; adjectif long → <b>the most</b>.","tr":"C'est l'hôtel le plus cher de la ville."},{"q":"Our new laptop is ___ powerful than the previous model.","o":["more","most","many","very"],"e":"<b>than</b> + adjectif long → <b>more</b>.","tr":"Notre nouvel ordinateur est plus puissant que le modèle précédent."},{"q":"Ms. Kim is the ___ experienced member of the team.","o":["most","more","much","many"],"e":"<b>the … of the team</b> → superlatif <b>the most</b>.","tr":"Mme Kim est la personne la plus expérimentée de l'équipe."},{"q":"We have ___ time to finish the project, so we must hurry.","o":["little","few","a few","many"],"e":"Time est indénombrable ; sens négatif (il faut se dépêcher) → <b>little</b>.","tr":"Nous avons peu de temps pour finir le projet, il faut se dépêcher."},{"q":"There are only ___ seats left for the concert.","o":["a few","a little","much","little"],"e":"Seats = dénombrable ; « only » + petit nombre → <b>a few</b>.","tr":"Il ne reste que quelques places pour le concert."},{"q":"The weather today is ___ worse than yesterday.","o":["much","many","more","very"],"e":"Pour renforcer un comparatif → <b>much</b> (bien pire). « Very » ne modifie pas un comparatif.","tr":"Le temps est bien pire aujourd'hui qu'hier."},{"q":"This model is not as expensive ___ the others.","o":["as","than","like","so"],"e":"Structure <b>(not) as … as</b>.","tr":"Ce modèle n'est pas aussi cher que les autres."},{"q":"The second quarter was the ___ successful in the company's history.","o":["most","more","much","best"],"e":"Superlatif d'un adjectif long → <b>the most successful</b>.","tr":"Le deuxième trimestre a été le plus réussi de l'histoire de l'entreprise."},{"q":"Could you speak a little ___? I can't hear you.","o":["louder","loud","loudest","more loud"],"e":"Comparaison implicite (plus fort qu'actuellement) → <b>louder</b>.","tr":"Pourriez-vous parler un peu plus fort ? Je ne vous entends pas."},{"q":"The company hired ___ new employees this year than last year.","o":["fewer","less","little","few"],"e":"<b>than</b> + nom <b>dénombrable</b> (employees) → <b>fewer</b>.","tr":"L'entreprise a embauché moins de salariés cette année que l'an dernier."},{"q":"There is ___ traffic on weekends than on weekdays.","o":["less","fewer","few","many"],"e":"<b>than</b> + nom <b>indénombrable</b> (traffic) → <b>less</b>.","tr":"Il y a moins de circulation le week-end qu'en semaine."},{"q":"Both candidates are qualified, but Ms. Tan is the ___ of the two.","o":["better","best","good","well"],"e":"En anglais soigné, pour comparer <b>deux</b> éléments : <b>the better of the two</b>.","tr":"Les deux candidats sont qualifiés, mais Mme Tan est la meilleure des deux."},{"q":"___ employees in the department have completed the training.","o":["All","Every","Each","Much"],"e":"Nom pluriel + verbe pluriel (have) → <b>All</b>. Every/Each exigent un singulier.","tr":"Tous les employés du service ont suivi la formation."},{"q":"The new design is ___ to the old one.","o":["similar","same","alike","like"],"e":"<b>Similar to</b> = semblable à. On dit « the same as », « alike » sans complément.","tr":"Le nouveau design ressemble à l'ancien."},{"q":"Our prices are the ___ in the region.","o":["lowest","lower","low","most low"],"e":"<b>the … in the region</b> → superlatif ; low → <b>lowest</b>.","tr":"Nos prix sont les plus bas de la région."},{"q":"The more you practice, the ___ you become.","o":["better","best","good","well"],"e":"<b>The more …, the + comparatif</b> → better.","tr":"Plus vous vous entraînez, meilleur vous devenez."},{"q":"This year's conference was ___ larger than last year's.","o":["far","very","more","most"],"e":"<b>Far</b> + comparatif = beaucoup plus.","tr":"La conférence de cette année était bien plus grande que celle de l'an dernier."},{"q":"There isn't ___ room in the storage area.","o":["enough","many","few","several"],"e":"Room (espace) est indénombrable → <b>enough</b>. Many/few/several exigent un pluriel.","tr":"Il n'y a pas assez de place dans la zone de stockage."},{"q":"___ of the two proposals was accepted.","o":["Neither","None","Nobody","No"],"e":"Deux éléments → <b>Neither of</b>. « None » s'emploie pour trois ou plus.","tr":"Aucune des deux propositions n'a été acceptée."},{"q":"The factory produces ___ cars as it did last year.","o":["as many","as much","so much","more"],"e":"Égalité avec un dénombrable (cars) → <b>as many … as</b>.","tr":"L'usine produit autant de voitures que l'an dernier."},{"q":"The train is ___ than the bus.","o":["faster","fast","fastest","more fast"],"e":"<b>than</b> + adjectif court → <b>faster</b>.","tr":"Le train est plus rapide que le bus."},{"q":"Ms. Diaz works ___ than anyone else in the office.","o":["harder","hard","hardest","more hardly"],"e":"Comparatif de l'adverbe <b>hard</b> → <b>harder</b>. « Hardly » = à peine.","tr":"Mme Diaz travaille plus dur que quiconque au bureau."},{"q":"The results were not as good ___ we had hoped.","o":["as","than","so","that"],"e":"Structure <b>not as … as</b>.","tr":"Les résultats n'ont pas été aussi bons que nous l'espérions."},{"q":"This is by far the ___ product we have ever launched.","o":["most innovative","more innovative","innovativest","innovative"],"e":"<b>by far the … ever</b> → superlatif.","tr":"C'est de loin le produit le plus innovant que nous ayons jamais lancé."},{"q":"___ information is available on our website.","o":["Further","Farther","Many","Few"],"e":"<b>Further</b> = supplémentaire. « Farther » concerne la distance ; information est indénombrable.","tr":"Des informations complémentaires sont disponibles sur notre site."},{"q":"Mr. Otto has ___ experience than the other applicants.","o":["more","many","much","most"],"e":"<b>than</b> → comparatif <b>more</b>.","tr":"M. Otto a plus d'expérience que les autres candidats."},{"q":"We received ___ complaints this month than last month.","o":["fewer","less","little","much"],"e":"Complaints est dénombrable → <b>fewer</b>.","tr":"Nous avons reçu moins de réclamations ce mois-ci que le mois dernier."},{"q":"The hotel offers ___ rooms with a sea view.","o":["several","much","a little","every"],"e":"Nom pluriel dénombrable → <b>several</b>.","tr":"L'hôtel propose plusieurs chambres avec vue sur la mer."},{"q":"The meeting lasted ___ longer than expected.","o":["slightly","very","most","many"],"e":"Un adverbe comme <b>slightly</b> peut modifier un comparatif ; « very » non.","tr":"La réunion a duré un peu plus longtemps que prévu."},{"q":"The company's profits this year were ___ than ever before.","o":["higher","high","highest","more higher"],"e":"<b>than</b> → comparatif simple ; jamais « more higher ».","tr":"Les bénéfices de cette année ont été plus élevés que jamais."},{"q":"It was the ___ decision the board had ever made.","o":["worst","worse","bad","baddest"],"e":"Superlatif irrégulier de bad → <b>the worst</b>.","tr":"C'était la pire décision que le conseil ait jamais prise."},{"q":"Most ___ prefer flexible working hours.","o":["employees","employee","of employees","the employee"],"e":"<b>Most + nom pluriel</b> (sans « of » ni article).","tr":"La plupart des employés préfèrent les horaires flexibles."},{"q":"The new printer is ___ as efficient as the old one.","o":["twice","two","double","second"],"e":"<b>Twice as … as</b> = deux fois plus … que.","tr":"La nouvelle imprimante est deux fois plus efficace que l'ancienne."},{"q":"Every ___ must wear a badge.","o":["visitor","visitors","of visitors","the visitors"],"e":"<b>Every + nom singulier</b>.","tr":"Chaque visiteur doit porter un badge."},{"q":"The price of oil has become ___ unstable.","o":["increasingly","increasing","increase","increased"],"e":"Adverbe devant un adjectif : <b>increasingly</b> = de plus en plus.","tr":"Le prix du pétrole est devenu de plus en plus instable."},{"q":"We need ___ more volunteers for the event.","o":["a few","a little","much","little"],"e":"Volunteers = dénombrable → <b>a few more</b>.","tr":"Il nous faut quelques bénévoles de plus pour l'événement."},{"q":"This route is ___ than the highway.","o":["shorter","short","shortest","more shorter"],"e":"<b>than</b> → <b>shorter</b>.","tr":"Cet itinéraire est plus court que l'autoroute."},{"q":"Ms. Lang is ___ of all the managers.","o":["the most organized","more organized","the more organized","organizedest"],"e":"<b>of all</b> → superlatif avec <b>the most</b>.","tr":"Mme Lang est la plus organisée de tous les responsables."},{"q":"Only a ___ money is left in the budget.","o":["little","few","many","several"],"e":"Money est indénombrable → <b>a little</b>.","tr":"Il ne reste qu'un peu d'argent dans le budget."},{"q":"The report was ___ detailed than I expected.","o":["less","fewer","least","little"],"e":"<b>than</b> + adjectif → <b>less</b> (moins).","tr":"Le rapport était moins détaillé que prévu."},{"q":"The weather was ___ nice that we had lunch outside.","o":["so","such","too","very"],"e":"<b>so + adjectif + that</b> = si … que.","tr":"Il faisait si beau que nous avons déjeuné dehors."},{"q":"It was ___ a successful event that we will repeat it next year.","o":["such","so","too","very"],"e":"<b>such + a + adjectif + nom + that</b>.","tr":"C'était un événement tellement réussi que nous le referons l'an prochain."},{"q":"The box is too heavy ___ one person to carry.","o":["for","to","of","with"],"e":"<b>too + adjectif + for + personne + to</b>.","tr":"Le carton est trop lourd pour qu'une personne le porte seule."},{"q":"Ms. Reed is not old ___ to retire yet.","o":["enough","too","so","very"],"e":"<b>adjectif + enough + to</b> (enough se place après l'adjectif).","tr":"Mme Reed n'est pas encore assez âgée pour prendre sa retraite."},{"q":"The seminar was ___ long for most participants.","o":["too","enough","so much","such"],"e":"<b>too + adjectif</b> = trop.","tr":"Le séminaire était trop long pour la plupart des participants."},{"q":"Almost ___ employee took part in the survey.","o":["every","all","each of","most"],"e":"Nom <b>singulier</b> → <b>every</b> (almost every = presque chaque).","tr":"Presque tous les employés ont répondu à l'enquête."},{"q":"Neither option is ___ than the other.","o":["cheaper","cheap","cheapest","more cheaper"],"e":"<b>than</b> → <b>cheaper</b>.","tr":"Aucune des deux options n'est moins chère que l'autre."},{"q":"This is one of the ___ cities in Europe.","o":["oldest","older","old","most old"],"e":"<b>one of the + superlatif + pluriel</b>.","tr":"C'est l'une des villes les plus anciennes d'Europe."},{"q":"The company has ___ customers in Asia than in Europe.","o":["more","much","most","many"],"e":"<b>than</b> → comparatif <b>more</b>.","tr":"L'entreprise a plus de clients en Asie qu'en Europe."},{"q":"The new process is not ___ complicated as the old one.","o":["as","more","so much","such"],"e":"Structure <b>not as … as</b>.","tr":"Le nouveau processus n'est pas aussi compliqué que l'ancien."},{"q":"Sales rose ___ in May than in April.","o":["more quickly","most quickly","quickly","more quick"],"e":"Comparatif d'un adverbe en -ly → <b>more quickly</b>.","tr":"Les ventes ont augmenté plus rapidement en mai qu'en avril."},{"q":"___ of the staff members were invited to the dinner.","o":["All","Every","Each","Much"],"e":"Verbe au pluriel (were) → <b>All of</b>.","tr":"Tous les membres du personnel ont été invités au dîner."},{"q":"The new laptop is ___ than the old one.","o":["lighter","light","lightest","more light"],"e":"<b>than</b> + adjectif court → -er.","tr":"Le nouvel ordinateur est plus léger que l'ancien."},{"q":"This is the ___ building in the city.","o":["tallest","taller","tall","most tall"],"e":"<b>the … in</b> → superlatif.","tr":"C'est le plus haut bâtiment de la ville."},{"q":"The second hotel was ___ comfortable than the first.","o":["more","most","much","very"],"e":"Adjectif long + <b>than</b> → more.","tr":"Le second hôtel était plus confortable que le premier."},{"q":"Mr. Kim is the ___ senior member of the team.","o":["most","more","much","many"],"e":"<b>the … of the team</b> → superlatif.","tr":"M. Kim est le membre le plus ancien de l'équipe."},{"q":"We don't have ___ information about the project.","o":["much","many","few","a few"],"e":"Information = indénombrable → <b>much</b>.","tr":"Nous n'avons pas beaucoup d'informations sur le projet."},{"q":"There were ___ people at the meeting than expected.","o":["fewer","less","little","few"],"e":"Dénombrable + than → <b>fewer</b>.","tr":"Il y avait moins de monde que prévu à la réunion."},{"q":"The new model uses ___ energy than the previous one.","o":["less","fewer","few","many"],"e":"Indénombrable + than → <b>less</b>.","tr":"Le nouveau modèle consomme moins d'énergie que le précédent."},{"q":"The weather is ___ better today.","o":["much","very","more","most"],"e":"Renforcer un comparatif → <b>much</b>.","tr":"Il fait bien meilleur aujourd'hui."},{"q":"Our sales are as high ___ last year.","o":["as","than","like","so"],"e":"<b>as … as</b>.","tr":"Nos ventes sont aussi élevées que l'an dernier."},{"q":"Of all the options, this is the ___ expensive.","o":["least","less","little","fewer"],"e":"Superlatif d'infériorité → <b>the least</b>.","tr":"De toutes les options, c'est la moins chère."},{"q":"The train is ___ faster than the bus.","o":["much","very","more","many"],"e":"Renforcer un comparatif → <b>much</b>.","tr":"Le train est bien plus rapide que le bus."},{"q":"___ of the employees work from home on Fridays.","o":["Many","Much","Every","Each"],"e":"Pluriel dénombrable + verbe pluriel → <b>Many</b>.","tr":"Beaucoup d'employés télétravaillent le vendredi."},{"q":"There is ___ milk left in the fridge.","o":["little","few","many","several"],"e":"Indénombrable → <b>little</b>.","tr":"Il reste peu de lait dans le frigo."},{"q":"I need ___ more minutes to finish.","o":["a few","a little","much","little"],"e":"Minutes = dénombrable → <b>a few</b>.","tr":"J'ai besoin de quelques minutes de plus pour finir."},{"q":"This year's profits were the ___ in the company's history.","o":["highest","higher","high","most high"],"e":"Superlatif → highest.","tr":"Les bénéfices de cette année sont les plus élevés de l'histoire de l'entreprise."},{"q":"The new office is twice ___ big as the old one.","o":["as","so","than","more"],"e":"<b>twice as … as</b>.","tr":"Le nouveau bureau est deux fois plus grand que l'ancien."},{"q":"Ms. Tan is ___ than her colleagues.","o":["more experienced","most experienced","experienceder","more experience"],"e":"Adjectif long + than → <b>more experienced</b>.","tr":"Mme Tan est plus expérimentée que ses collègues."},{"q":"The more we sell, the ___ we earn.","o":["more","most","much","many"],"e":"<b>The more …, the more …</b>.","tr":"Plus nous vendons, plus nous gagnons."},{"q":"This software is ___ easier to use than the old version.","o":["far","very","so","too"],"e":"<b>Far</b> + comparatif = bien plus.","tr":"Ce logiciel est bien plus simple que l'ancienne version."},{"q":"The meeting was ___ productive than last week's.","o":["less","fewer","least","little"],"e":"Adjectif + than → <b>less</b>.","tr":"La réunion a été moins productive que celle de la semaine dernière."},{"q":"___ employee must attend the training.","o":["Each","All","Both","Most"],"e":"Nom singulier → <b>Each</b>.","tr":"Chaque employé doit suivre la formation."},{"q":"Both options are good, but the first one is ___ than the second.","o":["cheaper","cheapest","cheap","more cheap"],"e":"<b>than</b> → cheaper.","tr":"Les deux options sont bonnes, mais la première est moins chère que la seconde."},{"q":"The room was too small ___ the whole team.","o":["for","to","of","by"],"e":"<b>too + adj + for</b> + nom.","tr":"La salle était trop petite pour toute l'équipe."},{"q":"Is the hotel close ___ to walk to?","o":["enough","too","so","very"],"e":"<b>adjectif + enough + to</b>.","tr":"L'hôtel est-il assez proche pour y aller à pied ?"},{"q":"The presentation was ___ interesting that nobody left early.","o":["so","such","too","very"],"e":"<b>so + adjectif + that</b>.","tr":"La présentation était si intéressante que personne n'est parti tôt."},{"q":"They are ___ good employees that we want to keep them.","o":["such","so","too","very"],"e":"<b>such + adjectif + nom pluriel + that</b>.","tr":"Ce sont de si bons employés que nous voulons les garder."},{"q":"The price is ___ high for our budget.","o":["too","enough","so much","such"],"e":"<b>too + adjectif</b> = trop.","tr":"Le prix est trop élevé pour notre budget."},{"q":"The printer is ___ the fastest one we have.","o":["by far","very","too","so much"],"e":"<b>By far</b> + superlatif = de loin.","tr":"Cette imprimante est de loin la plus rapide que nous ayons."},{"q":"___ of the applicants were qualified.","o":["Few","Little","Much","Every"],"e":"Pluriel + were → <b>Few</b>.","tr":"Peu de candidats étaient qualifiés."},{"q":"The new plan is ___ than the old one.","o":["better","best","good","well"],"e":"Comparatif de good → <b>better</b>.","tr":"Le nouveau plan est meilleur que l'ancien."},{"q":"This is the ___ report I have ever read.","o":["clearest","clearer","clear","most clear"],"e":"<b>the … ever</b> → superlatif.","tr":"C'est le rapport le plus clair que j'aie jamais lu."},{"q":"Our store is ___ from the station than theirs.","o":["farther","far","farthest","more far"],"e":"Comparatif de far → <b>farther</b>.","tr":"Notre magasin est plus loin de la gare que le leur."},{"q":"Ms. Lee arrived ___ than everyone else.","o":["earlier","early","earliest","more early"],"e":"Comparatif de early → <b>earlier</b>.","tr":"Mme Lee est arrivée plus tôt que tout le monde."},{"q":"The CEO spoke ___ than usual.","o":["more slowly","slowlier","most slowly","slow"],"e":"Adverbe en -ly → <b>more slowly</b>.","tr":"Le PDG a parlé plus lentement que d'habitude."},{"q":"There aren't ___ chairs for everyone.",  la voiture la plus fiable que nous ayons eue."},{"q":"___ of the money was spent on training.","o":["Half","Halves","A half","Halfs"],"e":"<b>Half of</b> = la moitié de.","tr":"La moitié de l'argent a été consacrée à la formation."},{"q":"The factory now produces ___ as many units as last year.","o":["twice","two","double","second"],"e":"<b>twice as many … as</b>.","tr":"L'usine produit désormais deux fois plus d'unités que l'an dernier."},{"q":"The second option is ___ the more expensive of the two.","o":["by far","very","too","so"],"e":"<b>By far</b> + the + comparatif (deux éléments).","tr":"La seconde option est de loin la plus chère des deux."},{"q":"Mr. Park is not ___ experienced as Ms. Lee.","o":["as","so much","more","such"],"e":"<b>not as … as</b>.","tr":"M. Park n'est pas aussi expérimenté que Mme Lee."},{"q":"The company hired ___ new staff this year.","o":["several","much","a little","every"],"e":"Staff (ici pluriel de personnes) → <b>several</b>.","tr":"L'entreprise a embauché plusieurs personnes cette année."},{"q":"This is the ___ of the two routes.","o":["shorter","shortest","short","more short"],"e":"Deux éléments → <b>the + comparatif</b> (anglais soigné).","tr":"C'est le plus court des deux itinéraires."},{"q":"The meeting ended ___ than we had planned.","o":["sooner","soonest","soon","more soon"],"e":"<b>than</b> → sooner.","tr":"La réunion s'est terminée plus tôt que prévu."},{"q":"The weather was ___ cold that the event was canceled.","o":["so","such","too","enough"],"e":"<b>so + adj + that</b>.","tr":"Il faisait si froid que l'événement a été annulé."},{"q":"There was ___ a crowd that we couldn't get in.","o":["such","so","too","very"],"e":"<b>such a + nom + that</b>.","tr":"Il y avait une telle foule que nous n'avons pas pu entrer."},{"q":"The tickets were ___ expensive for students.","o":["too","enough","such","so much"],"e":"<b>too + adj + for</b>.","tr":"Les billets étaient trop chers pour les étudiants."},{"q":"We have ___ supplies to last the month.","o":["enough","too","so","such"],"e":"<b>Enough</b> + nom + to.","tr":"Nous avons assez de fournitures pour tenir le mois."},{"q":"The results were ___ good as last year's.","o":["just as","just so","just than","just more"],"e":"<b>just as … as</b> = tout aussi … que.","tr":"Les résultats ont été tout aussi bons que l'an dernier."},{"q":"The more complex the task, the ___ it takes.","o":["longer","longest","long","more long"],"e":"<b>The …, the + comparatif</b>.","tr":"Plus la tâche est complexe, plus elle prend du temps."},{"q":"Most of the staff ___ the new policy.","o":["support","supports","supporting","has supported"],"e":"<b>Most of the staff</b> (personnes) → verbe pluriel.","tr":"La plupart du personnel soutient la nouvelle politique."},{"q":"The printer is ___ older than the computer.","o":["even","very","so","too"],"e":"<b>Even</b> + comparatif.","tr":"L'imprimante est encore plus vieille que l'ordinateur."},{"q":"Only ___ employees attended the party.","o":["a handful of","a handful","handful of","handfuls"],"e":"<b>A handful of</b> = une poignée de.","tr":"Seule une poignée d'employés est venue à la fête."},{"q":"The new plan is ___ better than the old one.","o":["a great deal","a great deal of","great deal","many"],"e":"<b>A great deal</b> + comparatif.","tr":"Le nouveau plan est bien meilleur que l'ancien."},{"q":"This is the ___ popular product in our range.","o":["most","more","much","many"],"e":"Superlatif → the most.","tr":"C'est le produit le plus populaire de notre gamme."},{"q":"The flight was ___ more expensive than the train.","o":["far","very","so","too"],"e":"<b>Far more</b> = bien plus.","tr":"L'avion était bien plus cher que le train."},{"q":"The company has ___ employees than any other firm in the city.","o":["more","most","many","much"],"e":"<b>than any other</b> → comparatif.","tr":"L'entreprise emploie plus de monde que toute autre société de la ville."},{"q":"The ___ the weather, the more people come to the beach.","o":["warmer","warmest","warm","more warm"],"e":"<b>The + comparatif …, the more …</b>.","tr":"Plus il fait chaud, plus il y a de monde à la plage."}]},{"id":"relat","group":"grammar","title":"Pronoms relatifs","part":"Part 5","start":101,"rule":"<b>who</b> = personne sujet · <b>whom</b> = personne complément (souvent après préposition) · <b>which</b> = chose · <b>whose</b> = dont (+ nom) · <b>where</b> = lieu · <b>what</b> = ce que/ce qui. Après une virgule, jamais <b>that</b>.","qs":[{"q":"The engineer ___ designed the bridge will give a talk.","o":["who","which","whose","whom"],"e":"Antécédent = <b>personne</b> (engineer), sujet de « designed » → <b>who</b>.","tr":"L'ingénieur qui a conçu le pont donnera une conférence."},{"q":"The client ___ order was delayed has been refunded.","o":["whose","who","which","that"],"e":"Relation de possession (la commande <b>du</b> client) + nom juste après → <b>whose</b>.","tr":"Le client dont la commande a été retardée a été remboursé."},{"q":"This is the hotel ___ we stayed during the conference.","o":["where","which","when","what"],"e":"Antécédent = <b>lieu</b> et la relative est complète (we stayed) → <b>where</b>.","tr":"C'est l'hôtel où nous avons séjourné pendant la conférence."},{"q":"The report, ___ was published yesterday, contains several errors.","o":["which","that","who","what"],"e":"Relative <b>entre virgules</b> (non restrictive) sur une chose → <b>which</b>. « That » est interdit après une virgule.","tr":"Le rapport, qui a été publié hier, contient plusieurs erreurs."},{"q":"___ you need is a valid passport.","o":["What","That","Which","Who"],"e":"Pas d'antécédent : « <b>ce dont</b> vous avez besoin » → <b>What</b>.","tr":"Ce dont vous avez besoin, c'est d'un passeport valide."},{"q":"The person to ___ you should address your complaint is Ms. Rossi.","o":["whom","who","whose","which"],"e":"Après une <b>préposition</b> (to) et pour une personne → <b>whom</b>.","tr":"La personne à qui vous devez adresser votre réclamation est Mme Rossi."},{"q":"The company ___ I work for is based in Lyon.","o":["that","who","whose","where"],"e":"Antécédent = chose (company), complément de « work for » → <b>that</b> (ou which).","tr":"L'entreprise pour laquelle je travaille est basée à Lyon."},{"q":"Ms. Kent, ___ joined the firm last year, was promoted.","o":["who","which","that","whom"],"e":"Personne, sujet, entre virgules → <b>who</b>.","tr":"Mme Kent, arrivée dans le cabinet l'an dernier, a été promue."},{"q":"The product ___ we launched last month is selling well.","o":["which","who","whose","where"],"e":"Chose, complément de « launched » → <b>which</b>.","tr":"Le produit que nous avons lancé le mois dernier se vend bien."},{"q":"The city ___ the conference will be held is Berlin.","o":["where","which","who","whose"],"e":"Lieu + relative complète → <b>where</b>.","tr":"La ville où se tiendra la conférence est Berlin."},{"q":"The manager ___ car was damaged filed a report.","o":["whose","who","which","whom"],"e":"Possession + nom (car) → <b>whose</b>.","tr":"Le responsable dont la voiture a été endommagée a déposé un rapport."},{"q":"I don't understand ___ he said.","o":["what","that","which","who"],"e":"Pas d'antécédent : « ce que » → <b>what</b>.","tr":"Je ne comprends pas ce qu'il a dit."},{"q":"The day ___ the store opened was very busy.","o":["when","where","which","who"],"e":"Antécédent de <b>temps</b> + relative complète → <b>when</b>.","tr":"Le jour de l'ouverture du magasin a été très chargé."},{"q":"The applicants ___ we interviewed were all qualified.","o":["whom","whose","which","where"],"e":"Personnes, complément de « interviewed » → <b>whom</b>.","tr":"Les candidats que nous avons reçus étaient tous qualifiés."},{"q":"This is the reason ___ the project was delayed.","o":["why","which","where","what"],"e":"<b>The reason why</b> = la raison pour laquelle.","tr":"C'est la raison pour laquelle le projet a pris du retard."},{"q":"The printer, ___ is very old, often breaks down.","o":["which","that","who","what"],"e":"Chose, entre virgules → <b>which</b> (jamais that).","tr":"L'imprimante, qui est très ancienne, tombe souvent en panne."},{"q":"Anyone ___ needs help should contact the IT department.","o":["who","which","whose","whom"],"e":"Personne, sujet de « needs » → <b>who</b>.","tr":"Toute personne ayant besoin d'aide doit contacter le service informatique."},{"q":"The building in ___ our office is located is being renovated.","o":["which","that","where","what"],"e":"Après une <b>préposition</b>, pour une chose → <b>which</b> (jamais « in that »).","tr":"Le bâtiment dans lequel se trouve notre bureau est en rénovation."},{"q":"The client with ___ I spoke yesterday placed an order.","o":["whom","who","which","whose"],"e":"Après une <b>préposition</b>, pour une personne → <b>whom</b>.","tr":"Le client avec qui j'ai parlé hier a passé commande."},{"q":"Mr. Dunn is the engineer ___ designed the new engine.","o":["who","whom","which","whose"],"e":"Personne, <b>sujet</b> de « designed » → <b>who</b>.","tr":"M. Dunn est l'ingénieur qui a conçu le nouveau moteur."},{"q":"The report ___ you requested is attached.","o":["that","who","what","where"],"e":"Chose, complément → <b>that</b>.","tr":"Le rapport que vous avez demandé est en pièce jointe."},{"q":"The company, ___ headquarters are in Paris, has 5,000 employees.","o":["whose","which","who","that"],"e":"Le siège <b>de</b> l'entreprise → <b>whose</b> (s'emploie aussi pour les choses).","tr":"L'entreprise, dont le siège est à Paris, compte 5 000 salariés."},{"q":"Please tell me ___ you need for the meeting.","o":["what","which","that","who"],"e":"« ce dont » sans antécédent → <b>what</b>.","tr":"Dites-moi ce dont vous avez besoin pour la réunion."},{"q":"The hotel ___ we booked has a swimming pool.","o":["which","where","who","whose"],"e":"« booked » a besoin d'un complément (on réserve l'hôtel) → <b>which</b>, pas where.","tr":"L'hôtel que nous avons réservé a une piscine."},{"q":"The employees, most of ___ work part-time, received a bonus.","o":["whom","who","which","them"],"e":"<b>most of whom</b> (personnes) : après « of », on utilise whom.","tr":"Les employés, dont la plupart sont à temps partiel, ont reçu une prime."},{"q":"The period ___ sales were highest was December.","o":["when","which","where","who"],"e":"Antécédent de temps → <b>when</b>.","tr":"La période où les ventes ont été les plus fortes était décembre."},{"q":"The candidate ___ references were excellent got the job.","o":["whose","who","which","whom"],"e":"Les références <b>du</b> candidat → <b>whose</b>.","tr":"Le candidat dont les références étaient excellentes a obtenu le poste."},{"q":"The café ___ we usually have lunch is closed today.","o":["where","which","when","what"],"e":"Lieu + relative complète → <b>where</b>.","tr":"Le café où nous déjeunons d'habitude est fermé aujourd'hui."},{"q":"Is there anything ___ I can do to help?","o":["that","what","who","where"],"e":"Après <b>anything / everything / something</b> → <b>that</b>.","tr":"Y a-t-il quelque chose que je puisse faire pour aider ?"},{"q":"The new policy, ___ was introduced last month, has been successful.","o":["which","that","what","who"],"e":"Entre virgules, chose → <b>which</b>.","tr":"La nouvelle politique, introduite le mois dernier, est un succès."},{"q":"The supplier from ___ we buy our paper has raised its prices.","o":["whom","who","that","where"],"e":"Après la préposition <b>from</b>, personne/organisation → <b>whom</b>.","tr":"Le fournisseur auprès duquel nous achetons notre papier a augmenté ses prix."},{"q":"___ happened at the meeting surprised everyone.","o":["What","That","Which","Who"],"e":"« Ce qui » sans antécédent → <b>What</b>.","tr":"Ce qui s'est passé à la réunion a surpris tout le monde."},{"q":"The team ___ won the award will be honored at dinner.","o":["that","whose","where","what"],"e":"Groupe, sujet de « won » → <b>that</b>.","tr":"L'équipe qui a remporté le prix sera honorée au dîner."},{"q":"Ms. Park, ___ I met at the conference, called me today.","o":["whom","which","whose","where"],"e":"Personne, complément de « met », entre virgules → <b>whom</b>.","tr":"Mme Park, que j'ai rencontrée à la conférence, m'a appelé aujourd'hui."},{"q":"The documents ___ were on the table have disappeared.","o":["that","who","what","where"],"e":"Choses, sujet de « were » → <b>that</b>.","tr":"Les documents qui étaient sur la table ont disparu."},{"q":"The year ___ the company was founded was 1985.","o":["when","where","which","who"],"e":"Antécédent de temps → <b>when</b>.","tr":"L'année de fondation de l'entreprise est 1985."},{"q":"The museum, ___ attracts millions of visitors, is closed on Mondays.","o":["which","that","who","where"],"e":"Entre virgules, chose, sujet → <b>which</b>.","tr":"Le musée, qui attire des millions de visiteurs, est fermé le lundi."},{"q":"The engineer ___ proposal was chosen will lead the project.","o":["whose","who","whom","which"],"e":"La proposition <b>de</b> l'ingénieur → <b>whose</b>.","tr":"L'ingénieur dont la proposition a été retenue dirigera le projet."},{"q":"This is exactly ___ I was looking for.","o":["what","which","that","where"],"e":"« ce que » sans antécédent → <b>what</b>.","tr":"C'est exactement ce que je cherchais."},{"q":"The town ___ Ms. Silva grew up is near the coast.","o":["where","which","when","whose"],"e":"Lieu + « grew up » (intransitif) → <b>where</b>.","tr":"La ville où Mme Silva a grandi est près de la côte."},{"q":"The machines, some of ___ are 20 years old, need to be replaced.","o":["which","them","that","who"],"e":"<b>some of which</b> (choses).","tr":"Les machines, dont certaines ont 20 ans, doivent être remplacées."},{"q":"Employees ___ want to take part in the race should register.","o":["who","which","whose","whom"],"e":"Personnes, sujet → <b>who</b>.","tr":"Les employés qui veulent participer à la course doivent s'inscrire."},{"q":"The e-mail ___ I sent you contains the schedule.","o":["that","who","what","where"],"e":"Chose, complément de « sent » → <b>that</b>.","tr":"L'e-mail que je vous ai envoyé contient le planning."},{"q":"The person ___ you should contact is Mr. Hale.","o":["whom","whose","which","where"],"e":"Personne, complément de « contact » → <b>whom</b>.","tr":"La personne à contacter est M. Hale."},{"q":"The store sells everything ___ you need for camping.","o":["that","what","who","where"],"e":"Après <b>everything</b> → <b>that</b>.","tr":"Le magasin vend tout ce dont vous avez besoin pour le camping."},{"q":"The laptop ___ battery is broken must be repaired.","o":["whose","which","that","who"],"e":"La batterie <b>de</b> l'ordinateur → <b>whose</b>.","tr":"L'ordinateur dont la batterie est cassée doit être réparé."},{"q":"The conference room, ___ can hold 50 people, is on the second floor.","o":["which","that","where","who"],"e":"Entre virgules, chose, sujet → <b>which</b>.","tr":"La salle de conférence, qui peut accueillir 50 personnes, est au deuxième étage."},{"q":"We visited the factory ___ the new cars are produced.","o":["where","which","who","whose"],"e":"Lieu + relative passive complète → <b>where</b>.","tr":"Nous avons visité l'usine où sont produites les nouvelles voitures."},{"q":"Mr. Lee, ___ daughter works here, is retiring.","o":["whose","who","whom","which"],"e":"La fille <b>de</b> M. Lee → <b>whose</b>.","tr":"M. Lee, dont la fille travaille ici, prend sa retraite."},{"q":"The reason ___ I called is to confirm our appointment.","o":["why","what","where","who"],"e":"<b>The reason why</b>.","tr":"Je vous appelle pour confirmer notre rendez-vous."},{"q":"The package ___ arrived this morning is for you.","o":["that","who","where","what"],"e":"Chose, sujet → <b>that</b>.","tr":"Le colis arrivé ce matin est pour vous."},{"q":"The workshop is designed for people ___ are new to programming.","o":["who","which","whose","whom"],"e":"Personnes, sujet → <b>who</b>.","tr":"L'atelier est destiné aux débutants en programmation."},{"q":"The restaurant ___ we celebrated our anniversary has closed.","o":["where","which","when","whose"],"e":"Lieu + relative complète → <b>where</b>.","tr":"Le restaurant où nous avons fêté notre anniversaire a fermé."},{"q":"The consultant ___ the company hired has 20 years of experience.","o":["whom","whose","where","which"],"e":"Personne, complément de « hired » → <b>whom</b>.","tr":"Le consultant recruté par l'entreprise a 20 ans d'expérience."},{"q":"The main topic, ___ was discussed at length, was the budget.","o":["which","that","what","who"],"e":"Entre virgules, chose → <b>which</b>.","tr":"Le sujet principal, longuement débattu, était le budget."},{"q":"Our director, ___ is on vacation, will return next week.","o":["who","which","whom","whose"],"e":"Personne, sujet, entre virgules → <b>who</b>.","tr":"Notre directeur, actuellement en vacances, revient la semaine prochaine."},{"q":"The shop ___ I bought this jacket offers free alterations.","o":["where","which","who","when"],"e":"Lieu + relative complète (bought this jacket) → <b>where</b>.","tr":"La boutique où j'ai acheté cette veste propose des retouches gratuites."},{"q":"The investors ___ money was lost demanded an explanation.","o":["whose","who","which","whom"],"e":"L'argent <b>des</b> investisseurs → <b>whose</b>.","tr":"Les investisseurs qui ont perdu leur argent ont exigé des explications."},{"q":"The time ___ the train leaves has changed.","o":["when","where","who","whose"],"e":"Antécédent de temps → <b>when</b>.","tr":"L'heure de départ du train a changé."},{"q":"The two companies, both of ___ are based in Tokyo, will merge.","o":["which","them","that","who"],"e":"<b>both of which</b> (choses).","tr":"Les deux entreprises, toutes deux basées à Tokyo, vont fusionner."},{"q":"The manager ___ hired me has left the company.","o":["who","whom","which","whose"],"e":"Personne, <b>sujet</b> de hired → who.","tr":"Le responsable qui m'a embauché a quitté l'entreprise."},{"q":"The laptop ___ I bought last week is already broken.","o":["which","who","whose","where"],"e":"Chose, complément → which.","tr":"L'ordinateur que j'ai acheté la semaine dernière est déjà cassé."},{"q":"The city ___ our head office is located is Chicago.","o":["where","which","when","who"],"e":"Lieu + relative complète → where.","tr":"La ville où se trouve notre siège est Chicago."},{"q":"The client ___ contract was renewed sent us a thank-you note.","o":["whose","who","which","whom"],"e":"Possession + nom → whose.","tr":"Le client dont le contrat a été renouvelé nous a envoyé un mot de remerciement."},{"q":"Tell me ___ you want for lunch.","o":["what","which","that","who"],"e":"« ce que » sans antécédent → what.","tr":"Dis-moi ce que tu veux pour le déjeuner."},{"q":"The week ___ the conference takes place is very busy.","o":["when","where","who","what"],"e":"Antécédent de temps → when.","tr":"La semaine de la conférence est très chargée."},{"q":"The engineer to ___ I spoke was very helpful.","o":["whom","who","which","that"],"e":"Personne après préposition → whom.","tr":"L'ingénieur à qui j'ai parlé a été très utile."},{"q":"This is the reason ___ we changed suppliers.","o":["why","which","what","where"],"e":"<b>The reason why</b>.","tr":"C'est la raison pour laquelle nous avons changé de fournisseur."},{"q":"The new office, ___ opened in May, is very modern.","o":["which","that","who","where"],"e":"Chose entre virgules → which (jamais that).","tr":"Le nouveau bureau, ouvert en mai, est très moderne."},{"q":"Anyone ___ wants to attend must register.","o":["who","which","whom","whose"],"e":"Personne, sujet → who.","tr":"Toute personne souhaitant participer doit s'inscrire."},{"q":"The room in ___ the meeting took place was too small.","o":["which","that","where","what"],"e":"Chose après préposition → which.","tr":"La salle où s'est tenue la réunion était trop petite."},{"q":"The candidate ___ we chose has ten years of experience.","o":["whom","whose","which","where"],"e":"Personne, complément → whom.","tr":"Le candidat que nous avons choisi a dix ans d'expérience."},{"q":"The supplier ___ products we use is based in Italy.","o":["whose","who","which","whom"],"e":"Possession + nom → whose.","tr":"Le fournisseur dont nous utilisons les produits est basé en Italie."},{"q":"The hotel ___ we stayed at was excellent.","o":["that","where","who","what"],"e":"« stayed at » contient déjà la préposition → that (where + at = double emploi).","tr":"L'hôtel où nous avons séjourné était excellent."},{"q":"Ms. Park, ___ is our new director, will speak first.","o":["who","which","that","whom"],"e":"Personne, sujet, entre virgules → who.","tr":"Mme Park, notre nouvelle directrice, parlera en premier."},{"q":"___ I need most right now is more time.","o":["What","That","Which","Who"],"e":"« Ce dont » sans antécédent → What.","tr":"Ce dont j'ai le plus besoin maintenant, c'est de temps."},{"q":"The restaurant ___ we had lunch is near the station.","o":["where","which","when","whose"],"e":"Lieu + relative complète → where.","tr":"Le restaurant où nous avons déjeuné est près de la gare."},{"q":"The documents, ___ were confidential, were locked in a safe.","o":["which","that","who","what"],"e":"Choses entre virgules → which.","tr":"Les documents, confidentiels, étaient enfermés dans un coffre."},{"q":"The employees ___ attended the training received a certificate.","o":["who","which","whose","whom"],"e":"Personnes, sujet → who.","tr":"Les employés qui ont suivi la formation ont reçu un certificat."},{"q":"The day ___ I started this job was a Monday.","o":["when","where","which","who"],"e":"Antécédent de temps → when.","tr":"Le jour où j'ai commencé ce travail était un lundi."},{"q":"The company for ___ she works is expanding.","o":["which","that","who","where"],"e":"Chose après préposition → which.","tr":"L'entreprise pour laquelle elle travaille se développe."},{"q":"The report ___ you sent me was very useful.","o":["that","who","what","where"],"e":"Chose, complément → that.","tr":"Le rapport que vou
