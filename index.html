in open as usual, and orders will be shipped [145].\n\nWe look forward to welcoming you to our newly renovated store in March. Thank you for your continued [146]."},"p6_39":{"hdr":"Dear Ms. Alvarez,","text":"On behalf of the Lakeside Food Bank, I would like to thank you for volunteering at our annual food drive last Saturday. Thanks to volunteers like you, we [147] more than 5,000 kilograms of food.\n\n[148] This food will help over 800 families in our community this winter.\n\nWe hope you will join us again next year. Your time and [149] made a real difference. If you know anyone who might be [150] in volunteering, please share our website with them.\n\nWith gratitude,\nMark Evans, Director"},"p6_40":{"hdr":"From: Accounts Receivable, Delta Office Supply\nTo: Karen Wu\nSubject: RE: Invoice #4410","text":"Dear Ms. Wu,\n\nThank you for bringing the error on invoice #4410 to our [131]. You are correct that you were charged for 50 boxes of paper instead of 30.\n\n[132] A corrected invoice is attached to this e-mail, and the difference of $120 has been [133] to your account.\n\nWe apologize for the mistake and will take steps to ensure it does not happen [134].\n\nBest regards,\nTim Hall"},"p6_41":{"hdr":"Introducing TaskFlow 3.0","text":"TaskFlow, the popular project management software, has released its latest version. TaskFlow 3.0 allows teams to track tasks, share files, and [135] deadlines all in one place.\n\n[136] The new version also works on smartphones, so users can stay connected wherever they are.\n\nCurrent customers can upgrade [137] of charge. New users can try the software for 30 days before [138] to buy a subscription."},"p6_42":{"hdr":"MEMO\nTo: All employees\nFrom: Customer Service Director\nRe: Survey results","text":"Thank you to everyone who helped with this year's customer satisfaction survey. More than 2,000 customers [139] to the questionnaire.\n\nOverall, 87% of customers said they were satisfied with our service, an increase of 5% compared with last year. [140]\n\nHowever, many customers mentioned long waiting times on the phone. To address this [141], we will hire five additional call center staff next month. The full report is available on the intranet for those who would like to read it [142]."},"p6_43":{"hdr":"Oakville Weekly","text":"The Oakville Farmers' Market will return to Central Park this Saturday for its tenth season. More than 60 local farmers and producers will sell fresh fruit, vegetables, cheese, and baked [143].\n\nThe market will be open every Saturday from 8 A.M. to 1 P.M. until the end of October. [144]\n\n“The market has become a favorite weekly event for many families,” said organizer Beth Harris. This year, the market will also offer free cooking [145] by local chefs. Visitors are encouraged to bring their own bags to [146] plastic waste."},"p6_44":{"hdr":"From: Maria Santos, HR\nTo: James Lee\nSubject: Interview invitation","text":"Dear Mr. Lee,\n\nThank you for applying for the position of Marketing Analyst. We were impressed by your application and would like to invite you for an interview [147] Tuesday, April 9, at 10 A.M.\n\n[148] The interview will last about an hour and will include a short case study.\n\nPlease reply to this e-mail to confirm that you are [149] at this time. If not, we will be happy to suggest an [150] date.\n\nBest regards,\nMaria Santos"},"p6_45":{"hdr":"NOTICE TO RESIDENTS\nMaple Court Apartments","text":"Please be advised that the elevators in Building B will be out of service on Monday, November 4, from 9 A.M. to 3 P.M. for [131] maintenance.\n\nDuring this time, residents will need to use the stairs. [132]\n\nWe recommend that residents [133] any deliveries for another day. The management office apologizes for the inconvenience and appreciates your understanding. For questions, please call the office [134] business hours."},"p6_46":{"hdr":"From: Conference Team\nTo: All registered participants\nSubject: Speaker change","text":"Dear Participants,\n\nWe any further questions.\n\nCustomer Care Team"},"p7_4_0":{"hdr":"From: Olivia Chen <ochen@brightpath.com>\nTo: All Brightpath Staff\nDate: March 2\nSubject: Office move","text":"Dear colleagues,\n\nAs announced last month, Brightpath will move to its new office at 88 River Road on Saturday, March 14. The new building is larger and closer to the train station.\n\nPlease pack the contents of your desk into the boxes provided by Thursday, March 12. Label each box with your name and department. The moving company will take care of computers and furniture.\n\nThe office will be closed on Friday, March 13, so that the IT team can prepare the network. Employees should work from home that day. We will open at the new location on Monday, March 16.\n\nOlivia Chen\nOffice Manager"},"p7_4_1":{"hdr":"Text message chain","text":"Kevin Tran (11:02 A.M.)\nHi Anna, the client from Osaka just called. Their flight is delayed by two hours.\n\nAnna Lopez (11:04 A.M.)\nOh no. Our meeting was at 2.\n\nKevin Tran (11:05 A.M.)\nThey asked if we could meet at 4 instead.\n\nAnna Lopez (11:07 A.M.)\nThat works for me. I'll let the director know.\n\nKevin Tran (11:08 A.M.)\nGreat. I'll book the conference room for the later time."},"p7_4_2":{"hdr":"SUNRISE FITNESS — Grand Opening!","text":"Sunrise Fitness is opening a new gym on Park Avenue on May 1.\n\nMembership includes:\n• Access to all equipment, 24 hours a day\n• Two free sessions with a personal trainer\n• Group classes such as yoga and cycling\n\nSpecial offer: Join before May 15 and pay no registration fee (normally $50).\n\nMonthly membership: $45. Students with a valid ID receive a 20% discount.\n\nVisit sunrisefitness.com to sign up."},"p7_4_3":{"hdr":"Document 1 — Invoice","text":"CITY PRINT SHOP — INVOICE #5521\nCustomer: Harbor Dental Clinic\nDate: June 4\n\nBusiness cards (500) ........ $60\nAppointment reminder cards (1,000) ........ $90\nPosters (20) ........ $80\nTOTAL ........ $230\n\nPayment is due within 30 days. Customers who pay within 10 days receive a 5% discount.\n\n———————————\nDocument 2 — E-mail\nFrom: Dr. Sarah Fields\nTo: City Print Shop\nDate: June 6\nSubject: Invoice #5521\n\nHello,\n\nThank you for the prompt delivery. Everything looks great, except that we ordered only 10 posters, not 20. Could you please send a corrected invoice? We would like to pay this week to take advantage of your discount.\n\nBest regards,\nDr. Sarah Fields"},"p7_4_4":{"hdr":"NOTICE — Lakeview Public Pool","text":"The Lakeview Public Pool will reopen on June 1 after a three-month renovation. Improvements include new changing rooms, a larger children's area, and solar-heated water.\n\nSummer hours (June 1 – August 31):\nMonday–Friday: 6 A.M. – 9 P.M.\nSaturday–Sunday: 8 A.M. – 7 P.M.\n\nSwimming lessons for children aged 5 to 12 begin on June 10. Space is limited; registration opens on May 20 at the community center."},"p7_4_5":{"hdr":"Business News — Retail","text":"Online clothing retailer StyleBox reported a 30% increase in sales last quarter, largely thanks to its new same-day delivery service in major cities. — [1] —\n\nThe company launched the service in January in five cities and plans to expand it to ten more by the end of the year. — [2] —\n\nHowever, StyleBox's profits did not rise as quickly as its sales because of higher delivery costs. — [3] — CEO Mark Ellis said the company is looking for ways to make deliveries more efficient, including the use of electric vans. — [4] —"},"p7_5_0":{"hdr":"Customer review — Riverside Inn","text":"★★★☆☆ Reviewed by Tom K. — August 12\n\nI stayed at the Riverside Inn for three nights during a business trip. The location is excellent — just a five-minute walk from the convention center — and the staff were friendly.\n\nHowever, my room was quite noisy because it faced the main street, and the Wi-Fi was slow in the evenings. Breakfast was included but offered only a limited choice.\n\nI would stay here again for the location, but I would ask for a room at the back of the building."},"p7_5_1":{"hdr":"From: Priya Nair\nTo: Design Team\nDate: October 3\nSubject: Client feedback","text":"Hi team,\n\nI met with Greenfield Bank yesterday to present our website design. Overall, they were very pleased with our work, especially the new homepage.\n\nThey did ask for a few changes. First, they would like the company logo to be larger. Second, they want the “Contact Us” button to appear on every page. Finally, they asked us to use a darker shade of green to match their brand.\n\nThe client would like to see the revised design by October 10. Let's meet tomorrow at 9 A.M. to divide the work.\n\nPriya"},"p7_5_2":{"hdr":"Online chat discussion","text":"Leo Martin (3:15 P.M.)\nHas anyone seen the updated price list? The client needs it today.\n\nSofia Reyes (3:16 P.M.)\nIt's in the shared folder, but it hasn't been approved yet.\n\nLeo Martin (3:17 P.M.)\nWho needs to approve it?\n\nSofia Reyes (3:18 P.M.)\nMr. Grant. He's in a meeting until 4.\n\nDaniel Wu (3:20 P.M.)\nI'll catch him as soon as he comes out.\n\nLeo Martin (3:21 P.M.)\nThanks, Daniel. I'll tell the client to expect it by 5."},"p7_5_3":{"hdr":"Document 1 — Web page\nwww.skyhighair.com/baggage","text":"SkyHigh Airlines — Checked Baggage Fees\n\nEconomy: first bag $30, second bag $45\nPremium Economy: first bag free, second bag $45\nBusiness: first and second bags free\n\nMaximum weight per bag: 23 kg (Economy and Premium Economy), 32 kg (Business).\nBags over the weight limit are charged an extra $60.\n\n———————————\nDocument 2 — E-mail\nFrom: Nadia Russo\nTo: SkyHigh Customer Service\nSubject: Flight SH204\n\nHello,\n\nI will be flying from Rome to Chicago on flight SH204 next week in Premium Economy. I plan to bring two suitcases. One of them weighs about 26 kg. Could you tell me how much I will need to pay?\n\nThank you,\nNadia Russo"},"p7_5_4":{"hdr":"MEMO\nTo: All Warehouse Staff\nFrom: Operations Manager\nDate: November 2","text":"As the holiday season approaches, we expect order volumes to increase by about 40%. To handle the extra work, the warehouse will operate on an extended schedule from November 15 to December 23.\n\nDuring this period, a second shift will run from 3 P.M. to 11 P.M. Employees who wish to work on the second shift should sign up with their supervisor by November 8. Overtime will be paid at one and a half times the regular rate.\n\nWe will also hire 20 temporary workers. Please help them feel welcome."},"p7_5_5":{"hdr":"Community News","text":"The town of Millbrook has opened a new public library in the former post office building on Main Street. The library offers more than 40,000 books, as well as computers, study rooms, and a children's reading area.\n\nThe project was funded by a combination of government grants and donations from local businesses. “We wanted to give new life to a historic building,” said Mayor Linda Shaw.\n\nThe library is open Tuesday through Sunday. Library cards are free for residents, while non-residents pay $20 per year."},"p7_6_0":{"hdr":"From: Julia Moreno\nTo: Ken Watanabe\nDate: April 18\nSubject: Supplier visit","text":"Dear Mr. Watanabe,\n\nThank you for agreeing to visit our factory in Valencia next month. As discussed, your visit is scheduled for May 12 and 13.\n\nOn the first day, our production manager will give you a tour of the facility and show you our new packaging line. On the second day, we will meet with our purchasing team to discuss next year's contract.\n\nWe have reserved a room for you at the Hotel Marina, which is ten minutes from the factory. A driver will pick you up at the airport when you arrive. Please send me your flight details at your earliest convenience.\n\nBest regards,\nJulia Moreno"},"p7_6_1":{"hdr":"JOB OPENING — Customer Service Representative","text":"BlueWave Telecom is looking for a full-time Customer Service Representative to join our team in Denver.\n\nResponsibilities:\n• Answer customer questions by phone and chat\n• Help customers ":{"hdr":"Harbor City Times","text":"Harbor City will host the International Food Festival from July 8 to July 12 at Waterfront Park. More than 100 vendors from 30 countries will offer dishes from around the world.\n\nThe festival will also feature live music, cooking competitions, and activities for children. Last year's event attracted over 50,000 visitors.\n\nAdmission is free, but visitors must buy tokens to purchase food. Organizers recommend taking public transportation, as parking near the park will be limited."},"p7_7_0":{"hdr":"From: Service Desk <help@nexcorp.com>\nTo: All employees\nDate: February 10\nSubject: System upgrade","text":"Dear colleagues,\n\nOur e-mail system will be upgraded this Saturday, February 14, from 10 P.M. to 4 A.M. During this time, you will not be able to send or receive e-mails.\n\nAfter the upgrade, you will notice a new design and a larger mailbox capacity. You will be asked to log in again on Monday morning using your usual password.\n\nIf you experience any problems after the upgrade, please call the Service Desk at extension 300. We thank you for your patience.\n\nService Desk"},"p7_7_1":{"hdr":"Online chat discussion","text":"Nina Patel (10:12 A.M.)\nThe caterer just called. They can't deliver the lunch for the board meeting until 1 P.M.\n\nRobert King (10:13 A.M.)\nThe meeting breaks for lunch at 12.\n\nNina Patel (10:14 A.M.)\nI know. Should I look for another caterer?\n\nRobert King (10:15 A.M.)\nThere isn't enough time. Let's move the lunch break to 1.\n\nNina Patel (10:16 A.M.)\nOK. I'll update the agenda and send it to everyone."},"p7_7_2":{"hdr":"Product review — WorkPro Desk Chair","text":"★★★★★ Reviewed by Linda G. — June 3\n\nI work from home and spend at least eight hours a day at my desk, so I needed a comfortable chair. The WorkPro chair was easy to put together, and it took me only 20 minutes.\n\nThe back support is excellent, and I no longer have pain at the end of the day. The chair is a bit more expensive than similar models, but in my opinion, it is worth the price.\n\nThe only thing I would change is the color options — it only comes in black and gray."},"p7_7_3":{"hdr":"Document 1 — Advertisement","text":"GREENLINE BIKE RENTALS\n\nHourly rate: $8\nHalf day (4 hours): $25\nFull day: $40\nElectric bikes: add $10 to any rate\n\nHelmets are included free of charge. Group discount: 15% off for groups of five or more.\nOpen daily 8 A.M. – 7 P.M. at Lake Park entrance.\n\n———————————\nDocument 2 — E-mail\nFrom: Tanya Bell\nTo: Greenline Bike Rentals\nSubject: Reservation\n\nHi,\n\nI'd like to reserve bikes for my family for next Saturday. There will be four of us, and we'd like regular bikes for a full day. We plan to arrive at 9 A.M. Do we need to bring our own helmets?\n\nThanks,\nTanya Bell"},"p7_7_4":{"hdr":"MEMO\nTo: Sales Department\nFrom: Regional Director\nDate: January 5","text":"Congratulations to everyone on a record year! Our team exceeded its annual sales target by 12%, and customer satisfaction scores reached their highest level ever.\n\nTo thank you for your hard work, each team member will receive a bonus in their February paycheck. In addition, the top three salespeople will be invited to an awards dinner on January 25.\n\nOur target for this year is even more ambitious. I will present the new sales plan at our department meeting next Monday."},"p7_7_5":{"hdr":"Science & Business","text":"A new study by Carter University has found that employees who take short breaks every hour are more productive than those who work without stopping. — [1] —\n\nResearchers followed 500 office workers for six months. — [2] — Those who took a five-minute break each hour completed 15% more tasks on average. — [3] —\n\nThe study's authors recommend that companies encourage staff to stand up, stretch, or take a short walk during the day. — [4] —"},"p7_8_0":{"hdr":"From: Grace Liu <gliu@orbitdesign.com>\nTo: Mark Adams\nDate: September 9\nSubject: Proposal","text":"Dear Mr. Ada lectric cars, reducing charging times significantly. However, the battery is still expensive to produce.\n\nThe researchers hope to work with manufacturers to make the technology available to consumers within five years."},"p7_10_0":{"hdr":"From: Martin Blake <mblake@veritas.com>\nTo: Sophie Laurent\nDate: November 14\nSubject: Annual conference","text":"Dear Ms. Laurent,\n\nThank you for agreeing to lead a workshop at our annual conference in Lisbon. I am writing to confirm a few details.\n\nYour workshop, “Leading Remote Teams,” will take place on December 5 from 2 to 4 P.M. in Room C. About 40 participants have registered so far.\n\nThe room will be equipped with a projector and a microphone. If you need any other equipment, please let me know by November 25. We will also cover your hotel costs for two nights.\n\nBest regards,\nMartin Blake\nEvent Coordinator"},"p7_10_1":{"hdr":"Text message chain","text":"Ben Carter (1:10 P.M.)\nAre you still at the trade show?\n\nIsabel Ruiz (1:11 P.M.)\nYes, at our booth. It's been really busy.\n\nBen Carter (1:12 P.M.)\nDo you have enough brochures?\n\nIsabel Ruiz (1:13 P.M.)\nWe're down to our last few.\n\nBen Carter (1:14 P.M.)\nI'll bring another box when I come at 3."},"p7_10_2":{"hdr":"Document 1 — Web page\nwww.greenstay.com","text":"GREENSTAY ECO-LODGE — Room Rates (per night)\n\nStandard Room (2 guests): $90\nFamily Room (4 guests): $140\nForest Cabin (2 guests, private terrace): $160\n\nAll rates include breakfast. Guests staying three nights or more receive a 10% discount on the total price.\nFree guided nature walks every morning at 8 A.M.\n\n———————————\nDocument 2 — E-mail\nFrom: Kevin Moore\nTo: GreenStay Eco-Lodge\nSubject: Booking request\n\nHello,\n\nMy wife and I would like to stay at your lodge from July 10 to July 12 (two nights). We'd love a room with a private outdoor space. Could you tell me if one is available?\n\nThanks,\nKevin Moore"},"p7_10_3":{"hdr":"MEMO\nTo: All Employees\nFrom: Facilities Manager\nDate: August 20\nRe: Cafeteria renovation","text":"The employee cafeteria will be closed for renovation from September 1 to September 30. During this time, a temporary food station will be set up in the lobby, offering sandwiches, salads, and drinks.\n\nThe renovated cafeteria will have more seating, a salad bar, and a coffee counter. We appreciate your patience during the work.\n\nEmployees can also receive a 10% discount at Luca's Café across the street by showing their ID badge during September."},"p7_10_4":{"hdr":"Customer review — Luna Headphones","text":"★★☆☆☆ Reviewed by Jake P. — October 8\n\nI bought the Luna wireless headphones for my daily commute. The sound quality is good, and they are comfortable to wear.\n\nUnfortunately, the battery lasts only about four hours, not the 20 hours advertised on the box. I contacted customer service, and they offered to replace the headphones, but the new pair has the same problem.\n\nI would not recommend these headphones for long trips."},"p7_10_5":{"hdr":"Business Today","text":"Coffee chain Morning Bean has announced that it will stop using plastic cups in all of its 300 stores by the end of next year. — [1] —\n\nThe company will replace them with paper cups that can be recycled. Customers who bring their own cups will receive a 10-cent discount. — [2] —\n\nMorning Bean says the change will cost about $3 million, but it believes customers will appreciate the effort. — [3] — Several other coffee chains are expected to follow its example. — [4] —"}};

/* ============================================================
   ÉTAT & STOCKAGE (local, par navigateur)
   ============================================================ */
const LET = ["A","B","C","D"];
const KEY = "objectif990-v1";
let store = {best:{}, wrong:{}, answered:0, correct:0, stats:{}, help:false};
function save(){ try{ localStorage.setItem(dataKey(profiles.cur), JSON.stringify(store)); }catch(e){} }

const byId = Object.fromEntries(CATS.map(c=>[c.id,c]));
let view = "home", tipId = "gen", session = null, timer = null;
const app = document.getElementById("app");
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const blankify = s => s.replace("___",'<span class="blank">-------</span>');

function makeItem(catId, idx){
  const q = byId[catId].qs[idx];
  const base = q.o.map((_,i)=>i);
  return {cat:catId, idx, order:q.fixed?base:shuffle(base), picked:null};
}
function startSession(title, part, start, items, extra={}){
  speechStop();
  session = Object.assign({title, part, start, items, i:0, t0:Date.now(), showText:false}, extra);
  session.label = extra.series>0 ? `${title} · Série ${extra.series}` : extra.series===0 ? `${title} · Mélange` : title;
  view = "quiz"; render(); window.scrollTo(0,0);
}
const SIZE = 20;
const nSeries = c => Math.ceil(c.qs.length/SIZE);
const canMix = c => !c.ordered;
/* s = 1..n : série fixe ; s = 0 : mélange aléatoire de 20 questions de la catégorie */
function startCat(id, s){
  const c = byId[id];
  let idxs;
  if(s>0){
    idxs = c.qs.map((_,i)=>i).slice((s-1)*SIZE, s*SIZE);
    if(!c.ordered) idxs = shuffle(idxs);
  } else {
    idxs = shuffle(c.qs.map((_,i)=>i)).slice(0,SIZE);
  }
  startSession(c.title, c.part, c.start, idxs.map(i=>makeItem(id,i)), {catId:id, series:s});
}
function startMix(){
  const pool = CATS.filter(c=>c.group==="grammar"||c.group==="vocab").flatMap(c=>c.qs.map((_,i)=>[c.id,i]));
  startSession("Série mixte","Part 5",101, shuffle(pool).slice(0,SIZE).map(([c,i])=>makeItem(c,i)));
}
function startReview(){
  const keys = Object.keys(store.wrong).filter(k=>{const [c,i]=k.split(":");return byId[c]&&byId[c].qs[+i];});
  if(!keys.length) return;
  startSession("Mes erreurs","Révision",1, shuffle(keys).slice(0,20).map(k=>{const [c,i]=k.split(":");return makeItem(c,+i);}), {review:true});
}

/* ---------- audio (Part 2) ---------- */
const canSpeak = "speechSynthesis" in window;
let speakToken = 0;
function speechStop(){ speakToken++; if(canSpeak) try{speechSynthesis.cancel();}catch(e){} }
function pickVoice(){
  if(!canSpeak) return null;
  const v = speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  return v.find(x=>/en[-_]US/i.test(x.lang))||v[0]||null;
}
function playItem(it){
  if(!canSpeak) return;
  speechStop();
  const tok = speakToken, q = byId[it.cat].qs[it.idx], voice = pickVoice();
  const lines = [q.q, ...it.order.map((oi,k)=>LET[k]+". "+q.o[oi])];
  let n = 0;
  const next = ()=>{
    if(tok!==speakToken || n>=lines.length) return;
    const u = new SpeechSynthesisUtterance(lines[n++]);
    u.lang = "en-US"; u.rate = .95; if(voice) u.voice = voice;
    u.onend = ()=> setTimeout(next, n===1 ? 900 : 600);
    speechSynthesis.speak(u);
  };
  next();
}

/* ---------- statistiques ---------- */
const MIN_N = 5;
const PARTS = [
  {label:"Part 2", g:"listening", sub:"Question-réponse", ids:CATS.filter(c=>c.part==="Part 2").map(c=>c.id)},
  {label:"Part 5", g:"grammar", sub:"Grammaire", ids:CATS.filter(c=>c.group==="grammar").map(c=>c.id)},
  {label:"Part 5", g:"vocab", sub:"Vocabulaire", ids:CATS.filter(c=>c.group==="vocab").map(c=>c.id)},
  {label:"Part 6", g:"reading", sub:"Textes à compléter", ids:["p6"]},
  {label:"Part 7", g:"reading", sub:"Documents", ids:["p7"]},
];
function sumStats(ids){
  return ids.reduce((a,id)=>{ const s = store.stats[id]; if(s){ a.n+=s.n; a.ok+=s.ok; } return a; }, {n:0, ok:0});
}
function note(st){ return st && st.n ? (10*st.ok/st.n).toFixed(1).replace(".",",") : "—"; }
function level(st){
  if(!st || !st.n) return {cls:"na", txt:"Pas commencé"};
  if(st.n < MIN_N) return {cls:"na", txt:"Trop peu de réponses"};
  const r = 10*st.ok/st.n;
  if(r < 5) return {cls:"bad", txt:"À travailler"};
  if(r < 7.5) return {cls:"warn", txt:"En progrès"};
  return {cls:"good", txt:"Solide"};
}
function bestSeriesFor(c){
  if(canMix(c)) return 0;
  const ns = nSeries(c);
  for(let k=1;k<=ns;k++) if(store.best[c.id+":"+k]==null) return k;
  let low = 1; for(let k=2;k<=ns;k++) if(store.best[c.id+":"+k] < store.best[c.id+":"+low]) low = k;
  return low;
}
function renderDash(){
  const rows = PARTS.map(P=>{
    const st = sumStats(P.ids), L = level(st), w = st.n ? Math.round(100*st.ok/st.n) : 0;
    return `<li>
      <b><i class="dot" style="background:var(--c-${P.g})"></i>${P.label}</b>
      <span class="sc lvl-${L.cls}">${note(st)}<small>/10</small></span>
      <span class="sub">${P.sub}</span>
      <span class="line"><span class="nbar lvl-${L.cls}" aria-hidden="true"><i style="width:${w}%"></i></span><span class="pill lvl-${L.cls}">${L.txt}</span></span>
      <span class="line cnt">${st.n} faites · <span class="ok">${st.ok} bonnes</span> · <span class="ko">${st.n-st.ok} fausses</span></span>
    </li>`;
  }).join("");
  const ranked = CATS.map(c=>({c, st:store.stats[c.id]}))
    .filter(x=>x.st && x.st.n>=MIN_N)
    .sort((a,b)=>a.st.ok/a.st.n - b.st.ok/b.st.n);
  const weak = ranked.filter(x=>10*x.st.ok/x.st.n < 7.5).slice(0,4);
  let prio;
  if(!ranked.length) prio = `<p class="muted">Répondez à au moins ${MIN_N} questions dans un sujet : vos points faibles apparaîtront ici.</p>`;
  else if(!weak.length) prio = `<p class="muted">Aucun sujet sous 7,5/10. Continuez avec les sujets pas encore commencés ou les séries 2 et 3.</p>`;
  else prio = `<ol class="prio">${weak.map(({c,st})=>{
      const L = level(st), s = bestSeriesFor(c);
      return `<li data-g="${c.group}"><div><b>${c.title}</b><span>${c.part} · ${st.ok}/${st.n} bonnes</span></div>
        <span class="pill lvl-${L.cls}">${note(st)}/10</span>
        <button class="btn sm" type="button" data-cat="${c.id}" data-s="${s}">${s===0?"Mélange":"Série "+s}</button></li>`;
    }).join("")}</ol>`;
  return `<section class="group" aria-labelledby="dash-h">
    <div class="ghead"><h2 id="dash-h">Tableau de bord</h2><span class="eyebrow">note /10 = bonnes réponses ÷ questions faites × 10</span></div>
    <div class="dash">
      <div class="panel">
        <ul class="plist">${rows}</ul>
      </div>
      <div class="panel">
        <h3 class="ptitle">À travailler en priorité</h3>
        ${prio}
        <button class="linkbtn" type="button" id="reset-stats">Remettre les statistiques à zéro</button>
      </div>
    </div>
  </section>`;
}

function fmt(ms){ const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }

function renderQuiz(){
  const S = session, it = S.items[S.i], c = byId[it.cat], q = c.qs[it.idx];
  const num = S.review ? S.i+1 : S.start + S.i;
  const done = it.picked!==null;
  const answered = S.items.filter(x=>x.picked!==null).length;
  const isL = !!c.listening;
  const showTxt = done || S.showText || !canSpeak;

  let passage = "";
  if(q.p){
    const P = PASSAGES[q.p];
    const txt = P.text.replace(/\[(\d+)\]/g,(m,n)=>`<span class="gap${+n===q.blank?" on":""}">[${n}] -------</span>`);
    passage = `<div class="passage" tabindex="0" aria-label="Document"><span class="hdr">${P.hdr}</span>${txt}</div>`;
  }
  let stem;
  if(q.blank) stem = `Choisissez la réponse qui complète le blanc <b>[${q.blank}]</b> du texte.`;
  else if(isL) stem = showTxt ? q.q : `<span class="hidden-txt">Écoutez la question et les trois réponses.</span>`;
  else stem = blankify(q.q);

  const opts = it.order.map((oi,k)=>{

    if(done){ if(oi===0) cls+=" right"; else if(it.picked===k) cls+=" wrong"; else cls+=" dim"; }
    const label = (isL && !showTxt) ? `<span class="hidden-txt">Réponse ${LET[k]}</span>` : q.o[oi];
    return `<button type="button" class="${cls}" data-k="${k}" ${done?"disabled":""} aria-label="Réponse ${LET[k]}"><span class="bub">${LET[k]}</span><span>${label}</span></button>`;
  }).join("");

  let explain = "";
  if(done){
    const ok = it.order[it.picked]===0;
    const good = it.order.indexOf(0);
    explain = `<div class="explain" aria-live="polite">
      <div class="verdict ${ok?"ok":"ko"}">${ok?"Correct":"Incorrect"} — bonne réponse : (${LET[good]}) ${q.o[0]}</div>
      <p>${q.e}</p>
      ${isL?`<div class="script">${q.q}<br>${it.order.map((oi,k)=>`(${LET[k]}) ${q.o[oi]}`).join("<br>")}</div>`:""}
      ${q.tr?`<p class="tr">${q.tr}</p>`:""}
    </div>`;
  }

  const last = S.i===S.items.length-1;
  const rows = S.items.map((x,j)=>{
    const n = S.review ? j+1 : S.start+j;
    let cl = "qn";
    if(x.picked!==null) cl += x.order[x.picked]===0 ? " g" : " x";
    if(j===S.i) cl += " cur";
    return `<button type="button" class="${cl}" data-j="${j}" aria-label="Question ${n}${x.picked!==null?(x.order[x.picked]===0?", bonne réponse":", réponse fausse"):""}">${n}</button>`;
  }).join("");

  app.innerHTML = `
    <div class="qtop">
      <button class="ico" type="button" id="quit" aria-label="Quitter la série">&#8592;</button>
      <div class="qinfo"><b>${S.label}</b><span>${S.part} · ${answered}/${S.items.length} cochées · <b id="clk">${fmt(Date.now()-S.t0)}</b></span></div>
      <button class="hbtn" type="button" id="help" aria-pressed="${store.help}" aria-label="Aide : surligner les indices"><span class="sw" aria-hidden="true"></span>Aide</button>
    </div>
    <div class="qnav" id="qnav" role="group" aria-label="Questions de la série">${rows}</div>
    <div class="quiz">
      <article class="page">
        <div class="strip"><span>${S.review?c.part+" · "+c.title:c.title}</span><span>Question ${num} / ${S.review?S.items.length:S.start+S.items.length-1}</span></div>
        <div class="body">
          ${c.rule?`<details class="rule"><summary>Rappel de la règle</summary><div>${c.rule}</div></details>`:""}
          ${isL?`<div class="listen">${canSpeak?`<button class="btn primary" type="button" id="play">▶ Écouter</button>
            <button class="btn" type="button" id="showtxt" aria-pressed="${S.showText}">${S.showText?"Masquer le texte":"Afficher le texte"}</button>`:`<span class="muted">La synthèse vocale n'est pas disponible dans ce navigateur : le texte est affiché.</span>`}</div>`:""}
          ${passage}
          <div class="stem"><span class="no">${num}.</span><p>${stem}</p></div>
          <div class="hints" id="hints" hidden></div>
          <div class="opts" role="group" aria-label="Propositions">${opts}</div>
          ${explain}
        </div>
      </article>
    </div>
    <div class="bar">
      <button class="ico" type="button" id="prev" ${S.i===0?"disabled":""} aria-label="Question précédente">&#8592;</button>
      <button class="btn primary" type="button" id="next" ${done?"":"disabled"}>${last?"Voir le résultat":"Question suivante"}</button>
    </div>`;

  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  app.querySelectorAll(".qn").forEach(b=>b.onclick=()=>go(+b.dataset.j));
  app.querySelector("#prev").onclick=()=>go(S.i-1);
  app.querySelector("#next").onclick=next;
  app.querySelector("#quit").onclick=()=>{speechStop();session=null;view="home";render();};
  const pl = app.querySelector("#play"); if(pl) pl.onclick=()=>playItem(it);
  const st = app.querySelector("#showtxt"); if(st) st.onclick=()=>{S.showText=!S.showText;renderQuiz();};
  app.querySelector("#help").onclick=toggleHelp;
  if(store.help){ try{ applyHelp(q, c, showTxt); }catch(e){ console.error(e); } }
  const nav = app.querySelector("#qnav"), cur = app.querySelector(".qn.cur");
  if(nav && cur) nav.scrollLeft = cur.offsetLeft - nav.clientWidth/2 + cur.offsetWidth/2;
  swipe(app.querySelector(".page"));
  const clk = app.querySelector("#clk");
  timer = setInterval(()=>{ clk.textContent = fmt(Date.now()-S.t0); },1000);
}

/* balayage gauche / droite pour changer de question */
function swipe(el){
  if(!el) return;
  let x0 = null, y0 = null;
  el.addEventListener("touchstart", e=>{ const t = e.changedTouches[0]; x0 = t.clientX; y0 = t.clientY; }, {passive:true});
  el.addEventListener("touchend", e=>{
    if(x0===null) return;
    const t = e.changedTouches[0], dx = t.clientX-x0, dy = t.clientY-y0;
    x0 = null;
    if(Math.abs(dx) < 70 || Math.abs(dy) > 50) return;
    const S = session; if(!S) return;
    if(dx < 0){ if(S.items[S.i].picked!==null) next(); }
    else go(S.i-1);
  }, {passive:true});
}
function toggleHelp(){ store.help = !store.help; save(); const y = window.scrollY; renderQuiz(); window.scrollTo(0,y); }
function pick(k){
  const S = session, it = S.items[S.i];
  if(!it || it.picked!==null || k>=it.order.length) return;
  it.picked = k;
  const ok = it.order[k]===0, key = it.cat+":"+it.idx;
  store.answered++; if(ok) store.correct++;
  const st = store.stats[it.cat] || (store.stats[it.cat] = {n:0, ok:0});
  st.n++; if(ok) st.ok++;
  if(ok){ if(S.review) delete store.wrong[key]; } else store.wrong[key]=1;
  save(); speechStop(); renderQuiz();
  const nb = app.querySelector("#next"); if(nb) nb.focus({preventScroll:true});
}
function go(j){
  if(j<0||j>=session.items.length) return;
  speechStop(); session.i=j; renderQuiz();
  if(window.innerWidth<=820) window.scrollTo({top:0});
}
function next(){
  const S = session;
  if(S.items[S.i].picked===null) return;
  const firstOpen = S.items.findIndex(x=>x.picked===null);
  if(S.i < S.items.length-1) go(S.i+1);
  else if(firstOpen>=0) go(firstOpen);
  else finish();
}
function finish(){
  const S = session;
  S.elapsed = Date.now()-S.t0;
  S.score = S.items.filter(x=>x.order[x.picked]===0).length;
  if(S.catId && S.series>0){ const k = S.catId+":"+S.series, b = store.best[k]; if(b==null||S.score>b) store.best[k]=S.score; save(); }
  speechStop(); view="result"; render(); window.scrollTo(0,0);
  if(ghReady()) ghSync(true);
}

function renderResult(){
  const S = session, n = S.items.length, p = Math.round(100*S.score/n);
  const msg = p===100 ? "Sans faute. Passez à une autre catégorie."
    : p>=80 ? "Très solide. Relisez les explications des erreurs ci-dessous."
    : p>=50 ? "Base correcte. Refaites la série après avoir relu le rappel de la règle."
    : "Point à travailler. Ouvrez le rappel de la règle avant de recommencer.";
  const errs = S.items.map((x,j)=>({x,j})).filter(({x})=>x.order[x.picked]!==0);
  const errHtml = errs.map(({x,j})=>{
    const q = byId[x.cat].qs[x.idx];
    const n = S.review ? j+1 : S.start+j;
    const stem = q.blank ? `Blanc [${q.blank}]` : blankify(q.q);
    return `<div class="err"><div class="eyebrow">Question ${n} · ${byId[x.cat].title}</div>
      <div class="q">${stem}</div>
      <div class="a">Votre réponse : <em>${q.o[x.order[x.picked]]}</em> · Bonne réponse : <strong>${q.o[0]}</strong></div>
      <div class="x">${q.e}</div></div>`;
  }).join("");
  app.innerHTML = `<div class="result">
    <div><div class="eyebrow">${S.part} · ${S.label} · ${fmt(S.elapsed)}</div>
    <div class="score"><strong>${S.score}/${n}</strong><span>${p} % de bonnes réponses</span></div>
    <p class="muted" style="max-width:60ch;margin:8px 0 0">${msg}</p></div>
    <div class="quick" style="padding:0">
      ${S.catId && S.series>0 && S.series<nSeries(byId[S.catId]) ? `<button class="btn primary" type="button" id="nextser">Série ${S.series+1}</button>` : ""}
      <button class="btn${S.catId && S.series>0 && S.series<nSeries(byId[S.catId])?"":" primary"}" type="button" id="again">${S.series===0?"Nouveau mélange":"Recommencer"}</button>
      <button class="btn" type="button" id="rev" ${Object.keys(store.wrong).length?"":"disabled"}>Revoir mes erreurs</button>
      <button class="btn" type="button" id="home">Toutes les catégories</button>
      <button class="btn save" type="button" id="save-now" ${ghState.busy?"disabled":""}>${ghState.busy?"Enregistrement…":"Enregistrer la progression"}</button>
    </div>
    ${ghState.msg?`<p class="bkmsg" style="margin:0">${escHtml(ghState.msg)}</p>`:""}
    ${errs.length?`<div><h2 style="font-stretch:75%;font-size:22px;text-transform:uppercase;margin-bottom:12px">Erreurs à retenir</h2><div class="errs">${errHtml}</div></div>`:""}
  </div>`;
  app.querySelector("#again").onclick=()=>{
    if(S.catId) startCat(S.catId, S.series);
    else if(S.review) startReview();
    else startMix();
  };
  app.querySelector("#rev").onclick=startReview;
  const ns = app.querySelector("#nextser"); if(ns) ns.onclick=()=>startCat(S.catId, S.series+1);
  app.querySelector("#home").onclick=()=>{view="home";render();window.scrollTo(0,0);};
  app.querySelector("#save-now").onclick=saveNow;
}

function suffixMatches(str, lo, hi){

    if(m.index<lo || m.index+m[0].length>hi || SUF_SKIP.has(w)) continue;
    if(suf==="s" && (w.length<4 || /(ss|us|is|ous|ics|'s)$/.test(w))) continue;
    if(suf==="ed" && (w.length<5 || /eed$/.test(w))) continue;
    if((suf==="ing"||suf==="ly") && w.length<5) continue;
    if(/[A-Z]/.test(m[0][0]) && m.index>0 && !/[.!?]\s*$/.test(str.slice(Math.max(0,m.index-3), m.index))) continue; /* noms propres */

function choose(matches){

function wrapMatches(segs, matches){

    const seg = segs.find(g=>m.s>=g.start && m.e<=g.start+g.len);
    if(!seg) continue;
    if(!byNode.has(seg)) byNode.set(seg, []);
    byNode.get(seg).push(m);
  }
  for(const [seg, ms] of byNode){
    const t = seg.node.nodeValue, frag = document.createDocumentFragment(); let pos = 0;
    ms.sort((a,b)=>a.s-b.s);
    for(const m of ms){
      const a = m.s-seg.start, b = m.e-seg.start;
      if(a>pos) frag.append(t.slice(pos,a));
      const mk = document.createElement("mark");
      mk.className = "hl"+(m.suf?" suf":"")+(m.kw?" kw":"");
      mk.title = m.tip; mk.textContent = t.slice(a,b);
      m.text = mk.textContent;
      if(m.suf){ const L = t.slice(0,a).match(/[A-Za-z'-]*$/)[0]; m.word = L + m.text; }
      frag.append(mk); pos = b;

function sentenceWindow(str){
  const b = str.indexOf("");
  if(b<0) return [0, str.length];
  const before = str.slice(0,b);
  const stops = [...before.matchAll(/[.!?]["”’)]?\s+|\n/g)].map(m=>m.index+m[0].length);
  const lo = stops.length>1 ? stops[stops.length-2] : 0;    /* phrase courante + la précédente */

  if(group.id==="conj" || group.id==="preps" || group.opts.filter(o=>LINK.test(o.trim())).length>=2) ms = ms.concat(clauseMatches(str, lo, hi, group.id));
  if(withSuffix) ms = ms.concat(suffixMatches(str, lo, hi));
  const kept = choose(ms);
  wrapMatches(segs, kept);
  return kept.filter(m=>m.text);
}
function applyHelp(q, c, showTxt){
  const box = app.querySelector("#hints");
  if(!box) return;
  const found = [];
  const stemP = app.querySelector(".stem p");
  const pass = app.querySelector(".passage");
  let note = "";

  if(c.listening){
    if(!showTxt){ note = "Affichez le texte (ou répondez) pour voir les indices : l'aide ne gâche pas l'écoute."; }
    else {
      const f = flattenFor(stemP); stemP._flat = f;
      const ms = [];
      for(const [re, tip] of P2_RULES){
        const m = re.exec(f.str);
        if(m){ const lead = m[0].match(/^\s*/)[0].length, s = m.index+lead; ms.push({s, e:m.index+m[0].length, tip, pr:ms.length}); if(ms.length>=2) break; }
      }
      const kept = choose(ms); wrapMatches(f.segs, kept);
      found.push(...kept.filter(m=>m.text));
    }
  } else if(q.p && !q.blank){
    /* Part 7 : mots de la question retrouvés dans le document */
    const f = flattenFor(stemP); stemP._flat = f;
    const qm = collectP7Question(f.str);
    const words = [...new Set((q.q.match(/[A-Za-z][A-Za-z'-]{3,}/g)||[]).map(w=>w.toLowerCase()).filter(w=>!P7_STOPW.has(w)))];
    const roots = words.map(w=>w.length>6 ? w.slice(0,6) : w.replace(/(ies|es|s|ed|ing)$/,"")).filter(r=>r.length>=3);
    const kwTip = "Mot de la question → la réponse est souvent tout près (souvent reformulée)";
    const qk = [];
    for(const r of roots){
      const re = new RegExp(`\\b${r}[a-z'-]*`, "gi"); let m;
      while((m = re.exec(f.str))) qk.push({s:m.index, e:m.index+m[0].length, tip:kwTip, pr:500, kw:true});
    }
    const keptQ = choose(qm.concat(qk)); wrapMatches(f.segs, keptQ);
    found.push(...keptQ.filter(m=>m.text));
    if(pass && roots.length){
      const fp = flattenFor(pass, null, ".hdr");
      const pk = [];
      for(const r of roots){
        const re = new RegExp(`\\b${r}[a-z'-]*`, "gi"); let m;
        while((m = re.exec(fp.str))) pk.push({s:m.index, e:m.index+m[0].length, tip:kwTip, pr:500, kw:true});
      }
      const keptP = choose(pk); wrapMatches(fp.segs, keptP);
      if(keptP.length) found.push({text:`${keptP.length} repère${keptP.length>1?"s":""} dans le document`, tip:"Les mots de la question sont surlignés dans le texte : lisez autour d'eux en priorité", kw:true});
    }
  } else {
    const target = q.blank ? pass : stemP;
    if(target){
      const f = flattenFor(target, q.blank ? ".gap.on" : ".blank", q.blank ? ".gap,.hdr" : null);
      target._flat = f;
      const [lo, hi] = q.blank ? sentenceWindow(f.str) : [0, f.str.length];
      found.push(...rulesIn(target, f.str, lo, hi, !["relat","conj"].includes(c.id), {g:c.group, id:c.id, opts:q.o}));
    }
  }

  /* propositions qui ne diffèrent que par la terminaison */
  const labels = [...app.querySelectorAll(".opt > span:last-child")];
  const words = labels.map(l=>l.textContent.trim());
  const PRONS = /^(?:I|me|my|mine|myself|you|your|yours|yourself|yourselves|he|him|his|himself|she|her|hers|herself|it|its|itself|we|us|our|ours|ourselves|they|them|their|theirs|themselves|the|this|that|these|those|there)$/i;
  if(!c.listening && words.length && words.every(w=>/^[A-Za-z-]+$/.test(w)) && !words.some(w=>PRONS.test(w))){
    const low = words.map(w=>w.toLowerCase());
    let p = 0; while(low.every(w=>w[p]!==undefined && w[p]===low[0][p])) p++;
    if(p>=3 && low.some(w=>w.length>p)){
      labels.forEach((l,i)=>{
        const w = words[i];
        l.innerHTML = "";
        l.append(w.slice(0,p));
        if(w.length>p){ const mk = document.createElement("mark"); mk.className = "hl suf"; mk.title = "Terminaison qui change"; mk.textContent = w.slice(p); l.append(mk); }
      });
      found.push({text:words[0].slice(0,p)+"…", tip:"Même racine, terminaisons différentes : identifiez la nature du mot attendu (nom, adjectif, adverbe, verbe) avant de lire le sens", opt:true});
    }
  }

  /* liste des indices (utile sur mobile où le survol n'existe pas) */
  const seen = new Set(), items = [], sufs = new Map();
  for(const m of found){
    if(m.suf && !m.opt){ if(!sufs.has(m.tip)) sufs.set(m.tip, new Set()); sufs.get(m.tip).add((m.word||m.text).toLowerCase()); continue; }
    const key = m.tip;
    if(m.kw && !m.opt && seen.has(m.tip)){ const it = items.find(x=>x.tip===m.tip); if(it && !it.words.includes(m.text) && it.words.length<5) it.words.push(m.text); continue; }
    if(seen.has(key)){ const it = items.find(x=>x.tip===key); if(it && !it.words.includes(m.text) && it.words.length<4) it.words.push(m.text); continue; }
    seen.add(key); items.push({tip:m.tip, words:[m.text], suf:!!m.opt});
  }
  const esc = s => String(s).replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
  let html = items.slice(0,7).map(it=>`<li><span>${it.words.map(w=>`<mark class="hl${it.suf?" suf":""}">${esc(w)}</mark>`).join(" ")}</span><span>${esc(it.tip)}</span></li>`).join("");
  if(sufs.size) html += `<li><span>${[...sufs.keys()].map(t=>`<mark class="hl suf">-${esc(t.split(" ")[0].replace(/^-/,""))}</mark>`).join(" ")}</span><span>Terminaisons repérées : ${esc([...sufs.keys()].map(t=>t.replace(/^-\w+ : /,"")+" ("+[...sufs.get(t)].slice(0,3).join(", ")+")").join(" ; "))}</span></li>`;
  box.hidden = false;
  box.innerHTML = `<div class="hh"><span class="eyebrow">Indices</span><small>repérés automatiquement, à vérifier</small></div>` +
    (note ? `<p>${esc(note)}</p>` : html ? `<ul>${html}</ul>` : `<p>Pas d'indice automatique ici : lisez toute la phrase et comparez les propositions.</p>`);
}
function collectP7Question(str){
  const out = [];
  const R = [
    [/\bNOT\b/g, "NOT → trois propositions sont dans le document : cherchez celle qui n'y est pas"],
    [/\b(?:implied|suggested|inferred|most likely|probably)\b/gi, "Déduction → la réponse n'est pas écrite mot pour mot"],
    [/\b(?:purpose|why (?:is|was|did)[^?]*(?:written|sent))\b/gi, "Objectif du document → regardez surtout le début"],
    [/\b(?:true|indicated|stated|mentioned)\b/gi, "Détail vérifiable → comparez chaque proposition au texte"],
    [/\[\d\]|\bbest belong\b/gi, "Phrase à insérer → cherchez les mots de liaison et les pronoms autour de chaque position"],
    [/\b(?:closest in meaning|meaning)\b/gi, "Synonyme → remplacez le mot dans la phrase et gardez le sens du contexte"],
  ];
  for(const [re, tip] of R){ re.lastIndex = 0; let m; while((m = re.exec(str))) out.push({s:m.index, e:m.index+m[0].length, tip, pr:out.length}); }
  return out;
}

/* ---------- sauvegarde : export / import de la progression ---------- */
/* Format : O990Z<base64 gzip> (ou O990T<base64 texte> si le navigateur ne sait pas compresser). */
let bkp = {mode:null, msg:"", code:""};

function encodeStore(){
  const best = Object.entries(store.best || {}).filter(([k,v])=>v!=null)
    .map(([k,v])=>k+":"+v).join(",");
  const stats = Object.entries(store.stats || {}).filter(([k,v])=>v && v.n)
    .map(([k,v])=>k+":"+v.n+":"+v.ok).join(",");
  const byCat = {};
  for(const k of Object.keys(store.wrong || {})){
    const i = k.lastIndexOf(":"); if(i<0) continue;
    (byCat[k.slice(0,i)] = byCat[k.slice(0,i)] || []).push(k.slice(i+1));
  }
  const wrong = Object.entries(byCat).map(([c,l])=>c+":"+l.join(".")).join(",");
  return ["v1", "a="+(store.answered||0)+":"+(store.correct||0), "b="+best, "s="+stats, "w="+wrong].join("~");
}
function decodeStore(txt){
  const parts = String(txt).split("~");
  if(parts[0] !== "v1") throw new Error("version inconnue");
  const out = {best:{}, wrong:{}, stats:{}, answered:0, correct:0};
  for(const p of parts.slice(1)){
    const tag = p[0], body = p.slice(2);
    if(!body) continue;
    if(tag === "a"){ const [a,c] = body.split(":"); out.answered = +a||0; out.correct = +c||0; }
    else if(tag === "b") for(const e of body.split(",")){
      const [cat,s,v] = e.split(":");
      if(byId[cat] && +s>=0 && +v>=0) out.best[cat+":"+s] = +v;
    }
    else if(tag === "s") for(const e of body.split(",")){
      const [cat,n,ok] = e.split(":");
      if(byId[cat] && +n>0) out.stats[cat] = {n:+n, ok:+ok||0};
    }
    else if(tag === "w") for(const e of body.split(",")){
      const [cat,list] = e.split(":");
      if(!byId[cat] || !list) continue;
      for(const i of list.split(".")) if(byId[cat].qs[+i]) out.wrong[cat+":"+(+i)] = 1;
    }
  }
  return out;
}
const b64enc = bytes => { let s=""; for(const b of bytes) s += String.fromCharCode(b); return btoa(s); };
const b64dec = s => Uint8Array.from(atob(s), ch=>ch.charCodeAt(0));
async function streamBytes(bytes, kind, mode){
  const st = mode==="in" ? new CompressionStream(kind) : new DecompressionStream(kind);
  const r = new Response(new Blob([bytes]).stream().pipeThrough(st));
  return new Uint8Array(await r.arrayBuffer());
}
async function packStore(){
  const txt = encodeStore(), raw = new TextEncoder().encode(txt);
  if(typeof CompressionStream === "function"){
    try{ return "O990Z" + b64enc(await streamBytes(raw, "gzip", "in")); }catch(e){}
  }
  return "O990T" + b64enc(raw);
}
async function unpackStore(code){
  const s = String(code).replace(/\s+/g, "");
  if(s.startsWith("O990Z")) return decodeStore(new TextDecoder().decode(await streamBytes(b64dec(s.slice(5)), "gzip", "out")));
  if(s.startsWith("O990T")) return decodeStore(new TextDecoder().decode(b64dec(s.slice(5))));
  throw new Error("code non reconnu");
}
/* fusion : on garde le meilleur score par série, on additionne les compteurs, on réunit les erreurs */
function mergeStore(inc){
  for(const [k,v] of Object.entries(inc.best)) if(store.best[k]==null || v>store.best[k]) store.best[k] = v;
  for(const [k,v] of Object.entries(inc.stats)){
    const cur = store.stats[k] || (store.stats[k] = {n:0, ok:0});
    cur.n += v.n; cur.ok += v.ok;
  }
  for(const k of Object.keys(inc.wrong)) store.wrong[k] = 1;
  store.answered = (store.answered||0) + inc.answered;
  store.correct = (store.correct||0) + inc.correct;
}
function replaceStore(inc){
  store.best = inc.best; store.stats = inc.stats; store.wrong = inc.wrong;
  store.answered = inc.answered; store.correct = inc.correct;
}
function bkpSummary(d){
  const ser = Object.keys(d.best).length, q = Object.values(d.stats).reduce((a,s)=>a+s.n, 0);
  return `${q} question${q>1?"s":""} répondues · ${ser} série${ser>1?"s":""} terminée${ser>1?"s":""} · ${Object.keys(d.wrong).length} à revoir`;
}

function bindBackup(){
  const on = (id, fn)=>{ const el = app.querySelector("#"+id); if(el) el.onclick = fn; };
  const back = (msg)=>{ bkp = {mode:null, msg:msg||"", code:""}; renderHome(); };
  on("bk-exp", async ()=>{
    try{ bkp = {mode:"out", msg:"", code: await packStore()}; }
    catch(e){ bkp = {mode:null, msg:"Export impossible : "+e.message, code:""}; }
    renderHome();
  });
  on("bk-imp", ()=>{ bkp = {mode:"in", msg:"", code:""}; renderHome(); });
  on("bk-qr", async ()=>{
    try{ bkp = {mode:"qr", msg:"", code: await packStore()}; }
    catch(e){ bkp = {mode:null, msg:"QR impossible : "+e.message, code:""}; }
    renderHome();
    const box = app.querySelector(".qrwrap"); if(box) box.scrollIntoView({block:"center"});
  });
  on("bk-out2", ()=>{ bkp.mode = "out"; renderHome(); });
  on("bk-close", ()=>back(""));
  on("bk-copy", async ()=>{
    const ta = app.querySelector("#bk-out"); if(!ta) return;
    ta.focus(); ta.select();
    let ok = false;
    try{ await navigator.clipboard.writeText(ta.value); ok = true; }
    catch(e){ try{ ok = document.execCommand("copy"); }catch(e2){} }
    const btn = app.querySelector("#bk-copy");
    if(btn){ btn.textContent = ok ? "Code copié" : "Copiez-le à la main (Ctrl+C)"; }
  });
  const apply = async (how)=>{
    const ta = app.querySelector("#bk-in"); if(!ta) return;
    let data;
    try{ data = await unpackStore(ta.value); }
    catch(e){ bkp.msg = "Code illisible : vérifiez que tout le code a été collé."; renderHome(); return; }
    if(how === "merge") mergeStore(data); else replaceStore(data);
    save();
    back((how === "merge" ? "Progression fusionnée · " : "Progression remplacée · ") + bkpSummary(data));
  };
  on("bk-merge", ()=>apply("merge"));
  on("bk-repl", ()=>apply("replace"));
}

const escHtml = s => String(s).replace(/[&<>"]/g, ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function loadStore(){
  store = {best:{}, wrong:{}, answered:0, correct:0, stats:{}, help:false};
  try{ const s = JSON.parse(localStorage.getItem(dataKey(profiles.cur))||"null"); if(s) store = Object.assign(store, s); }catch(e){}
  if(!store.stats) store.stats = {};
  if(store.help == null) store.help = false;
}
let prof = {mode:null, armed:false};
function switchProfile(id){
  if(id === profiles.cur) return;
  profiles.cur = id; saveProfiles(); loadStore();
  prof = {mode:null, armed:false}; bkp = {mode:null, msg:"", code:""};
  speechStop(); session = null; view = "home"; render(); window.scrollTo(0,0);
}
function addProfile(name){
  if(profiles.list.length >= MAXP) return;
  name = String(name||"").trim().slice(0,22) || ("Profil " + (profiles.list.length+1));
  const id = "p" + Date.now().toString(36);
  profiles.list.push({id, name}); profiles.cur = id; saveProfiles(); loadStore();
  prof = {mode:null, armed:false}; renderHome();
}
function renameProfile(name){
  name = String(name||"").trim().slice(0,22);
  if(!name) return;
  curProfile().name = name; saveProfiles(); prof = {mode:null, armed:false}; renderHome();
}
function deleteProfile(){
  if(profiles.list.length < 2) return;
  const id = profiles.cur;
  try{ localStorage.removeItem(dataKey(id)); }catch(e){}
  profiles.list = profiles.list.filter(p=>p.id !== id);
  profiles.cur = profiles.list[0].id; saveProfiles(); loadStore();
  prof = {mode:null, armed:false}; renderHome();
}
function profStats(id){
  try{
    const s = JSON.parse(localStorage.getItem(dataKey(id))||"null");
    if(!s || !s.stats) return null;
    return Object.values(s.stats).reduce((a,x)=>({n:a.n+x.n, ok:a.ok+x.ok}), {n:0, ok:0});
  }catch(e){ return null; }
}
function renderProfiles(){
  const chips = profiles.list.map(p=>{
    const st = profStats(p.id);
    return `<button type="button" class="pchip${p.id===profiles.cur?" cur":""}" data-p="${p.id}" aria-pressed="${p.id===profiles.cur}">
      <span>${escHtml(p.name)}</span><b>${st && st.n ? note(st)+"/10" : "—"}</b></button>`;
  }).join("");
  const add = profiles.list.length < MAXP ? `<button type="button" class="pchip padd" id="p-add" aria-label="Ajouter un profil">+</button>` : "";
  let panel = "";
  if(prof.mode === "add"){
    panel = `<div class="pform"><label class="bklab" for="p-name">Prénom ou surnom du nouveau profil</label>
      <input class="pinput" id="p-name" maxlength="22" placeholder="Ex. : Léa" autocomplete="off">
      <div class="bkrow"><button class="btn sm primary" type="button" id="p-create">Créer</button>
      <button class="btn sm" type="button" id="p-cancel">Annuler</button></div>
      <p class="bkhint">Le nouveau profil démarre avec des statistiques vides. Les autres profils ne sont pas touchés.</p></div>`;
  } else if(prof.mode === "manage"){
    panel = `<div class="pform"><label class="bklab" for="p-name">Nom du profil en cours</label>
      <input class="pinput" id="p-name" maxlength="22" value="${escHtml(curProfile().name)}" autocomplete="off">
      <div class="bkrow"><button class="btn sm primary" type="button" id="p-rename">Renommer</button>
      <button class="btn sm" type="button" id="p-del" ${profiles.list.length<2?"disabled":""}>${prof.armed?"Confirmer la suppression":"Supprimer ce profil"}</button>
      <button class="btn sm" type="button" id="p-cancel">Fermer</button></div>
      <p class="bkhint">${profiles.list.length<2 ? "Le dernier profil ne peut pas être supprimé." : "La suppression efface les scores, erreurs et statistiques de ce profil, définitivement."}</p></div>`;
  }
  return `<div class="prof">
    <div class="prow"><span class="eyebrow">Profil</span>
      <div class="pchips" role="group" aria-label="Choisir un profil">${chips}${add}</div>
      <button class="linkbtn" type="button" id="p-manage">Renommer ou supprimer</button></div>
    ${panel}
  </div>`;
}
function bindProfiles(){
  const on = (id, fn)=>{ const el = app.querySelector("#"+id); if(el) el.onclick = fn; };
  app.querySelectorAll(".pchip[data-p]").forEach(b=>b.onclick=()=>switchProfile(b.dataset.p));
  on("p-add", ()=>{ prof = {mode:"add", armed:false}; renderHome(); const i = app.querySelector("#p-name"); if(i) i.focus(); });
  on("p-manage", ()=>{ prof = {mode: prof.mode==="manage" ? null : "manage", armed:false}; renderHome(); });
  on("p-cancel", ()=>{ prof = {mode:null, armed:false}; renderHome(); });
  on("p-create", ()=>addProfile((app.querySelector("#p-name")||{}).value));
  on("p-rename", ()=>renameProfile((app.querySelector("#p-name")||{}).value));
  on("p-del", ()=>{ if(prof.armed) deleteProfile(); else { prof.armed = true; renderHome(); } });
  const inp = app.querySelector("#p-name");
  if(inp) inp.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); (prof.mode==="add" ? addProfile : renameProfile)(inp.value); } };
}

let pendingCode = null;
(function(){
  const m = String(location.hash||"").match(/^#d=(.+)$/);
  if(m){
    pendingCode = decodeURIComponent(m[1]);
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  }
})();
function shareUrl(code){ return location.origin + location.pathname + "#d=" + code; }
function qrSvg(text){
  if(typeof qrcode !== "function") return "";
  try{
    const q = qrcode(0, "L");
    q.addData(text, "Byte"); q.make();
    return q.createSvgTag({cellSize:4, margin:2, scalable:true});
  }catch(e){ return ""; }
}

    <div class="bkrow"><button class="btn sm primary" type="button" id="rc-merge">Fusionner</button>
    <button class="btn sm" type="button" id="rc-repl">Remplacer</button>
    <button class="btn sm" type="button" id="rc-skip">Ignorer</button></div>
    ${bkp.msg ? `<p class="bkmsg">${escHtml(bkp.msg)}</p>` : ""}
  </div>`;
}
function bindRecv(){
  const on = (id, fn)=>{ const el = app.querySelector("#"+id); if(el) el.onclick = fn; };
  const apply = async how => {
    let data;
    try{ data = await unpackStore(pendingCode); }
    catch(e){ pendingCode = null; bkp.msg = "Le lien reçu est illisible."; renderHome(); return; }
    if(how === "merge") mergeStore(data); else replaceStore(data);
    save(); pendingCode = null;
    bkp.msg = (how === "merge" ? "Progression fusionnée · " : "Progression remplacée · ") + bkpSummary(data);
    renderHome();
  };
  on("rc-merge", ()=>apply("merge"));
  on("rc-repl", ()=>apply("replace"));
  on("rc-skip", ()=>{ pendingCode = null; bkp.msg = ""; renderHome(); });
}

/* ---------- synchronisation automatique par dépôt GitHub privé ---------- */
const GKEY = "objectif990-github";
let gh = {repo:"", token:"", last:0};
try{ const g = JSON.parse(localStorage.getItem(GKEY)||"null"); if(g) gh = Object.assign(gh, g); }catch(e){}
function ghSave(){ try{ localStorage.setItem(GKEY, JSON.stringify(gh)); }catch(e){} }
let ghState = {busy:false, msg:"", open:false};
const ghReady = () => !!(gh.repo && gh.token);
const ghPath = () => "progression/" + profiles.cur + ".json";
async function ghCall(method, body){
  const url = "https://api.github.com/repos/" + gh.repo.trim().replace(/^\/+|\/+$/g,"") + "/contents/" + ghPath();
  const res = await fetch(url, {
    method,
    headers: {"Authorization":"token " + gh.token.trim(), "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"},
    body: body ? JSON.stringify(body) : undefined
  });
  if(res.status === 404) return {missing:true};
  if(res.status === 401 || res.status === 403) throw new Error("jeton refusé ou sans droit d'écriture");
  if(!res.ok) throw new Error("GitHub a répondu " + res.status);
  return res.json();
}
/* fusion « au mieux » : pas de double comptage entre les deux appareils */
function mergeRemote(r){
  if(!r) return;
  for(const [k,v] of Object.entries(r.best||{})) if(store.best[k]==null || v > store.best[k]) store.best[k] = v;
  for(const [k,v] of Object.entries(r.stats||{})){
    const cur = store.stats[k];
    if(!cur || v.n > cur.n) store.stats[k] = {n:v.n, ok:v.ok};
  }
  for(const k of Object.keys(r.wrong||{})) store.wrong[k] = 1;
  store.answered = Math.max(store.answered||0, r.answered||0);
  store.correct = Math.max(store.correct||0, r.correct||0);
}
async function ghSync(silent){
  if(!ghReady() || ghState.busy) return;
  ghState.busy = true; if(!silent){ ghState.msg = "Synchronisation…"; renderHome(); }
  try{
    const got = await ghCall("GET");
    let sha = null;
    if(!got.missing){
      sha = got.sha;
      try{ mergeRemote(JSON.parse(decodeURIComponent(escape(atob(String(got.content).replace(/\s/g,"")))))); }catch(e){}
    }
    save();
    const payload = {profil: curProfile().name, maj: new Date().toISOString(), best:store.best, stats:store.stats, wrong:store.wrong, answered:store.answered, correct:store.correct};
    await ghCall("PUT", {message:"progression " + curProfile().name, content: b64enc(new TextEncoder().encode(JSON.stringify(payload))), sha: sha || undefined});
    gh.last = Date.now(); ghSave();
    ghState.msg = "Synchronisé à " + new Date(gh.last).toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"});
  }catch(e){
    ghState.msg = "Échec : " + e.message;
  }
  ghState.busy = false;
  if(view === "home") renderHome(); else if(view === "result" && !silent) renderResult();
}
/* bouton « Enregistrer la progression » : écrit dans le dépôt, ou ouvre la configuration */
function saveNow(){
  save();
  if(!ghReady()){
    ghState = {busy:false, msg:"Renseigne d'abord ton dépôt et ton jeton pour enregistrer en ligne.", open:true};
    view = "home"; render();
    const el = app.querySelector("#gh-repo");
    if(el){ el.scrollIntoView({block:"center"}); el.focus(); }
    return;
  }
  ghSync(false).then(()=>{ if(view === "result") renderResult(); });
}
function renderGh(){
  if(!ghState.open && !ghReady()){
    return `<div class="panel">
      <h3 class="ptitle">Synchroniser PC et téléphone</h3>
      <p>Deux façons de transférer sans rien installer : le <b>QR code</b> affiché avec le code d'export (à scanner avec l'autre appareil), ou une synchronisation automatique par un dépôt GitHub privé qui t'appartient.</p>
      <div class="bkrow"><button class="btn sm" type="button" id="gh-open">Configurer la synchronisation GitHub</button></div>
    </div>`;
  }
  const info = ghReady()
    ? `<p class="bkhint">Dépôt : <b>${escHtml(gh.repo)}</b>${gh.last ? " · dernière synchro le " + new Date(gh.last).toLocaleString("fr-FR") : " · jamais synchronisé"}. La synchronisation se fait à l'ouverture et à la fin de chaque série.</p>`
    : `<p class="bkhint">Crée un dépôt <b>privé</b> sur GitHub (par exemple <code>toeic-progression</code>), puis un jeton d'accès dans Settings → Developer settings → Personal access tokens → Fine-grained tokens, limité à ce dépôt, avec l'autorisation <b>Contents : Read and write</b>. Le jeton reste sur cet appareil : ne le mets pas sur un appareil partagé.</p>`;
  return `<div class="panel bkpanel">
    <h3 class="ptitle">Synchronisation GitHub</h3>
    <label class="bklab" for="gh-repo">Dépôt privé (pseudo/nom-du-depot)</label>
    <input class="pinput" id="gh-repo" value="${escHtml(gh.repo)}" placeholder="thewoodcutter939/toeic-progression" autocomplete="off" spellcheck="false">
    <label class="bklab" for="gh-token">Jeton d'accès</label>
    <input class="pinput" id="gh-token" type="password" value="${escHtml(gh.token)}" placeholder="github_pat_..." autocomplete="off" spellcheck="false">
    <div class="bkrow">
      <button class="btn sm primary" type="button" id="gh-sync" ${ghState.busy?"disabled":""}>${ghReady()?"Synchroniser maintenant":"Connecter et synchroniser"}</button>
      ${ghReady()?`<button class="btn sm" type="button" id="gh-off">Déconnecter cet appareil</button>`:""}
      <button class="btn sm" type="button" id="gh-close">Fermer</button>
    </div>
    ${info}
    ${ghState.msg ? `<p class="bkmsg">${escHtml(ghState.msg)}</p>` : ""}
  </div>`;
}
function bindGh(){
  const on = (id, fn)=>{ const el = app.querySelector("#"+id); if(el) el.onclick = fn; };
  on("gh-open", ()=>{ ghState.open = true; ghState.msg = ""; renderHome(); });
  on("gh-close", ()=>{ ghState.open = false; renderHome(); });
  on("gh-off", ()=>{ gh = {repo:"", token:"", last:0}; ghSave(); ghState = {busy:false, msg:"Appareil déconnecté.", open:true}; renderHome(); });
  on("gh-sync", ()=>{
    const r = app.querySelector("#gh-repo"), t = app.querySelector("#gh-token");
    gh.repo = (r ? r.value : "").trim(); gh.token = (t ? t.value : "").trim();
    if(!gh.repo || !gh.token){ ghState.msg = "Indique le dépôt et le jeton."; renderHome(); return; }
    if(!/^[\w.-]+\/[\w.-]+$/.test(gh.repo)){ ghState.msg = "Le dépôt s'écrit pseudo/nom-du-depot."; renderHome(); return; }
    ghSave(); ghSync(false);
  });
}

document.getElementById("brand").onclick=()=>{speechStop();view="home";render();window.scrollTo(0,0);};
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{speechStop();view=b.dataset.view;render();window.scrollTo(0,0);});
document.addEventListener("keydown",e=>{
  if(view!=="quiz"||!session||e.ctrlKey||e.metaKey||e.altKey) return;
  const tag = (e.target.tagName||"").toLowerCase();
  const k = e.key.toLowerCase();
  const map = {a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3};
  if(k in map){ pick(map[k]); e.preventDefault(); }
  else if(k==="enter"){ if(tag==="button"||tag==="summary") return; next(); e.preventDefault(); }
  else if(k==="arrowright"){ if(session.items[session.i].picked!==null) next(); }
  else if(k==="arrowleft"){ go(session.i-1); }
  else if(k==="h"){ toggleHelp(); e.preventDefault(); }
});

/* état d'ouverture : première visite → accueil ; sinon accueil avec la progression enregistrée */
render();
if(ghReady()) setTimeout(()=>ghSync(true), 800);
</script>
