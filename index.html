<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2A5C">
<meta name="description" content="Révision TOEIC : 3 800 questions en séries de 20, explications en français, statistiques par partie.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Objectif 990">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Objectif 990 Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600..900&family=Nunito+Sans:opsz,wght@6..12,400..800&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Version téléphone — thème clair ECAM (bleu profond + orange), tout en une colonne */
:root{
  color-scheme: light;
  --navy:#0E2A5C;
  --navy2:#163A7A;
  --orange:#DA532C;
  --paper:#FFFFFF;
  --surface:#FFFFFF;
  --surface2:#F1F4FA;
  --sheet:#F6F8FC;
  --line:#DDE3EE;
  --text:#14213D;
  --muted:#5B6782;
  --good:#17804A;
  --good-bg:#E6F4EC;
  --bad:#C62D2D;
  --bad-bg:#FCEBEA;
  --warn:#A8620A;
  --warn-bg:#FDF1DF;
  --mark:rgba(218,83,44,.22);
  --c-grammar:#1D4FA8;
  --c-vocab:#C8461F;
  --c-reading:#2A7FBF;
  --c-listening:#0F7F7A;
  --c-tips:#D07A12;
  --ink:#0E2A5C;
  --ink-soft:rgba(14,42,92,.10);
  --shadow:0 1px 2px rgba(14,42,92,.06),0 6px 18px rgba(14,42,92,.06);
  --top:calc(env(safe-area-inset-top,0px));
  --bot:calc(env(safe-area-inset-bottom,0px));
  --display:"Nunito","Varela Round","Segoe UI",Arial,sans-serif;
  --ui:"Nunito Sans","Segoe UI",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
body[data-g="grammar"],[data-g="grammar"]{--ink:var(--c-grammar);--ink-soft:rgba(29,79,168,.11)}
body[data-g="vocab"],[data-g="vocab"]{--ink:var(--c-vocab);--ink-soft:rgba(200,70,31,.11)}
body[data-g="reading"],[data-g="reading"]{--ink:var(--c-reading);--ink-soft:rgba(42,127,191,.12)}
body[data-g="listening"],[data-g="listening"]{--ink:var(--c-listening);--ink-soft:rgba(15,127,122,.12)}
body[data-g="tips"],[data-g="tips"]{--ink:var(--c-tips);--ink-soft:rgba(208,122,18,.13)}
body[data-g="mix"],[data-g="mix"]{--ink:var(--orange);--ink-soft:rgba(218,83,44,.11)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
body{background:var(--paper);color:var(--text);font:16px/1.5 var(--ui);padding-inline:14px;padding-block:0;margin:0;
  padding-bottom:calc(40px + var(--bot));-webkit-text-size-adjust:100%;overflow-x:hidden}
body.inquiz{padding-bottom:calc(96px + var(--bot))}
.wrap{max-width:620px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.12;letter-spacing:-.01em;color:var(--navy);text-wrap:balance}
::selection{background:var(--orange);color:#fff}

.marks{height:4px;margin-inline:-14px;background:linear-gradient(90deg,var(--navy) 0 25%,var(--navy2) 25% 50%,var(--c-reading) 50% 75%,var(--orange) 75% 100%)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;padding-top:calc(10px + var(--top));
  background:var(--navy);box-shadow:0 0 0 100vmax var(--navy);clip-path:inset(0 -100vmax);color:#fff}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:0;background:none;border:0;padding:0;color:#fff}
.brand b{font-family:var(--display);font-weight:800;font-size:21px;text-transform:lowercase;white-space:nowrap}
.brand b em{font-style:normal;color:var(--orange)}
.brand span{display:none}
nav.tabs{display:flex;gap:6px}
nav.tabs button{background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;color:#fff}
nav.tabs button[aria-current="true"]{background:var(--orange);border-color:var(--orange)}

.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
.muted{color:var(--muted)}

/* ACCUEIL */
.intro{padding-block:20px 16px;display:grid;gap:14px}
.bubbles{display:flex;gap:7px}
.bubbles i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 12px/1 var(--display);font-style:normal;color:#fff}
.bubbles i:nth-child(1){background:var(--navy)}
.bubbles i:nth-child(2){background:var(--navy2)}
.bubbles i:nth-child(3){background:var(--c-reading)}
.bubbles i:nth-child(4){background:var(--orange)}
.intro h1{font-weight:900;font-size:clamp(30px,9vw,40px);text-transform:lowercase}
.intro h1 span{color:var(--orange)}
.intro p{max-width:40ch;margin:0;color:var(--muted);font-size:14.5px}
.intro p b{color:var(--text)}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tally div{padding:11px 10px;display:flex;flex-direction:column;gap:1px;background:var(--surface2);border-radius:12px;border-top:3px solid var(--navy)}
.tally div:nth-child(2){border-top-color:var(--orange)}
.tally div:nth-child(3){border-top-color:var(--c-reading)}
.tally strong{font-family:var(--display);font-weight:900;font-size:23px;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--navy)}
.tally strong em{font-style:normal;font-size:12px;color:var(--muted);font-weight:600}
.tally small{font-size:11.5px;color:var(--muted);line-height:1.25}
.quick{display:grid;gap:8px;padding-bottom:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 18px;font-weight:700;font-size:15px;
  border:1.5px solid var(--ink);background:#fff;color:var(--ink);min-height:46px}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn:disabled{opacity:.4}
.btn .k{font-family:var(--mono);font-size:11px;opacity:.75}
.btn.sm{padding:8px 14px;font-size:13.5px;min-height:38px}

section.group{padding-block:20px;border-top:1px solid var(--line)}
.ghead{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.ghead h2{font-weight:900;font-size:23px;display:flex;align-items:center;gap:10px}
.ghead h2::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--ink-soft);flex:none}
.cats{display:grid;gap:10px}
.cat{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);
  border-top:3px solid var(--ink);border-radius:14px;padding:13px 13px 12px;box-shadow:var(--shadow)}
.cat:active{transform:scale(.995)}
.cat h3{font-size:17.5px;font-weight:800}
.cat .meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cat .meta .eyebrow{font-size:10px}
.cstat{display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px;font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cstat .pill{font-family:var(--ui);margin-left:auto}
.serlab{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ser{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:46px;background:var(--surface2);
  border:1px solid transparent;border-radius:11px;padding:6px 2px;color:var(--navy)}
.ser span{font-family:var(--display);font-size:16px;font-weight:800;line-height:1.1}
.ser b{font-family:var(--mono);font-weight:400;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.ser:active{background:var(--ink-soft)}
.ser.done{background:var(--ink-soft);color:var(--ink)}
.ser.done b{color:var(--text)}
.ser.full{background:var(--ink);color:#fff}
.ser.full b{color:#fff}
.mixbtn{background:#fff;border:1px dashed var(--ink);border-radius:11px;padding:11px 10px;font-size:14px;font-weight:700;color:var(--ink);text-align:center;min-height:44px}

/* TABLEAU DE BORD */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.dash{display:grid;gap:10px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.plist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.plist li:last-child{padding-bottom:0;border-bottom:0}
.plist b{grid-column:1;grid-row:1;font-family:var(--display);font-weight:800;font-size:16px;color:var(--navy);display:flex;align-items:center;gap:7px}
.plist b .dot{width:9px;height:9px;border-radius:50%;flex:none}
.plist .sub{grid-column:1;grid-row:2;font-size:12px;color:var(--muted);padding-left:16px}
.plist .sc{grid-column:2;grid-row:1 / span 2;text-align:right;align-self:center;font-family:var(--display);font-weight:900;font-size:20px;font-variant-numeric:tabular-nums}
.plist .sc small{font-family:var(--ui);font-weight:600;font-size:11px;color:var(--muted);margin-left:1px}
.plist .sc.lvl-good{color:var(--good)} .plist .sc.lvl-warn{color:var(--warn)} .plist .sc.lvl-bad{color:var(--bad)}
.plist .line{grid-column:1 / -1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plist .line .nbar{flex:1 1 90px}
.plist .cnt{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.nbar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;max-width:none}
.nbar i{display:block;height:100%;background:var(--muted);border-radius:3px}
.nbar.lvl-good i{background:var(--good)} .nbar.lvl-warn i{background:#E0922A} .nbar.lvl-bad i{background:var(--bad)}
.ok{color:var(--good)} .ko{color:var(--bad)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;line-height:1.4;padding:2px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.lvl-good{color:var(--good);background:var(--good-bg)}
.pill.lvl-warn{color:var(--warn);background:var(--warn-bg)}
.pill.lvl-bad{color:var(--bad);background:var(--bad-bg)}
.pill.lvl-na{color:var(--muted);border:1px solid var(--line);font-weight:600}
.ptitle{font-size:16px;font-weight:900;margin-bottom:8px}
.prio{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:10px}
.prio li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.prio li div{display:flex;flex-direction:column;min-width:0}
.prio li b{font-weight:700;font-size:14.5px}
.prio li span{font-size:12px;color:var(--muted)}
.prio li .btn{grid-column:1 / -1;justify-self:start}
.panel p{margin:0 0 10px;font-size:14px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:6px 0;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.linkbtn.armed{color:var(--bad);font-weight:700}

/* QUIZ */
.qtop{display:flex;align-items:center;gap:8px;padding-block:8px;padding-top:calc(8px + var(--top));position:sticky;top:0;z-index:5;
  background:rgba(255,255,255,.94);backdrop-filter:blur(8px);margin-inline:-14px;padding-inline:14px;border-bottom:1px solid var(--line)}
.ico{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--navy);font-size:19px;line-height:1;
  display:grid;place-items:center}
.ico:disabled{opacity:.35}
.ico:active:not(:disabled){background:var(--surface2)}
.qinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.qinfo b{font-family:var(--display);font-weight:800;font-size:15px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qinfo span{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{display:flex;align-items:center;gap:6px;flex:none;height:40px;padding:0 12px;border-radius:999px;border:1.5px solid #C9A200;background:#fff;
  color:#6B5600;font-weight:700;font-size:13.5px}
.hbtn .sw{width:24px;height:14px;border-radius:999px;background:#D6DCE8;position:relative;flex:none;transition:background .15s}
.hbtn .sw::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.hbtn[aria-pressed="true"]{background:#FFE45C;border-color:#E2B500;color:#3D3100}
.hbtn[aria-pressed="true"] .sw{background:#3D3100}
.hbtn[aria-pressed="true"] .sw::after{transform:translateX(10px);background:#FFE45C}

.qnav{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:10px 0 12px;margin-inline:-14px;padding-inline:14px}
.qnav::-webkit-scrollbar{display:none}
.qn{flex:none;min-width:34px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--muted);
  font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;display:grid;place-items:center}
.qn.g{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.qn.x{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:700}
.qn.cur{outline:2px solid var(--ink);outline-offset:1px;color:var(--navy);font-weight:700}

.page{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.page .strip{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;background:var(--ink);font-family:var(--mono);font-size:10px;
  letter-spacing:.07em;text-transform:uppercase;color:#fff}
.page .body{padding:16px 14px 20px;display:flex;flex-direction:column;gap:14px}
details.rule{border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:14px;background:var(--sheet)}
details.rule summary{cursor:pointer;font-weight:700;color:var(--ink);min-height:24px}
details.rule div{padding-top:8px;color:var(--muted)}
details.rule div b{color:var(--text)}
.passage{font-family:var(--serif);font-size:16px;line-height:1.65;background:var(--sheet);color:var(--text);border:1px solid var(--line);
  border-radius:11px;padding:14px;max-height:44vh;overflow:auto;white-space:pre-line;-webkit-overflow-scrolling:touch}
.passage .hdr{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:block;white-space:pre-line;margin-bottom:8px}
.gap{font-family:var(--mono);font-size:12.5px;padding:0 4px;border-radius:4px;white-space:nowrap;background:rgba(14,42,92,.08)}
.gap.on{background:var(--ink);color:#fff;font-weight:600}
.stem{display:flex;gap:10px;align-items:baseline}
.stem .no{font-family:var(--display);font-weight:900;font-size:16px;color:var(--ink);flex:none}
.stem p{margin:0;font-family:var(--serif);font-size:19px;line-height:1.45}
.stem p b{color:var(--ink)}
.blank{letter-spacing:.06em;white-space:nowrap;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:13px 12px;font-family:var(--serif);font-size:18px;min-height:52px}
.opt:active:not(:disabled){background:var(--ink-soft)}
.opt:disabled{cursor:default}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:800 13px/1 var(--display);color:var(--ink)}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.hidden-txt{color:var(--muted);font-family:var(--ui);font-size:14px;font-style:italic}
.listen{display:flex;gap:8px;flex-wrap:wrap}
.listen .btn{flex:1 1 140px}
.explain{border-radius:12px;background:var(--sheet);border-left:4px solid var(--orange);padding:14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.verdict{font-family:var(--display);font-weight:900;font-size:16.5px}
.verdict.ok{color:var(--good)}
.verdict.ko{color:var(--bad)}
.explain p{margin:0}
.explain b{background:linear-gradient(transparent 58%,var(--mark) 58%);font-weight:700;color:var(--text)}
.explain .tr{font-family:var(--serif);font-style:italic;color:var(--muted)}
.explain .script{font-family:var(--serif);font-size:15px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px}


/* SAUVEGARDE */
.bkpanel{display:grid;gap:10px}
.bkrow{display:flex;flex-wrap:wrap;gap:8px}
.bklab{font-size:13px;color:var(--muted)}
.bkta{width:100%;font-family:var(--mono);font-size:12px;line-height:1.4;padding:10px;border:1px solid var(--line);
  border-radius:10px;background:var(--sheet);color:var(--text);resize:vertical;word-break:break-all}
.bkta:focus{outline:2px solid var(--orange);outline-offset:1px}
.bkhint{font-size:12.5px}
.bkmsg{margin:0;font-size:13.5px;font-weight:700;color:var(--good)}


/* PROFILS */
.prof{display:grid;gap:8px;padding-block:12px;border-bottom:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchip{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1.5px solid transparent;border-radius:999px;
  padding:7px 14px;font-weight:700;font-size:14px;color:var(--navy);min-height:38px}
.pchip b{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.pchip:hover{border-color:var(--ink)}
.pchip.cur{background:var(--navy);color:#fff;border-color:var(--navy)}
.pchip.cur b{color:rgba(255,255,255,.75)}
.pchip.padd{font-size:17px;padding:7px 15px;color:var(--ink);border:1.5px dashed var(--ink);background:#fff}
.prow .linkbtn{margin-left:auto}
.pform{display:grid;gap:8px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px;max-width:520px}
.pinput{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);width:100%;max-width:280px}
.pinput:focus{outline:2px solid var(--orange);outline-offset:1px}


/* QR ET SYNCHRO */
.btn.save{border-color:var(--c-listening);color:var(--c-listening)}
.btn.save:hover:not(:disabled){background:rgba(15,127,122,.10)}
.qrwrap{display:grid;gap:8px;justify-items:start}
.qrbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;line-height:0}
.qrbox svg{width:100%;max-width:240px;height:auto;display:block}
.qrwrap.big{justify-items:center;width:100%}
.qrwrap.big .qrbox{padding:14px}
.qrwrap.big .qrbox svg{max-width:min(340px,80vw)}
.qrwrap.big .bkhint{max-width:44ch;text-align:center}
.recv{border-color:#F0D65A;background:#FFFBE8}
.recv .ptitle{color:#7A6200}

body.inquiz header.top,body.inquiz .marks{display:none}
/* barre d'action fixe */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:10px;padding:10px 14px;
  padding-bottom:calc(10px + var(--bot));background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.bar .btn{flex:1}
.bar .ico{width:46px;height:46px}

/* AIDE */
mark.hl{background:#FFE45C;color:inherit;border-radius:3px;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark.hl.suf{background:#FFF1A6;padding:0;border-radius:2px;box-shadow:inset 0 -2px 0 #E2B500}
mark.hl.kw{background:#FFEC85}
.hints{border:1px solid #F0D65A;background:#FFFBE8;border-radius:11px;padding:10px 12px;display:grid;gap:6px}
.hints .hh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.hints .eyebrow{color:#7A6200}
.hints small{font-size:11px;color:var(--muted)}
.hints ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hints li{display:grid;gap:2px;font-size:13.5px}
.hints li > span:first-child{font-family:var(--serif);font-size:15px}
.hints p{margin:0;font-size:13.5px;color:var(--muted)}

/* RÉSULTAT */
.result{padding-block:20px;display:grid;gap:18px}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score strong{font-family:var(--display);font-weight:900;font-size:56px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.score span{font-size:16px;color:var(--muted)}
.errs{display:grid;gap:10px}
.err{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:12px;padding:12px;display:grid;gap:6px}
.err .q{font-family:var(--serif);font-size:16px}
.err .a{font-size:14px}
.err .a em{font-style:normal;color:var(--bad);text-decoration:line-through}
.err .a strong{color:var(--good)}
.err .x{font-size:14px;color:var(--muted)}
.err .x b{color:var(--text)}
.actions{display:flex;flex-direction:column;gap:8px}

/* FICHES */
.tips{display:grid;gap:14px;padding-block:18px}
.tipnav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-14px;padding:0 14px 2px}
.tipnav::-webkit-scrollbar{display:none}
.tipnav button{flex:none;background:var(--surface2);border:0;border-radius:999px;padding:9px 14px;color:var(--muted);font-weight:700;font-size:13.5px;white-space:nowrap;min-height:40px}
.tipnav button span{display:none}
.tipnav button[aria-current="true"]{background:var(--navy);color:#fff}
.fiche{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--orange);border-radius:16px;padding:16px 14px;display:grid;gap:14px;box-shadow:var(--shadow)}
.fiche h2{font-weight:900;font-size:25px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts span{font-family:var(--mono);font-size:11.5px;background:var(--surface2);border-radius:999px;padding:4px 10px;color:var(--navy)}
.fiche ul{margin:0;padding-left:0;list-style:none;display:grid;gap:11px}
.fiche li{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;font-size:15px}
.fiche li::before{content:"";width:9px;height:9px;margin-top:6px;border-radius:50%;background:var(--orange)}
.fiche li b{font-weight:700;color:var(--navy)}
.fiche table{border-collapse:collapse;font-size:13.5px;width:100%;min-width:360px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.fiche th,.fiche td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.fiche th{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--navy);font-weight:500}
.fiche td:first-child{font-weight:700;white-space:nowrap;color:var(--navy)}
.fiche .ex{font-family:var(--serif);font-style:italic;color:var(--muted)}

@media (min-width:620px){
  .cats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar{max-width:620px;margin:0 auto;border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/*DATA*/
const CATS = [{"id":"forms","group":"grammar","title":"Formes des mots","part":"Part 5","start":101,"rule":"Repérez la <b>place</b> du blanc : devant un nom → adjectif ; après un article/possessif → nom ; autour d'un verbe → adverbe (-ly). Suffixes : <b>-tion, -ment, -ness, -ity</b> = nom · <b>-ive, -ous, -able, -ful, -al</b> = adjectif · <b>-ly</b> = adverbe · <b>-ize, -en, -ify</b> = verbe.","qs":[{"q":"The new software allows employees to work more ___ from home.","o":["efficiently","efficient","efficiency","efficiencies"],"e":"Le blanc modifie le verbe <b>work</b> → il faut un <b>adverbe</b> : efficiently.","tr":"Le nouveau logiciel permet aux employés de travailler plus efficacement depuis chez eux."},{"q":"Ms. Tanaka gave a very ___ presentation on the quarterly results.","o":["informative","inform","information","informatively"],"e":"Entre « very » et le nom <b>presentation</b> → <b>adjectif</b> : informative.","tr":"Mme Tanaka a fait une présentation très instructive sur les résultats trimestriels."},{"q":"The ___ of the new branch is scheduled for next spring.","o":["opening","open","opened","opens"],"e":"Structure <b>The ___ of</b> → il faut un <b>nom</b>. « Opening » (l'ouverture) est ici un nom.","tr":"L'ouverture de la nouvelle agence est prévue pour le printemps prochain."},{"q":"Please make sure the forms are ___ before submitting them.","o":["complete","completely","completion","completing"],"e":"Après le verbe <b>be</b> (are), on attend un <b>adjectif attribut</b> : complete (= remplis entièrement).","tr":"Veuillez vous assurer que les formulaires sont complets avant de les soumettre."},{"q":"The marketing team worked ___ to meet the deadline.","o":["tirelessly","tireless","tirelessness","tire"],"e":"Le blanc suit le verbe <b>worked</b> et le décrit → <b>adverbe</b> en -ly.","tr":"L'équipe marketing a travaillé sans relâche pour respecter l'échéance."},{"q":"Customer ___ has improved since the new policy was introduced.","o":["satisfaction","satisfy","satisfied","satisfying"],"e":"Il faut un <b>nom sujet</b> du verbe « has improved ». <b>Customer satisfaction</b> est un nom composé très fréquent au TOEIC.","tr":"La satisfaction client s'est améliorée depuis l'introduction de la nouvelle politique."},{"q":"The company is ___ to announce the launch of its new product line.","o":["pleased","please","pleasing","pleasure"],"e":"Pour exprimer ce que <b>ressent</b> le sujet, on utilise l'adjectif en <b>-ed</b> (pleased). L'adjectif en -ing décrit ce qui provoque le sentiment.","tr":"L'entreprise a le plaisir d'annoncer le lancement de sa nouvelle gamme."},{"q":"The CEO spoke ___ about the company's future.","o":["confidently","confident","confidence","confide"],"e":"Le blanc décrit la manière de parler (verbe spoke) → <b>adverbe</b>.","tr":"Le PDG a parlé avec assurance de l'avenir de l'entreprise."},{"q":"We received a ___ response from the client.","o":["positive","positively","positivity","positives"],"e":"Entre l'article « a » et le nom <b>response</b> → <b>adjectif</b>.","tr":"Nous avons reçu une réponse positive du client."},{"q":"The ___ of the new system took three months.","o":["installation","install","installed","installs"],"e":"Structure <b>The ___ of</b> → <b>nom</b> en -tion.","tr":"L'installation du nouveau système a pris trois mois."},{"q":"Please handle the fragile items ___.","o":["carefully","careful","care","carefulness"],"e":"Le blanc modifie le verbe <b>handle</b> → <b>adverbe</b>.","tr":"Veuillez manipuler les objets fragiles avec précaution."},{"q":"Our products are known for their ___.","o":["reliability","reliable","reliably","rely"],"e":"Après le possessif <b>their</b> → <b>nom</b> (-ity).","tr":"Nos produits sont réputés pour leur fiabilité."},{"q":"The hotel staff were extremely ___ during our stay.","o":["helpful","help","helpfully","helpfulness"],"e":"Après <b>be + extremely</b> → <b>adjectif</b> attribut.","tr":"Le personnel de l'hôtel a été extrêmement serviable pendant notre séjour."},{"q":"Ms. Durand is ___ for organizing the annual conference.","o":["responsible","responsibility","responsibly","respond"],"e":"<b>Be responsible for</b> = être chargé de → <b>adjectif</b>.","tr":"Mme Durand est chargée d'organiser la conférence annuelle."},{"q":"The board will ___ the proposal at its next meeting.","o":["evaluate","evaluation","evaluative","evaluator"],"e":"Après le modal <b>will</b> → <b>verbe</b> à la base verbale.","tr":"Le conseil évaluera la proposition lors de sa prochaine réunion."},{"q":"Prices have increased ___ over the past year.","o":["significantly","significant","significance","signify"],"e":"Le blanc modifie le verbe <b>increased</b> → <b>adverbe</b>.","tr":"Les prix ont considérablement augmenté au cours de l'année écoulée."},{"q":"The factory is looking for ___ workers.","o":["skilled","skill","skills","skillfully"],"e":"Devant le nom <b>workers</b> → <b>adjectif</b> (participe passé adjectival : qualifié).","tr":"L'usine recherche des ouvriers qualifiés."},{"q":"Visitors must show a valid form of ___ at the entrance.","o":["identification","identify","identifiable","identified"],"e":"Après la préposition <b>of</b> → <b>nom</b>.","tr":"Les visiteurs doivent présenter une pièce d'identité valide à l'entrée."},{"q":"The new manager has made several ___ to the workflow.","o":["improvements","improve","improved","improving"],"e":"Après <b>several</b> → <b>nom pluriel</b> (-ments). « Make improvements » est une collocation.","tr":"Le nouveau responsable a apporté plusieurs améliorations au processus."},{"q":"The instructions were written ___ so that everyone could understand them.","o":["clearly","clear","clarity","clarify"],"e":"Le blanc décrit la manière d'écrire (were written) → <b>adverbe</b>.","tr":"Les instructions étaient rédigées clairement pour que tout le monde les comprenne."},{"q":"Mr. Wong is a very ___ negotiator.","o":["persuasive","persuade","persuasion","persuasively"],"e":"Entre <b>very</b> et le nom <b>negotiator</b> → <b>adjectif</b> (-ive).","tr":"M. Wong est un négociateur très convaincant."},{"q":"The company offers ___ salaries to attract talented staff.","o":["competitive","compete","competition","competitively"],"e":"Devant le nom <b>salaries</b> → <b>adjectif</b>.","tr":"L'entreprise propose des salaires compétitifs pour attirer des talents."},{"q":"Our goal is to ___ the production process.","o":["simplify","simple","simply","simplicity"],"e":"Après <b>to</b> (infinitif) → <b>verbe</b> (-ify).","tr":"Notre objectif est de simplifier le processus de production."},{"q":"The ___ of the project depends on adequate funding.","o":["success","succeed","successful","successfully"],"e":"Structure <b>The ___ of</b> → <b>nom</b>.","tr":"La réussite du projet dépend d'un financement suffisant."},{"q":"The report was ___ reviewed by the legal department.","o":["thoroughly","thorough","thoroughness","most thorough"],"e":"Entre <b>was</b> et le participe <b>reviewed</b> → <b>adverbe</b>.","tr":"Le rapport a été examiné en détail par le service juridique."},{"q":"All employees should read the safety guidelines ___.","o":["attentively","attentive","attention","attend"],"e":"En fin de phrase, le blanc décrit la manière de lire → <b>adverbe</b>.","tr":"Tous les employés doivent lire attentivement les consignes de sécurité."},{"q":"The marketing campaign was highly ___.","o":["effective","effect","effectively","effectiveness"],"e":"Après <b>was highly</b> → <b>adjectif</b> attribut.","tr":"La campagne marketing a été très efficace."},{"q":"Ms. Rivera made a ___ contribution to the team's success.","o":["considerable","consider","considerably","consideration"],"e":"Entre <b>a</b> et le nom <b>contribution</b> → <b>adjectif</b>.","tr":"Mme Rivera a apporté une contribution considérable au succès de l'équipe."},{"q":"Our ___ to quality has made us an industry leader.","o":["commitment","commit","committed","commits"],"e":"Après le possessif <b>Our</b>, sujet de « has made » → <b>nom</b>.","tr":"Notre engagement envers la qualité a fait de nous un leader du secteur."},{"q":"Applicants must have a ___ knowledge of Spanish.","o":["basic","bases","basically","basis"],"e":"Devant le nom <b>knowledge</b> → <b>adjectif</b>.","tr":"Les candidats doivent avoir des notions de base en espagnol."},{"q":"The results were ___ better than we had expected.","o":["slightly","slight","slightest","slighted"],"e":"Le blanc modifie le comparatif <b>better</b> → <b>adverbe</b>.","tr":"Les résultats ont été légèrement meilleurs que prévu."},{"q":"Mr. Adams responded ___ to the customer's complaint.","o":["promptly","prompt","prompting","promptness"],"e":"Le blanc modifie le verbe <b>responded</b> → <b>adverbe</b>.","tr":"M. Adams a répondu rapidement à la réclamation du client."},{"q":"The company has a strong ___ in Asia.","o":["presence","present","presently","presented"],"e":"Après l'adjectif <b>strong</b> → <b>nom</b> (-ence).","tr":"L'entreprise est bien implantée en Asie."},{"q":"The new policy is ___ to all employees.","o":["applicable","apply","application","applicably"],"e":"Après <b>is</b> → <b>adjectif</b> (-able). « Applicable to » = qui s'applique à.","tr":"La nouvelle politique s'applique à tous les employés."},{"q":"The director gave a ___ speech at the ceremony.","o":["memorable","memory","memorize","memorably"],"e":"Devant le nom <b>speech</b> → <b>adjectif</b>.","tr":"Le directeur a prononcé un discours mémorable lors de la cérémonie."},{"q":"Please make a ___ decision before Friday.","o":["final","finally","finalize","finality"],"e":"Devant le nom <b>decision</b> → <b>adjectif</b>.","tr":"Merci de prendre une décision définitive avant vendredi."},{"q":"The ___ for the position must have five years of experience.","o":["applicant","apply","applicable","applied"],"e":"Après <b>The</b>, sujet de « must have » et désignant une <b>personne</b> → nom en -ant.","tr":"Le candidat au poste doit avoir cinq ans d'expérience."},{"q":"Online sales have grown ___ since the website was redesigned.","o":["steadily","steady","steadiness","steadied"],"e":"Le blanc modifie <b>have grown</b> → <b>adverbe</b>.","tr":"Les ventes en ligne progressent régulièrement depuis la refonte du site."},{"q":"It is ___ to wear protective glasses in the laboratory.","o":["mandatory","mandate","mandates","mandatorily"],"e":"Structure <b>It is + adjectif + to</b> → <b>adjectif</b>.","tr":"Le port de lunettes de protection est obligatoire au laboratoire."},{"q":"The committee reached a ___ agreement after long discussions.","o":["mutual","mutually","mutuality","mutualize"],"e":"Devant le nom <b>agreement</b> → <b>adjectif</b>.","tr":"Le comité est parvenu à un accord mutuel après de longues discussions."},{"q":"Mr. Hassan works ___ with the design team.","o":["closely","close","closeness","closed"],"e":"<b>Work closely with</b> = travailler en étroite collaboration → <b>adverbe</b>.","tr":"M. Hassan travaille en étroite collaboration avec l'équipe de conception."},{"q":"The hotel is ___ located near the train station.","o":["conveniently","convenient","convenience","convene"],"e":"Entre <b>is</b> et le participe <b>located</b> → <b>adverbe</b>.","tr":"L'hôtel est idéalement situé près de la gare."},{"q":"The ___ of the new factory will create 200 jobs.","o":["construction","construct","constructive","constructively"],"e":"Structure <b>The ___ of</b> → <b>nom</b>.","tr":"La construction de la nouvelle usine créera 200 emplois."},{"q":"Please be ___ when you speak with clients.","o":["courteous","courteously","courtesy","courteousness"],"e":"Après <b>be</b> → <b>adjectif</b> attribut.","tr":"Soyez courtois lorsque vous parlez aux clients."},{"q":"The company has been ___ profitable for five years.","o":["consistently","consistent","consistency","consist"],"e":"Le blanc modifie l'adjectif <b>profitable</b> → <b>adverbe</b>.","tr":"L'entreprise est rentable de façon constante depuis cinq ans."},{"q":"The ___ was postponed because of the storm.","o":["shipment","shipments","shipped","shippable"],"e":"Après <b>The</b> → <b>nom</b> ; le verbe <b>was</b> impose le <b>singulier</b>.","tr":"L'expédition a été reportée à cause de la tempête."},{"q":"The new equipment will make our workers more ___.","o":["productive","produce","production","productively"],"e":"<b>Make + objet + adjectif</b> (rendre qqn + adj.) → <b>adjectif</b>.","tr":"Le nouvel équipement rendra nos ouvriers plus productifs."},{"q":"The museum is ___ closed on Mondays.","o":["normally","normal","normality","normalize"],"e":"Entre <b>is</b> et <b>closed</b> → <b>adverbe</b>.","tr":"Le musée est normalement fermé le lundi."},{"q":"We apologize for the ___ in processing your order.","o":["delay","delayed","delaying","delayable"],"e":"Après <b>the</b> et avant <b>in</b> → <b>nom</b>.","tr":"Nous nous excusons pour le retard de traitement de votre commande."},{"q":"The ___ agreed to extend the contract for another year.","o":["negotiators","negotiate","negotiable","negotiation"],"e":"Sujet du verbe <b>agreed</b> : il faut des <b>personnes</b> capables de se mettre d'accord → negotiators.","tr":"Les négociateurs ont accepté de prolonger le contrat d'un an."},{"q":"Ms. Chen is ___ qualified for the position.","o":["highly","high","height","heighten"],"e":"Le blanc modifie l'adjectif <b>qualified</b> → <b>adverbe</b>. « Highly qualified » est une collocation.","tr":"Mme Chen est hautement qualifiée pour le poste."},{"q":"The ___ of the report is due on Monday.","o":["submission","submit","submissive","submitted"],"e":"Structure <b>The ___ of</b> → <b>nom</b>.","tr":"La remise du rapport est attendue lundi."},{"q":"The restaurant received ___ reviews from critics.","o":["favorable","favor","favorably","favors"],"e":"Devant le nom <b>reviews</b> → <b>adjectif</b>.","tr":"Le restaurant a reçu des critiques favorables."},{"q":"Staff members must dress ___ for client meetings.","o":["appropriately","appropriate","appropriateness","appropriation"],"e":"Le blanc modifie le verbe <b>dress</b> → <b>adverbe</b>.","tr":"Le personnel doit porter une tenue adaptée pour les rendez-vous clients."},{"q":"The company plans to ___ its operations into South America.","o":["expand","expansion","expansive","expansively"],"e":"Après <b>plans to</b> → <b>verbe</b>.","tr":"L'entreprise prévoit d'étendre ses activités en Amérique du Sud."},{"q":"Profits rose due to ___ demand for electric vehicles.","o":["increasing","increase","increasingly","increases"],"e":"Devant le nom <b>demand</b> → <b>adjectif</b> (participe en -ing : une demande qui augmente).","tr":"Les bénéfices ont augmenté grâce à la demande croissante de véhicules électriques."},{"q":"The ___ between the two companies lasted ten years.","o":["partnership","partner","partnered","partners"],"e":"Il faut un <b>nom</b> désignant une <b>relation</b> qui peut « durer » → partnership (-ship).","tr":"Le partenariat entre les deux entreprises a duré dix ans."},{"q":"The documents must be stored ___.","o":["securely","secure","security","securities"],"e":"Le blanc décrit la manière de stocker → <b>adverbe</b>.","tr":"Les documents doivent être conservés en lieu sûr."},{"q":"Mr. Blake is an ___ speaker who has presented at many conferences.","o":["experienced","experience","experiencing","experiential"],"e":"Devant le nom <b>speaker</b> → <b>adjectif</b> ; « experienced » = expérimenté.","tr":"M. Blake est un orateur expérimenté qui a participé à de nombreuses conférences."},{"q":"The ___ of the event was praised by all participants.","o":["organization","organize","organized","organizational"],"e":"Structure <b>The ___ of</b> → <b>nom</b>.","tr":"L'organisation de l'événement a été saluée par tous les participants."},{"q":"Our team responded ___ to the customer's request.","o":["quickly","quick","quickness","quicken"],"e":"Modifie le verbe <b>responded</b> → adverbe.","tr":"Notre équipe a répondu rapidement à la demande du client."},{"q":"The new manager made an ___ decision.","o":["important"," should dress ___.","o":["neatly","neat","neatness","neaten"],"e":"Modifie le verbe <b>dress</b> → adverbe.","tr":"Le personnel doit avoir une tenue soignée."},{"q":"The ___ results will be announced tomorrow.","o":["official","officially","office","officiate"],"e":"Devant le nom <b>results</b> → adjectif.","tr":"Les résultats officiels seront annoncés demain."},{"q":"The company's ___ to the environment is well known.","o":["dedication","dedicate","dedicated","dedicating"],"e":"Après le possessif, sujet de <b>is</b> → nom.","tr":"L'engagement de l'entreprise pour l'environnement est bien connu."},{"q":"The new model is ___ priced.","o":["reasonably","reasonable","reason","reasoning"],"e":"Devant le participe <b>priced</b> → adverbe.","tr":"Le nouveau modèle est vendu à un prix raisonnable."},{"q":"The conference was attended by ___ from 20 countries.","o":["participants","participate","participation","participatory"],"e":"Après <b>by</b> et désignant des personnes → nom.","tr":"La conférence a réuni des participants de 20 pays."},{"q":"The company is ___ committed to quality.","o":["deeply","deep","depth","deepen"],"e":"Devant le participe <b>committed</b> → adverbe.","tr":"L'entreprise est profondément attachée à la qualité."},{"q":"Please be ___ when handling chemicals.","o":["cautious","caution","cautiously","cautiousness"],"e":"Après <b>be</b> → adjectif.","tr":"Soyez prudent lorsque vous manipulez des produits chimiques."},{"q":"The printer is not working ___.","o":["properly","proper","property","propriety"],"e":"Modifie <b>is working</b> → adverbe.","tr":"L'imprimante ne fonctionne pas correctement."},{"q":"Ms. Hall is ___ in three languages.","o":["fluent","fluently","fluency","fluentness"],"e":"Après <b>is</b> → adjectif (fluent in).","tr":"Mme Hall parle couramment trois langues."},{"q":"The manager was ___ with the team's performance.","o":["delighted","delight","delightful","delightfully"],"e":"Ce que <b>ressent</b> la personne → -ed (delighted with).","tr":"Le responsable était ravi des performances de l'équipe."},{"q":"The ___ of the product depends on the materials used.","o":["durability","durable","durably","endure"],"e":"<b>The ___ of</b> → nom.","tr":"La durabilité du produit dépend des matériaux utilisés."},{"q":"The CEO ___ welcomed the new employees.","o":["warmly","warm","warmth","warmer"],"e":"Devant le verbe <b>welcomed</b> → adverbe.","tr":"Le PDG a chaleureusement accueilli les nouveaux employés."},{"q":"Online shopping has become ___ popular.","o":["enormously","enormous","enormity","enormousness"],"e":"Modifie l'adjectif <b>popular</b> → adverbe.","tr":"Les achats en ligne sont devenus extrêmement populaires."},{"q":"The staff received ___ training on the new system.","o":["additional","addition","additionally","add"],"e":"Devant le nom <b>training</b> → adjectif.","tr":"Le personnel a reçu une formation complémentaire sur le nouveau système."},{"q":"The department ___ exceeded its sales target.","o":["easily","easy","ease","easiness"],"e":"Devant le verbe <b>exceeded</b> → adverbe.","tr":"Le service a largement dépassé son objectif de ventes."}]},{"id":"tenses","group":"grammar","title":"Temps verbaux","part":"Part 5","start":101,"rule":"Cherchez l'<b>indice de temps</b> : <b>since / for</b> → present perfect · <b>yesterday, ago, last</b> → prétérit · <b>by the time / by + date future</b> → future perfect. Après <b>when, before, after, as soon as, until</b>, on met le <b>présent</b> même pour parler du futur.","qs":[{"q":"Mr. Lee ___ for the company since 2015.","o":["has worked","works","is working","worked"],"e":"<b>Since 2015</b> : action commencée dans le passé et toujours vraie → <b>present perfect</b>.","tr":"M. Lee travaille pour l'entreprise depuis 2015."},{"q":"By the time the manager arrives, the team ___ the report.","o":["will have finished","finishes","has finished","finished"],"e":"<b>By the time</b> + présent : l'action sera terminée avant un moment futur → <b>future perfect</b> (will have + participe).","tr":"D'ici à ce que le responsable arrive, l'équipe aura terminé le rapport."},{"q":"The shipment ___ yesterday afternoon.","o":["arrived","arrives","has arrived","will arrive"],"e":"<b>Yesterday</b> = moment passé précis → <b>prétérit</b>. Le present perfect est impossible avec un marqueur de temps révolu.","tr":"La livraison est arrivée hier après-midi."},{"q":"Ms. Garcia ___ the clients as soon as she receives the contract.","o":["will call","called","has called","calling"],"e":"La subordonnée « as soon as she <b>receives</b> » est au présent mais renvoie au futur → la principale se met au <b>futur</b>.","tr":"Mme Garcia appellera les clients dès qu'elle recevra le contrat."},{"q":"Next month, the board ___ a new chief financial officer.","o":["will appoint","appointed","has appointed","appointing"],"e":"<b>Next month</b> → <b>futur</b>.","tr":"Le mois prochain, le conseil nommera un nouveau directeur financier."},{"q":"When the fire alarm rang, the staff ___ a meeting.","o":["were holding","hold","have held","will hold"],"e":"Action <b>en cours</b> dans le passé, interrompue par une autre (the alarm rang) → <b>past continuous</b>.","tr":"Quand l'alarme incendie a sonné, le personnel était en réunion."},{"q":"The contract must be signed before the project ___.","o":["begins","will begin","began","beginning"],"e":"Après <b>before</b> (conjonction de temps), on utilise le <b>présent</b> pour une action future, jamais « will ».","tr":"Le contrat doit être signé avant que le projet ne commence."},{"q":"The company ___ its new headquarters last year.","o":["opened","opens","has opened","will open"],"e":"<b>Last year</b> → <b>prétérit</b>.","tr":"L'entreprise a inauguré son nouveau siège l'an dernier."},{"q":"Ms. Ito ___ in Tokyo for three years before moving to London.","o":["had lived","has lived","lives","will live"],"e":"Action antérieure à une autre action passée (moving to London) → <b>past perfect</b>.","tr":"Mme Ito avait vécu trois ans à Tokyo avant de s'installer à Londres."},{"q":"Right now, the technicians ___ the network.","o":["are repairing","repair","repaired","have repaired"],"e":"<b>Right now</b> → action en cours → <b>présent continu</b>.","tr":"En ce moment, les techniciens réparent le réseau."},{"q":"The sales team usually ___ on Monday mornings.","o":["meets","is meeting","meeting","has met"],"e":"<b>Usually</b> = habitude → <b>présent simple</b>, avec -s (the team = singulier).","tr":"L'équipe commerciale se réunit habituellement le lundi matin."},{"q":"We ___ the new catalog to all customers next week.","o":["will send","sent","have sent","had sent"],"e":"<b>Next week</b> → <b>futur</b>.","tr":"Nous enverrons le nouveau catalogue à tous les clients la semaine prochaine."},{"q":"I ___ this report for two hours, and I'm still not finished.","o":["have been writing","write","wrote","will write"],"e":"Action commencée dans le passé et toujours en cours (for two hours, still) → <b>present perfect continu</b>.","tr":"J'écris ce rapport depuis deux heures et je n'ai toujours pas fini."},{"q":"The train ___ when we arrived at the station.","o":["had already left","already leaves","will already leave","has already left"],"e":"Le départ du train précède notre arrivée (passé) → <b>past perfect</b>.","tr":"Le train était déjà parti quand nous sommes arrivés à la gare."},{"q":"Mr. Klein ___ to Berlin twice this year.","o":["has traveled","travels","had traveled","traveling"],"e":"<b>This year</b> (période non terminée) + nombre de fois → <b>present perfect</b>.","tr":"M. Klein est allé deux fois à Berlin cette année."},{"q":"The store ___ at 9 A.M. every day, including Sundays.","o":["opens","open","opening","have opened"],"e":"Habitude → <b>présent simple</b> ; sujet singulier (the store) → <b>-s</b>.","tr":"Le magasin ouvre à 9 h tous les jours, dimanche compris."},{"q":"By the end of this year, Ms. Novak ___ at the firm for a decade.","o":["will have worked","works","has worked","worked"],"e":"<b>By the end of this year</b> (futur) → <b>future perfect</b>.","tr":"D'ici la fin de l'année, Mme Novak aura travaillé dix ans au cabinet."},{"q":"The client ___ while I was having lunch.","o":["called","calls","has called","is calling"],"e":"Action ponctuelle qui interrompt une action en cours dans le passé → <b>prétérit</b>.","tr":"Le client a appelé pendant que je déjeunais."},{"q":"Ms. Adams ___ the proposal yet.","o":["hasn't reviewed","didn't review","doesn't review","won't review"],"e":"<b>Yet</b> dans une phrase négative → <b>present perfect</b>.","tr":"Mme Adams n'a pas encore examiné la proposition."},{"q":"The factory ___ 500 units per day at the moment.","o":["is producing","produced","has produced","had produced"],"e":"<b>At the moment</b> → <b>présent continu</b>.","tr":"L'usine produit actuellement 500 unités par jour."},{"q":"Two years ago, the company ___ a factory in Mexico.","o":["built","has built","builds","will build"],"e":"<b>Ago</b> → <b>prétérit</b>.","tr":"Il y a deux ans, l'entreprise a construit une usine au Mexique."},{"q":"The manager ___ the budget before the meeting started.","o":["had approved","approves","will approve","has approved"],"e":"Action antérieure à une action passée (the meeting started) → <b>past perfect</b>.","tr":"Le responsable avait approuvé le budget avant le début de la réunion."},{"q":"Our team ___ on this project since January.","o":["has been working","is working","worked","works"],"e":"<b>Since January</b> + action qui continue → <b>present perfect continu</b>.","tr":"Notre équipe travaille sur ce projet depuis janvier."},{"q":"The workshop ___ at 2 P.M. tomorrow, according to the schedule.","o":["begins","began","has begun","had begun"],"e":"Événement futur fixé par un <b>programme</b> → <b>présent simple</b>.","tr":"Selon le programme, l'atelier commence demain à 14 h."},{"q":"Ms. Lopez ___ her presentation when the projector stopped working.","o":["was giving","gives","has given","will give"],"e":"Action en cours interrompue (the projector stopped) → <b>past continuous</b>.","tr":"Mme Lopez faisait sa présentation quand le projecteur est tombé en panne."},{"q":"Mr. Tan ___ the company in 2010 and still works there.","o":["joined","has joined","joins","had joined"],"e":"Date passée précise (<b>in 2010</b>) → <b>prétérit</b>, même si la situation continue.","tr":"M. Tan est entré dans l'entreprise en 2010 et y travaille toujours."},{"q":"The price of fuel ___ steadily over the last six months.","o":["has risen","rises","will rise","had risen"],"e":"<b>Over the last six months</b> = période jusqu'à maintenant → <b>present perfect</b>.","tr":"Le prix du carburant a augmenté régulièrement ces six derniers mois."},{"q":"Once the payment ___, we will ship your order.","o":["is received","will be received","was received","received"],"e":"Après <b>once</b> (conjonction de temps) → <b>présent</b> ; ici au passif.","tr":"Dès que le paiement sera reçu, nous expédierons votre commande."},{"q":"Next Friday, the new branch ___ its doors to the public.","o":["will open","opened","has opened","had opened"],"e":"<b>Next Friday</b> → <b>futur</b>.","tr":"Vendredi prochain, la nouvelle agence ouvrira ses portes au public."},{"q":"The meeting ___ for an hour when the director finally arrived.","o":["had been going on","is going on","has been going on","will go on"],"e":"Durée d'une action jusqu'à un moment passé → <b>past perfect continu</b>.","tr":"La réunion durait depuis une heure quand le directeur est enfin arrivé."},{"q":"Every year, the company ___ a charity event in December.","o":["organizes","organize","organizing","have organized"],"e":"<b>Every year</b> → <b>présent simple</b> ; the company = singulier → <b>-s</b>.","tr":"Chaque année, l'entreprise organise un événement caritatif en décembre."},{"q":"The committee ___ its decision yesterday.","o":["announced","announces","has announced","will announce"],"e":"<b>Yesterday</b> → <b>prétérit</b>.","tr":"Le comité a annoncé sa décision hier."},{"q":"Look at those clouds! It ___ rain.","o":["is going to","went to","has gone to","goes to"],"e":"Prédiction fondée sur un <b>indice visible</b> → <b>be going to</b>.","tr":"Regarde ces nuages ! Il va pleuvoir."},{"q":"I ___ Ms. Park since we were at university together.","o":["have known","know","am knowing","knew"],"e":"<b>Since</b> → <b>present perfect</b>. « Know » ne se met pas à la forme continue.","tr":"Je connais Mme Park depuis la fac."},{"q":"When I called the office, Mr. Ali ___ home.","o":["had already gone","already goes","will already go","is already going"],"e":"Son départ précède mon appel (passé) → <b>past perfect</b>.","tr":"Quand j'ai appelé le bureau, M. Ali était déjà rentré chez lui."},{"q":"The engineers ___ the bridge inspection by next Monday.","o":["will have completed","completed","have completed","had completed"],"e":"<b>By next Monday</b> → action terminée avant un moment futur → <b>future perfect</b>.","tr":"Les ingénieurs auront terminé l'inspection du pont d'ici lundi prochain."},{"q":"Ms. Grant ___ as a consultant for several firms before she started her own business.","o":["had worked","has worked","works","will work"],"e":"Antériorité par rapport à « started » (passé) → <b>past perfect</b>.","tr":"Mme Grant avait été consultante pour plusieurs cabinets avant de créer sa société."},{"q":"Our website ___ currently being updated.","o":["is","was","has","will"],"e":"<b>Currently being updated</b> → passif au <b>présent continu</b> : is being + participe.","tr":"Notre site est en cours de mise à jour."},{"q":"The shipment ___ in two days.","o":["will arrive","arrived","has arrived","had arrived"],"e":"<b>In two days</b> = dans deux jours → <b>futur</b>.","tr":"La livraison arrivera dans deux jours."},{"q":"Since the new manager arrived, productivity ___ by 15 percent.","o":["has increased","increases","will increase","increasing"],"e":"<b>Since</b> + prétérit → principale au <b>present perfect</b>.","tr":"Depuis l'arrivée du nouveau responsable, la productivité a augmenté de 15 %."},{"q":"The team ___ the problem until the engineer explained it.","o":["didn't understand","doesn't understand","won't understand","hasn't understood"],"e":"Récit au passé (explained) → <b>prétérit</b>.","tr":"L'équipe n'a pas compris le problème jusqu'à ce que l'ingénieur l'explique."},{"q":"Mr. Obi ___ at the moment; can I take a message?","o":["is traveling","travels","traveled","has traveled"],"e":"<b>At the moment</b> → <b>présent continu</b>.","tr":"M. Obi est en déplacement en ce moment ; puis-je prendre un message ?"},{"q":"The conference ___ place in Paris last spring.","o":["took","takes","has taken","will take"],"e":"<b>Last spring</b> → <b>prétérit</b> (take place → took place).","tr":"La conférence a eu lieu à Paris au printemps dernier."},{"q":"Please wait here until the doctor ___ ready.","o":["is","will be","was","has been"],"e":"Après <b>until</b> → <b>présent</b> pour un événement futur.","tr":"Veuillez attendre ici jusqu'à ce que le médecin soit prêt."},{"q":"The firm ___ more than 200 clients since it was founded.","o":["has served","serves","served","will serve"],"e":"<b>Since it was founded</b> → <b>present perfect</b> (bilan jusqu'à maintenant).","tr":"Le cabinet a servi plus de 200 clients depuis sa création."},{"q":"At this time tomorrow, we ___ over the Atlantic.","o":["will be flying","fly","flew","have flown"],"e":"Action <b>en cours</b> à un moment précis du futur → <b>futur continu</b>.","tr":"Demain à la même heure, nous survolerons l'Atlantique."},{"q":"Sales ___ sharply after the advertisement was broadcast.","o":["increased","increase","have increased","will increase"],"e":"Récit au passé (was broadcast) → <b>prétérit</b>.","tr":"Les ventes ont fortement augmenté après la diffusion de la publicité."},{"q":"The company ___ a new logo, which will be unveiled next month.","o":["has designed","designs","had designed","designing"],"e":"Action terminée dont le <b>résultat est présent</b> (le logo existe, il sera dévoilé) → <b>present perfect</b>.","tr":"L'entreprise a conçu un nouveau logo, qui sera dévoilé le mois prochain."},{"q":"Ms. Weber rarely ___ late for meetings.","o":["arrives","arrive","arriving","is arriving"],"e":"<b>Rarely</b> = fréquence → <b>présent simple</b> avec -s.","tr":"Mme Weber arrive rarement en retard aux réunions."},{"q":"The printer ___ again; please call the technician.","o":["has broken down","breaks down","will break down","had broken down"],"e":"Événement récent avec <b>conséquence présente</b> (appelez le technicien) → <b>present perfect</b>.","tr":"L'imprimante est de nouveau en panne ; appelez le technicien."},{"q":"We ___ the results as soon as the analysis is complete.","o":["will publish","published","have published","had published"],"e":"<b>As soon as</b> + présent → principale au <b>futur</b>.","tr":"Nous publierons les résultats dès que l'analyse sera terminée."},{"q":"Mr. Dale ___ the report by the time the meeting started.","o":["had finished","finishes","has finished","will finish"],"e":"<b>By the time</b> + prétérit → <b>past perfect</b>.","tr":"M. Dale avait terminé le rapport au moment où la réunion a commencé."},{"q":"Ms. Kaur ___ the company's social media accounts since last spring.","o":["has managed","manages","managed","will manage"],"e":"<b>Since last spring</b> → <b>present perfect</b>.","tr":"Mme Kaur gère les réseaux sociaux de l'entreprise depuis le printemps dernier."},{"q":"The new software ___ next month.","o":["will be launched","was launched","has been launched","had been launched"],"e":"<b>Next month</b> + le logiciel subit l'action → <b>futur passif</b>.","tr":"Le nouveau logiciel sera lancé le mois prochain."},{"q":"While the guests ___ dinner, the band started to play.","o":["were having","have","had had","will have"],"e":"<b>While</b> + action en cours dans le passé → <b>past continuous</b>.","tr":"Pendant que les invités dînaient, l'orchestre a commencé à jouer."},{ fect.","tr":"M. Cruz avait vérifié la facture deux fois avant de l'envoyer."},{"q":"The number of online orders ___ every year.","o":["increases","increase","increasing","have increased"],"e":"Sujet <b>The number</b> (singulier) + habitude → increases.","tr":"Le nombre de commandes en ligne augmente chaque année."},{"q":"The new bridge ___ traffic congestion when it opens.","o":["will reduce","reduced","has reduced","had reduced"],"e":"<b>When it opens</b> (futur) → principale au futur.","tr":"Le nouveau pont réduira les embouteillages à son ouverture."},{"q":"Ms. Yu ___ in Paris when she was a student.","o":["lived","has lived","lives","will live"],"e":"Période passée révolue → prétérit.","tr":"Mme Yu a vécu à Paris quand elle était étudiante."},{"q":"The team ___ the report by 5 P.M. today.","o":["will have finished","finishing","had finished","finishes"],"e":"<b>By 5 P.M. today</b> (à venir) → future perfect.","tr":"L'équipe aura terminé le rapport avant 17 h aujourd'hui."},{"q":"The company ___ its policy right now because of many complaints.","o":["is changing","changes","had changed","changing"],"e":"Changement en cours → présent continu.","tr":"L'entreprise est en train de modifier sa politique à cause de nombreuses plaintes."},{"q":"The chef ___ in this restaurant for 20 years.","o":["has cooked","cooks","cook","is cooking"],"e":"Durée jusqu'à maintenant → present perfect.","tr":"Le chef cuisine dans ce restaurant depuis 20 ans."},{"q":"The director ___ the proposal at the moment.","o":["is reviewing","reviews","reviewed","has reviewed"],"e":"<b>At the moment</b> → présent continu.","tr":"Le directeur examine la proposition en ce moment."},{"q":"Our office ___ to a new building in 2019.","o":["moved","moves","has moved","will move"],"e":"<b>In 2019</b> → prétérit.","tr":"Notre bureau a déménagé dans un nouveau bâtiment en 2019."},{"q":"I'll send you the file after I ___ it.","o":["finish","will finish","finished","finishing"],"e":"Après <b>after</b> (futur) → présent.","tr":"Je t'enverrai le fichier quand je l'aurai terminé."},{"q":"The company ___ a lot of money on advertising lately.","o":["has spent","spends","had spent","will spend"],"e":"<b>Lately</b> → present perfect.","tr":"L'entreprise a beaucoup dépensé en publicité ces derniers temps."},{"q":"The plane ___ when we reached the gate.","o":["had already taken off","already takes off","will already take off","has already taken off"],"e":"Antérieur à « reached » → past perfect.","tr":"L'avion avait déjà décollé quand nous sommes arrivés à la porte."},{"q":"Mr. Nash ___ his car every Saturday.","o":["washes","wash","washing","have washed"],"e":"<b>Every Saturday</b> → présent simple, 3e personne → -es.","tr":"M. Nash lave sa voiture tous les samedis."},{"q":"The next board meeting ___ place on June 5.","o":["will take","took","has taken","had taken"],"e":"Événement à venir (<b>next</b>) → futur.","tr":"Le prochain conseil d'administration aura lieu le 5 juin."},{"q":"Since the merger, the company ___ two factories.","o":["has closed","closes","closed","will close"],"e":"<b>Since the merger</b> → present perfect.","tr":"Depuis la fusion, l'entreprise a fermé deux usines."},{"q":"The guests ___ dinner when the lights went out.","o":["were eating","eat","have eaten","will eat"],"e":"Action en cours interrompue → past continuous.","tr":"Les invités dînaient quand la lumière s'est éteinte."},{"q":"I ___ at this company for five years next May.","o":["will have worked","work","have worked","worked"],"e":"Bilan à un moment futur (<b>next May</b>) → future perfect.","tr":"En mai prochain, j'aurai travaillé cinq ans dans cette entreprise."},{"q":"The engineer ___ the machine yesterday, and it works now.","o":["repaired","repairs","has repaired","will repair"],"e":"<b>Yesterday</b> → prétérit.","tr":"L'ingénieur a réparé la machine hier, elle fonctionne maintenant."},{"q":"The mail usually ___ at 11 A.M.","o":["arrives","arrive","arriving","is arriving"],"e":"<b>Usually</b> → présent simple ; mail singulier → -s.","tr":"Le courrier arrive généralement à 11 h."},{"q":"The factory's safety record ___ since the new manager arrived.","o":["has improved","improves","improved","will improve"],"e":"<b>Since</b> + prétérit → present perfect.","tr":"Le bilan sécurité de l'usine s'est amélioré depuis l'arrivée du nouveau responsable."},{"q":"We ___ the hotel before we left home.","o":["had booked","have booked","book","will book"],"e":"Antérieur à « left » → past perfect.","tr":"Nous avions réservé l'hôtel avant de partir."},{"q":"Tomorrow at noon, the team ___ the new system.","o":["will be testing","test","tested","has tested"],"e":"Action en cours à un moment futur → futur continu.","tr":"Demain à midi, l'équipe sera en train de tester le nouveau système."},{"q":"The accountant ___ an error in the figures this morning.","o":["found","finds","will find","had found"],"e":"Moment passé (<b>this morning</b>, terminé) → prétérit.","tr":"Le comptable a trouvé une erreur dans les chiffres ce matin."},{"q":"The team ___ the target by the end of the quarter.","o":["will have reached","reached","has reached","had reached"],"e":"<b>By the end of the quarter</b> → future perfect.","tr":"L'équipe aura atteint l'objectif d'ici la fin du trimestre."},{"q":"Ms. Diaz ___ for a new job at the moment.","o":["is looking","looks","looked","has looked"],"e":"<b>At the moment</b> → présent continu.","tr":"Mme Diaz cherche un nouvel emploi en ce moment."},{"q":"At the moment, the client ___ the order because the price has increased.","o":["is canceling","cancels","will have canceled","canceling"],"e":"Action en cours liée à une cause présente → présent continu.","tr":"Le client annule sa commande parce que le prix a augmenté."},{"q":"Mr. Lee ___ the company for more than 30 years before he retired last year.","o":["had served","has served","serves","will serve"],"e":"Antérieur à « retired » → past perfect.","tr":"M. Lee avait servi l'entreprise plus de 30 ans avant de prendre sa retraite l'an dernier."}]},{"id":"preps","group":"grammar","title":"Prépositions","part":"Part 5","start":101,"rule":"<b>on</b> + jour/date · <b>in</b> + mois/année · <b>at</b> + heure. <b>by</b> = au plus tard · <b>until</b> = jusqu'à (durée continue). <b>for</b> + durée · <b>since</b> + point de départ. <b>during</b> + nom · <b>while</b> + proposition. <b>due to / because of</b> + nom.","qs":[{"q":"The conference will be held ___ March 12.","o":["on","in","at","by"],"e":"Devant une <b>date précise</b> (jour), on utilise <b>on</b>. « In March » mais « on March 12 ».","tr":"La conférence aura lieu le 12 mars."},{"q":"Please submit your expense reports ___ the end of the week.","o":["by","until","since","during"],"e":"<b>By</b> = « au plus tard » (échéance). <b>Until</b> exprime une action qui dure jusqu'à un moment.","tr":"Veuillez soumettre vos notes de frais d'ici la fin de la semaine."},{"q":"The store is closed ___ renovations.","o":["due to","because","although","despite"],"e":"Le blanc est suivi d'un <b>nom</b> (renovations) → préposition de cause <b>due to</b>. « Because » doit être suivi d'une proposition (sujet + verbe).","tr":"Le magasin est fermé pour cause de travaux."},{"q":"The museum is located ___ the train station and the city hall.","o":["between","among","through","along"],"e":"<b>Between A and B</b> : entre deux éléments. <b>Among</b> s'emploie pour plus de deux éléments non distingués.","tr":"Le musée se trouve entre la gare et la mairie."},{"q":"Ms. Patel has been in charge of the project ___ three years.","o":["for","since","during","within"],"e":"<b>Three years</b> est une <b>durée</b> → <b>for</b>. <b>Since</b> exige un point de départ (since 2023).","tr":"Mme Patel est responsable du projet depuis trois ans."},{"q":"The office will remain open ___ 8 P.M. on weekdays.","o":["until","by","at","within"],"e":"« Remain open » = état qui <b>dure</b> jusqu'à un moment → <b>until</b>.","tr":"Le bureau restera ouvert jusqu'à 20 h en semaine."},{"q":"Employees are not allowed to use their phones ___ the safety training.","o":["during","while","for","when"],"e":"<b>During</b> + <b>nom</b> (the safety training). <b>While</b> introduirait une proposition (while they are training).","tr":"Les employés n'ont pas le droit d'utiliser leur téléphone pendant la formation sécurité."},{"q":"The package arrived ___ Tuesday morning.","o":["on","in","at","for"],"e":"Jour précis (même avec morning) → <b>on</b> : on Tuesday morning.","tr":"Le colis est arrivé mardi matin."},{"q":"Our office is ___ the third floor.","o":["on","in","at","to"],"e":"Étage → <b>on</b> the … floor.","tr":"Notre bureau est au troisième étage."},{"q":"The meeting starts ___ 9:30.","o":["at","on","in","of"],"e":"Heure précise → <b>at</b>.","tr":"La réunion commence à 9 h 30."},{"q":"The company was founded ___ 1998.","o":["in","on","at","since"],"e":"Année → <b>in</b>. « Since » exigerait un present perfect.","tr":"L'entreprise a été fondée en 1998."},{"q":"Please send the invoice ___ e-mail.","o":["by","with","on","from"],"e":"Moyen de communication/transport → <b>by</b> (by e-mail, by mail, by train).","tr":"Veuillez envoyer la facture par e-mail."},{"q":"The contract is valid ___ two years.","o":["for","since","during","until"],"e":"Durée chiffrée → <b>for</b>.","tr":"Le contrat est valable deux ans."},{"q":"The discount applies to orders ___ $100.","o":["over","through","across","along"],"e":"<b>Over</b> + montant = supérieur à.","tr":"La remise s'applique aux commandes de plus de 100 $."},{"q":"Ms. Diaz is responsible ___ customer relations.","o":["for","of","to","with"],"e":"Construction fixe : <b>responsible for</b>.","tr":"Mme Diaz est responsable des relations clients."},{"q":"We are looking forward ___ working with you.","o":["to","for","at","on"],"e":"Expression figée <b>look forward to</b> + V-ing.","tr":"Nous avons hâte de travailler avec vous."},{"q":"The store is located ___ Main Street.","o":["on","at","to","from"],"e":"Nom de rue sans numéro → <b>on</b> (US).","tr":"Le magasin se trouve sur Main Street."},{"q":"Employees must arrive ___ time for the training session.","o":["on","at","by","with"],"e":"<b>On time</b> = à l'heure (ponctuel).","tr":"Les employés doivent arriver à l'heure pour la formation."},{"q":"The flight from London arrived ___ Chicago an hour late.","o":["in","at","to","on"],"e":"Arriver dans une <b>ville</b> → arrive <b>in</b>. « Arrive at » s'emploie pour un lieu précis (the airport).","tr":"Le vol en provenance de Londres est arrivé à Chicago avec une heure de retard."},{"q":"The new product will be launched ___ the end of the year.","o":["at","in","on","to"],"e":"<b>At the end of</b> = à la fin de (moment). « In the end » = finalement.","tr":"Le nouveau produit sera lancé à la fin de l'année."},{"q":"Mr. Grant has worked here ___ 2019.","o":["since","for","from","during"],"e":"Point de départ + present perfect → <b>since</b>.","tr":"M. Grant travaille ici depuis 2019."},{"q":"Please put the boxes ___ the table.","o":["on","at","in","to"],"e":"Surface → <b>on</b>.","tr":"Veuillez poser les cartons sur la table."},{"q":"The seminar was canceled ___ a lack of interest.","o":["because of","because","despite","although"],"e":"Cause + <b>nom</b> (a lack) → <b>because of</b>.","tr":"Le séminaire a été annulé faute d'intérêt."},{"q":"___ the rain, the event was held outdoors.","o":["Despite","Although","Because of","However"],"e":"Opposition + <b>nom</b> (the rain) → <b>Despite</b>.","tr":"Malgré la pluie, l'événement s'est tenu en plein air."},{"q":"Our sales increased ___ 20 percent compared with last quarter.","o":["by","of","at","with"],"e":"Écart chiffré d'une hausse/baisse → <b>by</b>.","tr":"Nos ventes ont augmenté de 20 % par rapport au trimestre précédent."},{"q":"The train runs ___ Paris and Lyon.","o":["between","among","from","across"],"e":"<b>Between A and B</b>.","tr":"Le train circule entre Paris et Lyon."},{"q":"Applications must be received ___ June 30.","o":["by","until","since","during"],"e":"Date limite → <b>by</b> (au plus tard).","tr":"Les candidatures doivent être reçues au plus tard le 30 juin."},{"q":"The hotel is ___ walking distance of the beach.","o":["within","between","inside","along"],"e":"Expression figée <b>within walking distance of</b>.","tr":"L'hôtel est à distance de marche de la plage."},{"q":"We will be closed ___ the holidays.","o":["during","while","since","between"],"e":"<b>During</b> + nom (période). « While » exige une proposition.","tr":"Nous serons fermés pendant les fêtes."},{"q":"The manager is ___ a business trip this week.","o":["on","in","at","for"],"e":"Expression <b>on a business trip</b> (en déplacement).","tr":"Le responsable est en déplacement cette semaine."},{"q":"Ms. Song is an expert ___ international law.","o":["in","at","of","with"],"e":"Domaine de compétence → <b>expert in</b>.","tr":"Mme Song est experte en droit international."},{"q":"The bus stops ___ front of the hotel.","o":["in","at","on","to"],"e":"Expression <b>in front of</b> = devant.","tr":"Le bus s'arrête devant l'hôtel."},{"q":"The new policy will take effect ___ January 1.","o":["on","in","at","since"],"e":"Date précise → <b>on</b>.","tr":"La nouvelle politique entrera en vigueur le 1er janvier."},{"q":"Our team consists ___ five engineers.","o":["of","in","with","from"],"e":"<b>Consist of</b> = se composer de.","tr":"Notre équipe se compose de cinq ingénieurs."},{"q":"The instructions are available ___ three languages.","o":["in","on","at","by"],"e":"Langue → <b>in</b> (in English, in three languages).","tr":"Les instructions sont disponibles en trois langues."},{"q":"The museum is open ___ Tuesday to Sunday.","o":["from","since","between","at"],"e":"<b>From … to …</b> = du … au ….","tr":"Le musée est ouvert du mardi au dimanche."},{"q":"The report was written ___ Mr. Harris.","o":["by","from","of","with"],"e":"Agent du passif → <b>by</b>.","tr":"Le rapport a été rédigé par M. Harris."},{"q":"The keys are ___ the top drawer.","o":["in","on","at","into"],"e":"À l'intérieur d'un contenant → <b>in</b>. « Into » exprime un mouvement.","tr":"Les clés sont dans le tiroir du haut."},{"q":"The river runs ___ the center of the city.","o":["through","among","between","onto"],"e":"Traverser un espace de part en part → <b>through</b>.","tr":"Le fleuve traverse le centre-ville."},{"q":"The price of the tour includes transportation ___ the airport.","o":["from","of","at","in"],"e":"Point de départ d'un trajet → <b>from</b>.","tr":"Le prix de l'excursion comprend le transfert depuis l'aéroport."},{"q":"All staff members, ___ the director, attended the training.","o":["including","include","included","includes"],"e":"<b>Including</b> fonctionne comme une préposition = y compris.","tr":"Tout le personnel, directeur compris, a suivi la formation."},{"q":"The office will be closed ___ further notice.","o":["until","by","since","for"],"e":"Expression figée <b>until further notice</b> = jusqu'à nouvel ordre.","tr":"Le bureau sera fermé jusqu'à nouvel ordre."},{"q":"We received many complaints ___ the new schedule.","o":["about","at","in","to"],"e":"<b>Complaint about</b> = plainte concernant.","tr":"Nous avons reçu de nombreuses plaintes au sujet du nouvel horaire."},{"q":"The factory has been in operation ___ over fifty years.","o":["for","since","during","from"],"e":"Durée (over fifty years) + present perfect → <b>for</b>.","tr":"L'usine fonctionne depuis plus de cinquante ans."},{"q":"Ms. Morgan is in charge ___ the accounting department.","o":["of","for","with","about"],"e":"Expression <b>in charge of</b>.","tr":"Mme Morgan dirige le service comptable."},{"q":"The conference room is available ___ request.","o":["upon","in","at","with"],"e":"Expression <b>upon request</b> (= on request) : sur demande.","tr":"La salle de conférence est disponible sur demande."},{"q":"The shop sells a wide range ___ electronic products.","o":["of","for","in","with"],"e":"<b>A wide range of</b> = une
